<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Senior Front-End Interview Prep</title>
<style>
:root {
  --bg: #0f0f17; --panel: #151827; --card: #1d2138; --line: #2a2f4d;
  --text: #e2e8f0; --muted: #8b93a7; --accent: #e94560; --accent-soft: rgba(233,69,96,.12);
  --green: #4ade80; --green-soft: rgba(74,222,128,.12); --yellow: #fbbf24; --blue: #60a5fa; --purple: #a78bfa;
  --code-bg: #0b0d16; --shadow: 0 8px 30px rgba(0,0,0,.35);
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #f6f7fb; --panel: #ffffff; --card: #eef0f7; --line: #dde1ee;
  --text: #1a1f36; --muted: #5b6478; --accent: #d6334f; --accent-soft: rgba(214,51,79,.08);
  --green: #15803d; --green-soft: rgba(21,128,61,.08); --yellow: #b45309; --blue: #1d4ed8; --purple: #6d28d9;
  --code-bg: #f1f3f9; --shadow: 0 8px 30px rgba(20,30,60,.08);
  color-scheme: light;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.65 'Segoe UI', system-ui, -apple-system, sans-serif; }
a { color: var(--blue); }
code, pre, .mono { font-family: 'Cascadia Code', 'Consolas', ui-monospace, monospace; }

/* Layout */
.layout { display: grid; grid-template-columns: 290px minmax(0, 1fr); min-height: 100vh; }
.sidebar { position: sticky; top: 0; height: 100vh; overflow-y: auto; background: var(--panel); border-right: 1px solid var(--line); padding: 1.2rem 0.9rem 2rem; }
.brand { padding: 0 .5rem 1rem; }
.brand h1 { font-size: 1.15rem; margin: 0; line-height: 1.3; }
.brand h1 span { color: var(--accent); }
.brand p { margin: .25rem 0 0; color: var(--muted); font-size: .8rem; }
.overall { margin: 0 .5rem 1rem; }
.bar { height: 6px; background: var(--card); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--purple)); border-radius: 99px; transition: width .3s; }
.overall small { color: var(--muted); font-size: .75rem; }
.modes { display: grid; grid-template-columns: repeat(3, 1fr); gap: .3rem; margin: 0 .3rem 1rem; }
.modes button { border: 1px solid var(--line); background: var(--card); color: var(--muted); padding: .45rem .2rem; border-radius: 8px; cursor: pointer; font-size: .78rem; font-weight: 600; }
.modes button.active { color: #fff; background: var(--accent); border-color: var(--accent); }
.nav { list-style: none; margin: 0; padding: 0; }
.nav a { display: grid; grid-template-columns: 1fr auto; gap: .2rem .5rem; padding: .5rem .6rem; border-radius: 8px; color: var(--text); text-decoration: none; font-size: .86rem; }
.nav a:hover { background: var(--card); }
.nav a.active { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
.nav .count { color: var(--muted); font-size: .72rem; font-variant-numeric: tabular-nums; }
.nav .mini { grid-column: 1 / -1; height: 3px; background: var(--card); border-radius: 9px; overflow: hidden; }
.nav .mini i { display: block; height: 100%; background: var(--green); }
.theme-btn { margin: 1rem .5rem 0; width: calc(100% - 1rem); border: 1px solid var(--line); background: transparent; color: var(--muted); padding: .45rem; border-radius: 8px; cursor: pointer; }

.main { min-width: 0; }
.topbar { position: sticky; top: 0; z-index: 10; display: flex; gap: .6rem; align-items: center; padding: .7rem 2rem; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.menu-btn { display: none; border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 8px; padding: .4rem .7rem; cursor: pointer; }
.search { position: relative; flex: 1; max-width: 560px; }
.search input { width: 100%; padding: .55rem .9rem .55rem 2.1rem; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--text); font-size: .9rem; }
.search::before { content: '⌕'; position: absolute; left: .75rem; top: .42rem; color: var(--muted); font-size: 1.05rem; }
.results { position: absolute; top: calc(100% + 6px); left: 0; right: 0; max-height: 60vh; overflow-y: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: .3rem; }
.results button { display: block; width: 100%; text-align: left; border: 0; background: transparent; color: var(--text); padding: .5rem .7rem; border-radius: 7px; cursor: pointer; font-size: .86rem; }
.results button:hover, .results button:focus { background: var(--card); outline: none; }
.results small { display: block; color: var(--muted); font-size: .72rem; }
.kbd-hint { color: var(--muted); font-size: .75rem; white-space: nowrap; }

.content { max-width: 920px; padding: 2rem 2rem 5rem; margin: 0 auto; }
.content h1 { overflow-wrap: anywhere; font-size: 2rem; line-height: 1.2; margin: .2rem 0 1rem; }
.content h2 { font-size: 1.35rem; margin: 2.4rem 0 .8rem; padding-bottom: .35rem; border-bottom: 1px solid var(--line); }
.content h3 { font-size: 1.1rem; margin: 1.8rem 0 .6rem; color: var(--purple); }
.content h4 { margin: 1.2rem 0 .4rem; }
.content p { margin: .6rem 0; }
.content ul, .content ol { padding-left: 1.4rem; margin: .5rem 0; }
.content li { margin: .25rem 0; }
.content li.task { list-style: none; margin-left: -1.3rem; }
.content strong { color: color-mix(in srgb, var(--text) 100%, var(--yellow) 0%); }
:not(pre) > code { background: var(--card); padding: .1rem .38rem; border-radius: 5px; font-size: .86em; color: var(--yellow); }
.fill { color: var(--yellow); background: rgba(251,191,36,.1); border-radius: 4px; padding: 0 .15rem; }
blockquote { margin: 1rem 0; padding: .7rem 1.1rem; border-left: 4px solid var(--accent); background: var(--accent-soft); border-radius: 0 10px 10px 0; }
blockquote p { margin: .3rem 0; }
.table-wrap { overflow-x: auto; margin: 1rem 0; border: 1px solid var(--line); border-radius: 10px; }
table { border-collapse: collapse; width: 100%; font-size: .87rem; }
th, td { text-align: left; padding: .55rem .75rem; border-bottom: 1px solid var(--line); vertical-align: top; }
th { background: var(--card); font-weight: 700; }
tr:last-child td { border-bottom: 0; }
.code { position: relative; margin: .9rem 0; }
pre { margin: 0; background: var(--code-bg); border: 1px solid var(--line); border-radius: 10px; padding: 1rem 1.1rem; overflow-x: auto; font-size: .82rem; line-height: 1.55; }
.copy { position: absolute; top: .45rem; right: .45rem; opacity: 0; transition: opacity .15s; border: 1px solid var(--line); background: var(--card); color: var(--muted); border-radius: 6px; padding: .15rem .55rem; font-size: .72rem; cursor: pointer; }
.code:hover .copy, .copy:focus { opacity: 1; }
.t-c { color: var(--muted); font-style: italic; } .t-s { color: var(--green); } .t-k { color: var(--purple); } .t-n { color: var(--yellow); }

/* Q&A */
.chapter-tools { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; margin: 0 0 1.5rem; padding: .7rem .9rem; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
.chapter-tools .grow { flex: 1; min-width: 160px; }
.chapter-tools small { color: var(--muted); }
.btn { border: 1px solid var(--line); background: var(--card); color: var(--text); padding: .38rem .8rem; border-radius: 8px; cursor: pointer; font-size: .8rem; font-weight: 600; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.good { background: var(--green-soft); border-color: var(--green); color: var(--green); }
details.qa { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; margin: .7rem 0; transition: border-color .15s; }
details.qa[open] { border-color: color-mix(in srgb, var(--accent) 50%, var(--line)); }
details.qa.mastered { border-left: 4px solid var(--green); }
details.qa > summary { display: flex; align-items: center; gap: .7rem; cursor: pointer; padding: .8rem 1rem; list-style: none; font-weight: 600; }
details.qa > summary::-webkit-details-marker { display: none; }
details.qa > summary::before { content: '▸'; color: var(--accent); transition: transform .15s; flex: none; }
details.qa[open] > summary::before { transform: rotate(90deg); }
details.qa > summary .q { flex: 1; }
.followups { margin: 1.4rem 0 .4rem; padding: .9rem 1.1rem; border-radius: 12px; background: color-mix(in srgb, var(--purple) 8%, transparent); border: 1px solid color-mix(in srgb, var(--purple) 32%, var(--line)); }
.fu-label { font-size: .75rem; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: var(--purple); margin-bottom: .4rem; }
.fu-label span { font-weight: 600; text-transform: none; letter-spacing: 0; color: var(--muted); margin-left: .4rem; }
details.fu { border-top: 1px dashed var(--line); }
details.fu:first-of-type { border-top: 0; }
details.fu > summary { cursor: pointer; padding: .55rem 0 .55rem 1.3rem; font-weight: 600; list-style: none; position: relative; }
details.fu > summary::-webkit-details-marker { display: none; }
details.fu > summary::before { content: 'Q'; position: absolute; left: 0; top: .55rem; font-size: .7rem; font-weight: 800; color: var(--purple); }
details.fu[open] > summary { color: var(--purple); }
details.fu > p { margin: 0 0 .7rem 1.3rem; line-height: 1.7; }
.master-btn { flex: none; border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 99px; padding: .15rem .65rem; font-size: .72rem; cursor: pointer; white-space: nowrap; }
.mastered .master-btn { color: var(--green); border-color: var(--green); background: var(--green-soft); }
.ans { padding: 0 1.2rem 1rem 2.2rem; border-top: 1px dashed var(--line); }
.hide-mastered details.qa.mastered { display: none; }
.mock { margin: 1rem 0 1.2rem; padding: .9rem 1.1rem; border-radius: 12px; background: color-mix(in srgb, var(--blue) 9%, transparent); border: 1px solid color-mix(in srgb, var(--blue) 35%, var(--line)); }
.mock p { margin: .5rem 0; line-height: 1.75; }
.mock-label { font-size: .75rem; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: var(--blue); margin-bottom: .2rem; }
.mock-label span { font-weight: 600; text-transform: none; letter-spacing: 0; color: var(--muted); margin-left: .4rem; }
.notes-label { font-size: .75rem; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin-top: 1.2rem; }
.hide-notes .ans > :not(.mock):not(.followups) { display: none; }
.speak-btn { margin-left: .5rem; border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 6px; padding: .1rem .5rem; font-size: .72rem; cursor: pointer; text-transform: none; letter-spacing: 0; }
.pager { display: flex; justify-content: space-between; gap: 1rem; margin-top: 3rem; }
.pager a { flex: 1; padding: .9rem 1rem; border: 1px solid var(--line); border-radius: 12px; text-decoration: none; color: var(--text); background: var(--panel); }
.pager a:hover { border-color: var(--accent); }
.pager small { display: block; color: var(--muted); font-size: .72rem; }
.pager .next { text-align: right; }

/* Flashcards */
.fc-setup { display: flex; flex-wrap: wrap; gap: .7rem; align-items: center; margin-bottom: 1.2rem; }
.fc-setup select, .fc-setup label { font-size: .85rem; }
select { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: .4rem .6rem; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 1.6rem 1.8rem; box-shadow: var(--shadow); }
.card .tag { display: inline-block; font-size: .72rem; font-weight: 700; color: var(--accent); background: var(--accent-soft); padding: .15rem .6rem; border-radius: 99px; margin-bottom: .7rem; }
.card .question { font-size: 1.3rem; font-weight: 700; line-height: 1.4; }
.card .answer { margin-top: 1.2rem; padding-top: 1rem; border-top: 1px dashed var(--line); }
.card-actions { display: flex; flex-wrap: wrap; gap: .6rem; margin-top: 1.4rem; }
.fc-meta { color: var(--muted); font-size: .8rem; margin-top: .8rem; }
.tip { color: var(--muted); font-size: .85rem; margin-bottom: 1rem; }
.timer { font-variant-numeric: tabular-nums; color: var(--yellow); font-weight: 700; }

/* Progress */
.prog-grid { display: grid; gap: .6rem; }
.prog-row { display: grid; grid-template-columns: 1fr 90px 160px; gap: 1rem; align-items: center; background: var(--panel); border: 1px solid var(--line); padding: .7rem 1rem; border-radius: 10px; text-decoration: none; color: var(--text); }
.prog-row:hover { border-color: var(--accent); }
.prog-row span { color: var(--muted); font-size: .82rem; text-align: right; font-variant-numeric: tabular-nums; }
.stat-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: .8rem; margin: 1rem 0 1.6rem; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 1rem; }
.stat b { display: block; font-size: 1.8rem; line-height: 1.1; }
.stat small { color: var(--muted); }

@media (max-width: 860px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .sidebar { position: fixed; z-index: 30; left: 0; top: 0; width: 290px; transform: translateX(-100%); transition: transform .2s; box-shadow: var(--shadow); }
  .sidebar.open { transform: none; }
  .menu-btn { display: inline-block; }
  .topbar { padding: .6rem 1rem; }
  .content { padding: 1.4rem 1rem 4rem; }
  .content h1 { font-size: 1.55rem; }
  .kbd-hint { display: none; }
  .prog-row { grid-template-columns: 1fr 70px; }
  .prog-row .bar { grid-column: 1 / -1; }
  .ans { padding: 0 .9rem 1rem 1rem; }
}
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <h1>Senior <span>Front-End</span> Interview Prep</h1>
      <p>React · JavaScript · Cloud · System Design</p>
    </div>
    <div class="overall">
      <div class="bar"><i id="overallBar" style="width:0"></i></div>
      <small id="overallText"></small>
    </div>
    <div class="modes" role="tablist" aria-label="Mode">
      <button data-mode="study" class="active">📖 Study</button>
      <button data-mode="cards">🃏 Cards</button>
      <button data-mode="progress">📊 Progress</button>
    </div>
    <ul class="nav" id="nav"></ul>
    <button class="theme-btn" id="themeBtn" type="button">◐ Toggle theme</button>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="menu-btn" id="menuBtn" type="button" aria-label="Open chapters">☰</button>
      <div class="search">
        <input id="search" type="search" placeholder="Search questions… (press / )" autocomplete="off" aria-label="Search questions">
        <div class="results" id="results" hidden></div>
      </div>
      <span class="kbd-hint">Cards: <b>Space</b> reveal · <b>G</b> got it · <b>→</b> next</span>
    </header>
    <main class="content" id="content"></main>
  </div>
</div>

<script>
const CHAPTERS = /*__CHAPTERS__*/[];

// ---------- storage (safe) ----------
const store = {
  get(k, d) { try { const v = localStorage.getItem('sip:' + k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem('sip:' + k, JSON.stringify(v)); } catch {} },
};
let mastered = store.get('mastered', {});
let checks = store.get('checks', {});

// ---------- build question index ----------
const hash = s => { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) | 0; return (h >>> 0).toString(36); };
const QUESTIONS = [];
CHAPTERS.forEach(ch => {
  const tpl = document.createElement('template');
  tpl.innerHTML = ch.html;
  ch.questions = [];
  tpl.content.querySelectorAll('details.qa').forEach(d => {
    const qEl = d.querySelector('summary .q');
    const ansEl = d.querySelector('.ans');
    const mockEl = ansEl && ansEl.querySelector('.mock');
    const q = { cid: ch.id, chapter: ch.title, id: ch.id + '~' + hash(qEl.textContent),
      qHTML: qEl.innerHTML, qText: qEl.textContent, aHTML: ansEl ? ansEl.innerHTML : '',
      mockHTML: (mockEl ? mockEl.outerHTML : '') + (ansEl && ansEl.querySelector('.followups') ? ansEl.querySelector('.followups').outerHTML : ''),
      text: (qEl.textContent + ' ' + (ansEl ? ansEl.textContent : '')).toLowerCase() };
    ch.questions.push(q); QUESTIONS.push(q);
  });
  ch.headings = [...tpl.content.querySelectorAll('h2, h3')].map(h => ({ id: h.id, text: h.textContent }));
});

// ---------- elements ----------
const $ = s => document.querySelector(s);
const content = $('#content'), nav = $('#nav'), sidebar = $('#sidebar');
let mode = 'study', currentId = CHAPTERS[0] && CHAPTERS[0].id;

function chapterStats(ch) { const done = ch.questions.filter(q => mastered[q.id]).length; return { done, total: ch.questions.length }; }

function renderNav() {
  nav.innerHTML = CHAPTERS.map(ch => {
    const { done, total } = chapterStats(ch);
    const pct = total ? Math.round(done / total * 100) : 0;
    return '<li><a href="#' + ch.id + '" data-id="' + ch.id + '" class="' + (ch.id === currentId && mode === 'study' ? 'active' : '') + '">' +
      '<span>' + ch.title.replace(/\s*\(.*\)$/, '') + '</span><span class="count">' + (total ? done + '/' + total : '') + '</span>' +
      (total ? '<span class="mini"><i style="width:' + pct + '%"></i></span>' : '') + '</a></li>';
  }).join('');
  const done = QUESTIONS.filter(q => mastered[q.id]).length;
  $('#overallBar').style.width = (QUESTIONS.length ? done / QUESTIONS.length * 100 : 0) + '%';
  $('#overallText').textContent = done + ' of ' + QUESTIONS.length + ' questions mastered';
  document.querySelectorAll('.modes button').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
}

function setMastered(id, val) {
  if (val) mastered[id] = Date.now(); else delete mastered[id];
  store.set('mastered', mastered);
  renderNav();
}

// ---------- study mode ----------
function renderChapter(id, focusQid) {
  mode = 'study';
  const idx = CHAPTERS.findIndex(c => c.id === id);
  const ch = CHAPTERS[idx] || CHAPTERS[0];
  currentId = ch.id;
  const { done, total } = chapterStats(ch);
  const hideM = store.get('hideMastered', false);
  const hideN = store.get('hideNotes', false);
  const tools = total ? '<div class="chapter-tools"><div class="grow"><div class="bar"><i style="width:' + (done / total * 100) + '%"></i></div>' +
    '<small>' + done + ' / ' + total + ' mastered in this chapter</small></div>' +
    '<button class="btn" data-act="expand">Expand all</button><button class="btn" data-act="collapse">Collapse all</button>' +
    '<button class="btn" data-act="hide">' + (hideM ? 'Show mastered' : 'Hide mastered') + '</button>' +
    '<button class="btn" data-act="notes">' + (hideN ? '📚 Show full notes' : '🎤 Mock answers only') + '</button>' +
    '<button class="btn primary" data-act="drill">🃏 Drill this chapter</button></div>' : '';
  const prev = CHAPTERS[idx - 1], next = CHAPTERS[idx + 1];
  const pager = '<nav class="pager">' +
    (prev ? '<a href="#' + prev.id + '"><small>← Previous</small>' + prev.title + '</a>' : '<span></span>') +
    (next ? '<a class="next" href="#' + next.id + '"><small>Next →</small>' + next.title + '</a>' : '<span></span>') + '</nav>';

  content.className = 'content' + (hideM ? ' hide-mastered' : '') + (hideN ? ' hide-notes' : '');
  content.innerHTML = ch.html.replace(/(<\/h1>)/, '$1' + tools) + pager;
  decorateMocks();

  const list = content.querySelectorAll('details.qa');
  list.forEach((d, i) => {
    const q = ch.questions[i];
    d.dataset.qid = q.id;
    d.classList.toggle('mastered', !!mastered[q.id]);
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'master-btn';
    b.textContent = mastered[q.id] ? '✓ Mastered' : 'Mark mastered';
    b.addEventListener('click', e => {
      e.preventDefault(); e.stopPropagation();
      const val = !mastered[q.id];
      setMastered(q.id, val);
      d.classList.toggle('mastered', val);
      b.textContent = val ? '✓ Mastered' : 'Mark mastered';
      const s = chapterStats(ch);
      const t = content.querySelector('.chapter-tools');
      if (t) { t.querySelector('.bar i').style.width = (s.done / s.total * 100) + '%'; t.querySelector('small').textContent = s.done + ' / ' + s.total + ' mastered in this chapter'; }
    });
    d.querySelector('summary').appendChild(b);
  });
  content.querySelectorAll('input.chk').forEach(c => {
    const key = ch.id + ':' + c.dataset.chk;
    if (key in checks) c.checked = checks[key];
    c.addEventListener('change', () => { checks[key] = c.checked; store.set('checks', checks); });
  });

  renderNav();
  if (focusQid) {
    const d = content.querySelector('details[data-qid="' + focusQid + '"]');
    if (d) { d.open = true; d.scrollIntoView({ block: 'start' }); window.scrollBy(0, -70); return; }
  }
  window.scrollTo(0, 0);
}

// ---------- mock answers: read-aloud ----------
const canSpeak = 'speechSynthesis' in window;
function decorateMocks() {
  if (!canSpeak) return;
  content.querySelectorAll('.mock-label').forEach(l => {
    if (l.querySelector('.speak-btn')) return;
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'speak-btn'; b.textContent = '🔊 Listen';
    l.appendChild(b);
  });
}
function stopSpeaking() {
  if (!canSpeak) return;
  speechSynthesis.cancel();
  document.querySelectorAll('.speak-btn').forEach(b => b.textContent = '🔊 Listen');
}
content.addEventListener('click', e => {
  const sp = e.target.closest('.speak-btn');
  if (!sp) return;
  const wasPlaying = sp.textContent.startsWith('⏹');
  stopSpeaking();
  if (wasPlaying) return;
  const text = [...sp.closest('.mock').querySelectorAll('p')].map(p => p.textContent).join(' ');
  const u = new SpeechSynthesisUtterance(text);
  u.rate = 0.95; u.lang = 'en-CA';
  u.onend = () => { sp.textContent = '🔊 Listen'; };
  sp.textContent = '⏹ Stop';
  speechSynthesis.speak(u);
});
window.addEventListener('hashchange', stopSpeaking);

content.addEventListener('click', e => {
  const copy = e.target.closest('.copy');
  if (copy) {
    const text = copy.parentElement.querySelector('code').textContent;
    (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(
      () => { copy.textContent = 'Copied'; setTimeout(() => copy.textContent = 'Copy', 1200); },
      () => { copy.textContent = 'Select & copy'; });
    return;
  }
  const act = e.target.closest('[data-act]');
  if (!act) return;
  const a = act.dataset.act;
  if (a === 'expand' || a === 'collapse') content.querySelectorAll('details.qa').forEach(d => d.open = a === 'expand');
  if (a === 'collapse') content.querySelectorAll('details.fu').forEach(d => d.open = false);
  if (a === 'hide') { store.set('hideMastered', !store.get('hideMastered', false)); renderChapter(currentId); }
  if (a === 'notes') {
    const open = [...content.querySelectorAll('details.qa[open]')].map(d => d.dataset.qid);
    store.set('hideNotes', !store.get('hideNotes', false)); renderChapter(currentId);
    open.forEach(id => { const d = content.querySelector('details[data-qid="' + id + '"]'); if (d) d.open = true; });
  }
  if (a === 'drill') { fcScope = currentId; location.hash = 'cards'; }
});

// ---------- flashcards ----------
let fcScope = store.get('fcScope', 'all'), fcOnlyNew = store.get('fcOnlyNew', true), fcView = store.get('fcView', 'both');
let deck = [], deckPos = 0, revealed = false, timerStart = 0, timerId = null;

function buildDeck() {
  deck = QUESTIONS.filter(q => (fcScope === 'all' || q.cid === fcScope) && (!fcOnlyNew || !mastered[q.id]));
  for (let i = deck.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [deck[i], deck[j]] = [deck[j], deck[i]]; }
  deckPos = 0; revealed = false;
}

function renderCards(rebuild) {
  mode = 'cards';
  if (rebuild) buildDeck();
  renderNav();
  clearInterval(timerId);
  const opts = '<option value="all">All chapters</option>' + CHAPTERS.filter(c => c.questions.length)
    .map(c => '<option value="' + c.id + '"' + (fcScope === c.id ? ' selected' : '') + '>' + c.title + '</option>').join('');
  const setup = '<h1>🃏 Flashcards</h1><p class="tip">Answer out loud first, as if the interviewer just asked (aim for 1–2 minutes). Then reveal the 🎤 mock answer and compare: did you hit the same points, give an example and mention a trade-off? Use 🔊 Listen to hear it spoken.</p>' +
    '<div class="fc-setup"><select id="fcScope" aria-label="Chapter">' + opts + '</select>' +
    '<select id="fcView" aria-label="Answer view"><option value="both">Reveal: mock answer + notes</option><option value="mock">Reveal: mock answer only</option></select>' +
    '<label><input type="checkbox" id="fcOnlyNew"' + (fcOnlyNew ? ' checked' : '') + '> Only unmastered</label>' +
    '<button class="btn" id="fcShuffle">↻ Reshuffle</button></div>';

  const q = deck[deckPos];
  let card;
  if (!q) {
    card = '<div class="card"><div class="question">' + (deck.length ? '🎉 Deck finished!' : 'No cards here: everything in this scope is mastered.') + '</div>' +
      '<p class="fc-meta">Reshuffle, switch chapter, or untick "Only unmastered" to review everything again.</p></div>';
  } else {
    card = '<div class="card"><span class="tag">' + q.chapter + '</span><div class="question">' + q.qHTML + '</div>' +
      (revealed ? '<div class="answer">' + (fcView === 'mock' && q.mockHTML ? q.mockHTML : q.aHTML) + '</div>' : '') +
      '<div class="card-actions">' + (revealed
        ? '<button class="btn good" id="fcGot">✓ Got it (G)</button><button class="btn" id="fcAgain">↺ Review again</button><button class="btn" id="fcNext">Skip →</button>'
        : '<button class="btn primary" id="fcReveal">Reveal answer (Space)</button><button class="btn" id="fcNext">Skip →</button>') + '</div>' +
      '<p class="fc-meta">Card ' + (deckPos + 1) + ' of ' + deck.length + ' · <span class="timer" id="fcTimer">0:00</span></p></div>';
  }
  content.className = 'content';
  content.innerHTML = setup + card;

  decorateMocks();
  $('#fcScope').value = fcScope;
  $('#fcView').value = fcView;
  $('#fcView').onchange = e => { fcView = e.target.value; store.set('fcView', fcView); renderCards(false); };
  $('#fcScope').onchange = e => { fcScope = e.target.value; store.set('fcScope', fcScope); renderCards(true); };
  $('#fcOnlyNew').onchange = e => { fcOnlyNew = e.target.checked; store.set('fcOnlyNew', fcOnlyNew); renderCards(true); };
  $('#fcShuffle').onclick = () => renderCards(true);
  const on = (id, fn) => { const el = document.getElementById(id); if (el) el.onclick = fn; };
  on('fcReveal', reveal); on('fcNext', nextCard); on('fcGot', gotIt);
  on('fcAgain', () => { deck.push(deck[deckPos]); nextCard(); });
  if (q && !revealed) {
    timerStart = Date.now();
    timerId = setInterval(() => {
      const s = Math.floor((Date.now() - timerStart) / 1000), el = document.getElementById('fcTimer');
      if (el) el.textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
    }, 500);
  }
}
function reveal() { revealed = true; renderCards(false); }
function nextCard() { stopSpeaking(); deckPos++; revealed = false; renderCards(false); window.scrollTo(0, 0); }
function gotIt() { const q = deck[deckPos]; if (q) setMastered(q.id, true); nextCard(); }

// ---------- progress ----------
function renderProgress() {
  mode = 'progress';
  renderNav();
  const done = QUESTIONS.filter(q => mastered[q.id]).length;
  const today = new Date().toDateString();
  const todayCount = Object.values(mastered).filter(t => new Date(t).toDateString() === today).length;
  const rows = CHAPTERS.filter(c => c.questions.length).map(c => {
    const s = chapterStats(c);
    return '<a class="prog-row" href="#' + c.id + '"><b>' + c.title + '</b><span>' + s.done + ' / ' + s.total + '</span>' +
      '<div class="bar"><i style="width:' + (s.done / s.total * 100) + '%"></i></div></a>';
  }).join('');
  content.className = 'content';
  content.innerHTML = '<h1>📊 Progress</h1><div class="stat-cards">' +
    '<div class="stat"><b>' + Math.round(done / (QUESTIONS.length || 1) * 100) + '%</b><small>overall mastered</small></div>' +
    '<div class="stat"><b>' + done + '</b><small>of ' + QUESTIONS.length + ' questions</small></div>' +
    '<div class="stat"><b>' + todayCount + '</b><small>mastered today</small></div></div>' +
    '<div class="prog-grid">' + rows + '</div>' +
    '<p style="margin-top:2rem"><button class="btn" id="resetBtn">Reset all progress</button> <span id="resetMsg" class="tip"></span></p>';
  let armed = false;
  $('#resetBtn').onclick = () => {
    if (!armed) { armed = true; $('#resetBtn').textContent = 'Click again to confirm reset'; return; }
    mastered = {}; checks = {}; store.set('mastered', mastered); store.set('checks', checks); renderProgress();
  };
}

// ---------- search ----------
const searchEl = $('#search'), resultsEl = $('#results');
searchEl.addEventListener('input', () => {
  const term = searchEl.value.trim().toLowerCase();
  if (term.length < 2) { resultsEl.hidden = true; return; }
  const words = term.split(/\s+/);
  const hits = QUESTIONS.map(q => {
    if (!words.every(w => q.text.includes(w))) return null;
    const inQ = words.filter(w => q.qText.toLowerCase().includes(w)).length;
    return { q, score: inQ };
  }).filter(Boolean).sort((a, b) => b.score - a.score).slice(0, 25);
  const heads = [];
  CHAPTERS.forEach(c => c.headings.forEach(h => { if (words.every(w => h.text.toLowerCase().includes(w))) heads.push({ c, h }); }));
  resultsEl.innerHTML = (hits.length || heads.length)
    ? heads.slice(0, 5).map(x => '<button data-cid="' + x.c.id + '" data-h="' + x.h.id + '">§ ' + x.h.text + '<small>' + x.c.title + '</small></button>').join('') +
      hits.map(h => '<button data-cid="' + h.q.cid + '" data-qid="' + h.q.id + '">' + h.q.qText + '<small>' + h.q.chapter + (mastered[h.q.id] ? ' · ✓ mastered' : '') + '</small></button>').join('')
    : '<p style="padding:.6rem .8rem;margin:0;color:var(--muted)">No matches</p>';
  resultsEl.hidden = false;
});
resultsEl.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  resultsEl.hidden = true; searchEl.value = '';
  if (location.hash !== '#' + b.dataset.cid) history.pushState(null, '', '#' + b.dataset.cid);
  renderChapter(b.dataset.cid, b.dataset.qid);
  if (b.dataset.h) { const el = document.getElementById(b.dataset.h); if (el) { el.scrollIntoView(); window.scrollBy(0, -70); } }
});
document.addEventListener('click', e => { if (!e.target.closest('.search')) resultsEl.hidden = true; });
searchEl.addEventListener('keydown', e => {
  if (e.key === 'Escape') { resultsEl.hidden = true; searchEl.blur(); }
  if (e.key === 'ArrowDown') { const f = resultsEl.querySelector('button'); if (f) { e.preventDefault(); f.focus(); } }
});
resultsEl.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' && e.target.nextElementSibling) { e.preventDefault(); e.target.nextElementSibling.focus(); }
  if (e.key === 'ArrowUp') { e.preventDefault(); (e.target.previousElementSibling || searchEl).focus(); }
});

// ---------- keyboard ----------
document.addEventListener('keydown', e => {
  const typing = /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName);
  if (e.key === '/' && !typing) { e.preventDefault(); searchEl.focus(); return; }
  if (mode !== 'cards' || typing || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === ' ' && !revealed && deck[deckPos]) { e.preventDefault(); reveal(); }
  else if ((e.key === 'g' || e.key === 'G') && revealed) gotIt();
  else if (e.key === 'ArrowRight') nextCard();
});

// ---------- routing, theme, mobile ----------
function route() {
  const h = decodeURIComponent(location.hash.slice(1));
  sidebar.classList.remove('open');
  if (h === 'cards') renderCards(true);
  else if (h === 'progress') renderProgress();
  else renderChapter(CHAPTERS.some(c => c.id === h) ? h : currentId);
}
window.addEventListener('hashchange', route);
document.querySelectorAll('.modes button').forEach(b => b.addEventListener('click', () => {
  const target = b.dataset.mode === 'study' ? currentId : b.dataset.mode;
  if (location.hash === '#' + target) route(); else location.hash = target;
}));
$('#menuBtn').onclick = () => sidebar.classList.toggle('open');
const applyTheme = t => { if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; };
applyTheme(store.get('theme', null));
$('#themeBtn').onclick = () => {
  const next = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
  applyTheme(next); store.set('theme', next);
};
route();
</script>
</body>
