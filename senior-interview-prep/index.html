nd when state needs to be shared widely, a reducer plus context is a lightweight option, but for complex global state I'd move to Redux Toolkit or Zustand.\u003c/p>\u003c/div>\n\u003cp>When state has \u003cstrong>multiple sub-values that change together\u003c/strong>, the next state depends on the previous one in complex ways, or you want transitions \u003cstrong>testable as a pure function\u003c/strong> (e.g. a checkout step machine). \u003ccode>dispatch\u003c/code> is stable, so you can pass it down without \u003ccode>useCallback\u003c/code>. Combined with Context it gives a mini-Redux.\u003c/p>\n\u003cdiv class=\"code\">\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003cpre>\u003ccode data-lang=\"jsx\">\u003cspan class=\"t-k\">function\u003c/span> reducer(state, action) {\n  \u003cspan class=\"t-k\">switch\u003c/span> (action.\u003cspan class=\"t-k\">type\u003c/span>) {\n    \u003cspan class=\"t-k\">case\u003c/span> \u003cspan class=\"t-s\">'added'\u003c/span>: \u003cspan class=\"t-k\">return\u003c/span> { ...state, items: [...state.items, action.item] };\n    \u003cspan class=\"t-k\">case\u003c/span> \u003cspan class=\"t-s\">'removed'\u003c/span>: \u003cspan class=\"t-k\">return\u003c/span> { ...state, items: state.items.filter(i =&gt; i.id !== action.id) };\n    \u003cspan class=\"t-k\">default\u003c/span>: \u003cspan class=\"t-k\">throw\u003c/span> \u003cspan class=\"t-k\">new\u003c/span> Error(\u003cspan class=\"t-s\">'Unknown action '\u003c/span> + action.\u003cspan class=\"t-k\">type\u003c/span>);\n  }\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>Where do side effects go when using a reducer?\u003c/summary>\u003cp>Not in the reducer, which must be pure. Side effects go in event handlers or effects that dispatch actions with the results.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>How do you test a reducer?\u003c/summary>\u003cp>Call it directly with a state and an action, and assert on the returned state. No rendering needed, which is one of its biggest advantages.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">useContext: performance problems and fixes\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>Context is great for passing values deep into the tree without prop drilling. Things like the theme, the current locale, and at Bell the language was a great example, plus the authenticated user and feature flags.\u003c/p>\u003cp>The performance issue is that every component consuming a context re-renders whenever the provider's value changes, and the change is detected by reference. A very common mistake is passing an inline object as the value, which is new on every render, so every consumer re-renders every time the provider renders. The fix is to memoize the value.\u003c/p>\u003cp>The second issue is putting everything in one big context, so any change re-renders everyone. I split contexts by domain, or separate state from dispatch, so components that only dispatch don't re-render.\u003c/p>\u003cp>And I see context as dependency injection, not a state manager. For frequently changing shared state, like a cart, I'd use a store with selector-based subscriptions, like Redux Toolkit or Zustand, so components only re-render when their slice changes.\u003c/p>\u003c/div>\n\u003cp>Every consumer re-renders when the Provider's \u003ccode>value\u003c/code> changes (by reference). Problems:\u003c/p>\n\u003cul>\u003cli>\u003ccode>value={{ user, setUser }}\u003c/code> creates a new object every render, so all consumers re-render. Fix: \u003ccode>useMemo\u003c/code> the value.\u003c/li>\u003cli>One big context holding everything re-renders everyone on any change. Fix: \u003cstrong>split contexts\u003c/strong> (state vs dispatch, or by domain).\u003c/li>\u003cli>Context isn't a state manager. It's \u003cstrong>dependency injection\u003c/strong>. For high-frequency updates use Zustand/Redux (selector-based subscriptions) or \u003ccode>useSyncExternalStore\u003c/code>.\u003c/li>\u003c/ul>\n\u003cp>Good uses: theme, locale (EN/FR!), auth user, feature flags.\u003c/p>\n\u003cp>React 19: \u003ccode>&lt;Context value={...}&gt;\u003c/code> can be used directly as the provider.\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>How would you let components subscribe to only part of a context?\u003c/summary>\u003cp>Context doesn't support selectors natively. Options are splitting the context, wrapping consumers in memoised components that receive only what they need, or using a store with selectors like Zustand, or the \u003ccode>use-context-selector\u003c/code> library.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>Where should the language (EN/FR) live?\u003c/summary>\u003cp>In context, or in the i18n library's provider, plus the URL. It changes rarely, so the context re-render cost is irrelevant, and the URL makes it shareable and SEO-friendly.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Custom hooks: what makes a good one?\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>A custom hook is a way to reuse stateful logic, not state itself. Every component that calls the hook gets its own independent state.\u003c/p>\u003cp>What makes a good one: it does one thing and has a clear name starting with \u003ccode>use\u003c/code>. It hides the messy details like subscriptions, cleanup, cancellation and edge cases, and exposes a small, simple API. For example, \u003ccode>useDebounce\u003c/code>, \u003ccode>useMediaQuery\u003c/code>, \u003ccode>useOnClickOutside\u003c/code>, or at Bell something like \u003ccode>useCart\u003c/code>, which wraps selectors and dispatches so components don't know whether the cart lives in Redux or a query cache.\u003c/p>\u003cp>It should also be easy to test. I test hooks with \u003ccode>renderHook\u003c/code> from Testing Library. And I avoid hooks that do too much or return a huge object, because then every consumer re-renders on any change. Good custom hooks make components read like a description of what they do, not how.\u003c/p>\u003c/div>\n\u003cp>A custom hook shares \u003cstrong>stateful logic\u003c/strong>, not state. Each call has its own state. Good ones: \u003ccode>useDebounce\u003c/code>, \u003ccode>useMediaQuery\u003c/code>, \u003ccode>useOnClickOutside\u003c/code>, \u003ccode>useLocalStorage\u003c/code>, \u003ccode>useCart\u003c/code>, \u003ccode>useFeatureFlag\u003c/code>. Name them \u003ccode>useX\u003c/code>, return a minimal API, handle cleanup, and test them with \u003ccode>renderHook\u003c/code>.\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>Do two components using the same custom hook share state?\u003c/summary>\u003cp>No. Each call gets its own state. To share state, the hook has to read from shared storage, like context or an external store.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>How do you test a custom hook?\u003c/summary>\u003cp>With \u003ccode>renderHook\u003c/code> from React Testing Library, wrapping it with any needed providers, and asserting on \u003ccode>result.current\u003c/code>, using \u003ccode>act\u003c/code> for updates and fake timers or MSW for async behaviour.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">useId, useSyncExternalStore, useImperativeHandle, useDebugValue\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>\u003ccode>useId\u003c/code> generates a unique ID that's stable and identical on server and client. I use it to connect labels and ARIA attributes, like \u003ccode>htmlFor\u003c/code> and \u003ccode>aria-describedby\u003c/code>, in reusable components where hard-coded IDs would collide. It's not meant for list keys.\u003c/p>\u003cp>\u003ccode>useSyncExternalStore\u003c/code> is how you subscribe to a store outside React, like Redux, Zustand or a browser API such as online status, in a way that's safe with concurrent rendering. It prevents tearing, where different parts of the UI show different values of the same store during one render. Most of us use it indirectly through libraries.\u003c/p>\u003cp>\u003ccode>useImperativeHandle\u003c/code> lets a component expose a limited imperative API through a ref, like \u003ccode>focus\u003c/code> or \u003ccode>scrollToTop\u003c/code>, instead of exposing the whole DOM node. And \u003ccode>useDebugValue\u003c/code> just labels custom hooks in DevTools.\u003c/p>\u003c/div>\n\u003cul>\u003cli>\u003ccode>useId\u003c/code>: stable unique IDs that match between server and client (for \u003ccode>htmlFor\u003c/code>/ARIA). Not for list keys.\u003c/li>\u003cli>\u003ccode>useSyncExternalStore(subscribe, getSnapshot, getServerSnapshot)\u003c/code>: subscribe to external stores (Redux and Zustand use it) \u003cstrong>without tearing\u003c/strong> under concurrent rendering.\u003c/li>\u003cli>\u003ccode>useImperativeHandle\u003c/code>: expose a limited imperative API (\u003ccode>focus()\u003c/code>, \u003ccode>scrollToTop()\u003c/code>) via a ref.\u003c/li>\u003cli>\u003ccode>useDebugValue\u003c/code>: label custom hooks in DevTools.\u003c/li>\u003c/ul>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>Why not use Math.random() for IDs in components?\u003c/summary>\u003cp>It produces different values on the server and the client, causing hydration mismatches, and changes on every render. \u003ccode>useId\u003c/code> is stable and consistent.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>What's tearing?\u003c/summary>\u003cp>When concurrent rendering pauses mid-render and an external store changes, different components can display different versions of the same data in one frame. \u003ccode>useSyncExternalStore\u003c/code> prevents that.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">What is useEffectEvent (19.2)?\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>\u003ccode>useEffectEvent\u003c/code>, stable in React 19.2, solves a long-standing problem with effects. Sometimes an effect needs to read the latest value of a prop or state, but you don't want changes to that value to re-run the effect.\u003c/p>\u003cp>The classic example is a chat connection. The effect should reconnect when the room ID changes, but it also shows a notification using the current theme. If I put theme in the dependency array, changing the theme disconnects and reconnects the chat, which is wrong. If I leave it out, the linter complains and I get a stale value.\u003c/p>\u003cp>With \u003ccode>useEffectEvent\u003c/code>, I wrap the notification logic in an effect event. It always sees the latest props and state, but it isn't a dependency, so the effect only re-runs for the room ID. It replaces the old workaround of storing the latest callback in a ref.\u003c/p>\u003c/div>\n\u003cp>It lets you read the \u003cstrong>latest\u003c/strong> props/state inside an effect \u003cstrong>without adding them as dependencies\u003c/strong>. It solves \"my effect re-subscribes whenever \u003ccode>theme\u003c/code> changes, but I only use theme inside the callback\".\u003c/p>\n\u003cdiv class=\"code\">\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003cpre>\u003ccode data-lang=\"jsx\">\u003cspan class=\"t-k\">const\u003c/span> onConnected = useEffectEvent(() =&gt; showToast(\u003cspan class=\"t-s\">'Connected'\u003c/span>, theme));\nuseEffect(() =&gt; {\n  \u003cspan class=\"t-k\">const\u003c/span> conn = connect(roomId);\n  conn.on(\u003cspan class=\"t-s\">'connected'\u003c/span>, () =&gt; onConnected());\n  \u003cspan class=\"t-k\">return\u003c/span> () =&gt; conn.disconnect();\n}, [roomId]);  \u003cspan class=\"t-c\">// theme is NOT a dependency\u003c/span>\u003c/code>\u003c/pre>\u003c/div>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>What did people do before useEffectEvent?\u003c/summary>\u003cp>Stored the latest callback in a ref updated on every render, and called the ref inside the effect. Or they disabled the exhaustive-deps lint rule, which was risky.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>Can you call an effect event from an event handler?\u003c/summary>\u003cp>No. It's designed to be called only from inside effects. For regular event handlers you just use a normal function.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003ch2 id=\"concurrent-react-suspense\">Concurrent React &amp; Suspense\u003c/h2>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">useTransition and useDeferredValue: what problem do they solve?\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>Both let me tell React that some updates are less urgent than others, so the UI stays responsive.\u003c/p>\u003cp>With \u003ccode>useTransition\u003c/code>, I wrap a state update in \u003ccode>startTransition\u003c/code>. For example, in a product filter, updating the text in the input is urgent, but re-rendering a large filtered list isn't. React renders the transition in the background and can interrupt it if the user types again, and \u003ccode>isPending\u003c/code> lets me show a subtle loading indicator. In React 19, transitions can also be async, which is the basis of Actions.\u003c/p>\u003cp>\u003ccode>useDeferredValue\u003c/code> does the same thing, but when I only have a value, not control of the setter, for example a prop coming from a parent. It gives me a version of the value that lags behind during heavy rendering.\u003c/p>\u003cp>The key point is that these don't make the work faster. They make it interruptible, which improves responsiveness and INP. For network requests, debouncing is still useful, because transitions don't reduce the number of API calls.\u003c/p>\u003c/div>\n\u003cp>They mark updates as \u003cstrong>non-urgent\u003c/strong>, so urgent updates (typing, clicking) stay responsive (good for \u003cstrong>INP\u003c/strong>).\u003c/p>\n\u003cdiv class=\"code\">\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003cpre>\u003ccode data-lang=\"jsx\">\u003cspan class=\"t-k\">const\u003c/span> [isPending, startTransition] = useTransition();\n\u003cspan class=\"t-k\">const\u003c/span> onChange = e =&gt; {\n  setInput(e.target.value);                         \u003cspan class=\"t-c\">// urgent: input stays snappy\u003c/span>\n  startTransition(() =&gt; setFilter(e.target.value)); \u003cspan class=\"t-c\">// can be interrupted\u003c/span>\n};\n\n\u003cspan class=\"t-k\">const\u003c/span> deferredQuery = useDeferredValue(query);      \u003cspan class=\"t-c\">// lagging copy of a value\u003c/span>\n\u003cspan class=\"t-k\">const\u003c/span> results = useMemo(() =&gt; heavyFilter(items, deferredQuery), [items, deferredQuery]);\u003c/code>\u003c/pre>\u003c/div>\n\u003cul>\u003cli>\u003ccode>useTransition\u003c/code>: you control the \u003cstrong>setter\u003c/strong>. React 19 allows \u003cstrong>async\u003c/strong> functions in transitions (Actions).\u003c/li>\u003cli>\u003ccode>useDeferredValue\u003c/code>: you only have the \u003cstrong>value\u003c/strong> (e.g. a prop).\u003c/li>\u003c/ul>\n\u003cp>They don't make work faster. They make it \u003cstrong>interruptible\u003c/strong>. Debounce is still useful for network calls.\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>What's the difference between useTransition and debouncing?\u003c/summary>\u003cp>Debouncing delays the work by a fixed time and reduces how many times it happens, which is great for network requests. Transitions start immediately but can be interrupted by urgent updates, which suits expensive rendering.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>Can you use a transition to update a controlled input's value?\u003c/summary>\u003cp>No. Updates to an input's value must be urgent, otherwise typing becomes laggy or broken. You keep the input update urgent and mark only the expensive derived update as a transition.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">How does Suspense work?\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>Suspense lets a component declare that it's waiting for something, and a parent \u003ccode>Suspense\u003c/code> boundary shows a fallback until it's ready. A component suspends when it's waiting for lazy-loaded code from \u003ccode>React.lazy\u003c/code>, or data from a Suspense-enabled source, like the \u003ccode>use\u003c/code> API with a promise, framework loaders, or TanStack Query's suspense hooks, or server components streaming in.\u003c/p>\u003cp>The big advantage is that loading states become declarative and are controlled by where I place boundaries, instead of every component having its own \u003ccode>isLoading\u003c/code> check. I can wrap a whole page for one spinner, or wrap each slow widget separately so the rest of the page shows immediately.\u003c/p>\u003cp>On the server, Suspense enables streaming SSR: the server sends the HTML shell first and streams in each section as its data resolves, and selective hydration means React hydrates whatever the user interacts with first. Combined with transitions, React can keep showing the current UI instead of flashing a fallback when navigating.\u003c/p>\u003c/div>\n\u003cp>\u003ccode>&lt;Suspense fallback={&lt;Spinner/&gt;}&gt;\u003c/code> shows a fallback while a child \u003cstrong>suspends\u003c/strong>, which happens when it's waiting on lazy code (\u003ccode>React.lazy\u003c/code>), data via a Suspense-enabled source (\u003ccode>use(promise)\u003c/code>, framework loaders, TanStack Query \u003ccode>useSuspenseQuery\u003c/code>), or RSC streaming.\u003c/p>\n\u003cp>Benefits: declarative loading states, coordinated reveal, \u003cstrong>streaming SSR\u003c/strong> (send HTML for ready parts first, then stream the rest), selective hydration. Nested boundaries define the loading UX granularity. Transitions keep showing old UI instead of falling back to the spinner again.\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>Can you use Suspense for data fetching with useEffect?\u003c/summary>\u003cp>No. Suspense only works with data sources that integrate with it, like \u003ccode>use(promise)\u003c/code>, framework loaders, or libraries like TanStack Query's suspense hooks. A fetch in an effect doesn't suspend.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>What's a waterfall, and how does Suspense relate?\u003c/summary>\u003cp>A waterfall is when a child only starts fetching after its parent finishes, so requests run in sequence. Suspense doesn't fix that by itself; you fix it by starting fetches earlier, in parallel, at the route level, or on the server.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>Where would you put Suspense boundaries on a product page?\u003c/summary>\u003cp>Around independent slow sections, like reviews and recommendations, so the main product info and the add-to-cart button aren't blocked by them.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Error boundaries\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>An error boundary catches JavaScript errors thrown while rendering its children and shows a fallback UI instead of unmounting the whole app. They still have to be class components, using \u003ccode>getDerivedStateFromError\u003c/code> to show the fallback and \u003ccode>componentDidCatch\u003c/code> to log, or most teams use the \u003ccode>react-error-boundary\u003c/code> package.\u003c/p>\u003cp>They don't catch errors in event handlers, asynchronous code, server-side rendering, or the boundary itself, so I still need try/catch in handlers and proper error states for requests.\u003c/p>\u003cp>The senior part is where to place them. I put one at the route level, and smaller ones around independent widgets. On an e-commerce page, if the recommendations widget crashes, it should disappear or show a small message, not take down the checkout button. I log errors to monitoring like Sentry with the component stack, and offer a \"try again\" button that resets the boundary.\u003c/p>\u003c/div>\n\u003cp>Components that catch \u003cstrong>render/lifecycle errors\u003c/strong> in their subtree and show a fallback. They are still \u003cstrong>class components\u003c/strong> (\u003ccode>static getDerivedStateFromError\u003c/code> + \u003ccode>componentDidCatch\u003c/code>), or you use \u003ccode>react-error-boundary\u003c/code>.\u003c/p>\n\u003cp>They \u003cstrong>don't catch\u003c/strong>: event handler errors (use try/catch), async code, SSR errors, or errors in the boundary itself.\u003c/p>\n\u003cp>Senior use: put boundaries around \u003cstrong>independent widgets\u003c/strong> (recommendations, reviews) so one failure doesn't blank the checkout; log to Sentry in \u003ccode>componentDidCatch\u003c/code>; offer a \"Try again\" reset. React 19 adds root options \u003ccode>onCaughtError\u003c/code> / \u003ccode>onUncaughtError\u003c/code>.\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>How do you handle errors from event handlers?\u003c/summary>\u003cp>With try/catch in the handler, setting error state to show a message, and reporting the error to monitoring. If you want it to reach a boundary, you can set state that throws during the next render.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>How do you reset an error boundary?\u003c/summary>\u003cp>Provide a reset function, for example a \"Try again\" button that clears the error state, and reset automatically when certain keys change, like the route. react-error-boundary supports both.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003ch2 id=\"react-19-features\">React 19 Features\u003c/h2>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">What's new in React 19? (be able to list 6–8)\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>The headline feature is Actions. You can pass async functions to transitions and to a form's \u003ccode>action\u003c/code> prop, and React handles pending states, errors and form resets. Alongside that come new hooks: \u003ccode>useActionState\u003c/code> returns the result of an action plus a pending flag, \u003ccode>useFormStatus\u003c/code> lets a submit button know whether its parent form is submitting, and \u003ccode>useOptimistic\u003c/code> shows an optimistic value that automatically reverts if the action fails.\u003c/p>\u003cp>There's also the new \u003ccode>use\u003c/code> API, which reads a promise or context and can be called conditionally. Server Components and Server Actions are now stable for frameworks.\u003c/p>\u003cp>Several quality-of-life changes: \u003ccode>ref\u003c/code> is a regular prop, so no more \u003ccode>forwardRef\u003c/code>, ref callbacks can return cleanup functions, a context can be used directly as its provider, and you can render \u003ccode>title\u003c/code> and \u003ccode>meta\u003c/code> tags anywhere and React hoists them into the head. Hydration errors are much clearer too.\u003c/p>\u003cp>Then in 19.2 we got the \u003ccode>Activity\u003c/code> component for keeping hidden UI alive and pre-rendering it, and \u003ccode>useEffectEvent\u003c/code>. Alongside React 19, the React Compiler reached 1.0 for automatic memoization.\u003c/p>\u003c/div>\n\u003col>\u003cli>\u003cstrong>Actions\u003c/strong>: async functions in transitions handle pending state, errors and optimistic updates. \u003ccode>&lt;form action={fn}&gt;\u003c/code> accepts functions.\u003c/li>\u003cli>\u003cstrong>\u003ccode>useActionState\u003c/code>\u003c/strong>: \u003ccode>[state, formAction, isPending] = useActionState(action, initial)\u003c/code>.\u003c/li>\u003cli>\u003cstrong>\u003ccode>useFormStatus\u003c/code>\u003c/strong>: read the parent form's pending state in a child (e.g. a submit button).\u003c/li>\u003cli>\u003cstrong>\u003ccode>useOptimistic\u003c/code>\u003c/strong>: show an optimistic value while the async action runs; it reverts automatically on failure.\u003c/li>\u003cli>\u003cstrong>\u003ccode>use(resource)\u003c/code>\u003c/strong>: read a promise (suspends) or context, \u003cstrong>conditionally\u003c/strong> allowed.\u003c/li>\u003cli>\u003cstrong>Server Components &amp; Server Actions\u003c/strong> (\u003ccode>'use server'\u003c/code>) are stable for frameworks.\u003c/li>\u003cli>\u003cstrong>\u003ccode>ref\u003c/code> as a prop\u003c/strong> (no \u003ccode>forwardRef\u003c/code>), ref cleanup functions, \u003ccode>&lt;Context&gt;\u003c/code> as a provider.\u003c/li>\u003cli>\u003cstrong>Document metadata\u003c/strong>: \u003ccode>&lt;title&gt;\u003c/code>, \u003ccode>&lt;meta&gt;\u003c/code>, \u003ccode>&lt;link&gt;\u003c/code> rendered anywhere get hoisted to \u003ccode>&lt;head&gt;\u003c/code>. Stylesheet precedence, \u003ccode>preload\u003c/code>/\u003ccode>preinit\u003c/code> resource APIs.\u003c/li>\u003cli>Better hydration error messages, custom elements support.\u003c/li>\u003cli>\u003cstrong>19.2\u003c/strong>: \u003ccode>&lt;Activity mode=\"hidden\"&gt;\u003c/code> (keep state of hidden UI, pre-render), \u003ccode>useEffectEvent\u003c/code>, Performance tracks in DevTools.\u003c/li>\u003c/ol>\n\u003cdiv class=\"code\">\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003cpre>\u003ccode data-lang=\"jsx\">\u003cspan class=\"t-k\">function\u003c/span> AddToCart({ productId }) {\n  \u003cspan class=\"t-k\">const\u003c/span> [state, formAction, isPending] = useActionState(\u003cspan class=\"t-k\">async\u003c/span> (prev, formData) =&gt; {\n    \u003cspan class=\"t-k\">const\u003c/span> res = \u003cspan class=\"t-k\">await\u003c/span> addToCart(productId, formData.get(\u003cspan class=\"t-s\">'qty'\u003c/span>));\n    \u003cspan class=\"t-k\">return\u003c/span> res.ok ? { ok: \u003cspan class=\"t-k\">true\u003c/span> } : { error: \u003cspan class=\"t-s\">'Could not add item'\u003c/span> };\n  }, {});\n  \u003cspan class=\"t-k\">return\u003c/span> (\n    &lt;form action={formAction}&gt;\n      &lt;input name=\u003cspan class=\"t-s\">\"qty\"\u003c/span> \u003cspan class=\"t-k\">type\u003c/span>=\u003cspan class=\"t-s\">\"number\"\u003c/span> defaultValue={\u003cspan class=\"t-n\">1\u003c/span>} min={\u003cspan class=\"t-n\">1\u003c/span>} /&gt;\n      &lt;button disabled={isPending}&gt;{isPending ? \u003cspan class=\"t-s\">'Adding…'\u003c/span> : \u003cspan class=\"t-s\">'Add to cart'\u003c/span>}&lt;/button&gt;\n      {state.error &amp;&amp; &lt;p role=\u003cspan class=\"t-s\">\"alert\"\u003c/span>&gt;{state.error}&lt;/p&gt;}\n    &lt;/form&gt;\n  );\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>What's the difference between useActionState and useFormStatus?\u003c/summary>\u003cp>\u003ccode>useActionState\u003c/code> wraps an action and gives you its last result and a pending flag in the component that owns the form. \u003ccode>useFormStatus\u003c/code> is called in a child of a form, like a submit button, to read whether that form is submitting.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>Have you migrated a project to React 19? What broke?\u003c/summary>\u003cp>\u003cspan class=\"fill\">[Answer honestly.]\u003c/span> Common issues: removed legacy APIs like string refs and \u003ccode>propTypes\u003c/code> checks, \u003ccode>forwardRef\u003c/code> becoming unnecessary, and third-party libraries needing updates. Codemods handle much of it.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>What does the use API do with context?\u003c/summary>\u003cp>It reads context like \u003ccode>useContext\u003c/code>, but it can be called conditionally, for example after an early return.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">React Server Components (RSC): explain them clearly\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>Server Components are components that run only on the server, either at build time or per request. Their code is never sent to the browser, so they add zero JavaScript to the bundle. They can be async and fetch data directly, from a database or an internal service, and they can safely use secrets.\u003c/p>\u003cp>Client Components are the interactive ones we've always written. You mark the entry point with \u003ccode>'use client'\u003c/code>, and they can use state, effects and browser APIs. They're still pre-rendered to HTML on the server, then hydrated in the browser.\u003c/p>\u003cp>The rules: server components can render client components, but client components can't import server components, although they can receive them as children. Props crossing from server to client must be serialisable. And \u003ccode>'use client'\u003c/code> marks a boundary, so I push it as far down the tree as possible.\u003c/p>\u003cp>I'd stress that RSC isn't the same as SSR. SSR turns components into HTML for the first load. RSC produces a serialised component tree that can be streamed and refetched without full page reloads.\u003c/p>\u003cp>For something like Bell's product pages this is a big win: the product details, specs and pricing render on the server with no client JS, and only the plan selector and add-to-cart button are client components. That means a smaller bundle, better LCP and INP, and good SEO.\u003c/p>\u003c/div>\n\u003cp>\u003cstrong>Server Components\u003c/strong> render \u003cstrong>only on the server\u003c/strong> (at build or request time). Their code \u003cstrong>never ships to the browser\u003c/strong>: zero JS bundle cost. They can be \u003ccode>async\u003c/code> and access data directly (DB, internal APIs, secrets).\u003c/p>\n\u003cp>\u003cstrong>Client Components\u003c/strong> (\u003ccode>'use client'\u003c/code> at the top of a file) are the familiar interactive components. They're pre-rendered to HTML on the server (SSR) \u003cstrong>and\u003c/strong> hydrated on the client. They can use state, effects and browser APIs.\u003c/p>\n\u003cp>Rules:\u003c/p>\n\u003cul>\u003cli>Server components can import and render client components; client components \u003cstrong>cannot import\u003c/strong> server components (but can receive them as \u003ccode>children\u003c/code>/props).\u003c/li>\u003cli>Props from server to client must be \u003cstrong>serialisable\u003c/strong> (no functions, except Server Actions).\u003c/li>\u003cli>\u003ccode>'use client'\u003c/code> marks a \u003cstrong>boundary\u003c/strong>: everything imported below it becomes client code. Push it to the \u003cstrong>leaves\u003c/strong>.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>RSC ≠ SSR.\u003c/strong> SSR produces HTML from components for the first load. RSC produces a serialised component tree (the RSC payload) and can refetch parts without a full page reload. Frameworks combine both.\u003c/p>\n\u003cp>\u003cstrong>Why it matters for e-commerce like Bell:\u003c/strong> product/plan pages render on the server with data close to the source, ship less JS (better LCP/INP), get better SEO, and keep only the \"Add to cart\" and \"Plan selector\" interactive.\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>Can a server component use useState?\u003c/summary>\u003cp>No. Server components can't use state, effects or browser APIs, because they don't run in the browser. You extract the interactive part into a client component.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>How do you pass a server component into a client component?\u003c/summary>\u003cp>As \u003ccode>children\u003c/code> or another prop. The client component can't import it, but it can render what the server passed to it.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>Do server components replace data fetching libraries?\u003c/summary>\u003cp>For initial page data, often yes. For client-side interactions, like infinite scrolling or optimistic updates, client libraries like TanStack Query are still useful.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Server Actions: what are they and what are the security concerns?\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>Server Actions are async functions marked with \u003ccode>'use server'\u003c/code> that run on the server but can be called directly from client components or used as a form's \u003ccode>action\u003c/code>. The framework turns each one into an HTTP endpoint and handles the request for you, so you don't write a separate API route for simple mutations.\u003c/p>\u003cp>The security point is the most important part of the answer: a Server Action is a public endpoint. Anyone can call it with any arguments, not just your UI. So inside every action I validate the input, ideally with a Zod schema, and I check authentication and authorisation right there, never relying on the UI hiding a button. I don't trust hidden form fields, like a price, and I re-read sensitive data from the server.\u003c/p>\u003cp>Frameworks like Next.js add CSRF protection by checking the origin, and encrypt values captured in closures, but auth and validation are still my responsibility.\u003c/p>\u003c/div>\n\u003cp>Functions marked \u003ccode>'use server'\u003c/code> that run on the server and are callable from client components/forms. The framework creates an endpoint for them.\u003c/p>\n\u003cp>\u003cstrong>Security:\u003c/strong> they're \u003cstrong>public HTTP endpoints\u003c/strong>. Always validate input (Zod), \u003cstrong>authenticate and authorize inside the action\u003c/strong>, don't trust hidden fields, and watch out for leaking closures/secrets. Frameworks add CSRF protection (origin checks), but you're still responsible for auth.\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>How do you show validation errors from a server action?\u003c/summary>\u003cp>Return an error object from the action and read it with \u003ccode>useActionState\u003c/code>, rendering the errors next to the fields.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>Are server actions good for fetching data?\u003c/summary>\u003cp>Not really. They're designed for mutations and run sequentially. For reads, use server components or route handlers.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003ch2 id=\"patterns-architecture\">Patterns &amp; Architecture\u003c/h2>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Controlled vs uncontrolled components\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>In a controlled component, React state is the source of truth: the input gets its value from state and updates through \u003ccode>onChange\u003c/code>. That makes it easy to validate as the user types, format input like a phone number or postal code, or enable a button based on the value. The cost is a re-render on every keystroke, which is usually fine but can matter in large forms.\u003c/p>\u003cp>In an uncontrolled component, the DOM keeps the value. I set a \u003ccode>defaultValue\u003c/code> and read it when needed, through a ref or from \u003ccode>FormData\u003c/code> on submit. It's simpler and has fewer re-renders, and it fits naturally with native forms and React 19 form actions.\u003c/p>\u003cp>Libraries like React Hook Form use uncontrolled inputs under the hood for performance. One gotcha: an input must not switch between controlled and uncontrolled, which usually happens when the value starts as undefined, and React warns about it.\u003c/p>\u003c/div>\n\u003cul>\u003cli>\u003cstrong>Controlled:\u003c/strong> React state is the source of truth (\u003ccode>value\u003c/code> + \u003ccode>onChange\u003c/code>). Enables instant validation and formatting (phone/postal code masks), but re-renders on each keystroke.\u003c/li>\u003cli>\u003cstrong>Uncontrolled:\u003c/strong> the DOM holds the value (\u003ccode>defaultValue\u003c/code>, read with a ref or \u003ccode>FormData\u003c/code>). Fewer re-renders and simpler with native forms / React 19 actions.\u003c/li>\u003c/ul>\n\u003cp>React Hook Form uses uncontrolled inputs + refs for performance. Don't switch a component between the two (the warning comes from \u003ccode>value\u003c/code> going from \u003ccode>undefined\u003c/code> to defined).\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>How does React Hook Form achieve good performance?\u003c/summary>\u003cp>It registers inputs as uncontrolled with refs, so typing doesn't re-render the whole form. It only re-renders components that subscribe to specific field values or errors.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>How do you reset an uncontrolled form?\u003c/summary>\u003cp>Call \u003ccode>form.reset()\u003c/code> on the form element, change the \u003ccode>key\u003c/code> to remount it, or use the form library's reset. React 19 resets forms automatically after a successful action.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Composition patterns: children, render props, HOCs, compound components, headless\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>My default is plain composition with \u003ccode>children\u003c/code> and props. It's simple, and it's even a performance tool: content passed as children doesn't re-render when the wrapper's state changes.\u003c/p>\u003cp>For components with several related parts, I use compound components, like \u003ccode>Tabs\u003c/code> with \u003ccode>Tab\u003c/code> and \u003ccode>TabPanel\u003c/code>, which share state through context. That gives a flexible, readable API.\u003c/p>\u003cp>Render props and higher-order components were the older ways to share logic. Custom hooks have mostly replaced them, though you still see HOCs like \u003ccode>withAuth\u003c/code> or Redux's \u003ccode>connect\u003c/code> in legacy code, and I've migrated some of those to hooks at Bell.\u003c/p>\u003cp>For design systems, I like headless components, such as Radix or React Aria. They handle behaviour and accessibility, like keyboard navigation and ARIA, and we provide the styling. That way we don't re-implement a combobox or dialog and get accessibility subtly wrong.\u003c/p>\u003c/div>\n\u003cul>\u003cli>\u003cstrong>Composition / children:\u003c/strong> the default. Also a \u003cstrong>performance trick\u003c/strong>: \u003ccode>children\u003c/code> created by the parent don't re-render when the wrapper's state changes.\u003c/li>\u003cli>\u003cstrong>Compound components:\u003c/strong> \u003ccode>&lt;Tabs&gt;&lt;Tab/&gt;&lt;TabPanel/&gt;&lt;/Tabs&gt;\u003c/code> sharing implicit state via context.\u003c/li>\u003cli>\u003cstrong>Render props / HOCs:\u003c/strong> older logic-sharing patterns, mostly replaced by \u003cstrong>custom hooks\u003c/strong>. HOCs still exist (\u003ccode>withAuth\u003c/code>, \u003ccode>connect\u003c/code>).\u003c/li>\u003cli>\u003cstrong>Headless components:\u003c/strong> logic + a11y, no styles (Radix UI, React Aria, Headless UI, TanStack Table). Great for design systems: accessible behaviour with your brand's styles.\u003c/li>\u003cli>\u003cstrong>Container/presentational:\u003c/strong> less strict today, but \"smart data hooks + dumb UI components\" remains good for testing.\u003c/li>\u003cli>\u003cstrong>Polymorphic components:\u003c/strong> \u003ccode>&lt;Button as=\"a\" href&gt;\u003c/code> / \u003ccode>asChild\u003c/code> (Radix Slot).\u003c/li>\u003c/ul>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>What's the \"children as a performance trick\"?\u003c/summary>\u003cp>If a stateful wrapper receives its expensive content as \u003ccode>children\u003c/code>, that content was created by the parent. When the wrapper's state changes, React can reuse those elements and doesn't re-render them.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>When is a HOC still a reasonable choice?\u003c/summary>\u003cp>For cross-cutting behaviour applied to many components at the boundary, like analytics tracking or permission checks, or when working with existing APIs like Redux \u003ccode>connect\u003c/code>. For new logic sharing, hooks are better.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">How do you structure a large React codebase?\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>I organise by feature rather than by file type. Instead of global \u003ccode>components\u003c/code>, \u003ccode>reducers\u003c/code> and \u003ccode>utils\u003c/code> folders, there's a \u003ccode>features/cart\u003c/code> folder with the cart's components, hooks, API calls, state, types and tests together. Changes to one feature stay in one place, and it's easier to see what can be deleted.\u003c/p>\u003cp>Shared building blocks live in a separate UI or design-system area, and general utilities in a lib folder. Each feature exposes a public API through an index file, and I enforce boundaries with lint rules so features don't import each other's internals. That stops the codebase turning into spaghetti.\u003c/p>\u003cp>On top of that come consistency tools: TypeScript in strict mode, ESLint and Prettier, path aliases, and CODEOWNERS so the right people review changes. When there are several apps sharing a design system, I'd use a monorepo with Nx or Turborepo, so changes across the app and the shared library happen in one pull request.\u003c/p>\u003c/div>\n\u003cul>\u003cli>\u003cstrong>Feature-based folders\u003c/strong> (\u003ccode>features/cart\u003c/code>, \u003ccode>features/checkout\u003c/code>) over type-based (\u003ccode>components/\u003c/code>, \u003ccode>reducers/\u003c/code>): colocate components, hooks, tests, API and types.\u003c/li>\u003cli>\u003ccode>shared/\u003c/code> or \u003ccode>ui/\u003c/code> for design-system primitives; \u003ccode>lib/\u003c/code> for utilities.\u003c/li>\u003cli>Clear \u003cstrong>public API per feature\u003c/strong> (\u003ccode>index.ts\u003c/code>), with lint rules forbidding deep imports across features (eslint-plugin-boundaries, Nx module boundaries).\u003c/li>\u003cli>Absolute imports / path aliases.\u003c/li>\u003cli>\u003cstrong>Monorepo\u003c/strong> (Nx/Turborepo + pnpm workspaces) when there are several apps sharing a design system.\u003c/li>\u003cli>Enforce consistency with ESLint, Prettier, TS strict, commit hooks and a CODEOWNERS file.\u003c/li>\u003c/ul>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>How do you prevent features from importing each other's internals?\u003c/summary>\u003cp>Expose a public API through each feature's index file, and enforce boundaries with lint rules like eslint-plugin-boundaries or Nx module boundaries, so violations fail in CI.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>Where do you put shared components?\u003c/summary>\u003cp>Truly generic ones, like Button and Modal, go in the design system or a shared UI package. Components shared by only two features stay in one of them until they're really reused.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">StrictMode: what does it do?\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>StrictMode is a development-only tool that helps find bugs early. It renders components twice, and calls initialisers and reducers twice, to catch impure rendering logic. It also mounts components, unmounts them and mounts them again, which runs effects and their cleanups an extra time to reveal effects that don't clean up properly. And it warns about deprecated APIs.\u003c/p>\u003cp>None of this happens in production, so there's no performance cost for users.\u003c/p>\u003cp>The common confusion is when a developer sees their API call fire twice in development and wants to remove StrictMode. My answer is that the double call is revealing a real issue: if the effect can't safely run twice, it probably also has race conditions or leaks. The right fix is a proper cleanup, like aborting the request, or using a data-fetching library.\u003c/p>\u003c/div>\n\u003cp>Dev only: double-invokes render functions, initialisers and reducers, and runs effects mount → unmount → mount, to catch \u003cstrong>impure renders and missing cleanups\u003c/strong>. It also warns about deprecated APIs. No production impact. If your fetch fires twice in dev, that's StrictMode, and your fix is a correct cleanup/abort, \u003cstrong>not\u003c/strong> removing StrictMode.\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>Should StrictMode be enabled in production?\u003c/summary>\u003cp>It doesn't affect production at all; its checks only run in development. So you leave it on in the code.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>What kind of bug does the double render catch?\u003c/summary>\u003cp>Impure render logic, like mutating a variable outside the component or pushing to an array during render, which would give different results when rendered twice.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Portals: when and gotchas\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>A portal renders a child into a different DOM node, usually directly under \u003ccode>body\u003c/code>, while keeping it in the same place in the React tree. I use them for modals, tooltips, dropdown menus and toast notifications, because those need to escape parent containers with \u003ccode>overflow: hidden\u003c/code> or stacking context problems with z-index.\u003c/p>\u003cp>The main gotcha is that events bubble through the React tree, not the DOM tree. So a click inside a portal-rendered modal will trigger \u003ccode>onClick\u003c/code> handlers on the React parent, even though in the DOM it's somewhere else entirely. Context also flows through normally, which is usually what you want.\u003c/p>\u003cp>Also worth mentioning: modern browser features reduce the need for portals. The native \u003ccode>dialog\u003c/code> element and the Popover API render in the top layer, which sits above everything without any z-index fights.\u003c/p>\u003c/div>\n\u003cp>\u003ccode>createPortal(child, domNode)\u003c/code> renders outside the parent DOM hierarchy (modals, tooltips, toasts) to escape \u003ccode>overflow: hidden\u003c/code>/\u003ccode>z-index\u003c/code> stacking. \u003cstrong>Events still bubble through the React tree\u003c/strong>, not the DOM tree. Context still works. Today, the native \u003ccode>&lt;dialog&gt;\u003c/code> and the \u003cstrong>Popover API\u003c/strong> (\u003ccode>popover\u003c/code> attribute) + CSS anchor positioning reduce the need for portals.\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>Do React context and events work through a portal?\u003c/summary>\u003cp>Yes. Context flows normally, and events bubble through the React tree, which can surprise you, for example a click in a modal triggering a parent's onClick.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>Is a portal enough to make a modal accessible?\u003c/summary>\u003cp>No. A portal only changes where it renders. You still need focus management, keyboard handling, ARIA labelling and inert background content.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Hydration: what is it and what causes hydration mismatches?\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>When a page is server-rendered, the browser receives complete HTML first, so the user sees content quickly. Hydration is the process where React loads in the browser, walks through that existing HTML, and attaches event handlers and state to it instead of rebuilding it. For that to work, the first render in the browser must produce exactly the same output as the server.\u003c/p>\u003cp>A hydration mismatch happens when they differ. Common causes are using \u003ccode>Date.now()\u003c/code> or random values during render, checking \u003ccode>typeof window\u003c/code> to render something different on the client, formatting dates and numbers with a different locale or timezone on the server than in the browser, invalid HTML nesting like a \u003ccode>div\u003c/code> inside a \u003ccode>p\u003c/code>, and browser extensions modifying the page.\u003c/p>\u003cp>For a bilingual site like Bell's, the locale one is very real: a price formatted in French on the server and English in the browser causes a mismatch. Fixes: make the server and client use the same locale and timezone explicitly, render client-only values after mount in an effect, use \u003ccode>suppressHydrationWarning\u003c/code> only for unavoidable cases like timestamps, or render that component on the client only.\u003c/p>\u003c/div>\n\u003cp>Hydration attaches React's event handlers and state to \u003cstrong>server-rendered HTML\u003c/strong> instead of re-creating it. React expects the client's first render to \u003cstrong>exactly match\u003c/strong> the server HTML.\u003c/p>\n\u003cp>Mismatch causes: \u003ccode>Date.now()\u003c/code>/\u003ccode>Math.random()\u003c/code>, \u003ccode>typeof window\u003c/code> branches, locale/timezone formatting differences (\u003cstrong>EN/FR number/date formats!\u003c/strong>), invalid HTML nesting (\u003ccode>&lt;div&gt;\u003c/code> inside \u003ccode>&lt;p&gt;\u003c/code>), and browser extensions.\u003c/p>\n\u003cp>Fixes: render client-only values in \u003ccode>useEffect\u003c/code> after mount, \u003ccode>suppressHydrationWarning\u003c/code> for unavoidable cases (timestamps), consistent locale/timezone on the server, dynamic import with \u003ccode>ssr: false\u003c/code>.\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>How do you render something that depends on window or localStorage?\u003c/summary>\u003cp>Render a neutral version on the server and the first client render, then update in an effect after mount, or render that component on the client only.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>What's selective hydration?\u003c/summary>\u003cp>With streaming and Suspense, React hydrates sections independently and prioritises the part the user interacts with, so the page becomes interactive faster.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>What does a hydration mismatch cost?\u003c/summary>\u003cp>In React 18 and 19, React may discard the server HTML for that part and re-render it on the client, which wastes time, can cause visible flicker, and hurts performance.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">How would you debug a slow React page?\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>I always start by measuring, not guessing. I reproduce the problem in the Chrome Performance panel with CPU throttling to simulate a mid-range phone, and I use the React DevTools Profiler to record the interaction. That shows which components rendered, how long each took, and why they rendered.\u003c/p>\u003cp>From there I identify the category. Is it too many re-renders, one expensive component, a very long list, layout thrashing, or is the page actually waiting on a large bundle or slow network? Each has a different fix.\u003c/p>\u003cp>Then I fix in order of impact: move state down so fewer components re-render, split context, stop creating new objects in props, memoize where the profiler shows it helps, virtualise long lists, wrap heavy updates in \u003ccode>useTransition\u003c/code>, code-split heavy components, and move expensive computation to a Web Worker.\u003c/p>\u003cp>Finally, I measure again with the same steps to confirm the improvement, and if possible add a guard against regressions, like a performance budget in CI. That's the same process I followed for the performance work at Bell.\u003c/p>\u003c/div>\n\u003col>\u003cli>\u003cstrong>Reproduce and measure\u003c/strong>: Chrome Performance panel (with CPU throttling), React DevTools \u003cstrong>Profiler\u003c/strong> (\"why did this render?\", flame graph, commit durations), the 19.2 Performance tracks.\u003c/li>\u003cli>Identify: too many re-renders? one expensive component? huge lists? layout thrashing? a big bundle/slow network?\u003c/li>\u003cli>Fix, in order of leverage: colocate state, split context, avoid new object/array props, memoize \u003cem>where profiling shows benefit\u003c/em>, \u003cstrong>virtualise\u003c/strong> long lists, \u003ccode>useTransition\u003c/code>/\u003ccode>useDeferredValue\u003c/code> for heavy updates, code-split, move heavy work to a worker.\u003c/li>\u003cli>Verify with the same measurement; add a regression guard.\u003c/li>\u003c/ol>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>What does the Profiler's flame graph show?\u003c/summary>\u003cp>For each commit, which components rendered and how long each took, coloured by duration, plus why they rendered. It quickly shows whether one slow component or many unnecessary renders is the problem.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>How do you know whether the problem is React or the network?\u003c/summary>\u003cp>In the Performance panel, look at whether the time is spent in scripting, meaning JavaScript, or waiting on network requests. The network waterfall shows TTFB and download times separately.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>"},{"id":"05-state-and-data","title":"State Management & Data Fetching","html":"\u003ch1 id=\"state-management-data-fetching\">State Management &amp; Data Fetching\u003c/h1>\n\u003cblockquote>\u003cp>Your résumé says you \u003cstrong>refactored legacy code to Redux Toolkit\u003c/strong>, so expect deep questions here. The senior framing: \u003cstrong>separate server state from client state\u003c/strong>, and pick the simplest tool for each.\u003c/p>\u003c/blockquote>\n\u003ch2 id=\"the-mental-model\">The mental model\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Kind of state\u003c/th>\u003cth>Examples (Bell)\u003c/th>\u003cth>Best home\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Local UI\u003c/strong>\u003c/td>\u003ctd>dropdown open, input value, hover\u003c/td>\u003ctd>\u003ccode>useState\u003c/code> / \u003ccode>useReducer\u003c/code> in the component\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Shared client\u003c/strong>\u003c/td>\u003ctd>cart drawer open, selected plan during configuration, wizard step\u003c/td>\u003ctd>lift state up / Context / Zustand / Redux\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Server (remote) cache\u003c/strong>\u003c/td>\u003ctd>product catalog, prices, user's account, cart from API\u003c/td>\u003ctd>\u003cstrong>TanStack Query / RTK Query / SWR\u003c/strong> / RSC\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>URL\u003c/strong>\u003c/td>\u003ctd>filters, sort, page, selected tab, search query\u003c/td>\u003ctd>\u003ccode>searchParams\u003c/code> (router)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Form\u003c/strong>\u003c/td>\u003ctd>checkout fields + validation\u003c/td>\u003ctd>React Hook Form / native forms + actions\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Persistent\u003c/strong>\u003c/td>\u003ctd>language preference, recently viewed\u003c/td>\u003ctd>cookies / localStorage\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>Key insight:\u003c/strong> most \"global state\" in older Redux apps is actually \u003cstrong>server cache\u003c/strong>, which you had to hand-manage (loading flags, refetching, invalidation). Moving it to a query library removes a lot of code.\u003c/p>\n\u003ch2 id=\"redux-redux-toolkit\">Redux &amp; Redux Toolkit\u003c/h2>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Explain Redux's core principles and data flow\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>Redux is built on three principles. There's a single store that holds the application state. That state is read-only: you can't change it directly, you dispatch actions, which are plain objects describing what happened, like \"item added to cart\". And changes are made by reducers, which are pure functions that take the current state and an action and return the new state.\u003c/p>\u003cp>The data flow is one-directional. The UI dispatches an action, it passes through middleware, for things like async logic or logging, the reducers compute the new state, and components subscribed with \u003ccode>useSelector\u003c/code> re-render only if the slice they selected changed.\u003c/p>\u003cp>The benefits are predictability, easy testing because reducers are pure, and great debugging with the DevTools, where you can see every action and even time-travel. The cost is indirection and, in classic Redux, a lot of boilerplate, which is what Redux Toolkit solves, and which is why we moved to it at Bell.\u003c/p>\u003c/div>\n\u003col>\u003cli>\u003cstrong>Single source of truth\u003c/strong>: one store.\u003c/li>\u003cli>\u003cstrong>State is read-only\u003c/strong>: changed only by dispatching \u003cstrong>actions\u003c/strong> (plain objects describing \u003cem>what happened\u003c/em>).\u003c/li>\u003cli>\u003cstrong>Pure reducers\u003c/strong>: \u003ccode>(state, action) =&gt; newState\u003c/code>, no side effects.\u003c/li>\u003c/ol>\n\u003cp>Flow: UI → \u003ccode>dispatch(action)\u003c/code> → middleware (thunks, logging) → reducers → new state → subscribed components re-render if their \u003cstrong>selected\u003c/strong> slice changed (react-redux \u003ccode>useSelector\u003c/code> uses \u003ccode>useSyncExternalStore\u003c/code> and a reference comparison).\u003c/p>\n\u003cp>Benefits: predictable, DevTools time-travel, easy testing, a clear pattern for big teams. Cost: indirection and boilerplate (which RTK solves).\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>Why must reducers be pure?\u003c/summary>\u003cp>So that the same state and action always produce the same result. That makes them predictable, easy to test, and enables time-travel debugging and replaying actions. Side effects belong in middleware or thunks.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>When would you NOT use Redux?\u003c/summary>\u003cp>For small apps, or apps where most state is server data. Local state plus a query library is simpler. Redux pays off with complex shared client state and larger teams.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">What does Redux Toolkit add over classic Redux? Show an example.\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>Redux Toolkit is now the official way to write Redux, and it removes most of the boilerplate. \u003ccode>configureStore\u003c/code> sets up the store with good defaults: DevTools, thunk middleware, and development checks that catch accidental mutations and non-serialisable values.\u003c/p>\u003cp>\u003ccode>createSlice\u003c/code> generates the action creators and the reducer together from one object. It uses Immer internally, so I can write code that looks like mutation, such as pushing an item into the cart array, and it produces a correct immutable update. That alone removed a whole class of bugs for us.\u003c/p>\u003cp>For async logic there's \u003ccode>createAsyncThunk\u003c/code>, which dispatches pending, fulfilled and rejected actions automatically. \u003ccode>createEntityAdapter\u003c/code> gives normalised state with ready-made CRUD reducers and selectors. And \u003ccode>createSelector\u003c/code> gives memoised derived data, like the cart total.\u003c/p>\u003cp>On top of that, RTK Query handles data fetching and caching, which can replace a lot of hand-written thunks and loading flags. When I refactored legacy state at Bell, these tools cut the amount of state code significantly and made the patterns consistent across the team.\u003c/p>\u003c/div>\n\u003cul>\u003cli>\u003ccode>configureStore\u003c/code>: good defaults (DevTools, thunk, serializability + immutability checks in dev).\u003c/li>\u003cli>\u003ccode>createSlice\u003c/code>: actions + reducer in one; \u003cstrong>Immer\u003c/strong> lets you write \"mutating\" code safely.\u003c/li>\u003cli>\u003ccode>createAsyncThunk\u003c/code>: pending/fulfilled/rejected lifecycle actions.\u003c/li>\u003cli>\u003ccode>createEntityAdapter\u003c/code>: normalised CRUD state (\u003ccode>ids\u003c/code> + \u003ccode>entities\u003c/code>) + selectors.\u003c/li>\u003cli>\u003ccode>createSelector\u003c/code> (Reselect): memoised derived data.\u003c/li>\u003cli>\u003cstrong>RTK Query\u003c/strong>: data fetching + caching built in.\u003c/li>\u003cli>\u003ccode>createListenerMiddleware\u003c/code>: side effects that react to actions (a lighter alternative to sagas).\u003c/li>\u003c/ul>\n\u003cdiv class=\"code\">\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003cpre>\u003ccode data-lang=\"ts\">\u003cspan class=\"t-k\">const\u003c/span> cartSlice = createSlice({\n  name: \u003cspan class=\"t-s\">'cart'\u003c/span>,\n  initialState: { items: [] \u003cspan class=\"t-k\">as\u003c/span> CartItem[], status: \u003cspan class=\"t-s\">'idle'\u003c/span> \u003cspan class=\"t-k\">as\u003c/span> Status },\n  reducers: {\n    itemAdded(state, action: PayloadAction&lt;CartItem&gt;) {\n      \u003cspan class=\"t-k\">const\u003c/span> existing = state.items.find(i =&gt; i.sku === action.payload.sku);\n      \u003cspan class=\"t-k\">if\u003c/span> (existing) existing.qty += action.payload.qty;   \u003cspan class=\"t-c\">// Immer: safe \"mutation\"\u003c/span>\n      \u003cspan class=\"t-k\">else\u003c/span> state.items.push(action.payload);\n    },\n    itemRemoved(state, action: PayloadAction&lt;string&gt;) {\n      state.items = state.items.filter(i =&gt; i.sku !== action.payload);\n    },\n  },\n  extraReducers: builder =&gt; {\n    builder\n      .addCase(applyPromo.pending, state =&gt; { state.status = \u003cspan class=\"t-s\">'loading'\u003c/span>; })\n      .addCase(applyPromo.fulfilled, (state, action) =&gt; { state.status = \u003cspan class=\"t-s\">'idle'\u003c/span>; state.items = action.payload.items; })\n      .addCase(applyPromo.rejected, state =&gt; { state.status = \u003cspan class=\"t-s\">'error'\u003c/span>; });\n  },\n});\n\n\u003cspan class=\"t-k\">export\u003c/span> \u003cspan class=\"t-k\">const\u003c/span> selectCartTotal = createSelector(\n  [(s: RootState) =&gt; s.cart.items],\n  items =&gt; items.reduce((sum, i) =&gt; sum + i.price * i.qty, \u003cspan class=\"t-n\">0\u003c/span>)\n);\u003c/code>\u003c/pre>\u003c/div>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>How does Immer work?\u003c/summary>\u003cp>It gives you a draft proxy of the state. You \"mutate\" the draft, Immer records the changes, and produces a new immutable state with structural sharing, so unchanged parts keep their references.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>Can you both mutate the draft and return a value in a createSlice reducer?\u003c/summary>\u003cp>No. Either mutate the draft, or return a completely new state, but not both. Immer throws an error if you do both.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>What is the serializability check for?\u003c/summary>\u003cp>It warns when non-serialisable values like class instances, promises or functions go into the store or actions, because they break DevTools, persistence and time-travel.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">How did you migrate a legacy Redux codebase to RTK? (tie to your story)\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>At Bell, our cart and checkout state used older patterns with a lot of boilerplate, and we had bugs where data got out of sync. A big-bang rewrite wasn't an option, because we were shipping features continuously. So I did it incrementally.\u003c/p>\u003cp>The first step was replacing \u003ccode>createStore\u003c/code> with \u003ccode>configureStore\u003c/code>. Existing reducers keep working, so it's a very low-risk change that gives you DevTools and the mutation checks immediately. Then I converted reducers one at a time to \u003ccode>createSlice\u003c/code>, starting with the cart. Old and new slices lived side by side in the same store. Hand-written loading, success and failure action types became \u003ccode>createAsyncThunk\u003c/code>, and for pure server data, RTK Query is the next step.\u003c/p>\u003cp>I added memoised selectors with \u003ccode>createSelector\u003c/code> for derived values like totals, which also cut unnecessary re-renders, and migrated components from \u003ccode>connect\u003c/code> to the hooks as we touched them. I wrote tests for each slice and documented the pattern so the rest of the team could continue it.\u003c/p>\u003cp>The result was less code, fewer out-of-sync bugs, and faster onboarding because there was one consistent way of doing things. And the migration never blocked feature delivery.\u003c/p>\u003c/div>\n\u003col>\u003cli>Swap \u003ccode>createStore\u003c/code> for \u003ccode>configureStore\u003c/code>. The existing reducers still work, so it's a zero-risk first PR.\u003c/li>\u003cli>Convert \u003cstrong>one reducer at a time\u003c/strong> to \u003ccode>createSlice\u003c/code>; old and new coexist in \u003ccode>combineReducers\u003c/code>.\u003c/li>\u003cli>Replace hand-written action types/creators with slice actions; codemods/regex help.\u003c/li>\u003cli>Replace hand-rolled \u003ccode>FETCH_X_REQUEST/SUCCESS/FAILURE\u003c/code> with \u003ccode>createAsyncThunk\u003c/code>, and later \u003cstrong>RTK Query\u003c/strong> for pure server data.\u003c/li>\u003cli>Add \u003ccode>createSelector\u003c/code> for derived data (cart totals, filtered lists) to stop unnecessary re-renders.\u003c/li>\u003cli>Migrate \u003ccode>connect()\u003c/code> HOCs to \u003ccode>useSelector\u003c/code>/\u003ccode>useDispatch\u003c/code> hooks as components are touched.\u003c/li>\u003cli>Typed hooks: \u003ccode>useAppDispatch\u003c/code>, \u003ccode>useAppSelector\u003c/code>.\u003c/li>\u003cli>Tests for each slice (pure reducer tests are trivial).\u003c/li>\u003c/ol>\n\u003cp>Results to mention: less code, fewer sync bugs, faster onboarding (one pattern), and Immer removed accidental-mutation bugs.\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>How long did it take, and how did you track progress?\u003c/summary>\u003cp>\u003cspan class=\"fill\">[Real numbers: about X sprints alongside features.]\u003c/span> I kept a simple checklist of slices and components to migrate, and we migrated a component whenever we touched it for a feature, plus a few dedicated tickets.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>What would you do differently?\u003c/summary>\u003cp>\u003cspan class=\"fill\">[Honest reflection.]\u003c/span> For example, moving server data to RTK Query earlier, instead of first converting those fetches to thunks, would have saved a step.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>How did you get the rest of the team on board?\u003c/summary>\u003cp>I paired on the first migrations, wrote a short guide with before and after examples, and reviewed the early pull requests closely so the pattern was consistent.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Why normalise state? What does it look like?\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>Normalising means storing each entity once, in a lookup by ID, and referring to it by ID everywhere else, a lot like tables in a database. For example, products are stored as a list of IDs plus an object mapping each ID to the product, and the cart lines just store a product ID and a quantity.\u003c/p>\u003cp>The benefits are that there's no duplicated data, so if a price updates, it updates in one place and every view is consistent. Lookups by ID are O(1). Reducers stay simple and flat instead of updating deeply nested structures. And updating one item doesn't create new references for unrelated items, which helps memoisation.\u003c/p>\u003cp>Redux Toolkit's \u003ccode>createEntityAdapter\u003c/code> does all of this for you. With query libraries like TanStack Query, data is cached per query, so normalisation matters less, but for client-side state with relationships it's still the right approach.\u003c/p>\u003c/div>\n\u003cp>Store entities by ID once, and reference them by ID elsewhere:\u003c/p>\n\u003cdiv class=\"code\">\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003cpre>\u003ccode data-lang=\"js\">{ products: { ids: [\u003cspan class=\"t-s\">'p1'\u003c/span>,\u003cspan class=\"t-s\">'p2'\u003c/span>], entities: { p1: {...}, p2: {...} } },\n  cart: { lines: [{ productId: \u003cspan class=\"t-s\">'p1'\u003c/span>, qty: \u003cspan class=\"t-n\">2\u003c/span> }] } }\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>There's no duplication (update a price in one place), O(1) lookups, and simpler reducers. \u003ccode>createEntityAdapter\u003c/code> does it for you. Query libraries cache per \u003cem>query\u003c/em>, so normalisation matters less there.\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>How do you denormalise for the UI?\u003c/summary>\u003cp>With memoised selectors that combine entities, for example building cart lines with their product details from the IDs, so components get exactly the shape they need without recomputing every render.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>When is normalisation overkill?\u003c/summary>\u003cp>For small, flat data that's only read in one place, or for server data in a query cache that's refetched as a whole. It's most valuable when the same entities appear in several places and get updated.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Thunks vs sagas vs listener middleware\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>Thunks are the simplest option: an action creator returns a function that receives \u003ccode>dispatch\u003c/code> and \u003ccode>getState\u003c/code>, so you can do async work and dispatch results. They're the default in Redux Toolkit and cover most needs.\u003c/p>\u003cp>Redux-Saga uses generator functions and is very powerful for complex flows: cancellation, racing requests, debouncing, long-running background processes. But it has a steep learning curve and is verbose, and I mostly see it in legacy codebases now.\u003c/p>\u003cp>Listener middleware is the modern, lightweight option in Redux Toolkit. You say, \"when this action happens, run this side effect\", which is great for things like analytics, saving to localStorage, or reacting to an action from another slice.\u003c/p>\u003cp>And in practice, RTK Query removes most of the fetching logic that people used thunks or sagas for. So my default is RTK Query for data, thunks for occasional custom async logic, and listeners for cross-cutting side effects.\u003c/p>\u003c/div>\n\u003cul>\u003cli>\u003cstrong>Thunks\u003c/strong>: functions that can dispatch and read state; simple async. The default.\u003c/li>\u003cli>\u003cstrong>Redux-Saga\u003c/strong>: generator-based, powerful for complex flows (cancellation, races, debouncing, long-running processes), but steep to learn and verbose. Mostly legacy now.\u003c/li>\u003cli>\u003cstrong>Listener middleware\u003c/strong>: \"when action X happens, run this effect\" (analytics, syncing to localStorage, cross-slice reactions). Lightweight.\u003c/li>\u003cli>\u003cstrong>RTK Query\u003c/strong> handles most fetching, removing the need for most thunks.\u003c/li>\u003c/ul>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>How would you debounce an action with listener middleware?\u003c/summary>\u003cp>In the listener, call \u003ccode>listenerApi.cancelActiveListeners()\u003c/code> and then \u003ccode>await listenerApi.delay(300)\u003c/code>. If another matching action arrives, the previous run is cancelled, which is effectively a debounce.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>How do you cancel a createAsyncThunk?\u003c/summary>\u003cp>The dispatched thunk returns a promise with an \u003ccode>abort()\u003c/code> method, and the thunk receives a \u003ccode>signal\u003c/code> you pass to fetch. Calling abort cancels the request and dispatches a rejected action.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Common Redux performance problems\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>The most common one is a selector that returns a new reference every time, for example \u003ccode>useSelector\u003c/code> with a \u003ccode>map\u003c/code> or \u003ccode>filter\u003c/code> inside. Because \u003ccode>useSelector\u003c/code> compares results by reference, the component re-renders on every store update, even unrelated ones. The fix is a mem
