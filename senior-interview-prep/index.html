oised selector with \u003ccode>createSelector\u003c/code>, or selecting primitive values.\u003c/p>\u003cp>Other problems: selecting far more than the component needs, like the whole cart object when it only needs the item count; storing derived data in the store instead of computing it with selectors, which also creates sync bugs; putting fast-changing UI state, like the text of an input, into Redux, which dispatches on every keystroke; and storing large non-serialisable objects.\u003c/p>\u003cp>To find them, I use the React DevTools Profiler to see which components re-render, and the Redux DevTools to check how often actions fire.\u003c/p>\u003c/div>\n\u003cul>\u003cli>\u003ccode>useSelector(state =&gt; state.cart.items.map(...))\u003c/code> returns a \u003cstrong>new array every time\u003c/strong>, so the component re-renders on \u003cem>any\u003c/em> store update. Fix: \u003ccode>createSelector\u003c/code>, or select primitives.\u003c/li>\u003cli>Selecting too broadly (\u003ccode>state =&gt; state\u003c/code>).\u003c/li>\u003cli>Putting non-serialisable or huge objects in the store.\u003c/li>\u003cli>Storing derived data instead of computing it.\u003c/li>\u003cli>Putting rapidly-changing UI state (input text) in Redux; keep that local.\u003c/li>\u003c/ul>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>How does useSelector decide whether to re-render?\u003c/summary>\u003cp>It runs the selector after each dispatch and compares the result with the previous one using strict reference equality by default. If it differs, the component re-renders.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>When would you use shallowEqual with useSelector?\u003c/summary>\u003cp>When selecting several values into a new object, so the component only re-renders if one of them actually changes. Often it's simpler to call useSelector several times for primitives.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003ch2 id=\"server-state-tanstack-query-rtk-query\">Server State: TanStack Query &amp; RTK Query\u003c/h2>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">What problems does TanStack Query (React Query) solve?\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>TanStack Query manages server state, meaning data that lives on the server and that the client just caches. That's a very different problem from client state, and handling it manually with useEffect and Redux leads to a lot of repeated code and subtle bugs.\u003c/p>\u003cp>It gives you caching by query key, so two components requesting the same data share one request. It deduplicates requests, does stale-while-revalidate, so cached data shows instantly while it refreshes in the background, and refetches when the window regains focus or the network reconnects. It handles retries, pagination and infinite scrolling, prefetching, cancellation, and SSR hydration.\u003c/p>\u003cp>For writes, mutations can invalidate related queries, for example, after adding to the cart, invalidate the cart query so it refetches, or do optimistic updates with rollback.\u003c/p>\u003cp>A common follow-up is staleTime versus gcTime: \u003ccode>staleTime\u003c/code> is how long data is considered fresh, so no refetch happens, and \u003ccode>gcTime\u003c/code> is how long unused data stays in memory before being garbage collected.\u003c/p>\u003c/div>\n\u003cp>Caching by \u003cstrong>query key\u003c/strong>, request \u003cstrong>deduplication\u003c/strong>, \u003cstrong>stale-while-revalidate\u003c/strong>, background refetch (on focus/reconnect/interval), retries, pagination and infinite queries, \u003cstrong>mutations with invalidation\u003c/strong>, optimistic updates, prefetching, SSR hydration, cancellation, and DevTools.\u003c/p>\n\u003cdiv class=\"code\">\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003cpre>\u003ccode data-lang=\"tsx\">\u003cspan class=\"t-k\">const\u003c/span> { data, isPending, isError } = useQuery({\n  queryKey: [\u003cspan class=\"t-s\">'plans'\u003c/span>, { province, \u003cspan class=\"t-k\">type\u003c/span> }],       \u003cspan class=\"t-c\">// key includes all inputs\u003c/span>\n  queryFn: ({ signal }) =&gt; api.getPlans({ province, \u003cspan class=\"t-k\">type\u003c/span> }, { signal }),\n  staleTime: \u003cspan class=\"t-n\">5\u003c/span> * \u003cspan class=\"t-n\">60\u003c/span> * \u003cspan class=\"t-n\">1000\u003c/span>,                       \u003cspan class=\"t-c\">// fresh for 5 min: no refetch\u003c/span>\n});\n\n\u003cspan class=\"t-k\">const\u003c/span> queryClient = useQueryClient();\n\u003cspan class=\"t-k\">const\u003c/span> addToCart = useMutation({\n  mutationFn: api.addToCart,\n  onSuccess: () =&gt; queryClient.invalidateQueries({ queryKey: [\u003cspan class=\"t-s\">'cart'\u003c/span>] }),\n});\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>\u003ccode>staleTime\u003c/code> (how long data counts as fresh) vs \u003ccode>gcTime\u003c/code> (how long unused cache stays in memory) is a common question.\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>How do query keys work?\u003c/summary>\u003cp>A query key is an array that uniquely identifies the data, like the resource name plus parameters. Any change in the key means different cached data. Invalidation can match keys by prefix, like everything starting with \"cart\".\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>How would you prefetch data on hover?\u003c/summary>\u003cp>Call \u003ccode>queryClient.prefetchQuery\u003c/code> with the same key and function in the \u003ccode>onMouseEnter\u003c/code> of the link, so the data is often already cached when the user clicks.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>How does it work with server-side rendering?\u003c/summary>\u003cp>Prefetch on the server, dehydrate the cache into the page, and hydrate it on the client, so components get the data instantly without a second fetch.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">RTK Query vs TanStack Query: which would you choose?\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>They solve the same problem, so the choice is mostly about context. If the app already uses Redux, like at Bell, RTK Query is the natural choice: it's built into Redux Toolkit, the cache lives in the store so it shows up in Redux DevTools, and invalidation uses tags, so a mutation can invalidate all queries tagged \"Cart\". It can also generate typed hooks directly from an OpenAPI spec, which is great when the backend publishes Swagger.\u003c/p>\u003cp>If the app doesn't use Redux, I'd pick TanStack Query. It's lighter to adopt, framework-agnostic, has a larger ecosystem, and its infinite query and fine-grained cache controls are excellent.\u003c/p>\u003cp>So my answer would be: I don't think either is wrong. I'd look at the existing stack and the team's familiarity, and avoid having both in the same app.\u003c/p>\u003c/div>\n\u003cul>\u003cli>\u003cstrong>RTK Query\u003c/strong>: if you \u003cstrong>already use Redux\u003c/strong> (like Bell). Integrated with the store/DevTools, tag-based invalidation (\u003ccode>providesTags\u003c/code>/\u003ccode>invalidatesTags\u003c/code>), and OpenAPI codegen to generate hooks from Swagger.\u003c/li>\u003cli>\u003cstrong>TanStack Query\u003c/strong>: if you don't need Redux. Larger ecosystem, more flexible, framework-agnostic, excellent infinite queries.\u003c/li>\u003c/ul>\n\u003cp>Both solve the same problem. Pick based on the existing stack and team familiarity, and say so.\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>How does tag invalidation work in RTK Query?\u003c/summary>\u003cp>Queries declare which tags they provide, like \"Cart\", and mutations declare which tags they invalidate. After a mutation succeeds, every query providing those tags refetches automatically.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>Could you use both in one app?\u003c/summary>\u003cp>Technically yes, but I'd avoid it. Two caches with different invalidation models confuse the team and duplicate data. Pick one per app.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Optimistic updates: how, and how do you roll back?\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>An optimistic update means changing the UI immediately, as if the server request succeeded, and then reconciling with the real response. It makes the app feel instant, for example when changing the quantity of an item in the cart.\u003c/p>\u003cp>With TanStack Query, in \u003ccode>onMutate\u003c/code> I first cancel any in-flight fetches for that data, so an old response can't overwrite my optimistic value. I save a snapshot of the current cache, then update the cache with the new value, and return the snapshot. If the mutation fails, \u003ccode>onError\u003c/code> restores the snapshot and I show an error message. In \u003ccode>onSettled\u003c/code>, I invalidate the query so the final state comes from the server. React 19 also has \u003ccode>useOptimistic\u003c/code> for this.\u003c/p>\u003cp>The judgment part is knowing when not to do it. I wouldn't be optimistic for placing an order or a payment, or anything with a high failure rate or irreversible consequences. Those should show a clear pending state and wait for confirmation.\u003c/p>\u003c/div>\n\u003cp>Update the UI immediately and assume success; if the server fails, \u003cstrong>roll back\u003c/strong> and notify.\u003c/p>\n\u003cdiv class=\"code\">\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003cpre>\u003ccode data-lang=\"ts\">useMutation({\n  mutationFn: updateQty,\n  onMutate: \u003cspan class=\"t-k\">async\u003c/span> (vars) =&gt; {\n    \u003cspan class=\"t-k\">await\u003c/span> queryClient.cancelQueries({ queryKey: [\u003cspan class=\"t-s\">'cart'\u003c/span>] });   \u003cspan class=\"t-c\">// avoid an old fetch overwriting us\u003c/span>\n    \u003cspan class=\"t-k\">const\u003c/span> previous = queryClient.getQueryData([\u003cspan class=\"t-s\">'cart'\u003c/span>]);\n    queryClient.setQueryData([\u003cspan class=\"t-s\">'cart'\u003c/span>], old =&gt; applyQty(old, vars));\n    \u003cspan class=\"t-k\">return\u003c/span> { previous };\n  },\n  onError: (_err, _vars, ctx) =&gt; queryClient.setQueryData([\u003cspan class=\"t-s\">'cart'\u003c/span>], ctx.previous),\n  onSettled: () =&gt; queryClient.invalidateQueries({ queryKey: [\u003cspan class=\"t-s\">'cart'\u003c/span>] }),\n});\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>React 19 alternative: \u003ccode>useOptimistic\u003c/code>. \u003cstrong>When NOT to be optimistic:\u003c/strong> payments, order placement, and anything with a high failure rate or irreversible effects.\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>What if two optimistic updates overlap?\u003c/summary>\u003cp>That's why you cancel in-flight queries first and invalidate after every mutation settles. The final refetch reconciles with the server's truth even if the intermediate rollbacks were imperfect.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>How does useOptimistic differ?\u003c/summary>\u003cp>\u003ccode>useOptimistic\u003c/code> holds an optimistic value only while an async action or transition is in progress, and automatically switches back to the real state when it finishes, so you don't write manual rollback code.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">How do you handle race conditions in data fetching?\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>A race condition happens when several requests are in flight and their responses arrive in a different order from the requests. The classic case is a search or filter, where the old response arrives last and overwrites the correct results.\u003c/p>\u003cp>On the client I handle it in a few ways. I cancel the previous request with an AbortController when the input changes or the component unmounts. If cancellation isn't possible, I use an ignore flag in the effect cleanup, so an outdated response is discarded. Data libraries key the cache by the request parameters, so each response goes into the right cache entry. And I debounce inputs so fewer requests are made in the first place.\u003c/p>\u003cp>For mutations like a checkout submission, the race is double submission, so I disable the submit button while pending and use an idempotency key, so the server can recognise and ignore a duplicate. At Bell we saw the filter version of this problem, and cancellation plus keyed caching fixed it.\u003c/p>\u003c/div>\n\u003cul>\u003cli>\u003cstrong>AbortController\u003c/strong> to cancel previous requests on input change/unmount.\u003c/li>\u003cli>An \u003cstrong>ignore flag\u003c/strong> in the effect cleanup (\u003ccode>let ignore = false; return () =&gt; { ignore = true }\u003c/code>).\u003c/li>\u003cli>Query libraries key by input, so stale responses go to the right cache entry.\u003c/li>\u003cli>On the server, use \u003cstrong>idempotency keys\u003c/strong> so a retried checkout doesn't double-charge.\u003c/li>\u003cli>Disable submit while pending.\u003c/li>\u003c/ul>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>Can you give an example of a race condition outside of search?\u003c/summary>\u003cp>Switching tabs quickly between product categories, where an earlier category's response arrives last, or two quantity updates for the same cart item where the older response overwrites the newer one.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>How do idempotency keys work?\u003c/summary>\u003cp>The client generates a unique key for an operation, like an order submission, and sends it in a header. If the server sees the same key again, it returns the original result instead of performing the operation again.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003ch2 id=\"lightweight-alternatives\">Lightweight alternatives\u003c/h2>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Zustand, Jotai, Context: when do you reach for each?\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>My first step is always to ask what kind of state it is. Most state should be local, in \u003ccode>useState\u003c/code>, or in the URL, or is actually server data, which belongs in a query library. What's left is genuinely global client state, and that's usually a small amount.\u003c/p>\u003cp>For values that rarely change, like the theme, locale or the current user, React Context is enough, and it doesn't add a dependency.\u003c/p>\u003cp>For shared client state that changes more often, I like Zustand. It's a tiny store with hooks and selector-based subscriptions, so components only re-render when their slice changes, and it needs no provider. Something like a cart drawer or a multi-step product configurator works well with it.\u003c/p>\u003cp>Jotai uses an atom model, which is good for very interactive UIs with lots of independent pieces of state, like an editor.\u003c/p>\u003cp>And Redux Toolkit is still a great fit for large teams and complex state, where its strict patterns, middleware and DevTools are worth the structure, as in Bell's cart and checkout.\u003c/p>\u003c/div>\n\u003cul>\u003cli>\u003cstrong>Context + useReducer\u003c/strong>: low-frequency global values (theme, locale, auth). No extra dependency.\u003c/li>\u003cli>\u003cstrong>Zustand\u003c/strong>: tiny store with hooks and \u003cstrong>selector subscriptions\u003c/strong> (no provider needed); great for client state like a cart drawer or a configurator. \u003ccode>const qty = useCart(s =&gt; s.qty)\u003c/code>.\u003c/li>\u003cli>\u003cstrong>Jotai / Recoil-style atoms\u003c/strong>: fine-grained, bottom-up state. Good for highly interactive editors.\u003c/li>\u003cli>\u003cstrong>Redux Toolkit\u003c/strong>: large teams, strict patterns, complex cross-cutting client state, DevTools/time-travel, existing investment.\u003c/li>\u003cli>\u003cstrong>Signals\u003c/strong> (Preact signals, the TC39 proposal): fine-grained reactivity; know they exist.\u003c/li>\u003c/ul>\n\u003cp>Senior answer: \"Start with local state and the URL, use a query library for server state, and add a global store only for truly global client state. Most apps need far less global state than they have.\"\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>How do Zustand selectors avoid re-renders?\u003c/summary>\u003cp>A component subscribes with a selector, and only re-renders when the selected value changes, compared by reference, or with a shallow comparison for objects.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>How do you persist a Zustand store?\u003c/summary>\u003cp>With the \u003ccode>persist\u003c/code> middleware, which saves to localStorage or another storage and rehydrates on load. With SSR, you need to handle hydration timing to avoid mismatches.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Why put filters in the URL?\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>Because the URL is state that users can share, bookmark and navigate. If filters live only in component state, refreshing the page loses them, the back button doesn't undo a filter change, and a customer can't send a link to \"Samsung phones under $800 with 256 GB\".\u003c/p>\u003cp>Putting filters, sorting and pagination in the query string fixes all of that. It also helps SEO for category pages, makes analytics easier because you can see which filter combinations people use, and with server rendering, the server can render the right results on the first request.\u003c/p>\u003cp>A couple of implementation details: I debounce text inputs before updating the URL, and I use replace instead of push for rapid changes so the history doesn't fill up with every keystroke. In Next.js or React Router I read them with \u003ccode>useSearchParams\u003c/code>, and there are libraries like nuqs that make URL state typed. At Bell, we synced product filters to the URL for exactly these reasons.\u003c/p>\u003c/div>\n\u003cp>Shareable links (\"send me that phone filter\"), survives refresh, back/forward work, SEO for category pages, analytics, and SSR can render the right results immediately. Use \u003ccode>useSearchParams\u003c/code> (React Router / Next.js), or nuqs for typed URL state. Debounce text inputs before pushing to the URL, and use \u003ccode>replace\u003c/code> instead of \u003ccode>push\u003c/code> to avoid polluting history.\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>What about sensitive or very large state?\u003c/summary>\u003cp>Neither belongs in the URL. URLs end up in logs, history and analytics, and have length limits. Use server-side state or storage for those.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>How do you keep URL state typed?\u003c/summary>\u003cp>Parse and validate the search params with a schema, with defaults, or use a library like nuqs or TanStack Router, which provide typed search params.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003ch2 id=\"apis-rest-graphql-real-time\">APIs: REST, GraphQL, real-time\u003c/h2>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">REST vs GraphQL vs tRPC from a front-end point of view\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>REST is resource-based, simple and widely understood, and it works very well with HTTP caching at the browser and CDN level. The downside on the front end is over-fetching, under-fetching, and needing several round trips for one screen.\u003c/p>\u003cp>GraphQL lets the client ask for exactly the fields it needs in one request, with a strongly typed schema. Components can declare their own data needs with fragments. The trade-offs are that HTTP caching is harder, so you rely on a client-side normalised cache like Apollo, and the server has to deal with N+1 queries and protect itself against overly expensive queries.\u003c/p>\u003cp>tRPC gives end-to-end type safety between a TypeScript backend and front end without a schema language, which is great for full-stack TypeScript teams in a monorepo, but it couples the two tightly.\u003c/p>\u003cp>In an enterprise setup like Bell's, with many microservices, a common pattern is REST with OpenAPI contracts and a Backend-for-Frontend layer that aggregates services into exactly what each page needs. That gives most of GraphQL's benefits while keeping REST's simplicity and caching.\u003c/p>\u003c/div>\n\u003cul>\u003cli>\u003cstrong>REST\u003c/strong>: simple, HTTP caching (CDN/ETags) works naturally, but over/under-fetching and multiple round trips. A \u003cstrong>BFF\u003c/strong> (Backend for Frontend) fixes it by aggregating services into exactly what a page needs.\u003c/li>\u003cli>\u003cstrong>GraphQL\u003c/strong>: the client asks for exactly the fields it needs, a typed schema, one endpoint, fragments colocated with components (Relay). Costs: caching is harder (normalised client cache: Apollo/urql), N+1 on the server, query complexity limits, and file uploads are awkward.\u003c/li>\u003cli>\u003cstrong>tRPC\u003c/strong>: end-to-end TypeScript types without a schema, for full-stack TS monorepos.\u003c/li>\u003c/ul>\n\u003cp>At Bell-scale: microservices behind a \u003cstrong>BFF/API gateway\u003c/strong>, with an \u003cstrong>OpenAPI\u003c/strong> contract and generated TS types on the front end.\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>How do you cache GraphQL responses?\u003c/summary>\u003cp>Mostly on the client, with a normalised cache like Apollo or urql that stores entities by ID. HTTP caching is harder since queries are usually POSTs; persisted queries sent as GETs can help with CDN caching.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>What's the N+1 problem?\u003c/summary>\u003cp>When resolving a list makes one extra query per item, for example fetching the author for each of 50 posts separately. DataLoader batches those into one request.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Polling vs long polling vs SSE vs WebSockets\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>These are options for getting updates from the server, and I pick based on how real-time and how bidirectional the communication needs to be.\u003c/p>\u003cp>Regular polling just requests data every few seconds. It's simple and works everywhere, and it's fine for something like checking an order status every 30 seconds, but it wastes requests. Long polling keeps the request open until the server has something, which reduces waste but is a bit of a hack.\u003c/p>\u003cp>Server-Sent Events are a one-way stream from server to client over plain HTTP, with automatic reconnection built in. They're great for notifications, live dashboards, and streaming AI responses token by token.\u003c/p>\u003cp>WebSockets give a full two-way, low-latency connection, which you need for chat, collaboration or multiplayer features. The cost is more complexity: reconnection logic, heartbeats, authentication, and scaling, since connections are stateful on the server.\u003c/p>\u003cp>My default is the simplest one that meets the requirement: polling for slow updates, SSE for server push, and WebSockets only when the client also needs to send frequent messages.\u003c/p>\u003c/div>\n\u003cul>\u003cli>\u003cstrong>Polling\u003c/strong>: simple, wasteful; fine for \"order status every 30 s\".\u003c/li>\u003cli>\u003cstrong>Long polling\u003c/strong>: the server holds the request until there's data.\u003c/li>\u003cli>\u003cstrong>Server-Sent Events (SSE)\u003c/strong>: server → client stream over HTTP, auto-reconnect, text only. Great for notifications and \u003cstrong>LLM token streaming\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>WebSockets\u003c/strong>: full duplex, low latency. Chat, live collaboration, trading. Needs reconnection, heartbeat and scaling considerations (sticky sessions / pub-sub).\u003c/li>\u003c/ul>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>How do you handle WebSocket reconnection?\u003c/summary>\u003cp>Reconnect with exponential backoff and jitter, use heartbeats to detect dead connections, resubscribe after reconnecting, and fetch missed data, ideally by sending the last received event ID.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>Why is SSE good for AI responses?\u003c/summary>\u003cp>The data flows one way, from server to client, it works over regular HTTP through proxies and CDNs, and it handles reconnection automatically, so it's a simple fit for token streaming.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>"},{"id":"06-nextjs-rendering","title":"Next.js & Rendering Strategies","html":"\u003ch1 id=\"next-js-rendering-strategies\">Next.js &amp; Rendering Strategies\u003c/h1>\n\u003cblockquote>\u003cp>Next.js is on your résumé. Expect \"CSR vs SSR vs SSG vs ISR\", \"App Router vs Pages Router\" and \"how does caching work\". Versions: \u003cstrong>Next 15\u003c/strong> (Oct 2024: React 19, async request APIs, caching off by default for fetch), \u003cstrong>Next 16\u003c/strong> (Oct 2025: \u003cstrong>Turbopack default\u003c/strong>, \u003cstrong>Cache Components / \u003ccode>\"use cache\"\u003c/code>\u003c/strong>, \u003ccode>middleware.ts\u003c/code> → \u003ccode>proxy.ts\u003c/code>). Confirm the latest before the interview.\u003c/p>\u003c/blockquote>\n\u003ch2 id=\"rendering-strategies\">Rendering strategies\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Strategy\u003c/th>\u003cth>When HTML is made\u003c/th>\u003cth>Pros\u003c/th>\u003cth>Cons\u003c/th>\u003cth>Use for (Bell examples)\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>CSR\u003c/strong> (SPA)\u003c/td>\u003ctd>in the browser\u003c/td>\u003ctd>simple hosting (static), rich interactivity\u003c/td>\u003ctd>slow first paint, SEO risk, big JS\u003c/td>\u003ctd>logged-in dashboards, My Account\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>SSR\u003c/strong>\u003c/td>\u003ctd>per request on the server\u003c/td>\u003ctd>fresh + SEO + fast FCP\u003c/td>\u003ctd>server cost, TTFB, hydration cost\u003c/td>\u003ctd>personalised pages, cart\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>SSG\u003c/strong>\u003c/td>\u003ctd>at build time\u003c/td>\u003ctd>fastest, CDN-cacheable, cheap\u003c/td>\u003ctd>stale until rebuild\u003c/td>\u003ctd>marketing, help articles\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>ISR\u003c/strong>\u003c/td>\u003ctd>at build + regenerated after N s / on demand\u003c/td>\u003ctd>static speed + freshness\u003c/td>\u003ctd>eventual consistency\u003c/td>\u003ctd>product/plan pages, promos\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Streaming SSR\u003c/strong>\u003c/td>\u003ctd>server sends HTML in chunks\u003c/td>\u003ctd>fast first byte, progressive\u003c/td>\u003ctd>complexity\u003c/td>\u003ctd>product page with slow reviews/recommendations\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>RSC\u003c/strong>\u003c/td>\u003ctd>server components rendered on server\u003c/td>\u003ctd>zero JS for static parts\u003c/td>\u003ctd>new mental model\u003c/td>\u003ctd>most of a content/product page\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Partial Prerendering (PPR)\u003c/strong>\u003c/td>\u003ctd>static shell at build + dynamic holes streamed\u003c/td>\u003ctd>best of both\u003c/td>\u003ctd>newer\u003c/td>\u003ctd>product page shell static, price/stock/cart dynamic\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Islands\u003c/strong> (Astro)\u003c/td>\u003ctd>static HTML + isolated interactive islands\u003c/td>\u003ctd>minimal JS\u003c/td>\u003ctd>less app-like\u003c/td>\u003ctd>content sites\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Explain CSR vs SSR vs SSG vs ISR in one minute\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>With client-side rendering, the server sends an almost empty HTML page and JavaScript builds the UI in the browser. It's simple to host and great for app-like experiences behind a login, but the first paint is slower and SEO is weaker.\u003c/p>\u003cp>Server-side rendering generates the HTML on each request, so users and search engines get real content immediately, and the data is always fresh. The cost is server work per request and a higher time to first byte.\u003c/p>\u003cp>Static site generation renders pages at build time and serves them from a CDN, which is the fastest and cheapest option, but the content is only as fresh as the last build.\u003c/p>\u003cp>Incremental static regeneration is the middle ground: pages are static, but they regenerate in the background after a set time, or on demand, for example when a price changes in the CMS.\u003c/p>\u003cp>In practice you mix them per route. For a site like Bell's, I'd use static or ISR for marketing and product pages, SSR or streaming for personalised content like the cart, and client rendering for the logged-in account area.\u003c/p>\u003c/div>\n\u003cp>\"With \u003cstrong>CSR\u003c/strong> the server sends an empty shell and JS builds the page, which is great for app-like experiences behind login but slower first paint and weaker SEO. \u003cstrong>SSR\u003c/strong> renders HTML per request, giving fresh, SEO-friendly content but costing server time per request. \u003cstrong>SSG\u003c/strong> renders at build time and serves from a CDN, the fastest option, but content can go stale. \u003cstrong>ISR\u003c/strong> is SSG that regenerates pages in the background after a revalidate period or on demand, for example when a price changes in the CMS. In practice you \u003cstrong>mix them per route\u003c/strong>: SSG/ISR for marketing and product pages, SSR/streaming for personalised content, CSR for highly interactive authenticated tools.\"\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>Which would you choose for a product details page with frequently changing prices?\u003c/summary>\u003cp>ISR or a static shell with the product content cached, plus price and stock rendered dynamically or fetched on the client, which is what partial prerendering does. Prices must also be revalidated on demand when they change, and always confirmed server-side at checkout.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>What's the downside of SSR for every page?\u003c/summary>\u003cp>Every request hits the server, which costs money, increases TTFB under load, and makes traffic spikes, like launch days, harder to handle. Caching wherever possible is better.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">App Router vs Pages Router\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>The Pages Router is the original Next.js model. Each file in \u003ccode>pages\u003c/code> is a route, data is loaded with functions like \u003ccode>getServerSideProps\u003c/code> or \u003ccode>getStaticProps\u003c/code>, and every component ends up as a client component that gets hydrated.\u003c/p>\u003cp>The App Router is built on React Server Components. Components are server components by default, so they can be async and fetch data directly, and you opt into interactivity with \u003ccode>'use client'\u003c/code>. Layouts are nested and persist across navigation, so a sidebar doesn't re-render or lose state. There are special files for loading states and error boundaries, which use Suspense and error boundaries under the hood, plus streaming, Server Actions for mutations, and more advanced routing like parallel and intercepting routes.\u003c/p>\u003cp>The main benefit is shipping less JavaScript and fetching data closer to where it's used. The trade-off is a new mental model and caching behaviour that the team needs to learn. Both routers can coexist, so migration can be done page by page.\u003c/p>\u003c/div>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Pages Router (\u003ccode>pages/\u003c/code>)\u003c/th>\u003cth>App Router (\u003ccode>app/\u003c/code>)\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>getServerSideProps\u003c/code>, \u003ccode>getStaticProps\u003c/code>, \u003ccode>getStaticPaths\u003c/code>\u003c/td>\u003ctd>\u003ccode>async\u003c/code> Server Components fetch directly; \u003ccode>generateStaticParams\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>All components are client components (hydrated)\u003c/td>\u003ctd>\u003cstrong>Server Components by default\u003c/strong>; \u003ccode>'use client'\u003c/code> opt-in\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>_app\u003c/code>, \u003ccode>_document\u003c/code>\u003c/td>\u003ctd>nested \u003ccode>layout.tsx\u003c/code>, \u003ccode>template.tsx\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Custom loading UI\u003c/td>\u003ctd>\u003ccode>loading.tsx\u003c/code> (Suspense), \u003ccode>error.tsx\u003c/code> (error boundary), \u003ccode>not-found.tsx\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>API routes \u003ccode>pages/api\u003c/code>\u003c/td>\u003ctd>Route Handlers \u003ccode>app/api/x/route.ts\u003c/code> + \u003cstrong>Server Actions\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003c/td>\u003ctd>Streaming, nested layouts that persist state, parallel &amp; intercepting routes\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Migration is incremental: both routers can coexist.\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>What happens to layouts on navigation?\u003c/summary>\u003cp>Shared layouts don't re-render or lose state when you navigate between pages under them; only the changed segment renders.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>How would you migrate a large Pages Router app?\u003c/summary>\u003cp>Incrementally. Both routers work side by side, so I'd move routes one at a time, starting with simple or high-value pages, and shared components would need client boundaries where they use hooks.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">How does caching work in the Next.js App Router?\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>I'd describe it in layers, and mention that the defaults have changed between versions. First, request memoization: identical fetch calls during one render are deduplicated. Second, the data cache, which persists fetch results across requests. In Next 15, fetch isn't cached by default anymore, so you opt in with \u003ccode>force-cache\u003c/code> or a \u003ccode>revalidate\u003c/code> time and tags. Third, the full route cache, which stores the rendered HTML and payload for static routes. And fourth, the client-side router cache, which keeps visited pages in memory for fast back and forward navigation.\u003c/p>\u003cp>For invalidation, you can revalidate on a timer, or on demand with \u003ccode>revalidateTag\u003c/code> or \u003ccode>revalidatePath\u003c/code>, for example from a CMS webhook when a promotion changes.\u003c/p>\u003cp>In Next 16, the direction is explicit caching with the \u003ccode>\"use cache\"\u003c/code> directive and cache lifetime and tag helpers, where dynamic is the default and you choose what to cache. I think that's the right direction. My general principle is that caching should be explicit, and every cache needs a clear invalidation story, otherwise you get stale prices on an e-commerce site, which is a real business problem.\u003c/p>\u003c/div>\n\u003cp>Layers (it changed between versions, so explain concepts and state the version):\u003c/p>\n\u003col>\u003cli>\u003cstrong>Request memoization\u003c/strong>: the same \u003ccode>fetch\u003c/code> in one render pass is deduped.\u003c/li>\u003cli>\u003cstrong>Data cache\u003c/strong>: persisted fetch results across requests. In \u003cstrong>Next 15\u003c/strong>, \u003ccode>fetch\u003c/code> is \u003cstrong>not cached by default\u003c/strong>; opt in with \u003ccode>cache: 'force-cache'\u003c/code> or \u003ccode>next: { revalidate: 60, tags: ['plans'] }\u003c/code>.\u003c/li>\u003cli>\u003cstrong>Full route cache\u003c/strong>: static routes' HTML + RSC payload at build time.\u003c/li>\u003cli>\u003cstrong>Router cache (client)\u003c/strong>: RSC payloads of visited routes held in the browser for instant back/forward.\u003c/li>\u003c/ol>\n\u003cp>Invalidation: time-based \u003ccode>revalidate\u003c/code>, on-demand \u003ccode>revalidateTag('plans')\u003c/code> / \u003ccode>revalidatePath('/plans')\u003c/code> from a webhook or Server Action.\u003c/p>\n\u003cp>\u003cstrong>Next 16 / Cache Components:\u003c/strong> an explicit \u003ccode>\"use cache\"\u003c/code> directive on functions/components plus \u003ccode>cacheLife\u003c/code> / \u003ccode>cacheTag\u003c/code>. Dynamic is the default and caching is opt-in. Senior point: \u003cstrong>explicit caching beats magic caching\u003c/strong>, and you need a clear invalidation story (e.g. a CMS webhook calls \u003ccode>revalidateTag\u003c/code>).\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>How do you invalidate a cached product page when its price changes in the CMS?\u003c/summary>\u003cp>Tag the data fetches with something like the product ID, and have the CMS call a webhook route that calls \u003ccode>revalidateTag\u003c/code> for that product. The next request gets fresh data.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>Why did Next.js 15 change the fetch default?\u003c/summary>\u003cp>Developers were surprised by aggressive caching that showed stale data. Making it uncached by default and caching explicitly is more predictable.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">What is middleware (proxy in Next 16) used for?\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>Middleware, renamed proxy in Next 16, is code that runs before a request reaches a page or route, often at the edge, close to the user. It can redirect, rewrite, or modify request and response headers.\u003c/p>\u003cp>Typical uses: authentication checks that redirect to login, A/B test bucketing, adding security headers, bot protection, geolocation-based logic, and locale detection. For a bilingual site like Bell's, a good example is reading the \u003ccode>Accept-Language\u003c/code> header or a language cookie and sending the user to the English or French version of the page. Province-based pricing could also be routed this way.\u003c/p>\u003cp>The important constraint is that it runs on every matching request, so it has to be fast. I avoid heavy database calls there, limit it to the routes that need it with a matcher, and keep the logic simple.\u003c/p>\u003c/div>\n\u003cp>Code that runs \u003cstrong>before\u003c/strong> a request is handled, often at the \u003cstrong>edge\u003c/strong>: auth redirects, \u003cstrong>locale detection\u003c/strong> (\u003ccode>/en\u003c/code> vs \u003ccode>/fr\u003c/code> from \u003ccode>Accept-Language\u003c/code> or a cookie, very relevant to Bell), A/B test bucketing, geolocation (province-based pricing), bot protection, and rewrites. Keep it fast: no heavy DB calls.\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>Should you do authentication only in middleware?\u003c/summary>\u003cp>No. Middleware is good for a quick redirect, but authorisation must also happen in the data layer, in server components, route handlers and server actions, because middleware can be misconfigured or bypassed.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>How do you limit which routes run it?\u003c/summary>\u003cp>With the \u003ccode>matcher\u003c/code> config, excluding static assets and images, so it only runs where it's needed.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Image, font and script optimisation in Next.js\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>Next.js has three built-in components that address the most common performance problems.\u003c/p>\u003cp>The \u003ccode>Image\u003c/code> component generates responsive image sizes with \u003ccode>srcset\u003c/code>, serves modern formats like WebP and AVIF, lazy loads by default, and requires dimensions, which prevents layout shift. For the hero image, which is usually the LCP element, I mark it as priority so it's preloaded and not lazy loaded.\u003c/p>\u003cp>\u003ccode>next/font\u003c/code> downloads Google or local fonts at build time and serves them from your own domain, so there's no extra request to a third party, and it adjusts fallback font metrics to avoid layout shift when the font loads.\u003c/p>\u003cp>The \u003ccode>Script\u003c/code> component controls when third-party scripts load: after the page becomes interactive, during idle time, or even in a web worker. On large corporate sites, third-party tags like analytics, chat widgets and A/B testing tools are often the biggest cause of poor INP, so controlling their loading strategy makes a measurable difference.\u003c/p>\u003c/div>\n\u003cul>\u003cli>\u003ccode>next/image\u003c/code>: responsive \u003ccode>srcset\u003c/code>, lazy by default, modern formats, prevents CLS (requires width/height or \u003ccode>fill\u003c/code>), \u003ccode>priority\u003c/code> for the LCP image (\u003ccode>preload\u003c/code> in newer versions).\u003c/li>\u003cli>\u003ccode>next/font\u003c/code>: self-hosts Google fonts at build time, no layout shift (\u003ccode>size-adjust\u003c/code>), no external request.\u003c/li>\u003cli>\u003ccode>next/script\u003c/code>: \u003ccode>strategy=\"afterInteractive\" | \"lazyOnload\" | \"worker\"\u003c/code> for third-party tags (analytics, chat widgets). \u003cstrong>Third-party scripts are a top cause of poor INP on enterprise sites.\u003c/strong>\u003c/li>\u003c/ul>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>What does priority do on next/image?\u003c/summary>\u003cp>It preloads the image and disables lazy loading. Use it for the LCP image, typically the hero above the fold, and nowhere else.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>How would you load a chat widget without hurting performance?\u003c/summary>\u003cp>With the Script component's \u003ccode>lazyOnload\u003c/code> strategy, or better, a facade button that only loads the widget when the user clicks it.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Edge runtime vs Node runtime\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>The edge runtime runs code in lightweight V8 isolates distributed close to users around the world. It starts almost instantly and has low latency, but it only supports a subset of Node APIs, has size limits, and can't use many database drivers. The Node runtime runs in a regular server or serverless function with the full Node ecosystem.\u003c/p>\u003cp>I'd use the edge for fast, lightweight logic: redirects, authentication checks, personalisation, A/B testing and locale routing. I'd use Node for anything heavy or anything that talks to a database or uses Node-specific libraries.\u003c/p>\u003cp>The subtle trade-off worth mentioning: running at the edge doesn't help if the code then makes several calls to a database in a single region. Each of those round trips crosses the distance, and it can end up slower than running in a region next to the data.\u003c/p>\u003c/div>\n\u003cp>\u003cstrong>Edge\u003c/strong>: V8 isolates close to users, fast cold starts, limited APIs (no full Node, size limits). Good for middleware, personalisation, redirects and light APIs. \u003cstrong>Node\u003c/strong>: full ecosystem, DB drivers, heavier work. Don't put the edge function far from the database, because every DB round-trip then crosses regions, which is slower overall.\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>Can you use Prisma or a normal Postgres driver at the edge?\u003c/summary>\u003cp>Traditional TCP-based drivers generally don't work in edge runtimes. You need HTTP-based or edge-compatible drivers, or keep that code on the Node runtime.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">SEO for a React app: what matters?\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>The most important thing is that the content is in the HTML the server sends, through SSR or static generation, so search engines and social media previews see real content without needing to execute JavaScript.\u003c/p>\u003cp>Then the technical basics: a unique title and meta description per page, canonical URLs to avoid duplicate content, \u003ccode>hreflang\u003c/code> tags linking the English and French versions, which matters a lot for a bilingual site like Bell's, a sitemap and robots file, clean URLs, and real anchor links for navigation instead of click handlers.\u003c/p>\u003cp>Structured data with JSON-LD helps too, for example the \u003ccode>Product\u003c/code> and \u003ccode>Offer\u003c/code> schemas, which can show prices and ratings in search results.\u003c/p>\u003cp>And performance is part of SEO, because Core Web Vitals are a ranking signal. So the performance work we did at Bell, improving load times, wasn't just about user experience, it also supported search visibility for product pages.\u003c/p>\u003c/div>\n\u003cul>\u003cli>\u003cstrong>Server-rendered HTML\u003c/strong> (SSR/SSG) so crawlers and social previews see the content.\u003c/li>\u003cli>Unique \u003ccode>&lt;title&gt;\u003c/code>, meta description, \u003cstrong>canonical URLs\u003c/strong>, \u003ccode>hreflang\u003c/code> for EN/FR alternates.\u003c/li>\u003cli>Structured data (JSON-LD: \u003ccode>Product\u003c/code>, \u003ccode>Offer\u003c/code>, \u003ccode>BreadcrumbList\u003c/code>).\u003c/li>\u003cli>\u003ccode>sitemap.xml\u003c/code>, \u003ccode>robots.txt\u003c/code>, clean URLs, real \u003ccode>&lt;a href&gt;\u003c/code> links (not \u003ccode>onClick\u003c/code> navigation).\u003c/li>\u003cli>\u003cstrong>Core Web Vitals\u003c/strong> are a ranking signal.\u003c/li>\u003cli>Semantic HTML with one \u003ccode>h1\u003c/code> and a heading hierarchy.\u003c/li>\u003c/ul>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>Does Google execute JavaScript?\u003c/summary>\u003cp>Yes, but rendering is deferred and can be delayed, and other crawlers and social previews often don't execute JavaScript at all. Server-rendered HTML is the reliable approach.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>How do hreflang tags work?\u003c/summary>\u003cp>Each language version of a page lists all versions with their language and region, like en-CA and fr-CA, including itself, so search engines show the right language to the right users.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">When would you NOT use Next.js?\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>Next.js is great when you need SEO, server rendering, or a mix of rendering strategies. But it's not always the right choice.\u003c/p>\u003cp>For an internal admin tool or a dashboard behind login, with no SEO needs, a single-page app with Vite and React Router is simpler. It's just static files, so it can be hosted anywhere cheaply, with no server to run. The same goes for an embeddable widget that's dropped into other sites.\u003c/p>\u003cp>I'd also think about the team. Next.js, especially the App Router and server components, adds concepts and operational complexity like running Node servers and handling caching. If the team can't support that, a simpler setup may be better. Some companies also worry about being tied to Vercel's hosting, though Next.js can be self-hosted with Docker or adapters for AWS.\u003c/p>\u003cp>Good alternatives depending on the case: React Router v7, which is what Remix became, TanStack Start, or Astro for content-heavy sites that need very little JavaScript.\u003c/p>\u003c/div>\n\u003cp>An internal admin tool or SPA behind login with no SEO needs (Vite + React Router is simpler, static hosting, no server). Embedded widgets. A team without capacity to operate server infrastructure. Heavy vendor lock-in concerns (though Next can self-host via Docker/Node, or use OpenNext adapters on AWS). Alternatives: \u003cstrong>React Router v7 (Remix)\u003c/strong>, \u003cstrong>TanStack Start\u003c/strong>, \u003cstrong>Astro\u003c/strong> (content sites).\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>What would you choose for an internal dashboard?\u003c/summary>\u003cp>Vite with React and React Router or TanStack Router, a query library for data, and static hosting. Simple, fast to build, nothing to operate.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Build tooling: Vite vs webpack vs Turbopack; what does a bundler do?\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>A bundler takes your source code and turns it into optimised files for the browser. It follows imports to build a dependency graph, transforms TypeScript and JSX, removes unused code with tree-shaking, splits the code into chunks so pages load only what they need, minifies, and adds content hashes to file names so they can be cached long-term.\u003c/p>\u003cp>Vite has become the default for new single-page apps. In development it serves native ES modules without bundling, so the server starts instantly and hot reload is fast. For production, it bundles with Rollup, which is being replaced by Rolldown, written in Rust.\u003c/p>\u003cp>Webpack is the mature, highly configurable option that most older enterprise apps use, and it has Module Federation for micro-frontends, but it's slower. Rspack is a Rust rewrite with a webpack-compatible API, which makes it an easy way to speed up big webpack projects. And Turbopack is the Rust bundler from Vercel, which is the default in Next.js 16.\u003c/p>\u003cp>The trend is clear: tooling is moving to Rust for speed, and I'd choose based on the framework and how much existing configuration there is to migrate.\u003c/p>\u003c/div>\n\u003cp>A bundler resolves the module graph, transforms code (TS/JSX via esbuild/SWC/Babel), \u003cstrong>tree-shakes\u003c/strong>, \u003cstrong>code-splits\u003c/strong> into chunks, minifies, adds content \u003cstrong>hashes\u003c/strong> to file names for caching, and generates source maps.\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Vite\u003c/strong>: native ESM dev server (no bundling in dev, so instant start + fast HMR); production builds with Rollup (moving to \u003cstrong>Rolldown\u003c/strong>, Rust). The default for new SPAs.\u003c/li>\u003cli>\u003cstrong>webpack\u003c/strong>: mature, hugely configurable, \u003cstrong>Module Federation\u003c/strong> (micro-frontends). Slower.\u003c/li>\u003cli>\u003cstrong>Turbopack\u003c/strong>: Rust, Next.js default since v16.\u003c/li>\u003cli>\u003cstrong>Rspack\u003c/strong>: Rust, webpack-compatible API, an easy migration path for big webpack apps.\u003c/li>\u003c/ul>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>Why is Vite fast in development?\u003c/summary>\u003cp>It doesn't bundle your app in development. It serves source files as native ES modules and transforms them on demand with esbuild, so startup doesn't depend on app size, and hot module replacement only updates the changed module.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>What is tree-shaking and what breaks it?\u003c/summary>\u003cp>Removing unused exports from the bundle based on static ES module imports. It breaks with CommonJS modules, modules with side effects, and dynamic access patterns like importing everything as a namespace and using it dynamically.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>What's Module Federation?\u003c/summary>\u003cp>A webpack feature, also available for Rspack and Vite, that lets separately built apps load code from each other at runtime and share dependencies. It's the main technical foundation for runtime micro-frontends.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>"},{"id":"07-typescript","title":"TypeScript for Senior React Developers","html":"\u003ch1 id=\"typescript-for-senior-react-developers\">TypeScript for Senior React Developers\u003c/h1>\n\u003cblockquote>\u003cp>Most senior roles now expect \u003cstrong>TypeScript fluency\u003c/strong>. You won't be asked to write type gymnastics, but you will be asked to type components, hooks and API responses well, and to explain \u003cem>why\u003c/em> \u003ccode>any\u003c/code> is dangerous.\u003c/p>\u003c/blockquote>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">type vs interface\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>Both can describe the shape of an object, and in most everyday cases they're interchangeable. The differences: interfaces support declaration merging, so you can extend an existing interface by declaring it again, which is useful for augmenting library types like adding a property to \u003ccode>Window\u003c/code>. Interfaces use \u003ccode>extends\u003c/code>, and sometimes give clearer error messages.\u003c/p>\u003cp>Type aliases are more flexible. They can describe unions, intersections, tuples, primitives, and mapped and conditional types, which interfaces can't.\u003c/p>\u003cp>In practice, what matters most is consistency within the team. A common convention is to use \u003ccode>type\u003c/code> by default, because unions are so common in React props and state, and use \u003ccode>interface\u003c/code> for public APIs that others might extend. I wouldn't spend time debating it in a code review.\u003c/p>\u003c/div>\n\u003cp>Both describe object shapes. Differences:\u003c/p>\n\u003cul>\u003cli>\u003ccode>interface\u003c/code> supports \u003cstrong>declaration merging\u003c/strong> (augmenting library types, e.g. \u003ccode>Window\u003c/code>) and \u003ccode>extends\u003c/code>. Error messages are sometimes clearer.\u003c/li>\u003cli>\u003ccode>type\u003c/code> can express \u003cstrong>unions, intersections, tuples, mapped and conditional types\u003c/strong>, and primitives.\u003c/li>\u003c/ul>\n\u003cp>Rule of thumb: pick one convention for the team (many use \u003ccode>type\u003c/code> for everything, \u003ccode>interface\u003c/code> for public/extendable APIs). Don't argue about it in the interview; show you know the difference.\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>How do you extend a type alias?\u003c/summary>\u003cp>With an intersection, like \u003ccode>type Admin = User &amp; { permissions: string[] }\u003c/code>. Interfaces use \u003ccode>extends\u003c/code>, and an interface can also extend a type alias that describes an object.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>What is declaration merging useful for?\u003c/summary>\u003cp>Augmenting third-party types, like adding a custom property to \u003ccode>Window\u003c/code>, or extending a library's theme interface with your own tokens.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">any vs unknown vs never\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>\u003ccode>any\u003c/code> turns off type checking for that value. Anything is allowed, and worse, it spreads: whatever you derive from it is also unchecked. So I avoid it and have a lint rule against explicit \u003ccode>any\u003c/code>.\u003c/p>\u003cp>\u003ccode>unknown\u003c/code> is the safe counterpart. The value could be anything, but TypeScript won't let you use it until you narrow it, with a type check, a type guard or schema validation. I use it for API responses, \u003ccode>JSON.parse\u003c/code> results, and caught errors.\u003c/p>\u003cp>\u003ccode>never\u003c/code> represents something that can't happen, like a function that always throws, or a branch that should be unreachable. My favourite use is exhaustive checking: in the default case of a switch over a union, I pass the value to a function that takes \u003ccode>never\u003c/code>. If someone later adds a new case to the union and forgets to handle it, the build fails, which catches the bug at compile time.\u003c/p>\u003c/div>\n\u003cul>\u003cli>\u003ccode>any\u003c/code>: turns the type checker \u003cstrong>off\u003c/strong> and spreads silently. Avoid it (lint \u003ccode>no-explicit-any\u003c/code>).\u003c/li>\u003cli>\u003ccode>unknown\u003c/code>: \"could be anything, but you must \u003cstrong>narrow\u003c/strong> before using it\". Use it for API responses, \u003ccode>catch (e)\u003c/code> and \u003ccode>JSON.parse\u003c/code>.\u003c/li>\u003cli>\u003ccode>never\u003c/code>: a value that can't exist. Use it for exhaustive checks and functions that throw.\u003c/li>\u003c/ul>\n\u003cdiv class=\"code\">\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003cpre>\u003ccode data-lang=\"ts\">\u003cspan class=\"t-k\">function\u003c/span> assertNever(x: \u003cspan class=\"t-k\">never\u003c/span>): \u003cspan class=\"t-k\">never\u003c/span> { \u003cspan class=\"t-k\">throw\u003c/span> \u003cspan class=\"t-k\">new\u003c/span> Error(\u003cspan class=\"t-s\">'Unexpected: '\u003c/span> + x); }\u003c/code>\u003c/pre>\u003c/div>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>How do you type a caught error?\u003c/summary>\u003cp>As \u003ccode>unknown\u003c/code>, which is the default with strict settings, then narrow it: check \u003ccode>instanceof Error\u003c/code> before reading \u003ccode>message\u003c/code>, and otherwise convert it to a string.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>Why does unknown matter for JSON.parse?\u003c/summary>\u003cp>Its result is really untyped data from outside. Treating it as \u003ccode>unknown\u003c/code> forces you to validate it before use, instead of trusting it blindly as \u003ccode>any\u003c/code>.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Discriminated unions: model loading state properly\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>A discriminated union is a union of object types that share a common literal property, like \u003ccode>status\u003c/code>, which TypeScript uses to narrow the type.\u003c/p>\u003cp>The classic example is request state. Instead of separate \u003ccode>isLoading\u003c/code>, \u003ccode>error\u003c/code> and \u003ccode>data\u003c/code> fields, where you can end up with impossible combinations like loading and error both being true, I model it as a union: idle, loading, success with \u003ccode>data\u003c/code>, and error with an \u003ccode>error\u003c/code> message. When I check \u003ccode>status === 'success'\u003c/code>, TypeScript knows \u003ccode>data\u003c/code> exists, and in other branches it knows it doesn't.\u003c/p>\u003cp>Combined with an exhaustive check using \u003ccode>never\u003c/code>, adding a new status forces every switch statement to handle it. The phrase I like is \"make impossible states impossible\".\u003c/p>\u003cp>I've found this very useful for multi-step flows like checkout, where each step has different data, and for component props where certain props only make sense together.\u003c/p>\u003c/div>\n\u003cdiv class=\"code\">\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003cpre>\u003ccode data-lang=\"ts\">\u003cspan class=\"t-k\">type\u003c/span> RequestState&lt;T&gt; =\n  | { status: \u003cspan class=\"t-s\">'idle'\u003c/span> }\n  | { status: \u003cspan class=\"t-s\">'loading'\u003c/span> }\n  | { status: \u003cspan class=\"t-s\">'success'\u003c/span>; data: T }\n  | { status: \u003cspan class=\"t-s\">'error'\u003c/span>; error: string };\n\n\u003cspan class=\"t-k\">function\u003c/span> render(s: RequestState&lt;Plan[]&gt;) {\n  \u003cspan class=\"t-k\">switch\u003c/span> (s.status) {\n    \u003cspan class=\"t-k\">case\u003c/span> \u003cspan class=\"t-s\">'success'\u003c/span>: \u003cspan class=\"t-k\">return\u003c/span> s.data.length;      \u003cspan class=\"t-c\">// `data` exists only here: narrowed\u003c/span>\n    \u003cspan class=\"t-k\">case\u003c/span> \u003cspan class=\"t-s\">'error'\u003c/span>:   \u003cspan class=\"t-k\">return\u003c/span> s.error;\n    \u003cspan class=\"t-k\">case\u003c/span> \u003cspan class=\"t-s\">'idle'\u003c/span>: \u003cspan class=\"t-k\">case\u003c/span> \u003cspan class=\"t-s\">'loading'\u003c/span>: \u003cspan class=\"t-k\">return\u003c/span> \u003cspan class=\"t-k\">null\u003c/span>;\n    \u003cspan class=\"t-k\">default\u003c/span>: \u003cspan class=\"t-k\">return\u003c/span> assertNever(s);            \u003cspan class=\"t-c\">// compile error if a new status is added\u003c/span>\n  }\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>This makes \u003cstrong>impossible states impossible\u003c/strong> (no \u003ccode>isLoading &amp;&amp; error &amp;&amp; data\u003c/code> combos). Great for checkout steps too.\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>How would you type component props where some props only make sense together?\u003c/summary>\u003cp>A union of prop shapes, like a button that's either a link with \u003ccode>href\u003c/code>, or a button with \u003ccode>onClick\u003c/code>, discriminated by a field or by which props are present, so invalid combinations fail to compile.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>How does narrowing work on the discriminant?\u003c/summary>\u003cp>When you check the literal field, like \u003ccode>status === 'success'\u003c/code>, TypeScript narrows the union to the members where that literal matches, so the other members' properties are excluded.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Generics: explain with a real example\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>Generics are type parameters. They let you write a function, hook or component that works with many types while keeping the relationship between input and output.\u003c/p>\u003cp>For example, a \u003ccode>getJson&lt;T&gt;\u003c/code> helper returns \u003ccode>Promise&lt;T&gt;\u003c/code>, so the caller gets typed data back. I'd point out that this is an unchecked cast, though: TypeScript trusts you, so at API boundaries I'd validate with Zod. Another example is a \u003ccode>useLocalStorage&lt;T&gt;\u003c/code> hook: the type of the default value determines the type of the stored value and the setter. And generic components, like a \u003ccode>List&lt;T&gt;\u003c/code> that takes items and a \u003ccode>renderItem\u003c/code> function, so \u003ccode>renderItem\u003c/code> knows the exact item type.\u003c/p>\u003cp>Constraints make generics more precise, for example \u003ccode>T extends { id: string }\u003c/code> to guarantee an ID, or \u003ccode>K extends keyof T\u003c/code> to accept only valid property names. The guideline I follow is to use generics when they connect types between inputs and outputs, not just to look clever.\u003c/p>\u003c/div>\n\u003cp>Generics are type parameters that keep relationships between inputs and outputs.\u003c/p>\n\u003cdiv class=\"code\">\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003cpre>\u003ccode data-lang=\"ts\">\u003cspan class=\"t-k\">async\u003c/span> \u003cspan class=\"t-k\">function\u003c/span> getJson&lt;T&gt;(url: string, signal?: AbortSignal): Promise&lt;T&gt; {\n  \u003cspan class=\"t-k\">const\u003c/span> res = \u003cspan class=\"t-k\">await\u003c/span> fetch(url, { signal });\n  \u003cspan class=\"t-k\">if\u003c/span> (!res.ok) \u003cspan class=\"t-k\">throw\u003c/span> \u003cspan class=\"t-k\">new\u003c/span> Error(res.statusText);\n  \u003cspan class=\"t-k\">return\u003c/span> res.json() \u003cspan class=\"t-k\">as\u003c/span> Promise&lt;T&gt;;          \u003cspan class=\"t-c\">// ⚠ unchecked cast: validate at runtime with Zod\u003c/span>\n}\n\n\u003cspan class=\"t-k\">function\u003c/span> useLocalStorage&lt;T&gt;(key: string, initial: T) {\n  \u003cspan class=\"t-k\">const\u003c/span> [value, setValue] = useState&lt;T&gt;(() =&gt; {\n    \u003cspan class=\"t-k\">const\u003c/span> raw = localStorage.getItem(key);\n    \u003cspan class=\"t-k\">return\u003c/span> raw ? (JSON.parse(raw) \u003cspan class=\"t-k\">as\u003c/span> T) : initial;\n  });\n  useEffect(() =&gt; localStorage.setItem(key, JSON.stringify(value)), [key, value]);\n  \u003cspan class=\"t-k\">return\u003c/span> [value, setValue] \u003cspan class=\"t-k\">as\u003c/span> \u003cspan class=\"t-k\">const\u003c/span>;        \u003cspan class=\"t-c\">// tuple, not (T | Dispatch)[]\u003c/span>\n}\n\n\u003cspan class=\"t-c\">// Generic component\u003c/span>\n\u003cspan class=\"t-k\">type\u003c/span> ListProps&lt;T&gt; = { items: T[]; renderItem: (item: T) =&gt; React.ReactNode; getKey: (item: T) =&gt; string };\n\u003cspan class=\"t-k\">function\u003c/span> List&lt;T&gt;({ items, renderItem, getKey }: ListProps&lt;T&gt;) {\n  \u003cspan class=\"t-k\">return\u003c/span> &lt;ul&gt;{items.map(i =&gt; &lt;li key={getKey(i)}&gt;{renderItem(i)}&lt;/li&gt;)}&lt;/ul&gt;;\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>Constraints: \u003ccode>&lt;T extends { id: string }&gt;\u003c/code>, \u003ccode>&lt;K extends keyof T&gt;\u003c/code>.\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>What does \"as const\" do on the returned tuple?\u003c/summary>\u003cp>Without it, the return type is an array of a union. \u003ccode>as const\u003c/code> makes it a readonly tuple, so the first element has the value type and the second has the setter type, just like \u003ccode>useState\u003c/code>.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>What's a generic constraint?\u003c/summary>\u003cp>A requirement on the type parameter, like \u003ccode>T extends { id: string }\u003c/code>, so inside the function you can safely use \u003ccode>item.id\u003c/code>, and callers can't pass types without an ID.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Utility types you should know\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>The ones I use most: \u003ccode>Partial\u003c/code> makes every property optional, which is handy for update payloads, and \u003ccode>Required\u003c/code> does the opposite. \u003ccode>Pick\u003c/code> and \u003ccode>Omit\u003c/code> create a type with a subset of properties, for example a form type that omits the server-generated ID. \u003ccode>Record\u003c/code> creates an object type with specific keys, like prices by province. \u003ccode>Readonly\u003c/code> prevents mutation.\u003c/p>\u003cp>For unions, \u003ccode>Exclude\u003c/code> and \u003ccode>Extract\u003c/code> filter members, and \u003ccode>NonNullable\u003c/code> removes null and undefined. For functions, \u003ccode>ReturnType\u003c/code> and \u003ccode>Parameters\u003c/code> extract types from existing functions, and \u003ccode>Awaited\u003c/code> unwraps a promise.\u003c/p>\u003cp>In React, \u003ccode>ComponentProps\u003c/code> and \u003ccode>ComponentPropsWithoutRef\u003c/code> are really useful. For a design-system Button, I extend the native button props, so it accepts every standard attribute like \u003ccode>disabled\u003c/code> and \u003ccode>aria-label\u003c/code>, plus my own variant prop. That way I don't redefine HTML attributes by hand.\u003c/p>\u003c/div>\n\u003cp>\u003ccode>Partial&lt;T&gt;\u003c/code>, \u003ccode>Required&lt;T&gt;\u003c/code>, \u003ccode>Readonly&lt;T&gt;\u003c/code>, \u003ccode>Pick&lt;T, K&gt;\u003c/code>, \u003ccode>Omit&lt;T, K&gt;\u003c/code>, \u003ccode>Record&lt;K, V&gt;\u003c/code>, \u003ccode>Exclude&lt;U, X&gt;\u003c/code>, \u003ccode>Extract&lt;U, X&gt;\u003c/code>, \u003ccode>NonNullable&lt;T&gt;\u003c/code>, \u003ccode>ReturnType&lt;F&gt;\u003c/code>, \u003ccode>Parameters&lt;F&gt;\u003c/code>, \u003ccode>Awaited&lt;T&gt;\u003c/code>, \u003ccode>ComponentProps&lt;typeof Button&gt;\u003c/code>, \u003ccode>ComponentPropsWithoutRef&lt;'button'&gt;\u003c/code>.\u003c/p>\n\u003cdiv class=\"code\">\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003cpre>\u003ccode data-lang=\"ts\">\u003cspan class=\"t-k\">type\u003c/span> ButtonProps = React.ComponentPropsWithoutRef&lt;\u003cspan class=\"t-s\">'button'\u003c/span>&gt; &amp; { variant?: \u003cspan class=\"t-s\">'primary'\u003c/span> | \u003cspan class=\"t-s\">'secondary'\u003c/span> };\n\u003cspan class=\"t-k\">type\u003c/span> PlanUpdate = Partial&lt;Omit&lt;Plan, \u003cspan class=\"t-s\">'id'\u003c/span>&gt;&gt;;\n\u003cspan class=\"t-k\">type\u003c/span> PriceByProvince = Record&lt;\u003cspan class=\"t-s\">'ON'\u003c/span> | \u003cspan class=\"t-s\">'QC'\u003c/span> | \u003cspan class=\"t-s\">'BC'\u003c/span>, number&gt;;\u003c/code>\u003c/pre>\u003c/div>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>How would you make only some properties optional?\u003c/summary>\u003cp>Combine utilities: \u003ccode>Omit&lt;T, K&gt; &amp; Partial&lt;Pick&lt;T, K&gt;&gt;\u003c/code>. Many teams define a small \u003ccode>PartialBy\u003c/code> helper for this.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>Difference between Omit and Exclude?\u003c/summary>\u003cp>\u003ccode>Omit\u003c/code> removes properties from an object type. \u003ccode>Exclude\u003c/code> removes members from a union type.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Typing React: props, children, events, refs, hooks\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>For props I define a type and annotate the function parameter directly. I don't use \u003ccode>React.FC\u003c/code> much anymore, and I only include \u003ccode>children\u003c/code> when the component actually accepts children, typed as \u003ccode>React.ReactNode\u003c/code>. Callback props get explicit function types.\u003c/p>\u003cp>For events, I use React's event types, like \u003ccode>React.ChangeEvent&lt;HTMLInputElement&gt;\u003c/code> for inputs and \u003ccode>React.FormEvent&lt;HTMLFormElement&gt;\u003c/code> for forms, so \u003ccode>event.target.value\u003c/code> is correctly typed. For refs, \u003ccode>useRef&lt;HTMLInputElement&gt;(null)\u003c/code>. For state that starts empty, I give \u003ccode>useState\u003c/code> an explicit union, like \u003ccode>User | null\u003c/code>.\u003c/p>\u003cp>For context, a pattern I always use is creating the context with \u003ccode>null\u003c/code> as the default, and a custom hook that reads it and throws a clear error if it's used outside the provider. Then consumers get a non-null type and a helpful message.\u003c/p>\u003cp>Generic components are useful for things like lists and tables, and for wrapping native elements I extend \u003ccode>ComponentPropsWithoutRef\u003c/code>.\u003c/p>\u003c/div>\n\u003cdiv class=\"code\">\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003cpre>\u003ccode data-lang=\"tsx\">\u003cspan class=\"t-k\">type\u003c/span> CardProps = {\n  title: string;\n  children: React.ReactNode;           \u003cspan class=\"t-c\">// anything renderable\u003c/span>\n  onSelect?: (id: string) =&gt; \u003cspan class=\"t-k\">void\u003c/span>;\n};\n\n\u003cspan class=\"t-k\">const\u003c/span> onChange = (e: React.ChangeEvent&lt;HTMLInputElement&gt;) =&gt; setQ(e.target.value);\n\u003cspan class=\"t-k\">const\u003c/span> onSubmit = (e: React.FormEvent&lt;HTMLFormElement&gt;) =&gt; e.preventDefault();\n\n\u003cspan class=\"t-k\">const\u003c/span> inputRef = useRef&lt;HTMLInputElement&gt;(\u003cspan class=\"t-k\">null\u003c/span>);\n\u003cspan class=\"t-k\">const\u003c/span> [user, setUser] = useState&lt;User | \u003cspan class=\"t-k\">null\u003c/span>&gt;(\u003cspan class=\"t-k\">null\u003c/span>);\n\n\u003cspan class=\"t-c\">// Context with a safe hook\u003c/span>\n\u003cspan class=\"t-k\">const\u003c/span> CartContext = createContext&lt;CartApi | \u003cspan class=\"t-k\">null\u003c/span>&gt;(\u003cspan class=\"t-k\">null\u003c/span>);\n\u003cspan class=\"t-k\">export\u003c/span> \u003cspan class=\"t-k\">function\u003c/span> useCart() {\n  \u003cspan class=\"t-k\">const\u003c/span> ctx = useContext(CartContext);\n  \u003cspan class=\"t-k\">if\u003c/span> (!ctx) \u003cspan class=\"t-k\">throw\u003c/span> \u003cspan class=\"t-k\">new\u003c/span> Error(\u003cspan class=\"t-s\">'useCart must be used inside &lt;CartProvider&gt;'\u003c/span>);\n  \u003cspan class=\"t-k\">return\u003c/span> ctx;\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>Avoid \u003ccode>React.FC\u003c/code> debates: just type props directly. Don't type \u003ccode>children\u003c/code> unless you accept them.\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u00
