3cdetails class=\"fu\">\u003csummary>Why do people avoid React.FC?\u003c/summary>\u003cp>It used to add implicit \u003ccode>children\u003c/code>, and it complicates generics and default props. Typing the props parameter directly is simpler and more flexible. It's mostly a style choice now.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>How do you type a component that renders as different elements?\u003c/summary>\u003cp>With a polymorphic \u003ccode>as\u003c/code> prop and generics over the element type, using \u003ccode>ComponentPropsWithoutRef&lt;E&gt;\u003c/code>. It gets complex, so many design systems use an \u003ccode>asChild\u003c/code> pattern instead.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Type narrowing techniques\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>Narrowing is how TypeScript refines a broad type to a more specific one inside a block of code. The common techniques are \u003ccode>typeof\u003c/code> checks for primitives, \u003ccode>instanceof\u003c/code> for classes like \u003ccode>Date\u003c/code> or \u003ccode>Error\u003c/code>, the \u003ccode>in\u003c/code> operator to check whether a property exists, equality checks, especially on a discriminant property in a union, truthiness checks to rule out null and undefined, and \u003ccode>Array.isArray\u003c/code>.\u003c/p>\u003cp>When the built-in checks aren't enough, I write a user-defined type guard: a function whose return type is \u003ccode>value is Plan\u003c/code>. Inside, I do the runtime checks, and after calling it TypeScript treats the value as a \u003ccode>Plan\u003c/code>. There are also assertion functions, which throw if the condition fails and narrow the type afterwards.\u003c/p>\u003cp>The important caveat is that a custom type guard is only as correct as its implementation, since TypeScript trusts it. For complex external data, a schema library is safer than hand-written guards.\u003c/p>\u003c/div>\n\u003cp>\u003ccode>typeof\u003c/code>, \u003ccode>instanceof\u003c/code>, \u003ccode>in\u003c/code> (\u003ccode>'data' in res\u003c/code>), equality / discriminant checks, truthiness, \u003ccode>Array.isArray\u003c/code>, and \u003cstrong>user-defined type guards\u003c/strong>:\u003c/p>\n\u003cdiv class=\"code\">\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003cpre>\u003ccode data-lang=\"ts\">\u003cspan class=\"t-k\">function\u003c/span> isPlan(x: \u003cspan class=\"t-k\">unknown\u003c/span>): x is Plan {\n  \u003cspan class=\"t-k\">return\u003c/span> \u003cspan class=\"t-k\">typeof\u003c/span> x === \u003cspan class=\"t-s\">'object'\u003c/span> &amp;&amp; x !== \u003cspan class=\"t-k\">null\u003c/span> &amp;&amp; \u003cspan class=\"t-s\">'id'\u003c/span> \u003cspan class=\"t-k\">in\u003c/span> x &amp;&amp; \u003cspan class=\"t-s\">'price'\u003c/span> \u003cspan class=\"t-k\">in\u003c/span> x;\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>Assertion functions: \u003ccode>function assert(cond: unknown, msg: string): asserts cond\u003c/code>.\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>What's the danger of a custom type guard?\u003c/summary>\u003cp>TypeScript trusts it completely. If the runtime check is incomplete, TypeScript narrows incorrectly, and you get runtime errors in code the compiler said was safe.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>What does the \"in\" operator narrow?\u003c/summary>\u003cp>It checks whether a property exists, and narrows a union to the members that have that property.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Runtime validation: why TypeScript isn't enough at API boundaries\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>TypeScript types are erased when the code compiles, so they provide no protection at runtime. If an API returns a different shape than expected, or a field is renamed, the types still claim everything is fine, and the app crashes somewhere far from the real cause, or worse, shows wrong data.\u003c/p>\u003cp>So at the boundaries, meaning API responses, local storage, URL parameters and form input, I validate with a schema library like Zod. The nice part is that I define the schema once and infer the TypeScript type from it, so the runtime check and the static type can never drift apart. If the data doesn't match, I get a clear error at the boundary.\u003c/p>\u003cp>Another approach I like in a microservices setup like Bell's is generating the TypeScript types from the backend's OpenAPI specification, so the front-end types always match the API contract. Combining generated types with validation of critical responses gives strong safety.\u003c/p>\u003c/div>\n\u003cp>Types are erased at runtime. An API can return anything. Validate external data with \u003cstrong>Zod / Valibot\u003c/strong> and infer the type from the schema, so there's a single source of truth:\u003c/p>\n\u003cdiv class=\"code\">\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003cpre>\u003ccode data-lang=\"ts\">\u003cspan class=\"t-k\">const\u003c/span> Plan = z.object({ id: z.string(), name: z.string(), price: z.number().nonnegative() });\n\u003cspan class=\"t-k\">type\u003c/span> Plan = z.\u003cspan class=\"t-k\">infer\u003c/span>&lt;\u003cspan class=\"t-k\">typeof\u003c/span> Plan&gt;;\n\u003cspan class=\"t-k\">const\u003c/span> plans = z.array(Plan).parse(\u003cspan class=\"t-k\">await\u003c/span> res.json());   \u003cspan class=\"t-c\">// throws early, with a clear error\u003c/span>\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>Alternatively, \u003cstrong>generate types from OpenAPI\u003c/strong> (openapi-typescript, Orval, RTK Query codegen) so front end and back end can't drift.\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>Isn't validating every API response slow?\u003c/summary>\u003cp>Usually it's negligible compared with network time. For very large responses, I validate critical fields or sample in production, and validate fully in development and tests.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>What happens in the UI when validation fails?\u003c/summary>\u003cp>Treat it like an API error: show a friendly error state, report the details to monitoring with the endpoint and schema error, and don't render partially wrong data.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Advanced: keyof, typeof, indexed access, mapped, conditional, template literal types, satisfies\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>I use these mostly to derive types from values so there's a single source of truth. For example, with a routes object declared \u003ccode>as const\u003c/code>, \u003ccode>keyof typeof ROUTES\u003c/code> gives a union of route names, and indexed access gives a union of the paths. If someone adds a route, the types update automatically.\u003c/p>\u003cp>Mapped types transform every property of a type, for example making every property nullable. Conditional types choose a type based on a condition, and with \u003ccode>infer\u003c/code> you can extract part of a type, like the element type of an array. Template literal types build string types, like translation keys combining a locale and a key name, which is great for type-safe i18n keys.\u003c/p>\u003cp>And \u003ccode>satisfies\u003c/code>, which I use a lot for configuration objects: it checks that a value matches a type, but keeps the narrower inferred type, instead of widening it like an annotation would. So I get validation and precise autocomplete.\u003c/p>\u003cp>I'd add that I use advanced types mostly in shared libraries. In application code, readability matters more than cleverness.\u003c/p>\u003c/div>\n\u003cdiv class=\"code\">\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003cpre>\u003ccode data-lang=\"ts\">\u003cspan class=\"t-k\">const\u003c/span> ROUTES = { home: \u003cspan class=\"t-s\">'/'\u003c/span>, plans: \u003cspan class=\"t-s\">'/plans'\u003c/span>, cart: \u003cspan class=\"t-s\">'/cart'\u003c/span> } \u003cspan class=\"t-k\">as\u003c/span> \u003cspan class=\"t-k\">const\u003c/span>;\n\u003cspan class=\"t-k\">type\u003c/span> RouteName = \u003cspan class=\"t-k\">keyof\u003c/span> \u003cspan class=\"t-k\">typeof\u003c/span> ROUTES;            \u003cspan class=\"t-c\">// 'home' | 'plans' | 'cart'\u003c/span>\n\u003cspan class=\"t-k\">type\u003c/span> RoutePath = (\u003cspan class=\"t-k\">typeof\u003c/span> ROUTES)[RouteName];     \u003cspan class=\"t-c\">// '/' | '/plans' | '/cart'\u003c/span>\n\n\u003cspan class=\"t-k\">type\u003c/span> Nullable&lt;T&gt; = { [K \u003cspan class=\"t-k\">in\u003c/span> \u003cspan class=\"t-k\">keyof\u003c/span> T]: T[K] | \u003cspan class=\"t-k\">null\u003c/span> };          \u003cspan class=\"t-c\">// mapped\u003c/span>\n\u003cspan class=\"t-k\">type\u003c/span> ElementOf&lt;T&gt; = T \u003cspan class=\"t-k\">extends\u003c/span> (\u003cspan class=\"t-k\">infer\u003c/span> U)[] ? U : \u003cspan class=\"t-k\">never\u003c/span>;        \u003cspan class=\"t-c\">// conditional + infer\u003c/span>\n\u003cspan class=\"t-k\">type\u003c/span> Locale = \u003cspan class=\"t-s\">'en'\u003c/span> | \u003cspan class=\"t-s\">'fr'\u003c/span>;\n\u003cspan class=\"t-k\">type\u003c/span> I18nKey = \u003cspan class=\"t-s\">`${Locale}.${'title' | 'cta'}`\u003c/span>;                \u003cspan class=\"t-c\">// template literal\u003c/span>\n\n\u003cspan class=\"t-k\">const\u003c/span> config = { theme: \u003cspan class=\"t-s\">'dark'\u003c/span>, retries: \u003cspan class=\"t-n\">3\u003c/span> } \u003cspan class=\"t-k\">satisfies\u003c/span> Record&lt;string, string | number&gt;;\n\u003cspan class=\"t-c\">// `satisfies` checks against the type but KEEPS the narrow inferred type\u003c/span>\u003c/code>\u003c/pre>\u003c/div>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>Give an example of a mapped type you've used.\u003c/summary>\u003cp>Generating form error types from a form values type, where each field maps to an optional string, so errors always match the actual fields.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>What does infer do?\u003c/summary>\u003cp>Inside a conditional type it captures part of a type into a new type variable, like extracting the element type of an array or the resolved type of a promise.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">tsconfig settings a senior should care about\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>The non-negotiable one is \u003ccode>strict: true\u003c/code>, which turns on strict null checks and no implicit any, among others. Beyond that, I like \u003ccode>noUncheckedIndexedAccess\u003c/code>, which makes array and object index access return possibly undefined. It catches a lot of real bugs. \u003ccode>exactOptionalPropertyTypes\u003c/code> is useful in stricter codebases too.\u003c/p>\u003cp>For modern bundlers I use \u003ccode>moduleResolution: \"bundler\"\u003c/code>, \u003ccode>isolatedModules\u003c/code>, which is required when tools like esbuild or SWC compile files one at a time, and \u003ccode>verbatimModuleSyntax\u003c/code> so type-only imports are explicit. Path aliases keep imports readable.\u003c/p>\u003cp>For migrating a JavaScript codebase, I enable \u003ccode>allowJs\u003c/code>, convert files gradually starting from the leaves like utilities, use \u003ccode>ts-expect-error\u003c/code> with a ticket where necessary, and tighten strictness over time.\u003c/p>\u003cp>And I'd mention that TypeScript 7, the native port written in Go, makes type-checking around ten times faster, which really helps large codebases and CI times.\u003c/p>\u003c/div>\n\u003cp>\u003ccode>\"strict\": true\u003c/code> (non-negotiable for new code), \u003ccode>noUncheckedIndexedAccess\u003c/code> (array/record access may be \u003ccode>undefined\u003c/code>), \u003ccode>exactOptionalPropertyTypes\u003c/code>, \u003ccode>noImplicitOverride\u003c/code>, \u003ccode>moduleResolution: \"bundler\"\u003c/code>, \u003ccode>verbatimModuleSyntax\u003c/code>, \u003ccode>isolatedModules\u003c/code> (needed by esbuild/SWC), \u003ccode>skipLibCheck\u003c/code>, path aliases.\u003c/p>\n\u003cp>Migration strategy for JS → TS: \u003ccode>allowJs\u003c/code>, convert leaf files first, \u003ccode>// @ts-expect-error\u003c/code> with tickets, and increase strictness gradually (per folder with project references or a strict-plugin).\u003c/p>\n\u003cp>TS news: \u003cstrong>TypeScript 7 (native Go port, \"tsgo\")\u003c/strong> brings roughly 10× faster type-checking. Worth mentioning that you're following it.\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>What does noUncheckedIndexedAccess catch?\u003c/summary>\u003cp>Accessing \u003ccode>arr[0]\u003c/code> or \u003ccode>record[key]\u003c/code> returns a possibly undefined type, so you must handle the missing case. It catches real bugs with empty arrays and missing keys.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>How do you migrate a large codebase to strict mode?\u003c/summary>\u003cp>Enable strict options one at a time, or per folder, fix errors incrementally, and use a baseline of allowed errors that can only shrink in CI, so new code is strict from day one.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>"},{"id":"08-performance","title":"Performance & Core Web Vitals","html":"\u003ch1 id=\"performance-core-web-vitals\">Performance &amp; Core Web Vitals\u003c/h1>\n\u003cblockquote>\u003cp>This is \u003cstrong>your strongest area\u003c/strong> (the ~20% load-time win at Bell). Be ready to go very deep: metrics, tools, techniques, and how you prevented regressions.\u003c/p>\u003c/blockquote>\n\u003ch2 id=\"core-web-vitals-2024\">Core Web Vitals (2024+)\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Metric\u003c/th>\u003cth>Measures\u003c/th>\u003cth>Good\u003c/th>\u003cth>Poor\u003c/th>\u003cth>Main causes\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>LCP\u003c/strong>: Largest Contentful Paint\u003c/td>\u003ctd>loading: when the main content appears\u003c/td>\u003ctd>≤ 2.5 s\u003c/td>\u003ctd>&gt; 4 s\u003c/td>\u003ctd>slow TTFB, render-blocking CSS/JS, unoptimised hero image, client-side rendering\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>INP\u003c/strong>: Interaction to Next Paint\u003c/td>\u003ctd>responsiveness: worst-ish latency of clicks/taps/keys over the page's life\u003c/td>\u003ctd>≤ 200 ms\u003c/td>\u003ctd>&gt; 500 ms\u003c/td>\u003ctd>long JS tasks, heavy re-renders, third-party scripts, big DOM\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>CLS\u003c/strong>: Cumulative Layout Shift\u003c/td>\u003ctd>visual stability\u003c/td>\u003ctd>≤ 0.1\u003c/td>\u003ctd>&gt; 0.25\u003c/td>\u003ctd>images without dimensions, late banners/ads, web fonts, injected content\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>INP replaced FID in March 2024.\u003c/strong> FID only measured the \u003cem>delay\u003c/em> of the \u003cem>first\u003c/em> input; INP covers \u003cstrong>all\u003c/strong> interactions, including processing and rendering time. Thresholds are judged at the \u003cstrong>75th percentile\u003c/strong> of real users (mobile and desktop separately).\u003c/p>\n\u003cp>Supporting metrics: \u003cstrong>TTFB\u003c/strong> (server/CDN), \u003cstrong>FCP\u003c/strong>, \u003cstrong>TBT\u003c/strong> (lab proxy for INP), Speed Index.\u003c/p>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Lab data vs field data: what's the difference and which matters?\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>Lab data comes from tools like Lighthouse, WebPageTest or the Chrome Performance panel. You run the page in a controlled environment with a simulated device and network. It's reproducible, which makes it great for debugging and for automated checks in CI, but it isn't what real users experience.\u003c/p>\u003cp>Field data, or real-user monitoring, comes from actual visitors on their own devices and networks. Sources include Google's Chrome UX Report, the \u003ccode>web-vitals\u003c/code> library sending metrics to your analytics, or tools like Datadog, New Relic or Vercel Speed Insights. That's what Google uses for Core Web Vitals in search ranking, judged at the 75th percentile.\u003c/p>\u003cp>So I use them together. Field data tells me whether there's a problem and where: which pages, which devices, which countries. Lab tools help me find out why and verify a fix before it ships. Then I protect the improvement with a budget in CI. They often disagree. A page can score 95 in Lighthouse on a fast laptop but have poor INP for real users on mid-range Android phones.\u003c/p>\u003c/div>\n\u003cul>\u003cli>\u003cstrong>Lab\u003c/strong> (Lighthouse, WebPageTest, DevTools): a synthetic, controlled environment. Reproducible, good for debugging and CI gates, but \u003cstrong>not real users\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>Field / RUM\u003c/strong> (CrUX, the \u003ccode>web-vitals\u003c/code> JS library sending to analytics, Datadog/New Relic RUM, Vercel Speed Insights): real devices and networks. \u003cstrong>This is what Google ranks on and what users feel.\u003c/strong>\u003c/li>\u003c/ul>\n\u003cp>Senior answer: \"I use field data to know \u003cem>whether\u003c/em> we have a problem and \u003cem>where\u003c/em> (which pages, devices). I use lab tools to find \u003cem>why\u003c/em> and to verify fixes. Then I gate regressions in CI with Lighthouse CI or bundle-size budgets.\"\u003c/p>\n\u003cdiv class=\"code\">\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003cpre>\u003ccode data-lang=\"js\">\u003cspan class=\"t-k\">import\u003c/span> { onLCP, onINP, onCLS } \u003cspan class=\"t-k\">from\u003c/span> \u003cspan class=\"t-s\">'web-vitals'\u003c/span>;\n[onLCP, onINP, onCLS].forEach(fn =&gt; fn(metric =&gt; navigator.sendBeacon(\u003cspan class=\"t-s\">'/rum'\u003c/span>, JSON.stringify(metric))));\u003c/code>\u003c/pre>\u003c/div>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>Why does Lighthouse show a different score each run?\u003c/summary>\u003cp>Network and CPU variability, background processes, server response time and third-party scripts vary. That's why I use the median of several runs and rely on field data for decisions.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>What percentile does Google use, and why?\u003c/summary>\u003cp>The 75th percentile, so a page passes only if most real visits are good, not just the average or the fastest users.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">How do you improve LCP? (list 8+ techniques)\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>LCP measures when the largest piece of content, usually the hero image or main heading, appears, and the target is 2.5 seconds or less. I think about it as a chain: getting the HTML, discovering the LCP resource, downloading it, and rendering it. You optimise each link.\u003c/p>\u003cp>For the HTML: a fast server response with CDN caching, static generation or edge rendering, and no client-side redirects. For discovery: render the hero in the server HTML, rather than waiting for JavaScript, and preload the image or use \u003ccode>fetchpriority=\"high\"\u003c/code>, and never lazy-load the LCP image, which is a very common mistake. For download: compress images, use AVIF or WebP at the right size with \u003ccode>srcset\u003c/code>, and preconnect to the image CDN. For rendering: remove render-blocking resources by inlining critical CSS and deferring scripts, optimise web fonts with \u003ccode>font-display\u003c/code> and preloading, and reduce the JavaScript needed before the page renders.\u003c/p>\u003cp>At Bell, lazy-loading below-the-fold content, code splitting and image optimisation together contributed to the roughly 20 percent improvement in load times.\u003c/p>\u003c/div>\n\u003col>\u003cli>\u003cstrong>Fast TTFB\u003c/strong>: CDN, caching HTML (SSG/ISR), edge rendering, fewer server hops.\u003c/li>\u003cli>\u003cstrong>Server-render\u003c/strong> the LCP element (no \"JS must load before the hero shows\").\u003c/li>\u003cli>\u003cstrong>Prioritise the LCP image\u003c/strong>: \u003ccode>fetchpriority=\"high\"\u003c/code>, \u003ccode>&lt;link rel=\"preload\"&gt;\u003c/code>, \u003cstrong>never lazy-load it\u003c/strong>.\u003c/li>\u003cli>Optimise images: AVIF/WebP, correct dimensions, \u003ccode>srcset\u003c/code>/\u003ccode>sizes\u003c/code>, compression, an image CDN.\u003c/li>\u003cli>Remove render-blocking resources: inline \u003cstrong>critical CSS\u003c/strong>, \u003ccode>defer\u003c/code> scripts, load non-critical CSS async.\u003c/li>\u003cli>\u003ccode>preconnect\u003c/code> to critical third-party origins (image CDN, API).\u003c/li>\u003cli>Fonts: \u003ccode>font-display: swap\u003c/code> / \u003ccode>optional\u003c/code>, preload the main font, subset, self-host.\u003c/li>\u003cli>Reduce JS needed before render: code-split, remove unused deps, ship modern JS.\u003c/li>\u003cli>Avoid client-side redirects; use HTTP/2–3 and Brotli compression.\u003c/li>\u003c/ol>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>What are the sub-parts of LCP?\u003c/summary>\u003cp>Time to first byte, resource load delay, which is how late the LCP resource is discovered, resource load duration, and element render delay. DevTools shows this breakdown, so you know which part to fix.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>What if the LCP element is text, not an image?\u003c/summary>\u003cp>Then fonts and render-blocking CSS and JavaScript matter most: inline critical CSS, use \u003ccode>font-display: swap\u003c/code> or a preloaded font, and make sure the text is in the server HTML.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>Why is client-side rendering bad for LCP?\u003c/summary>\u003cp>The browser must download, parse and run JavaScript, and often fetch data, before the main content exists. Server rendering puts it directly in the HTML.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">How do you improve INP?\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>INP, Interaction to Next Paint, replaced FID in 2024. It measures how quickly the page responds visually to clicks, taps and key presses throughout the entire visit, and the target is under 200 milliseconds. The main cause of poor INP is the main thread being busy with JavaScript.\u003c/p>\u003cp>So the fixes are about reducing and breaking up that work. Long tasks over 50 milliseconds should be split up by yielding to the main thread, with \u003ccode>scheduler.yield\u003c/code> or \u003ccode>setTimeout\u003c/code>. In React, I reduce rendering work per interaction: keep state close to where it's used, avoid re-rendering big trees, virtualise long lists, and use \u003ccode>useTransition\u003c/code> so the urgent update, like the button's pressed state, paints first while heavy work happens after. Heavy computation can move to a Web Worker.\u003c/p>\u003cp>On large enterprise sites, third-party scripts are often the biggest problem: tag managers, analytics, chat widgets and A/B testing tools. Auditing them, deferring them, or removing unused ones can make a bigger difference than any code change.\u003c/p>\u003cp>To debug, I use the Performance panel's interactions track and the Long Animation Frames API in real-user monitoring to find which scripts are responsible.\u003c/p>\u003c/div>\n\u003col>\u003cli>\u003cstrong>Break up long tasks\u003c/strong> (&gt; 50 ms): yield to the main thread (\u003ccode>scheduler.yield()\u003c/code>, \u003ccode>setTimeout\u003c/code>), chunk work.\u003c/li>\u003cli>\u003cstrong>Reduce rendering work per interaction\u003c/strong>: avoid re-rendering huge trees (state colocation, memoization, selectors), \u003cstrong>virtualise long lists\u003c/strong>, reduce DOM size.\u003c/li>\u003cli>\u003ccode>useTransition\u003c/code> / \u003ccode>useDeferredValue\u003c/code> so urgent updates paint first.\u003c/li>\u003cli>Give \u003cstrong>immediate visual feedback\u003c/strong> (pressed state, spinner), then do the heavy work.\u003c/li>\u003cli>Move heavy computation to \u003cstrong>Web Workers\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>Audit third-party scripts\u003c/strong> (tag managers, chat, A/B tools, analytics): delay them, load them \u003ccode>async\u003c/code>, or remove them. This is often the #1 issue on big corporate sites.\u003c/li>\u003cli>Debounce/throttle input handlers; avoid layout thrashing.\u003c/li>\u003cli>Hydration cost: less client JS (RSC), progressive/selective hydration.\u003c/li>\u003c/ol>\n\u003cp>Debug with: DevTools Performance panel → interactions track → long tasks; the Web Vitals extension; the \u003cstrong>LoAF (Long Animation Frames) API\u003c/strong> for attribution in RUM.\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>What's the difference between INP and TBT?\u003c/summary>\u003cp>INP is a field metric based on real user interactions. Total Blocking Time is a lab metric measuring how much the main thread was blocked during load, so it's a useful proxy, but not the same thing.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>How do you find which interaction is slow?\u003c/summary>\u003cp>In the field, the \u003ccode>web-vitals\u003c/code> library's attribution build reports the element, interaction type and the long scripts involved. In the lab, the Performance panel's interactions track shows input delay, processing time and presentation delay.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>What is scheduler.yield?\u003c/summary>\u003cp>An API that pauses a long task and lets the browser handle pending input and rendering, then continues your task with high priority, which is better than a plain setTimeout that goes to the back of the queue.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">How do you improve CLS?\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>CLS measures unexpected layout shifts, content jumping around while the page loads, and the target is below 0.1. It's frustrating for users, and on an e-commerce site it can cause a misclick on the wrong button.\u003c/p>\u003cp>The most common cause is images, videos or iframes without dimensions, so the browser doesn't reserve space until they load. I always set \u003ccode>width\u003c/code> and \u003ccode>height\u003c/code> or use CSS \u003ccode>aspect-ratio\u003c/code>. Next is dynamic content: promo banners, cookie consent bars, ads, or personalised content injected after render. I reserve space for them with fixed-size containers or skeletons that match the final size, and I never insert content above existing content unless the user asked for it.\u003c/p>\u003cp>Web fonts can cause shifts when they swap in, so I match the fallback font metrics with \u003ccode>size-adjust\u003c/code> or use \u003ccode>next/font\u003c/code>. For animations I use \u003ccode>transform\u003c/code> instead of changing size or position properties.\u003c/p>\u003cp>One that's easy to miss on corporate sites: A/B testing and personalisation scripts that swap content after the page renders. Evaluating those on the server or at the edge avoids the shift.\u003c/p>\u003c/div>\n\u003cul>\u003cli>Always set \u003ccode>width\u003c/code>/\u003ccode>height\u003c/code> (or CSS \u003ccode>aspect-ratio\u003c/code>) on images, videos and iframes.\u003c/li>\u003cli>\u003cstrong>Reserve space\u003c/strong> for dynamic content: banners, promos, cookie consent, ads, skeletons with the right size.\u003c/li>\u003cli>Don't insert content above existing content (except in response to user input).\u003c/li>\u003cli>Fonts: \u003ccode>size-adjust\u003c/code> / \u003ccode>next/font\u003c/code> to match fallback metrics; \u003ccode>font-display: optional\u003c/code>.\u003c/li>\u003cli>Animate with \u003ccode>transform\u003c/code> instead of \u003ccode>top\u003c/code>/\u003ccode>height\u003c/code>.\u003c/li>\u003cli>Watch late-loading \u003cstrong>personalisation/A/B scripts\u003c/strong> that swap content after render.\u003c/li>\u003c/ul>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>Do layout shifts after user interaction count?\u003c/summary>\u003cp>Shifts within 500 milliseconds of a user input are excluded, because the user expects the page to change. Unexpected shifts later in the session do count.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>How do you debug which element shifted?\u003c/summary>\u003cp>The Performance panel highlights layout shifts and the elements that moved, and the web-vitals attribution build reports the largest shifting element in the field.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Bundle size: how do you analyse and reduce it?\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>To analyse, I use a bundle analyzer: webpack-bundle-analyzer, the Vite visualizer plugin, or source-map-explorer. It shows a map of what's in each chunk and how big it is. I also use the Coverage tab in Chrome DevTools to see how much of the loaded JavaScript and CSS is actually used on a page, and I check bundlephobia before adding a new dependency.\u003c/p>\u003cp>To reduce it: route-level code splitting so each page only loads its own code, and lazy-loading heavy components like modals, charts, maps or reviews until they're needed. Make tree-shaking work, by importing only what you need from a library, using ES module builds, and being careful with barrel files that pull in everything. Replace heavy libraries, for example moment with native \u003ccode>Intl\u003c/code> or date-fns. Remove duplicate versions of the same package, and ship modern JavaScript without unnecessary polyfills. With server components, static parts don't ship JavaScript at all.\u003c/p>\u003cp>And most importantly, I add a bundle size budget in CI, so a pull request that adds 100 KB fails the check and has to be discussed. Without that, bundles grow back within a few months.\u003c/p>\u003c/div>\n\u003cp>\u003cstrong>Analyse:\u003c/strong> \u003ccode>webpack-bundle-analyzer\u003c/code>, \u003ccode>rollup-plugin-visualizer\u003c/code> (Vite), \u003ccode>source-map-explorer\u003c/code>, Next's \u003ccode>@next/bundle-analyzer\u003c/code>, the DevTools Coverage tab (unused JS/CSS), bundlephobia.com before adding deps.\u003c/p>\n\u003cp>\u003cstrong>Reduce:\u003c/strong>\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Route-level code splitting\u003c/strong> (\u003ccode>React.lazy\u003c/code> + \u003ccode>Suspense\u003c/code>, dynamic \u003ccode>import()\u003c/code>); split heavy components (charts, editors, maps, modals) and load them on interaction or visibility.\u003c/li>\u003cli>Tree-shaking: ESM imports (\u003ccode>import debounce from 'lodash-es/debounce'\u003c/code>, not all of lodash). Avoid barrel files that defeat it.\u003c/li>\u003cli>Replace heavy libs: moment → \u003ccode>Intl\u003c/code>/date-fns/dayjs; big UI kits → headless + CSS.\u003c/li>\u003cli>Ship modern JS (fewer polyfills); avoid duplicate package versions (\u003ccode>npm dedupe\u003c/code>).\u003c/li>\u003cli>\u003cstrong>Performance budgets\u003c/strong> in CI (size-limit, bundlesize, Lighthouse CI) so PRs fail when bundles grow.\u003c/li>\u003cli>Server Components keep static parts' JS out of the bundle.\u003c/li>\u003c/ul>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>What's a good JavaScript budget?\u003c/summary>\u003cp>It depends on the audience, but for mobile e-commerce I'd aim for well under 200 kilobytes compressed of JavaScript on the critical path, and treat any big increase as needing justification.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>How do you find duplicate dependencies?\u003c/summary>\u003cp>The bundle analyzer shows the same package in several versions, and \u003ccode>npm ls package-name\u003c/code> explains why. Deduping or aligning versions usually fixes it.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Lazy loading: what can be lazy-loaded and how?\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>Lazy loading means deferring anything that isn't needed for the first view. For code, that means routes and heavy components through dynamic imports: \u003ccode>React.lazy\u003c/code> with Suspense, or \u003ccode>next/dynamic\u003c/code>. Good candidates are modals, image galleries, charts, rich text editors, and below-the-fold sections like reviews and recommendations. I often trigger the load on hover or when the element becomes visible, so it's ready when the user needs it.\u003c/p>\u003cp>Images and iframes can use the native \u003ccode>loading=\"lazy\"\u003c/code> attribute, with the important exception of the hero image, which should load immediately. Third-party widgets like chat or embedded videos can use a facade: a lightweight placeholder that loads the real widget only when clicked. Data can be lazy-loaded with pagination or infinite scroll.\u003c/p>\u003cp>The trade-off is that too much lazy loading creates spinners everywhere and request waterfalls, so the user waits more. The rule is to lazy-load what's not needed for the initial view, and prefetch what's likely to be needed next. At Bell, lazy loading below-the-fold components and route-level splitting were key parts of the load-time improvement.\u003c/p>\u003c/div>\n\u003cul>\u003cli>\u003cstrong>Components / routes\u003c/strong>: \u003ccode>React.lazy(() =&gt; import('./Reviews'))\u003c/code> + \u003ccode>&lt;Suspense&gt;\u003c/code>. Prefetch on hover/visibility for snappy navigation.\u003c/li>\u003cli>\u003cstrong>Images / iframes\u003c/strong>: \u003ccode>loading=\"lazy\"\u003c/code> (native), but never on the LCP image.\u003c/li>\u003cli>\u003cstrong>Below-the-fold sections\u003c/strong>: render when visible (IntersectionObserver) or \u003ccode>content-visibility: auto\u003c/code>.\u003c/li>\u003cli>\u003cstrong>Third-party widgets\u003c/strong> (chat, video): a facade/placeholder until clicked.\u003c/li>\u003cli>\u003cstrong>Data\u003c/strong>: fetch on demand / pagination.\u003c/li>\u003c/ul>\n\u003cp>Trade-off: lazy-loading too much causes spinners and waterfalls. Lazy-load what's \u003cstrong>not needed for the first view\u003c/strong>.\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>What's a request waterfall caused by lazy loading?\u003c/summary>\u003cp>When a lazy component loads, then fetches its data, then lazy-loads a child that fetches more. Each step waits for the previous one. Preloading the code and starting data fetches in parallel avoids it.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>How do you handle a chunk that fails to load after a deployment?\u003c/summary>\u003cp>Catch the chunk load error in an error boundary and reload the page once, and keep old chunks available on the CDN for a while after deploying.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Caching strategy for front-end assets\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>The strategy is built around content hashing. When the build tool puts a hash of the file's contents in the file name, like \u003ccode>app.3f9a1c.js\u003c/code>, the file name changes whenever the content changes. So these assets can be cached for a year with the \u003ccode>immutable\u003c/code> directive: the browser never needs to check them again.\u003c/p>\u003cp>The HTML file is the opposite. It's the entry point that references those hashed files, so it must always be fresh. I serve it with \u003ccode>no-cache\u003c/code>, which means the browser revalidates it every time, or a short CDN cache with \u003ccode>stale-while-revalidate\u003c/code>.\u003c/p>\u003cp>For APIs, I use ETags for conditional requests, and \u003ccode>private\u003c/code> or \u003ccode>no-store\u003c/code> for anything user-specific, so a CDN never caches one user's cart and serves it to someone else. A Service Worker can add offline support and faster repeat visits.\u003c/p>\u003cp>For deployments, the order matters: upload the new hashed assets first, then the new HTML, and keep the old assets for a while. That way, users with the old page open don't hit missing files.\u003c/p>\u003c/div>\n\u003cul>\u003cli>Build outputs with \u003cstrong>content hashes\u003c/strong> (\u003ccode>app.3f9a1c.js\u003c/code>) → \u003ccode>Cache-Control: public, max-age=31536000, immutable\u003c/code>.\u003c/li>\u003cli>\u003cstrong>HTML\u003c/strong> → \u003ccode>no-cache\u003c/code> (revalidate every time) or short \u003ccode>s-maxage\u003c/code> at the CDN plus \u003ccode>stale-while-revalidate\u003c/code>.\u003c/li>\u003cli>APIs: \u003ccode>ETag\u003c/code> / \u003ccode>Last-Modified\u003c/code> for conditional requests; \u003ccode>Cache-Control: private\u003c/code> for user data.\u003c/li>\u003cli>\u003cstrong>Service Worker\u003c/strong> (Workbox) for offline and repeat visits.\u003c/li>\u003cli>On deploy, upload new hashed assets \u003cstrong>first\u003c/strong>, then the HTML, so users never get HTML pointing at missing files. Invalidate only the HTML at the CDN.\u003c/li>\u003c/ul>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>What does stale-while-revalidate do?\u003c/summary>\u003cp>It lets a cache serve a stale response immediately while fetching a fresh one in the background, so users get speed and data updates on the next request.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>What's the difference between no-cache and no-store?\u003c/summary>\u003cp>\u003ccode>no-cache\u003c/code> lets the response be stored but requires revalidation before each use. \u003ccode>no-store\u003c/code> means never store it at all, which is for sensitive data.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Resource hints: preload, prefetch, preconnect, dns-prefetch, modulepreload\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>Resource hints tell the browser about resources it will need before it would discover them itself. \u003ccode>preconnect\u003c/code> sets up the DNS lookup, TCP connection and TLS handshake early, for a critical third-party origin like an image CDN or API. \u003ccode>dns-prefetch\u003c/code> does just the DNS lookup, which is cheaper and is a good fallback.\u003c/p>\u003cp>\u003ccode>preload\u003c/code> fetches a specific resource needed for the current page with high priority, like the hero image or the main web font. \u003ccode>modulepreload\u003c/code> does the same for JavaScript modules. \u003ccode>prefetch\u003c/code> downloads, at low priority, resources likely to be needed for the next navigation. And the newer Speculation Rules API can prerender a likely next page entirely.\u003c/p>\u003cp>The caution is to use them sparingly. If you preload ten things, they compete for bandwidth with the truly critical resources and can make things slower. I usually preload one to three critical resources and verify the effect in the network waterfall.\u003c/p>\u003c/div>\n\u003cul>\u003cli>\u003ccode>preconnect\u003c/code>: early DNS+TCP+TLS to a critical origin.\u003c/li>\u003cli>\u003ccode>dns-prefetch\u003c/code>: DNS only (cheap fallback).\u003c/li>\u003cli>\u003ccode>preload\u003c/code>: fetch a resource needed \u003cstrong>for the current page\u003c/strong> soon (LCP image, critical font) with high priority.\u003c/li>\u003cli>\u003ccode>prefetch\u003c/code>: low-priority fetch for the \u003cstrong>next navigation\u003c/strong>.\u003c/li>\u003cli>\u003ccode>modulepreload\u003c/code>: preload ES modules plus their parsing.\u003c/li>\u003cli>\u003cstrong>Speculation Rules API\u003c/strong>: prerender likely next pages (Chrome).\u003c/li>\u003c/ul>\n\u003cp>Overusing preload competes with critical resources, so preload only 1–3 things.\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>How would you verify a preload helped?\u003c/summary>\u003cp>Compare the network waterfall and LCP before and after. The resource should start downloading earlier. Also check the console for \"preloaded but not used\" warnings.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>What's fetchpriority?\u003c/summary>\u003cp>An attribute that adjusts the priority of a single resource, like \u003ccode>high\u003c/code> for the hero image or \u003ccode>low\u003c/code> for a below-the-fold carousel image, without forcing an extra preload.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Rendering huge lists: what do you do?\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>If I need to show thousands of rows, rendering them all creates a huge DOM, which makes the initial render slow, uses a lot of memory and makes every interaction slower. The standard solution is virtualisation, also called windowing: only render the rows visible in the viewport plus a small buffer, and reuse them as the user scrolls. Libraries like TanStack Virtual or react-window handle this.\u003c/p>\u003cp>The challenges are variable row heights, which need measuring, keeping the scroll position when navigating back, and accessibility. Screen readers only see the rendered rows, so I add attributes like \u003ccode>aria-rowcount\u003c/code> and \u003ccode>aria-setsize\u003c/code>. The browser's find-in-page also won't find rows that aren't rendered.\u003c/p>\u003cp>Before virtualising, I'd question whether the user really needs thousands of rows at once. Pagination, a \"load more\" button, or better filtering and search might be the better UX. And there's a lighter CSS option, \u003ccode>content-visibility: auto\u003c/code>, which lets the browser skip rendering work for off-screen content.\u003c/p>\u003c/div>\n\u003cp>\u003cstrong>Virtualisation / windowing\u003c/strong>: render only visible rows plus a buffer (TanStack Virtual, react-window). That means constant DOM size and smooth scrolling. Considerations: variable row heights, keeping scroll position, a11y (screen readers only see rendered rows, so provide \u003ccode>aria-rowcount\u003c/code>/\u003ccode>aria-setsize\u003c/code>), and in-page search (Ctrl+F) doesn't find hidden rows. Alternatives: pagination, \"load more\", or CSS \u003ccode>content-visibility: auto\u003c/code>.\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>How does virtualisation handle variable row heights?\u003c/summary>\u003cp>It estimates heights first, measures rows after they render, caches the measurements, and adjusts the scroll positions. TanStack Virtual supports dynamic measurement.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>What does content-visibility: auto do?\u003c/summary>\u003cp>It lets the browser skip layout and paint for off-screen content until it's near the viewport. Combine it with \u003ccode>contain-intrinsic-size\u003c/code> so the scrollbar doesn't jump.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Images: the complete checklist\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>Images are usually the largest part of a page's weight, so I treat them as a checklist. First the right format: AVIF or WebP for photos, with fallbacks, and SVG for icons and logos. Then the right size: responsive images with \u003ccode>srcset\u003c/code> and \u003ccode>sizes\u003c/code>, so a phone doesn't download a desktop-sized image, plus good compression.\u003c/p>\u003cp>To prevent layout shift, always set width and height, or an aspect ratio. Lazy-load images below the fold, but give the hero image \u003ccode>fetchpriority=\"high\"\u003c/code> and never lazy-load it, since it's usually the LCP element. \u003ccode>decoding=\"async\"\u003c/code> helps avoid blocking the main thread.\u003c/p>\u003cp>For a large catalogue like Bell's device listings, an image CDN that resizes and converts images on the fly is the way to go, so content editors can upload one high-quality image and every device gets an optimised version. And \u003ccode>picture\u003c/code> lets you serve a different crop for mobile and desktop.\u003c/p>\u003c/div>\n\u003cp>Right format (AVIF &gt; WebP &gt; JPEG; SVG for icons), right size (\u003ccode>srcset\u003c/code> + \u003ccode>sizes\u003c/code>), compression, \u003ccode>width\u003c/code>/\u003ccode>height\u003c/code>, lazy below the fold, \u003ccode>fetchpriority=\"high\"\u003c/code> for the hero, \u003ccode>decoding=\"async\"\u003c/code>, an image CDN (Cloudinary, imgix, CloudFront + Lambda@Edge / Next image optimiser), and responsive art direction with \u003ccode>&lt;picture&gt;\u003c/code>.\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>What does the sizes attribute do?\u003c/summary>\u003cp>It tells the browser how wide the image will be displayed at different viewport widths, so it can choose the right file from \u003ccode>srcset\u003c/code> before CSS loads.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>Why is lazy-loading the hero image bad?\u003c/summary>\u003cp>Lazy images start loading late, after layout, which delays the largest contentful paint, often by hundreds of milliseconds.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Walk me through your Bell performance work (deep dive)\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>Sure. The product pages on Bell's e-commerce site were slow on mobile, which matters because most of the traffic is mobile, and load time affects both conversion and SEO. \u003cspan class=\"fill\">[Our Lighthouse performance score was around X, and LCP was around Y seconds on mobile.]\u003c/span>\u003c/p>\u003cp>I started by measuring rather than guessing. I used Lighthouse and the Chrome Performance panel, and ran a bundle analyzer, which showed that \u003cspan class=\"fill\">[we were shipping one large JavaScript bundle with code for every page, including some heavy libraries]\u003c/span>. Images weren't optimised, and there was unused CSS.\u003c/p>\u003cp>Then I prioritised by impact versus effort. I added route-level code splitting with \u003ccode>React.lazy\u003c/code> and Suspense, and lazy-loaded components below the fold and in modals, so the initial bundle only contained what the first view needed. I optimised images: lazy loading for off-screen images, correct sizes, and explicit dimensions to prevent layout shift, while making sure the hero image wasn't lazy. I fixed our Tailwind configuration so unused classes were purged properly, and removed duplicated legacy CSS. \u003cspan class=\"fill\">[I also replaced or trimmed some heavy dependencies.]\u003c/span>\u003c/p>\u003cp>The result was roughly a 20 percent improvement in load times, plus better Core Web Vitals. \u003cspan class=\"fill\">[LCP went from X to Y.]\u003c/span> To stop it regressing, \u003cspan class=\"fill\">[we added a Lighthouse or bundle-size check to the pipeline]\u003c/span>. If I continued, the next steps would be server rendering for product pages and deeper INP work on third-party scripts.\u003c/p>\u003c/div>\n\u003cp>Use \u003cstrong>Story 1\u003c/strong> from \u003cem>Your Story\u003c/em>. Structure:\u003c/p>\n\u003col>\u003cli>\u003cstrong>Baseline\u003c/strong>: which pages, which metrics (Lighthouse score, LCP, bundle size, \u003cspan class=\"fill\">[CrUX/RUM]\u003c/span>).\u003c/li>\u003cli>\u003cstrong>Diagnosis\u003c/strong>: bundle analyzer showed \u003cspan class=\"fill\">[X]\u003c/span>; the Performance panel showed \u003cspan class=\"fill\">[long tasks from Y]\u003c/span>; images were \u003cspan class=\"fill\">[Z]\u003c/span>.\u003c/li>\u003cli>\u003cstrong>Fixes, prioritised by impact/effort\u003c/strong>: code splitting + lazy loading, image optimisation, Tailwind content purge / removing dead CSS, removing heavy deps, \u003cspan class=\"fill\">[deferring third-party tags]\u003c/span>.\u003c/li>\u003cli>\u003cstrong>Result\u003c/strong>: ~20% faster loads, \u003cspan class=\"fill\">[LCP X→Y]\u003c/span>, better Core Web Vitals and SEO.\u003c/li>\u003cli>\u003cstrong>Guardrails\u003c/strong>: \u003cspan class=\"fill\">[Lighthouse CI / bundle budget / dashboard]\u003c/span>, so it didn't regress.\u003c/li>\u003cli>\u003cstrong>What you'd do next\u003c/strong>: SSR/RSC for product pages, INP work on third-party scripts, image CDN.\u003c/li>\u003c/ol>\n\u003cp>Expect: \"How did you know it was the bundle and not the API?\" → the waterfall in the Network panel, TTFB vs download vs scripting time in the Performance panel.\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>Which single change had the biggest impact?\u003c/summary>\u003cp>\u003cspan class=\"fill\">[Real answer.]\u003c/span> For example: \"Route-level code splitting, because the initial bundle had code for every page. Splitting it cut the JavaScript on the product page by \u003cspan class=\"fill\">[X percent]\u003c/span>.\"\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>How did you prioritise what to fix?\u003c/summary>\u003cp>By estimated impact on the metrics against effort and risk. Quick, low-risk wins like image fixes went first, and larger changes like code splitting went through more testing.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>Did it affect business metrics?\u003c/summary>\u003cp>\u003cspan class=\"fill\">[Only if you know.]\u003c/span> If you have data: \"\u003cspan class=\"fill\">[conversion / bounce rate]\u003c/span> improved by X.\" If not, be honest: \"I didn't have direct access to conversion data, but faster pages are well documented to improve conversion, and our SEO-relevant metrics improved.\"\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>"},{"id":"09-html-css-a11y","title":"HTML, CSS, Accessibility & i18n","html":"\u003ch1 id=\"html-css-accessibility-i18n\">HTML, CSS, Accessibility &amp; i18n\u003c/h1>\n\u003cblockquote>\u003cp>Seniors are expected to \u003cstrong>own quality\u003c/strong>: semantic HTML, accessible components, and responsive, maintainable CSS. Bell is a federally regulated, bilingual company, so \u003cstrong>a11y and EN/FR i18n are great talking points\u003c/strong> for you.\u003c/p>\u003c/blockquote>\n\u003ch2 id=\"accessibility-a11y\">Accessibility (a11y)\u003c/h2>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">What standards and laws apply? (Canada-specific is a bonus)\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>The practical standard is WCAG, the Web Content Accessibility Guidelines, at level AA. Most organisations target 2.1 AA, and 2.2 is increasingly expected. It added criteria like a minimum target size for buttons, focused elements not being hidden behind sticky headers, and accessible authentication. WCAG is organised around four principles: content must be perceivable, operable, understandable and robust.\u003c/p>\u003cp>In Canada, the Accessible Canada Act applies to federally regulated sectors, which includes telecom companies like Bell, and AODA applies to organisations in Ontario. In the US it's the ADA and Section 508, and in Europe the European Accessibility Act has been enforced since 2025.\u003c/p>\u003cp>Beyond the legal side, I'd say accessibility is just good engineering: keyboard support, clear labels and good contrast help everyone, including people on mobile in bright sunlight or people with a temporary injury. And for a company with millions of customers, a significant share of them rely on assistive technology.\u003c/p>\u003c/div>\n\u003cul>\u003cli>\u003cstrong>WCAG 2.1 / 2.2 level AA\u003c/strong> is the practical target. WCAG 2.2 (2023) adds focus-not-obscured, target size (24×24 px minimum), dragging alternatives, accessible authentication and consistent help.\u003c/li>\u003cli>Principles \u003cstrong>POUR\u003c/strong>: Perceivable, Operable, Understandable, Robust.\u003c/li>\u003cli>\u003cstrong>Canada:\u003c/strong> \u003cem>Accessible Canada Act\u003c/em> (federally regulated sectors such as telecom and banking), \u003cstrong>AODA\u003c/strong> (Ontario), and Quebec standards. \u003cstrong>US:\u003c/strong> ADA / Section 508. \u003cstrong>EU:\u003c/strong> European Accessibility Act (enforced from June 2025).\u003c/li>\u003c/ul>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>What are the WCAG contrast requirements?\u003c/summary>\u003cp>For level AA: 4.5 to 1 for normal text, 3 to 1 for large text, and 3 to 1 for user interface components and meaningful graphics, like input borders and icons.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>What's the difference between A, AA and AAA?\u003c/summary>\u003cp>They're conformance levels. A is the minimum, AA is the standard target in most laws and policies, and AAA is the strictest, usually not required for whole sites because some criteria can't be met for all content.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">The first rule of ARIA, and semantic HTML\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>The first rule of ARIA is: if a native HTML element already has the semantics and behaviour you need, use it instead of adding ARIA to a generic element. ARIA only changes what assistive technology announces. It doesn't add any behaviour, so it's easy to make things worse. That's why people say no ARIA is better than bad ARIA.\u003c/p>\u003cp>The classic example is a \u003ccode>div\u003c/code> with an onClick acting as a button. It isn't focusable with the keyboard, doesn't respond to Enter or Space, isn't announced as a button, and can't be disabled properly. A real \u003ccode>button\u003c/code> element gives you all of that for free.\u003c/p>\u003cp>So I start with semantic HTML: buttons for actions, links for navigation, labels for inputs, landmarks like \u003ccode>nav\u003c/code>, \u003ccode>main\u003c/code> and \u003ccode>header\u003c/code>, a logical heading hierarchy, real tables for tabular data, and native elements like \u003ccode>dialog\u003c/code> and \u003ccode>details\u003c/code>. I only reach for ARIA for custom widgets that HTML doesn't provide, like a combobox or tabs, and then I follow the official patterns exactly.\u003c/p>\u003c/div>\n\u003cp>\u003cstrong>\"No ARIA is better than bad ARIA.\"\u003c/strong> Use native elements first: \u003ccode>&lt;button&gt;\u003c/code> (not \u003ccode>&lt;div onClick&gt;\u003c/code>), \u003ccode>&lt;a href&gt;\u003c/code> for navigation, \u003ccode>&lt;label&gt;\u003c/code> for inputs, \u003ccode>&lt;nav&gt;\u003c/code>, \u003ccode>&lt;main&gt;\u003c/code>, \u003ccode>&lt;header&gt;\u003c/code>, \u003ccode>&lt;footer&gt;\u003c/code>, \u003ccode>&lt;dialog&gt;\u003c/code>, \u003ccode>&lt;details&gt;\u003c/code>, \u003ccode>&lt;table&gt;\u003c/code> for tabular data, and a heading hierarchy (\u003ccode>h1\u003c/code> → \u003ccode>h2\u003c/code>...).\u003c/p>\n\u003cp>A \u003ccode>&lt;div onClick&gt;\u003c/code> lacks: focusability, Enter/Space activation, a role announced to screen readers, and disabled semantics. You'd need \u003ccode>role=\"button\" tabIndex={0}\u003c/code> + key handlers, and you'd still miss things.\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>When is ARIA actually necessary?\u003c/summary>\u003cp>For widgets HTML doesn't provide natively, like tabs, comboboxes, tree views, and for dynamic announcements with live regions, or for labelling things that have no visible text, like an icon-only button.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>What's the difference between aria-label and aria-labelledby?\u003c/summary>\u003cp>\u003ccode>aria-label\u003c/code> provides the name as a string. \u003ccode>aria-labelledby\u003c/code> points to another element whose text becomes the name, which is better when visible text already exists, and it's translated with the rest of the page.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">How do you make a custom component accessible? (e.g. dropdown/combobox)\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>I start from the WAI-ARIA Authoring Practices, which define the expected roles, states and keyboard behaviour for widgets like comboboxes, tabs, menus and dialogs. Screen reader users have learned those conventions, so following them matters more than inventing something.\u003c/p>\u003cp>For a combobox, that means the input has \u003ccode>role=\"combobox\"\u003c/code> with \u003ccode>aria-expanded\u003c/code>, \u003ccode>aria-controls\u003c/code> pointing to the list, and \u003ccode>aria-activedescendant\u003c/code> for the highlighted option, and each option has \u003ccode>role=\"option\"\u003c/code> and \u003ccode>aria-selected\u003c/code>. Then the keyboard support: arrows to move, Enter to select, Escape to close, and Tab to leave. Focus management matters too: a visible focus indicator, a logical order, and returning focus sensibly when something closes. Every control needs an accessible name. Dynamic changes, like the number of results, are announced with a live region.\u003c/p>\u003cp>Then I test with the keyboard only and with a real screen reader, NVDA on Windows and VoiceOver on Mac or iPhone, because automated tools can't confirm the experience actually works.\u003c/p>\u003cp>Honestly, for production I'd often use a headless library like Radix or React Aria that has already solved these details, and put our design-system styles on top.\u003c/p>\u003c/div>\n\u003col>\u003cli>Follow the \u003cstrong>WAI-ARIA Authoring Practices (APG)\u003c/strong> pattern for that widget.\u003c/li>\u003cli>Correct \u003cstrong>roles / states / properties\u003c/strong>: \u003ccode>role=\"combobox\"\u003c/code>, \u003ccode>aria-expanded\u003c/code>, \u003ccode>aria-controls\u003c/code>, \u003ccode>aria-activedescendant\u003c/code>, \u003ccode>aria-selected\u003c/code>.\u003c/li>\u003cli>\u003cstrong>Keyboard support\u003c/strong>: Tab in/out, arrows, Enter, Esc, Home/End, type-ahead.\u003c/li>\u003cli>\u003cstrong>Focus management\u003c/strong>: visible focus ring (\u003ccode>:focus-visible\u003c/code>), logical order, return focus after closing.\u003c/li>\u003cli>\u003cstrong>Name, role, value\u003c/strong> exposed: labels via \u003ccode>&lt;label&gt;\u003c/code>, \u003ccode>aria-label\u003c/code> or \u003ccode>aria-labelledby\u003c/code>.\u003c/li>\u003cli>Announce dynamic changes: \u003ccode>aria-live=\"polite\"\u003c/code> (e.g. \"12 results\", \"Item added to cart\").\u003c/li>\u003cli>Test with a \u003cstrong>screen reader\u003c/strong> (NVDA/JAWS on Windows, VoiceOver on Mac/iOS, TalkBack on Android) and keyboard only.\u003c/li>\u003c/ol>\n\u003cp>Or use a \u003cstrong>headless accessible library\u003c/strong> (Radix, React Aria, Headless UI) and style it.\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>What's the difference between aria-activedescendant and roving tabindex?\u003c/summary>\u003cp>With \u003ccode>aria-activedescendant\u003c/code>, focus stays on a container or input, and you point to the visually active child, which is good for comboboxes. With roving tabindex, actual focus moves between children, and only one has tabIndex 0, which suits toolbars and tabs.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>Which screen readers do you test with?\u003c/summary>\u003cp>NVDA with Chrome or Firefox on Windows, and VoiceOver with Safari on Mac and iOS, plus TalkBack on Android for mobile-heavy pages. They behave differently, so testing at least two matters.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Focus management in SPAs\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>In a traditional website, every navigation loads a new page and the browser resets focus to the top, and screen readers announce the new page. In a single-page app, the content changes but focus stays where it was, often on a link that no longer exists, so a screen reader user may not know anything happened.\u003c/p>\u003cp>So on route changes, I move focus to the new page's main heading or main region, or announce the page title in a live region. For modals, focus moves into the dialog, is trapped there while it's open, Escape closes it, and focus returns to the button that opened it. The native \u003ccode>dialog\u003c/code> element handles most of that.\u003c/p>\u003cp>Other practices: a \"skip to main content\" link as the first focusable element, moving focus to the first invalid field or an error summary when a form fails validation, never removing the focus outline without providing a \u003ccode>:focus-visible\u003c/code> style, and using the \u003ccode>inert\u003c/code> attribute to make background content unreachable while an overlay is open.\u003c/p>\u003c/div>\n\u003cul>\u003cli>On \u003cstrong>route change\u003c/strong>, move focus to the new page's \u003ccode>h1\u003c/code> or main region (or announce it); otherwise screen-reader users don't know the page changed.\u003c/li>\u003cli>\u003cstrong>Modals\u003c/strong>: trap focus, \u003ccode>Esc\u003c/code> closes, return focus to the trigger (native \u003ccode>&lt;dialog&gt;\u003c/code> does most of this).\u003c/li>\u003cli>\u003cstrong>Skip link\u003c/strong>: \"Skip to main content\" as the first focusable element.\u003c/li>\u003cli>Errors on submit: focus the first invalid field, or an error summary.\u003c/li>\u003cli>Never \u003ccode>outline: none\u003c/code> without a \u003ccode>:focus-visible\u003c/code> replacement.\u003c/li>\u003cli>The \u003ccode>inert\u003c/code> attribute makes background content unfocusable.\u003c/li>\u003c/ul>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>How do you announce a route change?\u003c/summary>\u003cp>Move focus to the new page's h1 with tabIndex -1, or update a visually hidden live region with the new page title. Some frameworks, like Next.js, include a route announcer.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>What's the difference between :focus and :focus-visible?\u003c/summary>\u003cp>\u003ccode>:focus\u003c/code> applies whenever an element has focus, including mouse clicks. \u003ccode>:focus-visible\u003c/code> applies when the browser decides a focus indicator is helpful, mainly keyboard navigation, so you can show strong focus rings without them appearing on every click.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Accessible forms checklist\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>Every input needs a visible label properly connected with \u003ccode>for\u003c/code> and \u003ccode>id\u003c/code>, not just a placeholder, because placeholders disappear and often have poor contrast. Related controls, like a group of radio buttons for choosing a plan, go in a \u003ccode>fieldset\u003c/code> with a \u003ccode>legend\u003c/code>, so the group's question is announced.\u003c/p>\u003cp>For errors, each message is connected to its field with \u003ccode>aria-describedby\u003c/code>, and the field gets \u003ccode>aria-invalid\u003c/code>. On submit, focus moves to the first error or an error summary. Errors shouldn't be indicated by colour alone, and instructions about format, like a postal code, should appear before the user makes a mistake.\u003c/p>\u003cp>I also use the correct input types and \u003ccode>autocomplete\u003c/code> attributes, like email, tel, postal-code and cc-number. That gives mobile users the right keyboard and lets the browser autofill, which helps everyone, especially people with motor or cognitive disabilities. Required fields are marked both visually and programmatically. On a checkout like Bell's, these details directly affect completion rates.\u003c/p>\u003c/div>\n\u003cp>Every input has a visible \u003ccode>&lt;label&gt;\u003c/code>; group related inputs with \u003ccode>&lt;fieldset&gt;\u003c/code> + \u003ccode>&lt;legend&gt;\u003c/code> (e.g. \"Choose your plan\" radio group); errors are linked with \u003ccode>aria-describedby\u003c/code> and \u003ccode>aria-invalid\u003c/code>; don't rely on colour alone; mark required fields (\u003ccode>required\u003c/code>/\u003ccode>aria-required\u003c/code>); use the right \u003ccode>type\u003c/code> and \u003ccode>autocomplete\u003c/code> (\u003ccode>email\u003c/code>, \u003ccode>tel\u003c/code>, \u003ccode>postal-code\u003c/code>, \u003ccode>cc-number\u003c/code>) for mobile keyboards and autofill; announce error summaries; give clear instructions on format (postal code \u003ccode>A1A 1A1\u003c/code>).\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>Should you validate on blur, on change, or on submit?\u003c/summary>\u003cp>Generally validate on submit first, then on change or blur for fields that already showed an error, so users aren't interrupted while still typing, but get immediate feedback when fixing a mistake.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>Is a placeholder an acceptable label?\u003c/summary>\u003cp>No. It disappears when typing, often has low contrast, and isn't consistently announced. Use a visible label, and placeholder only for an example format.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">How do you test accessibility and make it stick in a team?\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>I use three layers. First, automated tools: eslint-plugin-jsx-a11y in the editor, axe-core in unit tests with jest-axe and in end-to-end tests with Cypress or Playwright, plus Lighthouse. These catch maybe 30 to 40 percent of issues, like missing labels and contrast problems, and they run on every pull request.\u003c/p>\u003cp>Second, manual testing: a keyboard-only pass, testing with a screen reader, zooming to 200 and 400 percent, checking reduced motion and contrast. Using React Testing Library's \u003ccode>getByRole\u003c/code> queries also helps, because if you can't find an element by its role and name, a screen reader user probably can't either.\u003c/p>\u003cp>Third, and most important for making it stick, process. Accessibility goes into the definition of done and the pull request checklist. Accessible patterns are built into the design system, so every team gets them by default and a fix happens in one place. Designers annotate focus order and labels. And periodic audits, ideally with real users of assistive technology, catch what the tools miss.\u003c/p>\u003c/div>\n\u003cul>\u003cli>\u003cstrong>Automated\u003c/strong> (catches ~30–40%): axe-core (\u003ccode>@axe-core/react\u003c/code>, \u003ccode>jest-axe\u003c/code>, \u003ccode>cypress-axe\u003c/code> / \u003ccode>@axe-core/playwright\u003c/code>), eslint-plugin-jsx-a11y, Lighthouse a11y.\u003c/li>\u003cli>\u003cstrong>Manual\u003c/strong>: keyboard-only pass, screen reader, 200% / 400% zoom and reflow, \u003ccode>prefers-reduced-motion\u003c/code>, contrast (4.5:1 text, 3:1 large text and UI components).\u003c/li>\u003cli>\u003cstrong>Process\u003c/strong>: a11y criteria in the Definition of Done, accessible components in the \u003cstrong>design system\u003c/strong> (fix once, fixed everywhere), designers annotate focus order and labels, periodic audits with users of assistive tech.\u003c/li>\u003cli>RTL tests using \u003ccode>getByRole\u003c/code> double as a11y checks.\u003c/li>\u003c/ul>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>What does automated testing miss?\u003c/summary>\u003cp>Whether alt text is actually meaningful, whether the focus order makes sense, whether keyboard interactions work as expected, and whether the screen reader experience is understandable. Those need manual testing.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>How do you convince a product owner to prioritise accessibility?\u003c/summary>\u003cp>Legal requirements, like the Accessible Canada Act for a telecom, the size of the affected audience, better usability for everyone, and SEO benefits. And it's far cheaper to build it in than to retrofit after an audit.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003ch2 id=\"internationalisation-en-fr\">Internationalisation (EN/FR)\u003c/h2>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">How do you build a bilingual (EN/FR) React app?\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>I use an i18n library like react-intl, i18next or next-intl, and no user-visible strings are hard-coded. Everything goes through message keys. Messages use ICU format, which handles plurals and variables properly, and French plural rules differ from English, so string concatenation isn't safe.\u003c/p>\u003cp>For formatting, I use the native \u003ccode>Intl\u003c/code> APIs with the locale. A price in English Canada is \"$1,234.56\", but in French Canada it's \"1 234,56 $\", with a different separator and the symbol after. Same for dates.\u003c/p>\u003cp>For routing and SEO, the locale goes in the URL, like \u003ccode>/en\u003c/code> and \u003ccode>/fr\u003c/code>, with \u003ccode>hreflang\u003c/code> tags, and I set the \u003ccode>lang\u003c/code> attribute on the HTML element so screen readers use the right pronunciation.\u003c/p>\u003cp>Design-wise, French text is typically 20 to 30 percent longer, so layouts can't rely on fixed widths, and we test with real French strings, not just English. Locale messages are loaded per language, missing keys are checked in CI, and there's a workflow with the translation team. And with server rendering, the server and client must use the same locale, otherwise you get hydration mismatches. All of this was part of daily work on Bell's site, since everything had to be bilingual.\u003c/p>\u003c/div>\n\u003cul>\u003cli>A library such as \u003cstrong>react-intl (FormatJS)\u003c/strong>, \u003cstrong>i18next / react-i18next\u003c/strong>, or \u003cstrong>next-intl\u003c/strong>, with message keys instead of hard-coded strings.\u003c/li>\u003cli>\u003cstrong>ICU message format\u003c/strong> for plurals and variables: \u003ccode>{count, plural, one {# article} other {# articles}}\u003c/code>.\u003c/li>\u003cli>\u003cstrong>\u003ccode>Intl\u003c/code> APIs\u003c/strong> for formatting: prices \u003ccode>new Intl.NumberFormat('fr-CA', { style: 'currency', currency: 'CAD' })\u003c/code> gives \u003ccode>1 234,56 $\u003c/code> vs \u003ccode>$1,234.56\u003c/code> in \u003ccode>en-CA\u003c/code>; dates; relative time.\u003c/li>\u003cli>Locale in the \u003cstrong>URL\u003c/strong> (\u003ccode>/en/...\u003c/code>, \u003ccode>/fr/...\u003c/code>) for SEO with \u003ccode>hreflang\u003c/code>; set \u003ccode>&lt;html lang=\"fr\"&gt;\u003c/code> (screen readers switch pronunciation).\u003c/li>\u003cli>\u003cstrong>Layout\u003c/strong>: French is ~20–30% longer, so avoid fixed widths and test truncation. Use CSS logical properties (\u003ccode>margin-inline-start\u003c/code>) if RTL may come.\u003c/li>\u003cli>Lazy-load locale bundles; translation workflow with the content team / a TMS; CI checks for missing keys.\u003c/li>\u003cli>Hydration: the server and client must use the same locale/timezone, or formatted numbers mismatch.\u003c/li>\u003c/ul>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>Why can't you concatenate translated strings?\u003c/summary>\u003cp>Word order, gender and plural rules differ between languages, so \"You have \" plus count plus \" items\" breaks in French. You use full messages with placeholders and ICU plural rules, so translators control the whole sentence.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>How do you handle missing translations?\u003c/summary>\u003cp>A CI check comparing keys between locale files, a fallback to the default language with a logged warning in development, and never shipping with missing keys for production locales.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>How do you avoid hydration mismatches with locale formatting?\u003c/summary>\u003cp>Determine the locale on the server from the URL, pass it explicitly to the client, and always format with an explicit locale and timezone instead of relying on the environment's defaults.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003ch2 id=\"css\">CSS\u003c/h2>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Specificity and the cascade (including @layer)\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>When several rules target the same element, the cascade decides which one wins. In order: first origin and importance, so \u003ccode>!important\u003c/code> declarations and browser versus author styles; then cascade layers; then specificity; and finally source order, where the later rule wins.\u00
