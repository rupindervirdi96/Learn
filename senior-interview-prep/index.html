ies like Comlink make the messaging feel like normal async function calls.\u003c/p>\u003cp>It's worth distinguishing Service Workers, which act as a network proxy for caching, offline support and push notifications, and Shared Workers, which can be shared across tabs. The main trade-off with Web Workers is the messaging overhead and added complexity, so I only use them when profiling shows a real long-task problem.\u003c/p>\u003c/div>\n\u003cp>Separate threads with no DOM access, communicating via \u003ccode>postMessage\u003c/code> (structured clone, or \u003cstrong>transferable\u003c/strong> objects for zero-copy). Use them for CPU-heavy work that would block the main thread: parsing large JSON/CSV, image processing, crypto, search indexes, diffing. Libraries such as Comlink make the API nicer.\u003c/p>\n\u003cp>\u003cstrong>Service Workers\u003c/strong> are different: a network proxy for offline/caching/push (PWA). \u003cstrong>Shared Workers\u003c/strong> are shared across tabs.\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>Can a Web Worker access localStorage or the DOM?\u003c/summary>\u003cp>No. Workers have no DOM and no localStorage. They do have fetch, IndexedDB, timers and WebSockets.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>What are transferable objects?\u003c/summary>\u003cp>Objects like ArrayBuffer whose ownership can be transferred to a worker instead of copied, which makes passing large binary data almost free. After transfer, the sender can't use it anymore.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>How do you use a worker in a Vite or webpack project?\u003c/summary>\u003cp>Create it with \u003ccode>new Worker(new URL('./worker.js', import.meta.url), { type: 'module' })\u003c/code>. Both bundlers recognise that pattern and bundle the worker file.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003ch2 id=\"dom-browser\">DOM &amp; Browser\u003c/h2>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Event delegation, bubbling and capturing\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>When an event happens, it travels in three phases: capturing down from the window to the target, the target phase, then bubbling back up through the ancestors. By default, listeners fire during bubbling.\u003c/p>\u003cp>Event delegation takes advantage of bubbling: instead of attaching a listener to every item in a list, you attach one listener to the parent and use \u003ccode>event.target.closest()\u003c/code> to figure out which item was clicked. It uses less memory and automatically works for items added later.\u003c/p>\u003cp>\u003ccode>stopPropagation\u003c/code> stops the event from travelling further, and \u003ccode>preventDefault\u003c/code> cancels the browser's default action, like a form submission. Note that some events, like \u003ccode>focus\u003c/code> and \u003ccode>blur\u003c/code>, don't bubble, so you use \u003ccode>focusin\u003c/code> and \u003ccode>focusout\u003c/code> instead.\u003c/p>\u003cp>In React this is built in: React uses delegation itself, attaching listeners at the root container, and since React 17 that's the root element rather than the document, which made running multiple React versions on a page safer.\u003c/p>\u003c/div>\n\u003cp>Events go through \u003cstrong>capture\u003c/strong> (window → target), then the \u003cstrong>target\u003c/strong>, then \u003cstrong>bubble\u003c/strong> (target → window). Delegation means attaching one listener on a parent and checking \u003ccode>event.target.closest('[data-id]')\u003c/code>. It uses less memory and works for dynamically added children.\u003c/p>\n\u003cp>\u003ccode>stopPropagation()\u003c/code> stops further propagation; \u003ccode>preventDefault()\u003c/code> cancels default behaviour (form submit, link navigation). Some events don't bubble (\u003ccode>focus\u003c/code>, \u003ccode>blur\u003c/code>; use \u003ccode>focusin\u003c/code>/\u003ccode>focusout\u003c/code>).\u003c/p>\n\u003cp>React note: since React 17, React attaches listeners at the \u003cstrong>root container\u003c/strong>, not \u003ccode>document\u003c/code>.\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>What's the difference between target and currentTarget?\u003c/summary>\u003cp>\u003ccode>target\u003c/code> is the element where the event actually happened, like an icon inside a button. \u003ccode>currentTarget\u003c/code> is the element the listener is attached to.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>When would you use the capture phase?\u003c/summary>\u003cp>When a parent must see an event before children can stop it, like closing a dropdown on any outside click, or for analytics that must observe every click.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>How do you detect a click outside a component in React?\u003c/summary>\u003cp>Add a listener on the document for \u003ccode>pointerdown\u003c/code>, and check whether \u003ccode>ref.current.contains(event.target)\u003c/code>. If not, close it. Remove the listener in the cleanup.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">What happens when you type a URL and press Enter? (front-end-focused answer)\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>First the browser resolves the domain through DNS, then opens a TCP connection and does the TLS handshake, or uses QUIC with HTTP/3. Then it sends the HTTP request. Ideally a CDN edge answers from cache. Otherwise the request goes to the origin server, and the time to the first byte is TTFB.\u003c/p>\u003cp>As HTML arrives, the browser parses it and builds the DOM. When it finds CSS, it fetches it and builds the CSSOM, and CSS is render-blocking. A regular script tag blocks parsing, which is why we use \u003ccode>defer\u003c/code> or modules. The DOM and CSSOM combine into the render tree, then layout calculates geometry, paint fills pixels, and compositing puts layers together on the GPU. Then JavaScript runs, and in a framework like Next.js, hydration makes the page interactive.\u003c/p>\u003cp>I like this question because every step has an optimisation: preconnect and DNS prefetch, CDN caching, Brotli compression, critical CSS, deferred scripts, preloading the LCP image, and reducing JavaScript to speed up hydration. That's essentially the checklist I used on the Bell performance work.\u003c/p>\u003c/div>\n\u003col>\u003cli>\u003cstrong>DNS\u003c/strong> lookup (cached?) → \u003cstrong>TCP + TLS\u003c/strong> handshake (or QUIC for HTTP/3).\u003c/li>\u003cli>HTTP request → maybe a \u003cstrong>CDN\u003c/strong> edge cache hit → server response (watch \u003cstrong>TTFB\u003c/strong>).\u003c/li>\u003cli>The browser \u003cstrong>parses HTML\u003c/strong> → builds the \u003cstrong>DOM\u003c/strong>. It finds CSS (render-blocking) → \u003cstrong>CSSOM\u003c/strong>. A sync \u003ccode>&lt;script&gt;\u003c/code> blocks parsing (use \u003ccode>defer\u003c/code>/\u003ccode>async\u003c/code>/\u003ccode>type=module\u003c/code>).\u003c/li>\u003cli>DOM + CSSOM → \u003cstrong>render tree\u003c/strong> → \u003cstrong>layout\u003c/strong> (geometry) → \u003cstrong>paint\u003c/strong> → \u003cstrong>composite\u003c/strong> (GPU layers).\u003c/li>\u003cli>JS executes → hydration (in SSR frameworks) → the page becomes interactive.\u003c/li>\u003c/ol>\n\u003cp>Optimisations at each step: preconnect/dns-prefetch, CDN, compression (Brotli), HTTP/2–3, critical CSS, \u003ccode>defer\u003c/code> scripts, preload the LCP image, and so on.\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>What's the difference between async and defer on scripts?\u003c/summary>\u003cp>Both download without blocking parsing. \u003ccode>async\u003c/code> runs as soon as it downloads, in any order. \u003ccode>defer\u003c/code> runs in document order after parsing finishes. App bundles should use \u003ccode>defer\u003c/code> or \u003ccode>type=\"module\"\u003c/code>, which is deferred by default.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>What does HTTP/2 change for front-end optimisation?\u003c/summary>\u003cp>It multiplexes many requests over one connection, so old tricks like bundling everything into one file or domain sharding matter less, and granular code splitting becomes more attractive.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>Which of these steps would you look at first on a slow page?\u003c/summary>\u003cp>TTFB first, because nothing happens before the HTML arrives, then render-blocking resources, then the LCP resource and how late it's discovered, and then JavaScript execution time.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Reflow vs repaint; how do you avoid layout thrashing?\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>Reflow, also called layout, is when the browser recalculates the size and position of elements. It's expensive because it can cascade through the page. Repaint is redrawing pixels without changing geometry, like a colour change, which is cheaper. Cheapest of all are changes to \u003ccode>transform\u003c/code> and \u003ccode>opacity\u003c/code>, which can be handled by the compositor on the GPU, so those are what I animate.\u003c/p>\u003cp>Layout thrashing happens when code alternates reading layout values, like \u003ccode>offsetHeight\u003c/code> or \u003ccode>getBoundingClientRect\u003c/code>, with writing styles, typically in a loop. Each read after a write forces the browser to recalculate layout synchronously. The fix is to batch: do all the reads first, then all the writes, or schedule writes with \u003ccode>requestAnimationFrame\u003c/code>.\u003c/p>\u003cp>Other tools: CSS \u003ccode>contain\u003c/code> and \u003ccode>content-visibility: auto\u003c/code> let the browser skip work for off-screen content. I'd use the Performance panel to confirm, because forced reflows show up there clearly with a warning.\u003c/p>\u003c/div>\n\u003cp>\u003cstrong>Reflow (layout)\u003c/strong> recalculates geometry and is expensive. \u003cstrong>Repaint\u003c/strong> redraws pixels. \u003cstrong>Composite-only\u003c/strong> changes (\u003ccode>transform\u003c/code>, \u003ccode>opacity\u003c/code>) are cheapest, so animate those.\u003c/p>\n\u003cp>\u003cstrong>Layout thrashing\u003c/strong> means alternating DOM reads (\u003ccode>offsetHeight\u003c/code>, \u003ccode>getBoundingClientRect\u003c/code>) with writes in a loop, which forces synchronous layout each time. Fix: batch reads, then writes (or use \u003ccode>requestAnimationFrame\u003c/code>), and use \u003ccode>will-change\u003c/code> sparingly. CSS \u003ccode>contain\u003c/code> and \u003ccode>content-visibility: auto\u003c/code> can skip work for off-screen content.\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>Which CSS properties are cheapest to animate?\u003c/summary>\u003cp>\u003ccode>transform\u003c/code> and \u003ccode>opacity\u003c/code>, because they can be handled by the compositor without layout or paint. Animating \u003ccode>width\u003c/code>, \u003ccode>height\u003c/code>, \u003ccode>top\u003c/code> or \u003ccode>left\u003c/code> triggers layout every frame.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>What does will-change do and when is it harmful?\u003c/summary>\u003cp>It hints that an element will animate, so the browser can promote it to its own layer in advance. Overusing it creates too many layers and wastes memory, so I apply it just before an animation and remove it after.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">localStorage vs sessionStorage vs cookies vs IndexedDB\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>Cookies are small, about 4 KB, and they're sent with every request to the server, so they're the right place for session or auth data, especially with the \u003ccode>HttpOnly\u003c/code>, \u003ccode>Secure\u003c/code> and \u003ccode>SameSite\u003c/code> flags, so JavaScript can't read them.\u003c/p>\u003cp>localStorage holds around 5 to 10 MB per origin and persists forever, while sessionStorage is scoped to a single tab and cleared when it closes. Both are synchronous, so they can block the main thread with large data, and both store only strings. Importantly, any script on the page can read them, so I never store auth tokens there, because an XSS bug would leak them.\u003c/p>\u003cp>IndexedDB is asynchronous, can store large amounts of structured data, and is what you'd use for offline-capable apps. The Cache API stores HTTP responses for Service Workers.\u003c/p>\u003cp>So my rule: auth goes in HttpOnly cookies, small user preferences like language go in localStorage, and anything large or offline goes in IndexedDB.\u003c/p>\u003c/div>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>\u003c/th>\u003cth>Size\u003c/th>\u003cth>Sent to server\u003c/th>\u003cth>Lifetime\u003c/th>\u003cth>Notes\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Cookie\u003c/td>\u003ctd>~4 KB\u003c/td>\u003ctd>every request\u003c/td>\u003ctd>configurable\u003c/td>\u003ctd>\u003ccode>HttpOnly\u003c/code>, \u003ccode>Secure\u003c/code>, \u003ccode>SameSite\u003c/code>: \u003cstrong>use for auth sessions\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>localStorage\u003c/td>\u003ctd>~5–10 MB\u003c/td>\u003ctd>no\u003c/td>\u003ctd>permanent\u003c/td>\u003ctd>sync API (blocks), strings only, XSS-readable: \u003cstrong>never store tokens\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>sessionStorage\u003c/td>\u003ctd>~5 MB\u003c/td>\u003ctd>no\u003c/td>\u003ctd>per tab\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>IndexedDB\u003c/td>\u003ctd>large\u003c/td>\u003ctd>no\u003c/td>\u003ctd>permanent\u003c/td>\u003ctd>async, structured data, offline apps\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Cache API\u003c/td>\u003ctd>large\u003c/td>\u003ctd>no\u003c/td>\u003ctd>permanent\u003c/td>\u003ctd>Service Worker responses\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>How do you sync state across tabs?\u003c/summary>\u003cp>Listen to the \u003ccode>storage\u003c/code> event, which fires in other tabs when localStorage changes, or use a \u003ccode>BroadcastChannel\u003c/code>. For a cart, that keeps the count consistent across open tabs.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>What happens if localStorage is full or blocked?\u003c/summary>\u003cp>\u003ccode>setItem\u003c/code> throws a quota error, and in some privacy modes access itself can throw. So I always wrap storage access in try/catch and make the app work without it.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>"},{"id":"03-coding-challenges","title":"Coding Challenges (with Solutions)","html":"\u003ch1 id=\"coding-challenges-with-solutions\">Coding Challenges (with Solutions)\u003c/h1>\n\u003cblockquote>\u003cp>\u003cstrong>Practise rule:\u003c/strong> read the prompt, close the solution, set a timer (JS utilities: 10–15 min, React components: 30–45 min), write it, \u003cem>then\u003c/em> compare. Talk out loud while you code; that's what you'll be graded on.\u003c/p>\u003c/blockquote>\n\u003ch2 id=\"javascript-utilities\">JavaScript Utilities\u003c/h2>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Implement debounce (with cancel and flush)\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>Before coding, I'd clarify: do we need leading or trailing execution, and do we need cancel? I'll assume trailing with cancel and flush.\u003c/p>\u003cp>My approach: debounce returns a new function, and the timer lives in a closure. Every call clears the existing timer and starts a new one, so the original function only runs once calls have stopped for \u003ccode>wait\u003c/code> milliseconds. I store the latest arguments and \u003ccode>this\u003c/code> so it works correctly as a method, and I call the function with \u003ccode>apply\u003c/code>.\u003c/p>\u003cp>\u003ccode>cancel\u003c/code> just clears the timer. \u003ccode>flush\u003c/code> runs the pending call immediately if one exists.\u003c/p>\u003cp>To test it, I'd call it rapidly three times and check it fires once with the last arguments, then check that cancel prevents the call. I'd also mention that in React the debounced function must be created once, with \u003ccode>useMemo\u003c/code> or a ref, otherwise every render creates a new timer and debouncing silently stops working.\u003c/p>\u003c/div>\n\u003cdiv class=\"code\">\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003cpre>\u003ccode data-lang=\"js\">\u003cspan class=\"t-k\">function\u003c/span> debounce(fn, wait = \u003cspan class=\"t-n\">300\u003c/span>) {\n  \u003cspan class=\"t-k\">let\u003c/span> timer = \u003cspan class=\"t-k\">null\u003c/span>;\n  \u003cspan class=\"t-k\">let\u003c/span> lastArgs, lastThis;\n\n  \u003cspan class=\"t-k\">function\u003c/span> debounced(...args) {\n    lastArgs = args;\n    lastThis = \u003cspan class=\"t-k\">this\u003c/span>;              \u003cspan class=\"t-c\">// preserve `this` for method usage\u003c/span>\n    clearTimeout(timer);\n    timer = setTimeout(() =&gt; {\n      timer = \u003cspan class=\"t-k\">null\u003c/span>;\n      fn.apply(lastThis, lastArgs);\n    }, wait);\n  }\n  debounced.cancel = () =&gt; { clearTimeout(timer); timer = \u003cspan class=\"t-k\">null\u003c/span>; };\n  debounced.flush = () =&gt; {\n    \u003cspan class=\"t-k\">if\u003c/span> (timer) { clearTimeout(timer); timer = \u003cspan class=\"t-k\">null\u003c/span>; fn.apply(lastThis, lastArgs); }\n  };\n  \u003cspan class=\"t-k\">return\u003c/span> debounced;\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>Talking points: closure holds \u003ccode>timer\u003c/code>; \u003ccode>this\u003c/code> and args are preserved; follow-ups include a \u003ccode>leading\u003c/code> option, and \u003cstrong>in React you must keep the debounced function stable\u003c/strong> (\u003ccode>useMemo\u003c/code>/\u003ccode>useRef\u003c/code>) or every render creates a new timer.\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>How would you add a leading option?\u003c/summary>\u003cp>On a call, if there's no active timer and leading is enabled, run the function immediately. Then start the timer as usual. On the trailing edge, only call again if there were further calls during the wait.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>How would you add a maxWait?\u003c/summary>\u003cp>Track when the first call in the current burst happened. If the time since then exceeds \u003ccode>maxWait\u003c/code>, run immediately even though calls are still coming. That's what lodash does, and it effectively combines debounce with throttle.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>How do you test it?\u003c/summary>\u003cp>With fake timers: call it several times, advance time by less than the wait and assert it hasn't run, advance past the wait and assert it ran once with the last arguments. Then test cancel and flush.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Implement throttle\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>I'd clarify whether they want a leading call, a trailing call, or both. I'll implement both, because that's what users expect: an immediate response, plus a final call so the last value isn't lost.\u003c/p>\u003cp>I track the timestamp of the last execution. On each call I compute how much time remains in the current window. If no time remains, I run immediately and update the timestamp. If we're still inside the window and no trailing call is scheduled, I schedule one for the remaining time, so the last event in a burst still gets handled.\u003c/p>\u003cp>I'd test it by firing many calls quickly with fake timers and checking it runs at most once per interval, plus once at the end. Then I'd mention that for visual updates on scroll, \u003ccode>requestAnimationFrame\u003c/code> is often better than a fixed interval, and for visibility, \u003ccode>IntersectionObserver\u003c/code> avoids scroll listeners entirely.\u003c/p>\u003c/div>\n\u003cdiv class=\"code\">\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003cpre>\u003ccode data-lang=\"js\">\u003cspan class=\"t-k\">function\u003c/span> throttle(fn, wait = \u003cspan class=\"t-n\">200\u003c/span>) {\n  \u003cspan class=\"t-k\">let\u003c/span> last = \u003cspan class=\"t-n\">0\u003c/span>;\n  \u003cspan class=\"t-k\">let\u003c/span> timer = \u003cspan class=\"t-k\">null\u003c/span>;\n  \u003cspan class=\"t-k\">return\u003c/span> \u003cspan class=\"t-k\">function\u003c/span> throttled(...args) {\n    \u003cspan class=\"t-k\">const\u003c/span> now = Date.now();\n    \u003cspan class=\"t-k\">const\u003c/span> remaining = wait - (now - last);\n    \u003cspan class=\"t-k\">if\u003c/span> (remaining &lt;= \u003cspan class=\"t-n\">0\u003c/span>) {\n      clearTimeout(timer); timer = \u003cspan class=\"t-k\">null\u003c/span>;\n      last = now;\n      fn.apply(\u003cspan class=\"t-k\">this\u003c/span>, args);                 \u003cspan class=\"t-c\">// leading call\u003c/span>\n    } \u003cspan class=\"t-k\">else\u003c/span> \u003cspan class=\"t-k\">if\u003c/span> (!timer) {\n      timer = setTimeout(() =&gt; {            \u003cspan class=\"t-c\">// trailing call\u003c/span>\n        last = Date.now(); timer = \u003cspan class=\"t-k\">null\u003c/span>;\n        fn.apply(\u003cspan class=\"t-k\">this\u003c/span>, args);\n      }, remaining);\n    }\n  };\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>What's the difference between your throttle and requestAnimationFrame throttling?\u003c/summary>\u003cp>Mine uses a fixed time interval. rAF throttling runs at most once per frame, synced with the display, which is better for visual updates like following the mouse, and it pauses automatically in background tabs.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>Why keep the trailing call?\u003c/summary>\u003cp>Without it, the final event in a burst can be lost, for example the final scroll position, so the UI ends in a stale state.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Implement Promise.all (and allSettled)\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>The requirements are: return a promise that resolves to an array of results in the same order as the input, reject as soon as any one rejects, accept non-promise values, and resolve immediately with an empty array for empty input.\u003c/p>\u003cp>Inside a new Promise, I create a results array and a counter. For each item I wrap it with \u003ccode>Promise.resolve\u003c/code>, so plain values work too. When one resolves, I store the value at its original index, not in completion order, which is the bug people usually make. Then I increment the counter, and when the counter equals the length, I resolve with the results. Any rejection calls \u003ccode>reject\u003c/code> directly. Since a promise can only settle once, later results or rejections are ignored automatically.\u003c/p>\u003cp>For allSettled, I'd map every input to a promise that never rejects, converting each outcome into an object with a status and a value or reason, and then reuse Promise.all.\u003c/p>\u003c/div>\n\u003cdiv class=\"code\">\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003cpre>\u003ccode data-lang=\"js\">\u003cspan class=\"t-k\">function\u003c/span> promiseAll(iterable) {\n  \u003cspan class=\"t-k\">return\u003c/span> \u003cspan class=\"t-k\">new\u003c/span> Promise((resolve, reject) =&gt; {\n    \u003cspan class=\"t-k\">const\u003c/span> items = Array.\u003cspan class=\"t-k\">from\u003c/span>(iterable);\n    \u003cspan class=\"t-k\">const\u003c/span> results = \u003cspan class=\"t-k\">new\u003c/span> Array(items.length);\n    \u003cspan class=\"t-k\">let\u003c/span> done = \u003cspan class=\"t-n\">0\u003c/span>;\n    \u003cspan class=\"t-k\">if\u003c/span> (items.length === \u003cspan class=\"t-n\">0\u003c/span>) \u003cspan class=\"t-k\">return\u003c/span> resolve([]);\n    items.forEach((item, i) =&gt; {\n      Promise.resolve(item)            \u003cspan class=\"t-c\">// handles non-promise values\u003c/span>\n        .then(value =&gt; {\n          results[i] = value;          \u003cspan class=\"t-c\">// keep ORDER, not completion order\u003c/span>\n          \u003cspan class=\"t-k\">if\u003c/span> (++done === items.length) resolve(results);\n        })\n        .\u003cspan class=\"t-k\">catch\u003c/span>(reject);                \u003cspan class=\"t-c\">// first rejection wins\u003c/span>\n    });\n  });\n}\n\n\u003cspan class=\"t-k\">function\u003c/span> promiseAllSettled(items) {\n  \u003cspan class=\"t-k\">return\u003c/span> Promise.all(items.map(p =&gt;\n    Promise.resolve(p).then(\n      value =&gt; ({ status: \u003cspan class=\"t-s\">'fulfilled'\u003c/span>, value }),\n      reason =&gt; ({ status: \u003cspan class=\"t-s\">'rejected'\u003c/span>, reason })\n    )\n  ));\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>What happens to the other promises when one rejects?\u003c/summary>\u003cp>They keep running. Promise.all just stops waiting for them, because promises can't be cancelled. If you need real cancellation, pass an AbortSignal to the underlying operations and abort it on failure.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>Implement Promise.race.\u003c/summary>\u003cp>Return a new promise and, for each input, call \u003ccode>Promise.resolve(item).then(resolve, reject)\u003c/code>. The first one to settle wins, because a promise can only settle once.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>Implement Promise.any.\u003c/summary>\u003cp>Like all, but inverted: resolve on the first fulfilment, collect rejections by index, and when every input has rejected, reject with an \u003ccode>AggregateError\u003c/code> of the reasons.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Run async tasks with a concurrency limit (e.g. max 3 uploads at a time)\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>A real example is uploading twenty files with at most three at a time. I'd take an array of task functions, not promises, because a promise has already started running when it's created.\u003c/p>\u003cp>My approach is a worker pool. I create \u003ccode>limit\u003c/code> workers. Each worker loops: it claims the next index from a shared counter, awaits that task, stores the result at that index, and keeps going until there are no tasks left. Because JavaScript is single-threaded, incrementing the shared counter is safe. Then I \u003ccode>await Promise.all\u003c/code> over the workers, and return results in the original order.\u003c/p>\u003cp>Edge cases to mention: the limit being larger than the number of tasks, error handling (whether one failure should stop everything or be collected like allSettled), and progress reporting, for example updating a progress bar per file. I'd also mention that the browser already limits connections per host, but explicit limits matter for things like rate-limited APIs.\u003c/p>\u003c/div>\n\u003cdiv class=\"code\">\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003cpre>\u003ccode data-lang=\"js\">\u003cspan class=\"t-k\">async\u003c/span> \u003cspan class=\"t-k\">function\u003c/span> runWithLimit(tasks, limit = \u003cspan class=\"t-n\">3\u003c/span>) {\n  \u003cspan class=\"t-k\">const\u003c/span> results = \u003cspan class=\"t-k\">new\u003c/span> Array(tasks.length);\n  \u003cspan class=\"t-k\">let\u003c/span> next = \u003cspan class=\"t-n\">0\u003c/span>;\n  \u003cspan class=\"t-k\">async\u003c/span> \u003cspan class=\"t-k\">function\u003c/span> worker() {\n    \u003cspan class=\"t-k\">while\u003c/span> (next &lt; tasks.length) {\n      \u003cspan class=\"t-k\">const\u003c/span> i = next++;                       \u003cspan class=\"t-c\">// claim an index (single-threaded, so safe)\u003c/span>\n      results[i] = \u003cspan class=\"t-k\">await\u003c/span> tasks[i]();\n    }\n  }\n  \u003cspan class=\"t-k\">await\u003c/span> Promise.all(Array.\u003cspan class=\"t-k\">from\u003c/span>({ length: Math.min(limit, tasks.length) }, worker));\n  \u003cspan class=\"t-k\">return\u003c/span> results;\n}\n\u003cspan class=\"t-c\">// usage: runWithLimit(files.map(f =&gt; () =&gt; upload(f)), 3)\u003c/span>\u003c/code>\u003c/pre>\u003c/div>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>How would you stop everything on the first error?\u003c/summary>\u003cp>Set a shared \u003ccode>failed\u003c/code> flag; each worker checks it before claiming the next task, and the outer promise rejects with the first error. For in-flight tasks, pass an AbortSignal and abort it.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>How would you report progress?\u003c/summary>\u003cp>Accept an \u003ccode>onProgress\u003c/code> callback and call it with the completed count after each task finishes, for example to update a progress bar per file upload.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Retry with exponential backoff\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>I'd write an async function that takes the operation and options like the number of retries and a base delay. In a loop, I try the operation and return on success. On failure, if I've used up the retries, I rethrow the last error. Otherwise I wait for the base delay times two to the power of the attempt number, plus some random jitter, and try again.\u003c/p>\u003cp>The jitter matters at scale: if thousands of clients fail at the same moment, you don't want them all retrying in sync and hammering the server again.\u003c/p>\u003cp>The senior points I'd raise: only retry things that are safe to repeat, meaning GET requests or POSTs with an idempotency key. On something like a checkout order submission, a blind retry could create a duplicate order. Also, don't retry 4xx errors except 429, respect the \u003ccode>Retry-After\u003c/code> header, and support an abort signal so the user can cancel.\u003c/p>\u003c/div>\n\u003cdiv class=\"code\">\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003cpre>\u003ccode data-lang=\"js\">\u003cspan class=\"t-k\">async\u003c/span> \u003cspan class=\"t-k\">function\u003c/span> retry(fn, { retries = \u003cspan class=\"t-n\">3\u003c/span>, baseMs = \u003cspan class=\"t-n\">300\u003c/span> } = {}) {\n  \u003cspan class=\"t-k\">for\u003c/span> (\u003cspan class=\"t-k\">let\u003c/span> attempt = \u003cspan class=\"t-n\">0\u003c/span>; ; attempt++) {\n    \u003cspan class=\"t-k\">try\u003c/span> {\n      \u003cspan class=\"t-k\">return\u003c/span> \u003cspan class=\"t-k\">await\u003c/span> fn();\n    } \u003cspan class=\"t-k\">catch\u003c/span> (err) {\n      \u003cspan class=\"t-k\">if\u003c/span> (attempt &gt;= retries) \u003cspan class=\"t-k\">throw\u003c/span> err;\n      \u003cspan class=\"t-k\">const\u003c/span> jitter = Math.random() * baseMs;\n      \u003cspan class=\"t-k\">await\u003c/span> \u003cspan class=\"t-k\">new\u003c/span> Promise(r =&gt; setTimeout(r, baseMs * \u003cspan class=\"t-n\">2\u003c/span> ** attempt + jitter));\n    }\n  }\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>Mention: only retry \u003cstrong>idempotent\u003c/strong> requests (GET, or POST with an idempotency key), don't retry 4xx, add \u003cstrong>jitter\u003c/strong> to avoid thundering herds, and respect the \u003ccode>Retry-After\u003c/code> header.\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>Which errors should not be retried?\u003c/summary>\u003cp>Most 4xx errors, like 400 validation errors, 401 or 403 auth errors and 404s, because retrying won't change the result. Retry network failures, 5xx, and 429 when rate limited, respecting \u003ccode>Retry-After\u003c/code>.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>Why jitter?\u003c/summary>\u003cp>Without jitter, many clients that failed at the same time retry at the same moments, creating synchronised traffic spikes that can keep a recovering server down. Randomness spreads them out.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Deep clone (handle arrays, objects, Date, Map, Set, cycles)\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>First, I'd mention that in real code I'd use \u003ccode>structuredClone\u003c/code>. Then I'd implement it to show the thinking.\u003c/p>\u003cp>It's a recursive function. Primitives and null are returned as they are. For objects, I keep a WeakMap of already-cloned objects, which handles circular references: if I've seen this object, I return its existing clone instead of recursing forever. Then I handle special types: a Date becomes a new Date, a RegExp a new RegExp, and for Map and Set I create a new one and recursively clone the entries. For arrays and plain objects, I create an empty copy, preserving the prototype, register it in the WeakMap before recursing, then copy each own key, including symbol keys, by cloning the value.\u003c/p>\u003cp>Limitations to mention: functions are shared rather than cloned, and DOM nodes and class instances with private state can't be truly cloned. This is also why deep cloning is rarely needed in React: normally we do targeted immutable updates instead.\u003c/p>\u003c/div>\n\u003cdiv class=\"code\">\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003cpre>\u003ccode data-lang=\"js\">\u003cspan class=\"t-k\">function\u003c/span> deepClone(value, seen = \u003cspan class=\"t-k\">new\u003c/span> WeakMap()) {\n  \u003cspan class=\"t-k\">if\u003c/span> (value === \u003cspan class=\"t-k\">null\u003c/span> || \u003cspan class=\"t-k\">typeof\u003c/span> value !== \u003cspan class=\"t-s\">'object'\u003c/span>) \u003cspan class=\"t-k\">return\u003c/span> value;\n  \u003cspan class=\"t-k\">if\u003c/span> (seen.has(value)) \u003cspan class=\"t-k\">return\u003c/span> seen.get(value);           \u003cspan class=\"t-c\">// cycles\u003c/span>\n  \u003cspan class=\"t-k\">if\u003c/span> (value \u003cspan class=\"t-k\">instanceof\u003c/span> Date) \u003cspan class=\"t-k\">return\u003c/span> \u003cspan class=\"t-k\">new\u003c/span> Date(value);\n  \u003cspan class=\"t-k\">if\u003c/span> (value \u003cspan class=\"t-k\">instanceof\u003c/span> RegExp) \u003cspan class=\"t-k\">return\u003c/span> \u003cspan class=\"t-k\">new\u003c/span> RegExp(value.source, value.flags);\n  \u003cspan class=\"t-k\">if\u003c/span> (value \u003cspan class=\"t-k\">instanceof\u003c/span> Map) {\n    \u003cspan class=\"t-k\">const\u003c/span> m = \u003cspan class=\"t-k\">new\u003c/span> Map(); seen.set(value, m);\n    value.forEach((v, k) =&gt; m.set(deepClone(k, seen), deepClone(v, seen)));\n    \u003cspan class=\"t-k\">return\u003c/span> m;\n  }\n  \u003cspan class=\"t-k\">if\u003c/span> (value \u003cspan class=\"t-k\">instanceof\u003c/span> Set) {\n    \u003cspan class=\"t-k\">const\u003c/span> s = \u003cspan class=\"t-k\">new\u003c/span> Set(); seen.set(value, s);\n    value.forEach(v =&gt; s.add(deepClone(v, seen)));\n    \u003cspan class=\"t-k\">return\u003c/span> s;\n  }\n  \u003cspan class=\"t-k\">const\u003c/span> copy = Array.isArray(value) ? [] : Object.create(Object.getPrototypeOf(value));\n  seen.set(value, copy);\n  \u003cspan class=\"t-k\">for\u003c/span> (\u003cspan class=\"t-k\">const\u003c/span> key \u003cspan class=\"t-k\">of\u003c/span> Reflect.ownKeys(value)) copy[key] = deepClone(value[key], seen);\n  \u003cspan class=\"t-k\">return\u003c/span> copy;\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>Then say: \"In real code I'd use \u003ccode>structuredClone\u003c/code>.\"\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>Why use a WeakMap rather than a Map for the seen cache?\u003c/summary>\u003cp>It doesn't keep the original objects alive after cloning finishes. A Map would work too, since it's local to one call, but WeakMap expresses the intent and avoids holding references longer than necessary.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>How do you clone class instances properly?\u003c/summary>\u003cp>My version preserves the prototype with \u003ccode>Object.create\u003c/code>, so methods work, but private fields and internal state can't be copied from the outside. Usually the class should provide its own \u003ccode>clone\u003c/code> method.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Deep equal\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>I start with \u003ccode>Object.is\u003c/code>, which handles identical references, primitives, and even NaN equal to NaN. If either value isn't an object, or is null, and they weren't equal already, I return false.\u003c/p>\u003cp>Then I check that both are arrays or both are not, compare the number of keys, and for every key in the first object, check that the second object has it as its own property and that the values are recursively deep-equal.\u003c/p>\u003cp>Edge cases I'd discuss: Dates and Maps would need special handling, circular structures would need a visited set, and performance on large objects. I'd also point out where this comes up in React. \u003ccode>React.memo\u003c/code> uses shallow comparison by default, not deep, because deep equality on every render can cost more than the re-render it avoids.\u003c/p>\u003c/div>\n\u003cdiv class=\"code\">\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003cpre>\u003ccode data-lang=\"js\">\u003cspan class=\"t-k\">function\u003c/span> deepEqual(a, b) {\n  \u003cspan class=\"t-k\">if\u003c/span> (Object.is(a, b)) \u003cspan class=\"t-k\">return\u003c/span> \u003cspan class=\"t-k\">true\u003c/span>;\n  \u003cspan class=\"t-k\">if\u003c/span> (\u003cspan class=\"t-k\">typeof\u003c/span> a !== \u003cspan class=\"t-s\">'object'\u003c/span> || \u003cspan class=\"t-k\">typeof\u003c/span> b !== \u003cspan class=\"t-s\">'object'\u003c/span> || a === \u003cspan class=\"t-k\">null\u003c/span> || b === \u003cspan class=\"t-k\">null\u003c/span>) \u003cspan class=\"t-k\">return\u003c/span> \u003cspan class=\"t-k\">false\u003c/span>;\n  \u003cspan class=\"t-k\">if\u003c/span> (Array.isArray(a) !== Array.isArray(b)) \u003cspan class=\"t-k\">return\u003c/span> \u003cspan class=\"t-k\">false\u003c/span>;\n  \u003cspan class=\"t-k\">const\u003c/span> keysA = Object.keys(a), keysB = Object.keys(b);\n  \u003cspan class=\"t-k\">if\u003c/span> (keysA.length !== keysB.length) \u003cspan class=\"t-k\">return\u003c/span> \u003cspan class=\"t-k\">false\u003c/span>;\n  \u003cspan class=\"t-k\">return\u003c/span> keysA.every(k =&gt; Object.prototype.hasOwnProperty.call(b, k) &amp;&amp; deepEqual(a[k], b[k]));\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>How would you handle circular references?\u003c/summary>\u003cp>Keep a map of pairs already being compared. If we see the same pair of objects again, treat them as equal for that path, which stops infinite recursion.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>Why doesn't React use deep comparison for props?\u003c/summary>\u003cp>Because deep comparison can be more expensive than re-rendering, especially for big objects, and it would run on every render. Shallow comparison plus immutable updates is cheap and good enough.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Flatten a nested array (with depth), without using .flat()\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>The recursive version uses reduce: for each item, if it's an array and we still have depth left, I recursively flatten it with depth minus one and concatenate the result. Otherwise I append the item. The default depth is Infinity.\u003c/p>\u003cp>Then I'd mention the recursion limit: a very deeply nested array could overflow the stack, so I'd show an iterative version using an explicit stack. I copy the input onto a stack, pop items, push array contents back onto the stack, and collect non-arrays into the output. Because popping reverses the order, I reverse the result at the end.\u003c/p>\u003cp>Complexity is O(n) in the total number of elements. And of course in production code I'd just use the built-in \u003ccode>flat\u003c/code>.\u003c/p>\u003c/div>\n\u003cdiv class=\"code\">\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003cpre>\u003ccode data-lang=\"js\">\u003cspan class=\"t-k\">function\u003c/span> flatten(arr, depth = Infinity) {\n  \u003cspan class=\"t-k\">return\u003c/span> arr.reduce((acc, item) =&gt;\n    Array.isArray(item) &amp;&amp; depth &gt; \u003cspan class=\"t-n\">0\u003c/span>\n      ? acc.concat(flatten(item, depth - \u003cspan class=\"t-n\">1\u003c/span>))\n      : acc.concat([item]), []);\n}\n\u003cspan class=\"t-c\">// Iterative version (no recursion limit):\u003c/span>\n\u003cspan class=\"t-k\">function\u003c/span> flattenIter(arr) {\n  \u003cspan class=\"t-k\">const\u003c/span> stack = [...arr], out = [];\n  \u003cspan class=\"t-k\">while\u003c/span> (stack.length) {\n    \u003cspan class=\"t-k\">const\u003c/span> item = stack.pop();\n    Array.isArray(item) ? stack.push(...item) : out.push(item);\n  }\n  \u003cspan class=\"t-k\">return\u003c/span> out.reverse();\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>What's the time and space complexity?\u003c/summary>\u003cp>O(n) time in the total number of elements, including nested ones. Space is O(n) for the output, plus O(d) recursion depth for the recursive version, or the explicit stack for the iterative one.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>How would you flatten a nested object into dot-notation keys?\u003c/summary>\u003cp>Recursively walk the object, building a path prefix. When the value is a primitive or array, set \u003ccode>result[path] = value\u003c/code>; otherwise recurse with \u003ccode>path + '.' + key\u003c/code>. That's useful for form libraries or translation files.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Memoize a function\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>Memoize returns a wrapper with a cache, a Map, in its closure. On each call I build a key from the arguments. JSON.stringify works for simple arguments, but I'd let the caller pass a custom key function. If the key is in the cache, I return the cached result. Otherwise I call the original function, store the result, and return it.\u003c/p>\u003cp>Then the senior discussion. First, memory: an unbounded cache is a memory leak in a long-running app, so I'd add an LRU limit, or use a WeakMap when the key is an object. Second, async functions: I'd cache the promise itself rather than the result, so two concurrent calls with the same argument share one request instead of both fetching. And if the promise rejects, I remove it from the cache so we can retry. Third, it only makes sense for pure functions.\u003c/p>\u003c/div>\n\u003cdiv class=\"code\">\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003cpre>\u003ccode data-lang=\"js\">\u003cspan class=\"t-k\">function\u003c/span> memoize(fn, keyFn = (...args) =&gt; JSON.stringify(args)) {\n  \u003cspan class=\"t-k\">const\u003c/span> cache = \u003cspan class=\"t-k\">new\u003c/span> Map();\n  \u003cspan class=\"t-k\">return\u003c/span> \u003cspan class=\"t-k\">function\u003c/span> (...args) {\n    \u003cspan class=\"t-k\">const\u003c/span> key = keyFn(...args);\n    \u003cspan class=\"t-k\">if\u003c/span> (cache.has(key)) \u003cspan class=\"t-k\">return\u003c/span> cache.get(key);\n    \u003cspan class=\"t-k\">const\u003c/span> result = fn.apply(\u003cspan class=\"t-k\">this\u003c/span>, args);\n    cache.set(key, result);\n    \u003cspan class=\"t-k\">return\u003c/span> result;\n  };\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>Discuss: unbounded cache (memory leak), so use LRU or a WeakMap for object keys. For async functions cache the \u003cstrong>promise\u003c/strong> so concurrent calls dedupe.\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>Why is JSON.stringify a weak cache key?\u003c/summary>\u003cp>It's slow for large arguments, fails on circular structures, loses functions and undefined, and objects with the same keys in a different order produce different keys. A custom key function is safer.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>How is this different from useMemo?\u003c/summary>\u003cp>My memoize caches results for all arguments forever, across calls. \u003ccode>useMemo\u003c/code> caches only the most recent value per component instance and recalculates when its dependencies change.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Curry\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>Currying transforms a function that takes several arguments into a chain of functions that can take them one or a few at a time.\u003c/p>\u003cp>My implementation returns a \u003ccode>curried\u003c/code> function that collects arguments. If the number of arguments collected so far is at least the original function's \u003ccode>length\u003c/code>, I call the original function. Otherwise I return a new function that accepts more arguments and calls \u003ccode>curried\u003c/code> again with the old and new arguments combined.\u003c/p>\u003cp>The limitation I'd mention is that it relies on \u003ccode>fn.length\u003c/code>, which doesn't count rest parameters or parameters with default values. A practical use is creating specialised functions, for example a currency formatter preconfigured with the locale, though in React code plain closures usually cover this.\u003c/p>\u003c/div>\n\u003cdiv class=\"code\">\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003cpre>\u003ccode data-lang=\"js\">\u003cspan class=\"t-k\">function\u003c/span> curry(fn) {\n  \u003cspan class=\"t-k\">return\u003c/span> \u003cspan class=\"t-k\">function\u003c/span> curried(...args) {\n    \u003cspan class=\"t-k\">return\u003c/span> args.length &gt;= fn.length\n      ? fn.apply(\u003cspan class=\"t-k\">this\u003c/span>, args)\n      : (...more) =&gt; curried.apply(\u003cspan class=\"t-k\">this\u003c/span>, [...args, ...more]);\n  };\n}\n\u003cspan class=\"t-k\">const\u003c/span> add3 = curry((a, b, c) =&gt; a + b + c);\nadd3(\u003cspan class=\"t-n\">1\u003c/span>)(\u003cspan class=\"t-n\">2\u003c/span>)(\u003cspan class=\"t-n\">3\u003c/span>); add3(\u003cspan class=\"t-n\">1\u003c/span>, \u003cspan class=\"t-n\">2\u003c/span>)(\u003cspan class=\"t-n\">3\u003c/span>); \u003cspan class=\"t-c\">// 6\u003c/span>\u003c/code>\u003c/pre>\u003c/div>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>Where is currying actually useful in front-end code?\u003c/summary>\u003cp>Creating preconfigured functions, like event handler factories, \u003ccode>handleChange('email')\u003c/code>, or formatters bound to a locale, and building pipelines in functional style. In everyday React code, a simple closure is usually clearer.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>How would you support placeholders?\u003c/summary>\u003cp>Use a special placeholder symbol in the arguments, and when merging new arguments, fill placeholders first before appending. Only call the function when all required positions are filled with real values.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">EventEmitter (on, off, once, emit)\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>I'd store listeners in a Map from event name to a Set of handlers. A Set avoids duplicates and makes removal easy.\u003c/p>\u003cp>\u003ccode>on\u003c/code> adds the handler and returns an unsubscribe function, a pattern I like because it fits naturally into a React \u003ccode>useEffect\u003c/code> cleanup. \u003ccode>off\u003c/code> deletes the handler. \u003ccode>once\u003c/code> wraps the handler in a function that first removes itself and then calls the original. \u003ccode>emit\u003c/code> calls every handler with the arguments.\u003c/p>\u003cp>One subtle bug to avoid: in \u003ccode>emit\u003c/code>, I iterate over a copy of the handlers, because a handler might unsubscribe itself during the emit, and modifying a collection while iterating it can skip handlers. Other things I'd mention: error isolation, so one throwing handler doesn't stop the others, and memory leaks if components subscribe and never unsubscribe.\u003c/p>\u003c/div>\n\u003cdiv class=\"code\">\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003cpre>\u003ccode data-lang=\"js\">\u003cspan class=\"t-k\">class\u003c/span> EventEmitter {\n  #events = \u003cspan class=\"t-k\">new\u003c/span> Map();\n  on(name, fn) {\n    \u003cspan class=\"t-k\">if\u003c/span> (!\u003cspan class=\"t-k\">this\u003c/span>.#events.has(name)) \u003cspan class=\"t-k\">this\u003c/span>.#events.set(name, \u003cspan class=\"t-k\">new\u003c/span> Set());\n    \u003cspan class=\"t-k\">this\u003c/span>.#events.get(name).add(fn);\n    \u003cspan class=\"t-k\">return\u003c/span> () =&gt; \u003cspan class=\"t-k\">this\u003c/span>.off(name, fn);           \u003cspan class=\"t-c\">// unsubscribe handle\u003c/span>\n  }\n  off(name, fn) { \u003cspan class=\"t-k\">this\u003c/span>.#events.get(name)?.delete(fn); }\n  once(name, fn) {\n    \u003cspan class=\"t-k\">const\u003c/span> wrapper = (...args) =&gt; { \u003cspan class=\"t-k\">this\u003c/span>.off(name, wrapper); fn(...args); };\n    \u003cspan class=\"t-k\">return\u003c/span> \u003cspan class=\"t-k\">this\u003c/span>.on(name, wrapper);\n  }\n  emit(name, ...args) {\n    [...(\u003cspan class=\"t-k\">this\u003c/span>.#events.get(name) ?? [])].forEach(fn =&gt; fn(...args)); \u003cspan class=\"t-c\">// copy: safe if handlers unsubscribe\u003c/span>\n  }\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>How would you make once() removable with off() using the original handler?\u003c/summary>\u003cp>Store a reference from the original handler to its wrapper, for example in a WeakMap, so \u003ccode>off(name, originalFn)\u003c/code> can find and remove the wrapper.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>How would you use this pattern in React?\u003c/summary>\u003cp>Subscribe in a \u003ccode>useEffect\u003c/code> and return the unsubscribe function as the cleanup, or better, wrap the emitter in \u003ccode>useSyncExternalStore\u003c/code> if components need to read state from it.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">LRU Cache (O(1) get/put)\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>The requirement is O(1) for both get and put, with the least recently used item evicted when capacity is exceeded.\u003c/p>\u003cp>In JavaScript, a Map makes this elegant because it remembers insertion order. On \u003ccode>get\u003c/code>, if the key exists, I delete it and set it again, which moves it to the end as most recently used, then return the value. On \u003ccode>put\u003c/code>, I delete the key if it exists, set it, and if the size exceeds capacity, I evict the first key from \u003ccode>map.keys()\u003c/code>, which is the oldest.\u003c/p>\u003cp>If they want the classic implementation, I'd explain a hash map pointing into a doubly linked list. The map gives O(1) lookup, and the list gives O(1) moving a node to the front and removing the tail. In front-end terms, I'd use this for things like caching autocomplete results or API responses with bounded memory.\u003c/p>\u003c/div>\n\u003cdiv class=\"code\">\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003cpre>\u003ccode data-lang=\"js\">\u003cspan class=\"t-k\">class\u003c/span> LRUCache {\n  constructor(capacity) { \u003cspan class=\"t-k\">this\u003c/span>.capacity = capacity; \u003cspan class=\"t-k\">this\u003c/span>.map = \u003cspan class=\"t-k\">new\u003c/span> Map(); }\n  get(key) {\n    \u003cspan class=\"t-k\">if\u003c/span> (!\u003cspan class=\"t-k\">this\u003c/span>.map.has(key)) \u003cspan class=\"t-k\">return\u003c/span> -\u003cspan class=\"t-n\">1\u003c/span>;\n    \u003cspan class=\"t-k\">const\u003c/span> value = \u003cspan class=\"t-k\">this\u003c/span>.map.get(key);\n    \u003cspan class=\"t-k\">this\u003c/span>.map.delete(key); \u003cspan class=\"t-k\">this\u003c/span>.map.set(key, value);   \u003cspan class=\"t-c\">// move to most-recent\u003c/span>\n    \u003cspan class=\"t-k\">return\u003c/span> value;\n  }\n  put(key, value) {\n    \u003cspan class=\"t-k\">this\u003c/span>.map.delete(key);\n    \u003cspan class=\"t-k\">this\u003c/span>.map.set(key, value);\n    \u003cspan class=\"t-k\">if\u003c/span> (\u003cspan class=\"t-k\">this\u003c/span>.map.size &gt; \u003cspan class=\"t-k\">this\u003c/span>.capacity) {\n      \u003cspan class=\"t-k\">this\u003c/span>.map.delete(\u003cspan class=\"t-k\">this\u003c/span>.map.keys().next().value);  \u003cspan class=\"t-c\">// oldest = first inserted\u003c/span>\n    }\n  }\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>A Map preserves insertion order, which is what makes this neat. The \"classic\" answer is a hashmap + doubly linked list.\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>Why is the Map solution O(1)?\u003c/summary>\u003cp>\u003ccode>get\u003c/code>, \u003ccode>set\u003c/code>, \u003ccode>delete\u003c/code> and \u003ccode>has\u003c/code> on a Map are O(1) on average, and getting the first key from the iterator is O(1). Re-inserting a key moves it to the end of the insertion order.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>How would you add a time-to-live?\u003c/summary>\u003cp>Store an expiry time with each value. On \u003ccode>get\u003c/code>, if it's expired, delete it and return a miss. Optionally clean up periodically.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Polyfill Array.prototype.map / filter / reduce\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>For map, I add a method to Array.prototype using a regular function so \u003ccode>this\u003c/code> refers to the array. I create an output array of the same length, loop over the indices, and for each index that actually exists, I call the callback with the value, the index and the array, using the optional \u003ccode>thisArg\u003c/code>, and store the result. Checking \u003ccode>i in this\u003c/code> preserves holes in sparse arrays, which matches the spec.\u003c/p>\u003cp>For reduce, the tricky part is the initial value. If one is provided, I start with it at index 0. If not, I use the first existing element as the accumulator and start from the next index. If the array is empty with no initial value, I throw a TypeError like the native version. Then I loop and update the accumulator.\u003c/p>\u003cp>I'd also mention that in real projects you shouldn't modify built-in prototypes. This is just to show understanding.\u003c/p>\u003c/div>\n\u003cdiv class=\"code\">\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003cpre>\u003ccode data-lang=\"js\">Array.prototype.myMap = \u003cspan class=\"t-k\">function\u003c/span> (cb, thisArg) {\n  \u003cspan class=\"t-k\">const\u003c/span> out = \u003cspan class=\"t-k\">new\u003c/span> Array(\u003cspan class=\"t-k\">this\u003c/span>.length);\n  \u003cspan class=\"t-k\">for\u003c/span> (\u003cspan class=\"t-k\">let\u003c/span> i = \u003cspan class=\"t-n\">0\u003c/span>; i &lt; \u003cspan class=\"t-k\">this\u003c/span>.length; i++) {\n    \u003cspan class=\"t-k\">if\u003c/span> (i \u003cspan class=\"t-k\">in\u003c/span> \u003cspan class=\"t-k\">this\u003c/span>) out[i] = cb.call(thisArg, \u003cspan class=\"t-k\">this\u003c/span>[i], i, \u003cspan class=\"t-k\">this\u003c/span>); \u003cspan class=\"t-c\">// skip holes\u003c/span>\n  }\n  \u003cspan class=\"t-k\">return\u003c/span> out;\n};\n\nArray.prototype.myReduce = \u003cspan class=\"t-k\">function\u003c/span> (cb, ...init) {\n  \u003cspan class=\"t-k\">let\u003c/span> i = \u003cspan class=\"t-n\">0\u003c/span>, acc;\n  \u003cspan class=\"t-k\">if\u003c/span> (init.length) acc = init[\u003cspan class=\"t-n\">0\u003c/span>];\n  \u003cspan class=\"t-k\">else\u003c/span> {\n    \u003cspan class=\"t-k\">while\u003c/span> (i &lt; \u003cspan class=\"t-k\">this\u003c/span>.length &amp;&amp; !(i \u003cspan class=\"t-k\">in\u003c/span> \u003cspan class=\"t-k\">this\u003c/span>)) i++;\n    \u003cspan class=\"t-k\">if\u003c/span> (i &gt;= \u003cspan class=\"t-k\">this\u003c/span>.length) \u003cspan class=\"t-k\">throw\u003c/span> \u003cspan class=\"t-k\">new\u003c/span> TypeError(\u003cspan class=\"t-s\">'Reduce of empty array with no initial value'\u003c/span>);\n    acc = \u003cspan class=\"t-k\">this\u003c/span>[i++];\n  }\n  \u003cspan class=\"t-k\">for\u003c/span> (; i &lt; \u003cspan class=\"t-k\">this\u003c/span>.length; i++) \u003cspan class=\"t-k\">if\u003c/span> (i \u003cspan class=\"t-k\">in\u003c/span> \u003cspan class=\"t-k\">this\u003c/span>) acc = cb(acc, \u003cspan class=\"t-k\">this\u003c/span>[i], i, \u003cspan class=\"t-k\">this\u003c/span>);\n  \u003cspan class=\"t-k\">return\u003c/span> acc;\n};\u003c/code>\u003c/pre>\u003c/div>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>Why should you avoid modifying built-in prototypes in real code?\u003c/summary>\u003cp>It can conflict with future language features or other libraries, which has actually happened, and it creates surprising global behaviour. Polyfills should be spec-compliant and only defined if missing.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>Implement filter.\u003c/summary>\u003cp>Same structure as map: loop over indices that exist, call the callback with value, index and array, and push the value into the result if the callback returns truthy.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Implement Function.prototype.bind\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>\u003ccode>bind\u003c/code> returns a new function with \u003ccode>this\u003c/code> fixed and optionally some arguments preset.\u003c/p>\u003cp>Inside \u003ccode>myBind\u003c/code>, \u003ccode>this\u003c/code> is the original function, so I save it. I return a \u003ccode>bound\u003c/code> function that, when called, applies the original function with the saved context and the preset arguments followed by the new arguments.\u003c/p>\u003cp>The edge case that shows deeper knowledge is \u003ccode>new\u003c/code>. If the bound function is called with \u003ccode>new\u003c/code>, the spec says the bound \u003ccode>this\u003c/code> is ignored and a new instance is created. I check \u003ccode>new.target\u003c/code>, and if it's set, I construct the original function with all the arguments. A complete implementation would also preserve the prototype and set the name and length, but I'd mention those rather than code them unless asked.\u003c/p>\u003c/div>\n\u003cdiv class=\"code\">\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003cpre>\u003ccode data-lang=\"js\">Function.prototype.myBind = \u003cspan class=\"t-k\">function\u003c/span> (ctx, ...preset) {\n  \u003cspan class=\"t-k\">const\u003c/span> fn = \u003cspan class=\"t-k\">this\u003c/span>;\n  \u003cspan class=\"t-k\">return\u003c/span> \u003cspan class=\"t-k\">function\u003c/span> bound(...args) {\n    \u003cspan class=\"t-k\">if\u003c/span> (\u003cspan class=\"t-k\">new\u003c/span>.target) \u003cspan class=\"t-k\">return\u003c/span> \u003cspan class=\"t-k\">new\u003c/span> fn(...preset, ...args); \u003cspan class=\"t-c\">// `new` ignores bound this\u003c/span>\n    \u003cspan class=\"t-k\">return\u003c/span> fn.apply(ctx, [...preset, ...args]);\n  };\n};\u003c/code>\u003c/pre>\u003c/div>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>Why use new.target?\u003c/summary>\u003cp>To detect whether the bound function was called with \u003ccode>new\u003c/code>. In that case the spec says the bound \u003ccode>this\u003c/code> is ignored and a new instance of the original function is created.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>How is bind different from an arrow function wrapper?\u003c/summary>\u003cp>Functionally similar for \u003ccode>this\u003c/code>, but bind also supports partial application, works with \u003ccode>new\u003c/code>, and creates a function with a specific name and length.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Get a nested value by path: get(obj, 'a.b[0].c', default)\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>This is like lodash's \u003ccode>get\u003c/code>. The function takes an object, a path and a default value. The path can be a string with dots and brackets, or an array of keys.\u003c/p>\u003cp>First I normalise the string path: I convert bracket notation, like \u003ccode>[0]\u003c/code>, into dot notation with a regex, split on dots, and filter out empty segments. Then I walk through the keys. If at any point the current value is null or undefined, I return the default. Otherwise I move one level deeper. At the end, if the result is undefined, I return the default, otherwise the value.\u003c/p>\u003cp>I'd mention that with modern JavaScript, optional chaining covers most static cases, so a helper like this is mainly useful when the path is dynamic, for example form field names like \"address.postalCode\" in a form library.\u003c/p>\u003c/div>\n\u003cdiv class=\"code\">\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003cpre>\u003ccode data-lang=\"js\">\u003cspan class=\"t-k\">function\u003c/span> get(obj, path, fallback) {\n  \u003cspan class=\"t-k\">const\u003c/span> keys = Array.isArray(path) ? path : path.replace(/\\[(\\w+)\\]/g, \u003cspan class=\"t-s\">'.$1'\u003c/span>).split(\u003cspan class=\"t-s\">'.'\u003c/span>).filter(Boolean);\n  \u003cspan class=\"t-k\">let\u003c/span> cur = obj;\n  \u003cspan class=\"t-k\">for\u003c/span> (\u003cspan class=\"t-k\">const\u003c/span> k \u003cspan class=\"t-k\">of\u003c/span> keys) {\n    \u003cspan class=\"t-k\">if\u003c/span> (cur == \u003cspan class=\"t-k\">null\u003c/span>) \u003cspan class=\"t-k\">return\u003c/span> fallback;\n    cur = cur[k];\n  }\n  \u003cspan class=\"t-k\">return\u003c/span> cur === \u003cspan class=\"t-k\">undefined\u003c/span> ? fallback : cur;\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>Now implement set(obj, path, value).\u003c/summary>\u003cp>Walk the path, creating an object or array at each missing level, depending on whether the next key is numeric, and assign the value at the last key. For immutable versions, copy each level along the path instead of mutating.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>What about keys that contain dots?\u003c/summary>\u003cp>Accept the path as an array of keys, which removes the ambiguity. String paths are a convenience, not the canonical format.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Classic algorithm warm-ups that appear in front-end screens\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>For front-end screens the algorithm questions are usually moderate, and the key is to talk through complexity.\u003c/p>\u003cp>My general approach: clarify the input and edge cases, describe a brute-force solution and its complexity, then optimise. Most of these optimise with the right data structure. A hash map turns lookups like two-sum or finding duplicates into O(n). A stack handles matching brackets or undo history. Sorting first helps with interval merging. BFS and DFS show up as tree problems, and in front end the tree is often the DOM itself, like finding all elements matching a condition or computing the depth of nested comments.\u003c/p>\u003cp>I always state time and space complexity at the end, test with an empty input and a single element, and mention the trade-off if there's one, like using extra memory for speed.\u003c/p>\u003c/div>\n\u003cul>\u003cli>\u003cstrong>Two-sum\u003c/strong> → hash map, O(n).\u003c/li>\u003cli>\u003cstrong>Valid parentheses\u003c/strong> → stack.\u003c/li>\u003cli>\u003cstrong>Group anagrams\u003c/strong> → Map keyed by sorted string.\u003c/li>\u003cli>\u003cstrong>Find duplicates / first non-repeating char\u003c/strong> → frequency Map.\u003c/li>\u003cli>\u003cstrong>Merge intervals\u003c/strong> → sort by start, then merge.\u003c/li>\u003cli>\u003cstrong>Binary search\u003c/strong>, \u003cstrong>BFS on a tree\u003c/strong> (e.g. traverse the DOM: \u003ccode>document.body\u003c/code> children level by level).\u003c/li>\u003cli>\u003cstrong>Get element by id without the API\u003c/strong> → DFS over \u003ccode>node.children\u003c/code>.\u003c/li>\u003c/ul>\n\u003cp>Always state the time/space complexity.\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>What's the complexity of two-sum with a hash map?\u003c/summary>\u003cp>O(n) time and O(n) space: one pass, checking if the complement is in the map before adding the current number.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>How would you find all elements with a given class name without the DOM API?\u003c/summary>\u003cp>Traverse the tree from the root, depth-first with recursion or a stack, checking each node's \u003ccode>classList\u003c/code> and collecting matches. That's O(n) in the number of nodes.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003ch2 id=\"react-components-hooks\">React Components &amp; Hooks\u003c/h2>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">useDebounce hook + search box with cancellation\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>I'd break this into two pieces. First, a \u003ccode>useDebounce\u003c/code> hook: it keeps a debounced copy of a value in state, and in an effect, sets a timeout to update it after the delay. The cleanup clears the timeout, so each keystroke resets the timer.\u003c/p>\u003cp>Then the search component: the input is controlled, so typing is instant, and the fetch effect depends on the debounced query instead of the raw input. In that effect I create an AbortController and return a cleanup that aborts it, so a slow response for an old query can never overwrite newer results. I track status as idle, loading, success or error, rather than separate booleans, and I ignore AbortErrors.\u003c/p>\u003cp>For accessibility, the input has a label and loading and error messages are announced with a status or alert role. And I'd close by saying that in production I'd use TanStack Query, with the debounced query in the query key, which also gives me caching, so going back to a previous search is instant.\u003c/p>\u003c/div>\n\u003cdiv class=\"code\">\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003cpre>\u003ccode data-lang=\"jsx\">\u003cspan class=\"t-k\">function\u003c/span> useDebounce(value, delay = \u003cspan class=\"t-n\">300\u003c/span>) {\n  \u003cspan class=\"t-k\">const\u003c/span> [debounced, setDebounced] = useState(value);\n  useEffect(() =&gt; {\n    \u003cspan class=\"t-k\">const\u003c/span> id = setTimeout(() =&gt; setDebounced(value), delay);\n    \u003cspan class=\"t-k\">return\u003c/span> () =&gt; clearTimeout(id);\n  }, [value, delay]);\n  \u003cspan class=\"t-k\">return\u003c/span> debounced;\n}\n\n\u003cspan class=\"t-k\">function\u003c/span> Search() {\n  \u003cspan class=\"t-k\">const\u003c/span> [query, setQuery] = useState(\u003cspan class=\"t-s\">''\u003c/span>);\n  \u003cspan class=\"t-k\">const\u003c/span> q = useDebounce(query.trim(), \u003cspan class=\"t-n\">300\u003c/span>);\n  \u003cspan class=\"t-k\">const\u003c/span> [state, setState] = useState({ status: \u003cspan class=\"t-s\">'idle'\u003c/span>, data: [] });\n\n  useEffect(() =&gt; {\n    \u003cspan class=\"t-k\">if\u003c/span> (!q) { setState({ status: \u003cspan class=\"t-s\">'idle'\u003c/span>, data: [] }); \u003cspan class=\"t-k\">return\u003c/span>; }\n    \u003cspan class=\"t-k\">const\u003c/span> ctrl = \u003cspan class=\"t-k\">new\u003c/span> AbortController();\n    setState(s =&gt; ({ ...s, status: \u003cspan class=\"t-s\">'loading'\u003c/span> }));\n    fetch(\u003cspan class=\"t-s\">'/api/search?q='\u003c/span> + encodeURIComponent(q), { signal: ctrl.signal })\n      .then(r =&gt; { \u003cspan class=\"t-k\">if\u003c/span> (!r.ok) \u003cspan class=\"t-k\">throw\u003c/span> \u003cspan class=\"t-k\">new\u003c/span> Error(r.statusText); \u003cspan class=\"t-k\">return\u003c/span> r.json(); })\n      .then(data =&gt; setState({ status: \u003cspan class=\"t-s\">'success'\u003c/span>, data }))\n      .\u003cspan class=\"t-k\">catch\u003c/span>(err =&gt; { \u003cspan class=\"t-k\">if\u003c/span> (err.name !== \u003cspan class=\"t-s\">'AbortError'\u003c/span>) setState({ status: \u003cspan class=\"t-s\">'error'\u003c/span>, data: [] }); });\n    \u003cspan class=\"t-k\">return\u003c/span> () =&gt; ctrl.abort();\n  }, [q]);\n\n  \u003cspan class=\"t-k\">return\u003c/span> (\n    &lt;div&gt;\n      &lt;label htmlFor=\u003cspan class=\"t-s\">\"search\"\u003c/span>&gt;Search products&lt;/label&gt;\n      &lt;input id=\u003cspan class=\"t-s\">\"search\"\u003c/span> value={query} onChange={e =&gt; setQuery(e.target.value)} /&gt;\n      {state.status === \u003cspan class=\"t-s\">'loading'\u003c/span> &amp;&amp; &lt;p role=\u003cspan class=\"t-s\">\"status\"\u003c/span>&gt;Loading…&lt;/p&gt;}\n      {state.status === \u003cspan class=\"t-s\">'error'\u003c/span> &amp;&amp; &lt;p role=\u003cspan class=\"t-s\">\"alert\"\u003c/span>&gt;Something went wrong.&lt;/p&gt;}\n      &lt;ul&gt;{state.data.map(item =&gt; &lt;li key={item.id}&gt;{item.name}&lt;/li&gt;)}&lt;/ul&gt;\n    &lt;/div&gt;\n  );\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>Mention: in production, use \u003cstrong>TanStack Query\u003c/strong> (\u003ccode>queryKey: ['search', q]\u003c/code>), which gives caching, dedupe and cancellation for free.\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>Why debounce the value rather than the fetch function?\u003c/summary>\u003cp>Debouncing a value is idiomatic with React's data flow. The effect just depends on the debounced value, and cleanup is automatic. Debouncing a function requires keeping it stable across renders and cancelling it on unmount.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>How would you show previous results while new ones load?\u003c/summary>\u003cp>Keep the old data in state and only replace it on success, with a subtle loading indicator. TanStack Query does that with \u003ccode>placeholderData: keepPreviousData\u003c/code>.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>How would you test this component?\u003c/summary>\u003cp>With MSW for the API and fake timers: type into the input, advance timers past the debounce, and assert with \u003ccode>findBy\u003c/code> that the results appear, plus an error-state test with a failing handler.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Accessible Autocomplete / Typeahead (the most common senior question)\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>I'd start with requirements: minimum characters, debounce delay, max results, keyboard support, whether the data is local or remote, and whether to cache.\u003c/p>\u003cp>The architecture is a controlled input, a debounced query, and an effect that fetches suggestions with an AbortController to prevent race conditions. I'd add a small cache in a ref keyed by query, so backspacing or retyping is instant.\u003c/p>\u003cp>For keyboard and screen readers I follow the ARIA combobox pattern: the input has \u003ccode>role=\"combobox\"\u003c/code>, \u003ccode>aria-expanded\u003c/code>, \u003ccode>aria-controls\u003c/code> pointing to the listbox, and \u003ccode>aria-activedescendant\u003c/code> pointing to the highlighted option. Arrow keys move the active index, Enter selects, and Escape closes. One detail people miss: clicking an option fires blur on the input first, which can close the list before the click registers, so I prevent default on mousedown.\u003c/p>\u003cp>At Bell, a real example is the address autocomplete for checking internet availability: debounce, cancellation and caching all mattered there. For scale I'd add virtualisation for long lists and highlighting of the matched text.\u003c/p>\u003c/div>\n\u003cp>Requirements to ask about: min chars? debounce? highlight matches? keyboard nav? async source? caching? max results?\u003c/p>\n\u003cdiv class=\"code\">\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003cp
