de> in CI, so installs are reproducible, and review lockfile changes in pull requests. Use automated tools like Dependabot, Renovate or Snyk for vulnerabilities, and act quickly on critical ones. Be selective about adding dependencies, checking maintenance, popularity and size. Reduce exposure to install scripts, which is how many attacks run, by disabling them or allow-listing the packages that need them. And delay adopting brand-new versions with a minimum release age policy, since most malicious versions are caught within days.\u003c/p>\u003cp>At enterprise scale, like Bell, packages often come through a private registry or proxy that can scan and block packages. And on the runtime side, Subresource Integrity and CSP limit the damage if a third-party script is compromised.\u003c/p>\u003c/div>\n\u003cp>Recent real incidents (e.g. 2025 npm worm/phishing compromises of popular packages) make this a hot topic. Practices:\u003c/p>\n\u003cul>\u003cli>Lockfiles committed; \u003cstrong>\u003ccode>npm ci\u003c/code>\u003c/strong> in CI; pin versions; review lockfile diffs.\u003c/li>\u003cli>\u003ccode>npm audit\u003c/code> / \u003cstrong>Dependabot / Renovate / Snyk\u003c/strong>; act on critical CVEs quickly.\u003c/li>\u003cli>Minimise dependencies (check bundlephobia, maintenance, downloads).\u003c/li>\u003cli>Disable install scripts where possible (\u003ccode>--ignore-scripts\u003c/code>, pnpm \u003ccode>onlyBuiltDependencies\u003c/code>), use \u003cstrong>minimum release age\u003c/strong> policies (don't auto-install versions published hours ago), and provenance/signatures (npm provenance, Sigstore).\u003c/li>\u003cli>Private registry/proxy (Artifactory, CodeArtifact) at enterprises like Bell.\u003c/li>\u003cli>SRI for third-party CDN scripts and CSP to limit the blast radius.\u003c/li>\u003c/ul>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>What does npm ci do differently from npm install?\u003c/summary>\u003cp>It installs exactly what's in the lockfile, fails if package.json and the lockfile don't match, and starts from a clean node_modules. That makes builds reproducible.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>What would you do if a dependency was reported compromised?\u003c/summary>\u003cp>Check whether the affected versions are in our lockfiles and which builds used them, pin to a safe version, rotate any secrets that could have been exposed in CI or developer machines, and review the incident advisory for specific indicators.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>"},{"id":"12-system-design","title":"Front-End System Design","html":"\u003ch1 id=\"front-end-system-design\">Front-End System Design\u003c/h1>\n\u003cblockquote>\u003cp>This round decides \"senior or not\". You're judged on \u003cstrong>structure, trade-offs, and communication\u003c/strong>, not on one right answer. Drive the conversation, think out loud, and check in with the interviewer.\u003c/p>\u003c/blockquote>\n\u003ch2 id=\"the-radio-framework-use-it-every-time\">The RADIO framework (use it every time)\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Step\u003c/th>\u003cth>Time (of ~45 min)\u003c/th>\u003cth>What to cover\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>R\u003c/strong>equirements\u003c/td>\u003ctd>5–8 min\u003c/td>\u003ctd>Functional (core features, users, devices), \u003cstrong>non-functional\u003c/strong> (performance, scale, SEO, a11y, i18n, offline, security), out of scope. Write them down.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>A\u003c/strong>rchitecture\u003c/td>\u003ctd>8–10 min\u003c/td>\u003ctd>Boxes: rendering strategy (CSR/SSR/RSC), client app layers, BFF/API, CDN, auth, third parties. Component tree at a high level.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>D\u003c/strong>ata model\u003c/td>\u003ctd>5 min\u003c/td>\u003ctd>Entities, client state vs server cache vs URL state, normalisation, cache keys.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>I\u003c/strong>nterface (API)\u003c/td>\u003ctd>5–8 min\u003c/td>\u003ctd>Endpoints/queries between client and server (pagination, filtering, errors), component props/APIs.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>O\u003c/strong>ptimisations\u003c/td>\u003ctd>10–15 min\u003c/td>\u003ctd>Performance, a11y, i18n, security, offline/error handling, observability, testing, deployment, scaling the \u003cem>team\u003c/em>. \u003cstrong>This is where you go deep in your strongest areas.\u003c/strong>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>Phrases that score points:\u003c/strong> \"Let me clarify the scope first\", \"The trade-off here is...\", \"For v1 I'd do X; at scale I'd move to Y\", \"How we'd measure success is...\", \"Let me check: do you want me to go deeper on rendering or on data?\"\u003c/p>\n\u003ch2 id=\"worked-example-1-e-commerce-product-listing-cart-bell-style\">Worked example 1: E-commerce product listing + cart (Bell-style) ⭐\u003c/h2>\n\u003cp>Practise this one first, because you can answer from real experience.\u003c/p>\n\u003cp>\u003cstrong>Requirements\u003c/strong>\u003c/p>\n\u003cul>\u003cli>Browse phones/plans with \u003cstrong>filters\u003c/strong> (brand, price, storage, 5G), sort, pagination; product detail page; add to cart; mini-cart; bilingual EN/FR; province-specific pricing.\u003c/li>\u003cli>Non-functional: SEO (product pages must rank), \u003cstrong>LCP &lt; 2.5 s on 4G mobile\u003c/strong>, launch-day traffic spikes (10–50×), WCAG AA, analytics, A/B testing.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Architecture\u003c/strong>\u003c/p>\n\u003cdiv class=\"code\">\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003cpre>\u003ccode data-lang=\"\">User ──► CDN (\u003cspan class=\"t-k\">static\u003c/span> assets, cached HTML \u003cspan class=\"t-k\">for\u003c/span> PLP/PDP, edge: locale + province)\n           │\n           ▼\n      Next.js app (RSC/SSR + ISR) ──► BFF / API gateway ──► catalog, pricing, inventory,\n           │                                               cart, promo, serviceability\n           └─ Client components: filters, add-to-cart, mini-cart, plan selector\n      Search: dedicated service (Algolia/Elasticsearch/OpenSearch) \u003cspan class=\"t-k\">for\u003c/span> facets\n      CMS (headless) \u003cspan class=\"t-k\">for\u003c/span> marketing content; webhook → revalidateTag()\u003c/code>\u003c/pre>\u003c/div>\n\u003cul>\u003cli>\u003cstrong>PLP/PDP\u003c/strong>: ISR or Partial Prerendering: a static shell + streamed dynamic price/stock (prices change, promos expire).\u003c/li>\u003cli>\u003cstrong>Cart / checkout\u003c/strong>: dynamic SSR or CSR, never cached at the CDN (\u003ccode>private\u003c/code>).\u003c/li>\u003cli>Interactive islands only where needed (filters, add-to-cart) to keep JS small.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Data model\u003c/strong>\u003c/p>\n\u003cul>\u003cli>\u003ccode>Product { id, slug, name, brand, images[], variants[] }\u003c/code>, \u003ccode>Variant { sku, colour, storage, price, stock }\u003c/code>, \u003ccode>Plan { id, data, price, province[] }\u003c/code>, \u003ccode>Cart { id, lines[{ sku, qty, planId }], promo, totals }\u003c/code>.\u003c/li>\u003cli>\u003cstrong>URL state:\u003c/strong> \u003ccode>/en/phones?brand=apple&amp;storage=256&amp;sort=price-asc&amp;page=2\u003c/code>.\u003c/li>\u003cli>\u003cstrong>Server cache:\u003c/strong> query keys \u003ccode>['products', filters]\u003c/code>, \u003ccode>['cart']\u003c/code>. Client state: mini-cart open.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>API\u003c/strong>\u003c/p>\n\u003cul>\u003cli>\u003ccode>GET /products?brand=&amp;sort=&amp;cursor=&amp;limit=24\u003c/code> → \u003ccode>{ items, facets: { brand: [{ value, count }] }, nextCursor }\u003c/code>.\u003c/li>\u003cli>\u003ccode>POST /cart/lines { sku, qty }\u003c/code> with an idempotency key → updated cart (return the whole cart so totals stay authoritative).\u003c/li>\u003cli>Error format: \u003ccode>{ code, message, field? }\u003c/code>. Prices come \u003cstrong>from the server\u003c/strong> (never trust client totals).\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Optimisations\u003c/strong>\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Performance:\u003c/strong> image CDN + \u003ccode>srcset\u003c/code>, hero \u003ccode>fetchpriority=high\u003c/code>, skeletons sized to prevent CLS, prefetch the PDP on hover, virtualise only if there are &gt; 100 tiles, code-split heavy PDP widgets (360° viewer, reviews), defer third-party tags.\u003c/li>\u003cli>\u003cstrong>Filters:\u003c/strong> debounce, update URL with \u003ccode>replace\u003c/code>, abort stale requests, keep previous results visible while loading (\u003ccode>keepPreviousData\u003c/code> / transitions), facet counts from the search service.\u003c/li>\u003cli>\u003cstrong>Cart:\u003c/strong> optimistic add (with rollback) + toast with \u003ccode>aria-live\u003c/code>; sync across tabs (BroadcastChannel / storage event); merge guest cart on login.\u003c/li>\u003cli>\u003cstrong>Scale/spikes:\u003c/strong> CDN-cached pages absorb traffic; a queue/waiting room for launch days; graceful degradation (hide recommendations if their service is down: \u003cstrong>error boundaries per widget\u003c/strong>).\u003c/li>\u003cli>\u003cstrong>SEO:\u003c/strong> SSR content, JSON-LD Product/Offer, canonical + \u003ccode>hreflang\u003c/code> EN/FR, sitemap.\u003c/li>\u003cli>\u003cstrong>a11y/i18n:\u003c/strong> filters as \u003ccode>fieldset\u003c/code>/checkbox groups, results count announced, ICU plurals, \u003ccode>Intl.NumberFormat('fr-CA')\u003c/code>.\u003c/li>\u003cli>\u003cstrong>Observability:\u003c/strong> RUM (Core Web Vitals per page type), Sentry errors with release tags, funnel analytics (PLP → PDP → cart → checkout conversion), feature flags and A/B experiments.\u003c/li>\u003c/ul>\n\u003ch2 id=\"worked-example-2-autocomplete-typeahead-component-level-design\">Worked example 2: Autocomplete / Typeahead (component-level design)\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Requirements:\u003c/strong> min 2 chars, results in &lt; 100 ms perceived, keyboard + screen reader, highlight matches, recent searches, works with 10M items.\u003c/li>\u003cli>\u003cstrong>Client:\u003c/strong> debounce (~200–300 ms), \u003ccode>AbortController\u003c/code>, \u003cstrong>in-memory LRU cache\u003c/strong> by query, optionally prefix-cache reuse (\"ap\" results can be filtered client-side for \"app\"), ARIA combobox, virtualised list if long, a \u003ccode>ResultItem\u003c/code> render prop for customisation.\u003c/li>\u003cli>\u003cstrong>Server:\u003c/strong> a search index (prefix/trie or Elasticsearch \u003ccode>completion\u003c/code> suggester), return the top N with highlights, cache popular prefixes at the CDN (\u003ccode>GET /suggest?q=ap\u003c/code> is cacheable!).\u003c/li>\u003cli>\u003cstrong>Edge cases:\u003c/strong> IME composition (Asian languages: \u003ccode>compositionstart/end\u003c/code>), race conditions, offline, empty/error state, rate limiting.\u003c/li>\u003cli>\u003cstrong>Metrics:\u003c/strong> latency p95, selection rate, zero-result rate.\u003c/li>\u003c/ul>\n\u003ch2 id=\"worked-example-3-news-feed-social-timeline-infinite-scroll\">Worked example 3: News feed / social timeline (infinite scroll)\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Pagination:\u003c/strong> \u003cstrong>cursor-based\u003c/strong> (stable under inserts), not offset.\u003c/li>\u003cli>\u003cstrong>Rendering:\u003c/strong> virtualised list with variable heights (measure + cache), placeholders, image lazy loading, \u003cstrong>preserve scroll position\u003c/strong> on back navigation, a \"new posts\" pill instead of auto-inserting at the top (avoids CLS).\u003c/li>\u003cli>\u003cstrong>Data:\u003c/strong> normalised posts/users store; optimistic likes; real-time via SSE/WebSocket for new posts.\u003c/li>\u003cli>\u003cstrong>Performance:\u003c/strong> prefetch the next page at 70% scroll, cap DOM nodes, recycle components, \u003ccode>content-visibility\u003c/code>.\u003c/li>\u003cli>\u003cstrong>a11y:\u003c/strong> \u003ccode>role=\"feed\"\u003c/code> + \u003ccode>aria-setsize\u003c/code>/\u003ccode>aria-posinset\u003c/code>, keyboard shortcuts (j/k), a \"load more\" fallback.\u003c/li>\u003c/ul>\n\u003ch2 id=\"worked-example-4-design-system-component-library-for-many-teams\">Worked example 4: Design system / component library for many teams\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Goals:\u003c/strong> consistency, a11y by default, velocity, multi-brand (Bell / Virgin Plus / Lucky style theming).\u003c/li>\u003cli>\u003cstrong>Architecture:\u003c/strong> tokens (Style Dictionary/Figma variables) → CSS variables; headless primitives (Radix/React Aria) + brand styles; a monorepo package \u003ccode>@company/ui\u003c/code> with tree-shakable ESM, \u003ccode>sideEffects: false\u003c/code>, per-component entry points.\u003c/li>\u003cli>\u003cstrong>Quality:\u003c/strong> Storybook docs, interaction tests, axe, \u003cstrong>visual regression\u003c/strong>, semver + changesets, codemods for breaking changes, deprecation warnings.\u003c/li>\u003cli>\u003cstrong>Adoption:\u003c/strong> office hours, contribution guidelines, usage analytics (which versions/components are used where), a migration guide.\u003c/li>\u003cli>\u003cstrong>Trade-offs:\u003c/strong> flexibility vs consistency (slots/\u003ccode>asChild\u003c/code> vs locked props), bundle size, framework lock-in (web components if teams use different frameworks).\u003c/li>\u003c/ul>\n\u003ch2 id=\"worked-example-5-real-time-dashboard-e-g-network-outage-order-status\">Worked example 5: Real-time dashboard (e.g. network outage / order status)\u003c/h2>\n\u003cul>\u003cli>Transport: SSE for one-way updates, WebSocket if bi-directional; reconnection with backoff + \"last event id\" resume; polling fallback.\u003c/li>\u003cli>Throttle UI updates (batch every 500 ms), use \u003ccode>useSyncExternalStore\u003c/code> for the stream store, Web Worker for aggregation, canvas/WebGL charts for thousands of points.\u003c/li>\u003cli>Stale data indicators, offline banner, timezones, accessible charts (data tables / summaries).\u003c/li>\u003c/ul>\n\u003ch2 id=\"architecture-topics-they-ll-probe\">Architecture topics they'll probe\u003c/h2>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Micro-frontends: when are they worth it, and how do you implement them?\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>Micro-frontends split a large front end into separate applications that different teams own, build and deploy independently. For a site like Bell's, that might be shop, support, my account and checkout, each owned by a different team.\u003c/p>\u003cp>There are several ways to implement them. The simplest and most robust is splitting by route: different apps serve different URL paths behind one domain, with a shared header and footer from a package or web component. Module Federation lets one app load components from another at runtime and share libraries like React as a single copy. Web components work when teams use different frameworks. And there's server-side or edge composition of page fragments.\u003c/p>\u003cp>They're worth it when you have many teams, say five or more, who are blocking each other in one codebase and need independent release schedules, or when you're gradually migrating a legacy app with the strangler pattern.\u003c/p>\u003cp>But the costs are real: duplicated dependencies and bigger bundles, version conflicts in shared libraries, an inconsistent user experience, harder shared state and authentication, and much more complex testing and operations. For one or two teams, I'd say they're not worth it. A well-organised monorepo with enforced module boundaries gives you most of the benefits with far less complexity.\u003c/p>\u003c/div>\n\u003cp>\u003cstrong>What:\u003c/strong> splitting a front end into independently developed and \u003cstrong>deployed\u003c/strong> apps owned by different teams (e.g. Bell: Shop, Support, My Account, Checkout).\u003c/p>\n\u003cp>\u003cstrong>Approaches:\u003c/strong>\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Route-based split\u003c/strong> (different apps behind one domain via a reverse proxy / CDN path routing): simplest and most robust. Shared header/footer as a package or web component.\u003c/li>\u003cli>\u003cstrong>Module Federation\u003c/strong> (webpack/Rspack/Vite plugin): load remote modules at runtime and share React as a singleton.\u003c/li>\u003cli>\u003cstrong>Web Components\u003c/strong> for framework-agnostic widgets.\u003c/li>\u003cli>\u003cstrong>Server-side composition\u003c/strong> (edge-side includes / fragment composition).\u003c/li>\u003cli>Single-spa orchestration (older).\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Worth it when:\u003c/strong> many teams (5+) step on each other, need independent release cadences, or face legacy migration (strangler pattern, migrating Angular/jQuery to React page by page).\u003c/p>\n\u003cp>\u003cstrong>Costs:\u003c/strong> duplicated dependencies (bundle size), version skew of shared libs, inconsistent UX, cross-app state/auth/routing complexity, harder local dev and E2E testing, ops overhead. \u003cstrong>Not worth it for one or two teams.\u003c/strong> A well-structured \u003cstrong>monorepo with module boundaries\u003c/strong> gives most of the benefit.\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>How do micro-frontends share state, like the logged-in user or cart count?\u003c/summary>\u003cp>Minimise sharing. Each app reads what it needs from APIs or cookies, and for live updates they communicate through simple browser events or a tiny shared event bus, not a shared store.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>How do you keep the UX consistent across micro-frontends?\u003c/summary>\u003cp>A shared design system package with versioning, shared header and footer, common UX guidelines, and visual regression tests, plus a platform team that owns these shared pieces.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>How do you handle React versions across micro-frontends?\u003c/summary>\u003cp>With Module Federation, share React as a singleton with compatible version ranges. Otherwise, coordinate upgrades through the platform team. Different React versions on one page cause bugs and bloat.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Monorepo vs polyrepo\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>A monorepo keeps multiple apps and packages in one repository, managed with tools like Nx or Turborepo and pnpm workspaces. The big advantage for front end is atomic changes. If I change a component in the design system, I can update every app that uses it in the same pull request, and CI tells me immediately if anything breaks. There's also shared tooling and configuration, consistent dependency versions, and easier refactoring. The costs are that it needs good tooling: build caching and running only the affected projects, otherwise CI becomes slow, plus clear ownership with CODEOWNERS.\u003c/p>\u003cp>A polyrepo gives each project its own repository. Teams are more independent, and permissions and pipelines are simpler, but shared code has to be published as versioned packages, versions drift apart, and a breaking change in a shared library becomes a coordination exercise across many repos.\u003c/p>\u003cp>For a front-end platform with a shared design system and several apps, I'd generally recommend a monorepo, provided the team invests in the tooling.\u003c/p>\u003c/div>\n\u003cp>\u003cstrong>Monorepo\u003c/strong> (Nx, Turborepo + pnpm workspaces): atomic changes across app + design system, shared tooling/config, easy refactors, consistent versions. It needs build caching/affected-only CI and ownership (CODEOWNERS). \u003cstrong>Polyrepo\u003c/strong>: independent, simpler permissions, but dependency drift and versioning overhead. For a front-end platform with a shared design system, a monorepo is usually the better fit.\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>How do you keep CI fast in a monorepo?\u003c/summary>\u003cp>Run only the affected projects, use remote build caching, parallelise jobs, and keep each project's tests independent, which Nx and Turborepo handle.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>How do you control who changes shared code?\u003c/summary>\u003cp>CODEOWNERS files requiring review from the owning team, module boundary rules, and clear contribution guidelines.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">BFF (Backend for Frontend): why?\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>A Backend-for-Frontend is a thin server layer built specifically for one front end. In a microservices architecture like Bell's, a single product page might need data from the catalogue, pricing, promotions, inventory and availability services. Without a BFF, the browser makes many requests, gets data shaped for backend needs, and contains a lot of glue logic.\u003c/p>\u003cp>The BFF aggregates those calls server-side, close to the services, and returns exactly the data that page needs, in the shape the UI wants. That means fewer round trips and smaller payloads, which matters on mobile. It's also the right place for security concerns: handling OAuth tokens on the server and giving the browser just an HttpOnly session cookie, plus caching and rate limiting. And it isolates the front end from backend changes.\u003c/p>\u003cp>In Next.js, route handlers, server actions and server components can act as the BFF, and as a full-stack developer I've built endpoints in NestJS for this kind of role. The risk to watch is business logic creeping into the BFF. It should orchestrate and shape data, not own domain rules.\u003c/p>\u003c/div>\n\u003cp>A thin server layer per front end (web, mobile) that aggregates microservices, shapes responses for the UI (fewer round trips, smaller payloads), handles auth/session (token handling server-side, an HttpOnly cookie to the browser), caching and rate limiting, and isolates the front end from backend changes. In Next.js, Route Handlers/Server Actions/RSC can act as the BFF. Risk: business logic creeping into the BFF; keep it a thin orchestration layer.\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>How is a BFF different from an API gateway?\u003c/summary>\u003cp>An API gateway is a generic entry point for routing, auth, and rate limiting. A BFF is specific to one client and shapes data for its screens. They're often used together.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>What problems can a BFF create?\u003c/summary>\u003cp>Another service to run and monitor, duplicated logic across BFFs for web and mobile, and business rules leaking into it if you're not careful.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">How do you handle errors and resilience in a large front end?\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>I think about resilience in layers. In the UI, I use error boundaries at the route level and around independent widgets, so if the recommendations or reviews section fails, it shows a fallback or disappears instead of crashing the whole page. Every data-driven component has explicit loading, empty and error states, and a retry option.\u003c/p>\u003cp>In the API layer, I have one place that handles errors consistently: typed error objects, timeouts so requests don't hang forever, and retries with backoff only for idempotent requests.\u003c/p>\u003cp>The key principle is graceful degradation. Critical paths, like adding to cart and checkout, must keep working even if non-critical services, such as recommendations, chat or analytics, are down. Forms preserve the user's input on failure, submissions are idempotent, and I detect offline status to show a helpful message.\u003c/p>\u003cp>And then visibility: error monitoring with source maps and release tags, alerts when the error rate spikes after a deployment, and session replay with privacy masking to reproduce issues. Resilience isn't just preventing errors, it's detecting and recovering from them quickly.\u003c/p>\u003c/div>\n\u003cul>\u003cli>\u003cstrong>Error boundaries\u003c/strong> at route and widget level, with fallbacks + retry.\u003c/li>\u003cli>API layer: typed errors, retries with backoff for idempotent calls, timeouts (\u003ccode>AbortSignal.timeout\u003c/code>), circuit-breaker-ish behaviour (hide a non-critical widget).\u003c/li>\u003cli>\u003cstrong>Graceful degradation:\u003c/strong> checkout must work even if recommendations/chat/analytics fail.\u003c/li>\u003cli>Offline detection, form state preservation, idempotent submits.\u003c/li>\u003cli>\u003cstrong>Monitoring:\u003c/strong> Sentry/Datadog with source maps, release tagging, user/session context (scrubbed of PII), alerting on error-rate spikes after deploy, session replay for repro (with privacy masking).\u003c/li>\u003c/ul>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>How do you decide what's critical versus non-critical on a page?\u003c/summary>\u003cp>Ask what the user came to do. On a product page, the product info, price and add-to-cart are critical. Recommendations, reviews and chat aren't. Critical parts get stronger fallbacks and monitoring; non-critical ones can just disappear on failure.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>How do you surface errors to users without frightening them?\u003c/summary>\u003cp>Clear, specific, human messages with a next step, like retry or contact support, preserving their input, and never showing technical details or stack traces.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Feature flags and experimentation\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>Feature flags let you separate deploying code from releasing a feature. You merge and deploy code that's turned off, then enable it for internal users, a percentage of customers, or a specific region or segment. If something goes wrong, you turn it off instantly without a rollback or a new deployment. That's especially valuable for risky changes, like a checkout change before a big device launch.\u003c/p>\u003cp>The same mechanism supports A/B testing: different users see different variants, and you measure the impact on conversion. Tools include LaunchDarkly, Optimizely, Unleash and GrowthBook.\u003c/p>\u003cp>There are a few things to get right. Evaluate flags on the server or at the edge when possible, so users don't see a flicker of the old version, which also causes layout shift. Keep user bucketing consistent between server and client. Test the important flag combinations. And clean up: every flag should have an owner and an expiry date, because old flags turn into hidden technical debt and confusing code paths.\u003c/p>\u003c/div>\n\u003cp>Decouple \u003cstrong>deploy\u003c/strong> from \u003cstrong>release\u003c/strong>: ship code dark, enable by % / segment / province, kill-switch on incidents, A/B test variants. Tools: LaunchDarkly, Unleash, Optimizely, AWS AppConfig, Flagsmith, GrowthBook. Concerns: flicker (evaluate flags server-side/at the edge to avoid CLS), flag debt (clean up after rollout, with an owner and expiry), testing combinations, and consistent bucketing across server and client.\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>How do you avoid flicker with client-side A/B tests?\u003c/summary>\u003cp>Evaluate the flag on the server or at the edge, and render the right variant in the HTML. If you must evaluate on the client, do it before first paint with a cached decision, but server-side is much better.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>How do you clean up flags?\u003c/summary>\u003cp>Every flag gets an owner and an expiry date when it's created. After full rollout, removing it becomes a ticket, and some tools alert on stale flags.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">How do you make architecture decisions as a senior? (process)\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>I follow a lightweight, written process, because the reasoning matters as much as the choice. First, I clearly define the problem and the constraints, including non-functional requirements like performance, team skills and timeline. Then I write a short RFC or Architecture Decision Record: the context, two or three realistic options with their trade-offs, my recommendation, and the consequences, including what we're giving up.\u003c/p>\u003cp>For risky unknowns, I do a time-boxed spike or prototype to get real data instead of opinions. I share the document with the teams affected and invite feedback, especially from people likely to disagree, since they find the weaknesses. I define how we'll measure success, and plan an incremental rollout with a way to roll back.\u003c/p>\u003cp>The Redux Toolkit migration at Bell followed this pattern: I wrote up the problems with our state management, compared options, proposed RTK with an incremental migration plan, and got buy-in before starting. Once a decision is made, it's documented, so a year later people understand why, not just what.\u003c/p>\u003c/div>\n\u003cp>Write an \u003cstrong>RFC / ADR\u003c/strong> (Architecture Decision Record): context, problem, options with trade-offs, decision, consequences. Prototype risky parts (spike). Get feedback from affected teams. Define success metrics. Plan an incremental migration (strangler fig) with rollback. Document and socialise. This answer often matters more than the technology choice itself.\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>What if your proposal gets rejected?\u003c/summary>\u003cp>I make sure I understand why, and if the decision is made by the right people with the trade-offs understood, I commit to it fully. If my concerns are significant, I document them, so we can revisit with data later.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>How do you handle a decision that needs to be made quickly without a full RFC?\u003c/summary>\u003cp>Make a reversible decision quickly, document it briefly as a lightweight ADR, and note what would make us revisit it. The weight of the process should match how hard the decision is to undo.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Offline support / PWA\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>Offline support is built on a Service Worker, a script that sits between the app and the network and can serve responses from a cache. I'd use Workbox rather than writing it by hand, with a different strategy per type of resource. Cache-first for hashed static assets, since they never change. Network-first, falling back to cache, for HTML and API data that should be fresh. Stale-while-revalidate for data that can be a little old, like a product catalogue.\u003c/p>\u003cp>For data, IndexedDB stores structured information locally, and background sync can queue actions taken offline and send them when the connection returns. A web app manifest makes the app installable.\u003c/p>\u003cp>The risk I always mention is that a buggy Service Worker can keep serving a broken version of your app from cache, even after you deploy a fix. So I'd include a clear update flow, like showing \"a new version is available, reload\", and a kill switch to unregister the worker if needed. And I'd question whether full offline support is really needed. For many e-commerce flows, caching assets for faster repeat visits plus a good offline message is enough.\u003c/p>\u003c/div>\n\u003cp>Service Worker (Workbox) caching strategies: \u003cstrong>cache-first\u003c/strong> for hashed static assets, \u003cstrong>network-first\u003c/strong> for HTML/API (fall back to cache), \u003cstrong>stale-while-revalidate\u003c/strong> for semi-static data. A web app manifest for installability, background sync for queued mutations, IndexedDB for data, and an \"update available\" flow when a new SW is waiting. Be careful: a buggy SW can cache a broken app, so always have a kill switch.\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>How do you update a Service Worker safely?\u003c/summary>\u003cp>Use versioned caches, clean up old ones on activation, and show the user a prompt to reload when a new version is waiting, instead of forcing a reload in the middle of their work.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>What's background sync?\u003c/summary>\u003cp>It lets a Service Worker retry queued requests, like a form submission made offline, when connectivity returns, even if the user has closed the tab. Browser support is limited, so you need a fallback.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>"},{"id":"13-cloud-devops","title":"Cloud, DevOps & Deployment for Front-End Engineers","html":"\u003ch1 id=\"cloud-devops-deployment-for-front-end-engineers\">Cloud, DevOps &amp; Deployment for Front-End Engineers\u003c/h1>\n\u003cblockquote>\u003cp>Senior front-end engineers are expected to \u003cstrong>own the path to production\u003c/strong>: how the app is built, hosted, cached, deployed, monitored and rolled back. You don't need to be a cloud architect, but you must speak confidently about \u003cstrong>AWS\u003c/strong> (most asked), with \u003cstrong>Azure/GCP equivalents\u003c/strong>, CI/CD, containers and observability.\u003c/p>\u003cp>🔧 \u003cstrong>Be honest about your hands-on level.\u003c/strong> Say \"At Bell, deployments went through \u003cspan class=\"fill\">[the platform team's pipeline / Jenkins / GitLab CI / OpenShift]\u003c/span>. I owned \u003cspan class=\"fill\">[X]\u003c/span>. On my own projects I've deployed with \u003cspan class=\"fill\">[Vercel / Render / AWS S3+CloudFront / Supabase]\u003c/span>.\" You have real projects in your folder (e.g. a Render full-stack test, a GitHub Pages portfolio, and Supabase on your résumé), so use them.\u003c/p>\u003c/blockquote>\n\u003ch2 id=\"the-reference-architecture-static-spa-on-aws-draw-it-from-memory\">The reference architecture: static SPA on AWS (draw it from memory)\u003c/h2>\n\u003cdiv class=\"code\">\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003cpre>\u003ccode data-lang=\"\">            Route \u003cspan class=\"t-n\">53\u003c/span> (DNS: shop.example.com)\n                    │\n                    ▼\n     AWS WAF ──► CloudFront (CDN, TLS via ACM cert, HTTP/\u003cspan class=\"t-n\">2\u003c/span>–\u003cspan class=\"t-n\">3\u003c/span>, Brotli, edge caching)\n                    │  Origin Access Control (bucket is NOT public)\n          ┌─────────┴──────────────┐\n          ▼                        ▼  /api/*  (path-based behaviour)\n   S3 bucket (\u003cspan class=\"t-k\">static\u003c/span> build:   API Gateway / ALB ──► Lambda / ECS / EKS services\n   index.html + hashed JS/CSS)          │\n                                        └──► DynamoDB / RDS / external services\n   CloudFront Functions / Lambda@Edge: redirects, security headers, locale routing, auth checks\n   Cognito (or Okta/Entra): user login (OIDC + PKCE)\n   CloudWatch / X-Ray / RUM: logs, metrics, traces, real-user monitoring\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>\u003cstrong>Deploy flow:\u003c/strong> CI builds → uploads \u003cstrong>hashed assets first\u003c/strong> (\u003ccode>Cache-Control: max-age=31536000, immutable\u003c/code>) → uploads \u003ccode>index.html\u003c/code> (\u003ccode>no-cache\u003c/code>) → \u003cstrong>CloudFront invalidation\u003c/strong> of \u003ccode>/index.html\u003c/code> only → smoke test. Rollback means re-pointing to the previous build (keep the old assets; use versioned prefixes).\u003c/p>\n\u003cp>SPA routing gotcha: deep links like \u003ccode>/plans/5g\u003c/code> return 404 from S3, so configure CloudFront to serve \u003ccode>index.html\u003c/code> for 403/404 (or use a CloudFront Function rewrite).\u003c/p>\n\u003ch2 id=\"aws-services-a-front-end-dev-should-know\">AWS services a front-end dev should know\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Service\u003c/th>\u003cth>What it is\u003c/th>\u003cth>Front-end use\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>S3\u003c/strong>\u003c/td>\u003ctd>object storage\u003c/td>\u003ctd>host static builds, user uploads (via \u003cstrong>pre-signed URLs\u003c/strong>)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>CloudFront\u003c/strong>\u003c/td>\u003ctd>CDN\u003c/td>\u003ctd>cache assets/pages at the edge, TLS, custom headers, path routing\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Route 53\u003c/strong>\u003c/td>\u003ctd>DNS\u003c/td>\u003ctd>domains, health-check failover\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>ACM\u003c/strong>\u003c/td>\u003ctd>certificates\u003c/td>\u003ctd>free TLS certs for CloudFront (must be in us-east-1)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Lambda\u003c/strong>\u003c/td>\u003ctd>serverless functions\u003c/td>\u003ctd>APIs, BFF, image resizing, SSR (Next via OpenNext)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Lambda@Edge / CloudFront Functions\u003c/strong>\u003c/td>\u003ctd>code at the edge\u003c/td>\u003ctd>redirects, headers (CSP/HSTS), A/B bucketing, auth checks\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>API Gateway\u003c/strong>\u003c/td>\u003ctd>managed API front door\u003c/td>\u003ctd>REST/HTTP/WebSocket APIs, throttling, auth\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Cognito\u003c/strong>\u003c/td>\u003ctd>user auth\u003c/td>\u003ctd>sign-up/sign-in, OIDC, social login, JWTs\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Amplify Hosting\u003c/strong>\u003c/td>\u003ctd>managed front-end hosting + CI\u003c/td>\u003ctd>quick deploys of React/Next with preview branches\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>ECS/Fargate, EKS\u003c/strong>\u003c/td>\u003ctd>containers\u003c/td>\u003ctd>run SSR Node servers (Next.js standalone)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>DynamoDB / RDS\u003c/strong>\u003c/td>\u003ctd>databases\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>SQS / SNS / EventBridge\u003c/strong>\u003c/td>\u003ctd>messaging\u003c/td>\u003ctd>async workflows (order events)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>CloudWatch, X-Ray, CloudWatch RUM\u003c/strong>\u003c/td>\u003ctd>observability\u003c/td>\u003ctd>logs, metrics, alarms, traces, Core Web Vitals\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>WAF / Shield\u003c/strong>\u003c/td>\u003ctd>security\u003c/td>\u003ctd>block bots, SQL injection, rate limiting, DDoS\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Secrets Manager / SSM Parameter Store\u003c/strong>\u003c/td>\u003ctd>secrets/config\u003c/td>\u003ctd>API keys for the BFF (never in the front-end bundle)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>IAM\u003c/strong>\u003c/td>\u003ctd>permissions\u003c/td>\u003ctd>least privilege for CI deploy roles (OIDC from GitHub Actions, no long-lived keys)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Bedrock\u003c/strong>\u003c/td>\u003ctd>managed LLMs\u003c/td>\u003ctd>AI features (ties to your AI experience)\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"azure-gcp-equivalents-in-case-the-company-isn-t-on-aws\">Azure &amp; GCP equivalents (in case the company isn't on AWS)\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Need\u003c/th>\u003cth>AWS\u003c/th>\u003cth>Azure\u003c/th>\u003cth>GCP\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Static hosting\u003c/td>\u003ctd>S3 + CloudFront / Amplify\u003c/td>\u003ctd>\u003cstrong>Static Web Apps\u003c/strong>, Blob Storage + Front Door\u003c/td>\u003ctd>Cloud Storage + Cloud CDN, \u003cstrong>Firebase Hosting\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>CDN / edge\u003c/td>\u003ctd>CloudFront\u003c/td>\u003ctd>Azure Front Door / CDN\u003c/td>\u003ctd>Cloud CDN\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Serverless\u003c/td>\u003ctd>Lambda\u003c/td>\u003ctd>Azure Functions\u003c/td>\u003ctd>Cloud Functions / \u003cstrong>Cloud Run\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Containers\u003c/td>\u003ctd>ECS / EKS\u003c/td>\u003ctd>Container Apps / AKS\u003c/td>\u003ctd>Cloud Run / GKE\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Auth\u003c/td>\u003ctd>Cognito\u003c/td>\u003ctd>\u003cstrong>Entra ID\u003c/strong> (formerly Azure AD), Entra External ID\u003c/td>\u003ctd>Firebase Auth / Identity Platform\u003c/td>\u003c/tr>\u003ctr>\u003ctd>CI/CD\u003c/td>\u003ctd>CodePipeline\u003c/td>\u003ctd>\u003cstrong>Azure DevOps Pipelines\u003c/strong>, GitHub Actions\u003c/td>\u003ctd>Cloud Build\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Monitoring\u003c/td>\u003ctd>CloudWatch\u003c/td>\u003ctd>\u003cstrong>Application Insights\u003c/strong> / Azure Monitor\u003c/td>\u003ctd>Cloud Monitoring / Logging\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Secrets\u003c/td>\u003ctd>Secrets Manager\u003c/td>\u003ctd>Key Vault\u003c/td>\u003ctd>Secret Manager\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Also know the \u003cstrong>front-end platforms\u003c/strong>: \u003cstrong>Vercel\u003c/strong> (Next.js creators: preview deployments per PR, edge functions, ISR), \u003cstrong>Netlify\u003c/strong>, \u003cstrong>Cloudflare Pages/Workers\u003c/strong>, \u003cstrong>Render\u003c/strong>, and \u003cstrong>Supabase\u003c/strong> (Postgres + auth + storage + pgvector). Enterprise (IBM/Bell world): \u003cstrong>Red Hat OpenShift\u003c/strong> (Kubernetes) and IBM Cloud are common, which is worth mentioning if that matches your experience.\u003c/p>\n\u003ch2 id=\"interview-questions\">Interview questions\u003c/h2>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">How would you deploy a React SPA to AWS? Walk me through it.\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>For a single-page app, I'd host the static build in a private S3 bucket with CloudFront in front of it as the CDN. The bucket isn't public; CloudFront accesses it through Origin Access Control. I'd attach an SSL certificate from ACM, and point the domain at the distribution with a Route 53 alias record.\u003c/p>\u003cp>Caching is the important detail. The hashed JavaScript and CSS files get a one-year immutable cache, and \u003ccode>index.html\u003c/code> gets no-cache, so users always get the latest version, which references the new hashed files. Because it's a single-page app, I'd configure CloudFront to return \u003ccode>index.html\u003c/code> for unknown paths, so deep links work. Security headers like CSP and HSTS can be added with a CloudFront response headers policy, and WAF can sit in front for bot protection and rate limiting.\u003c/p>\u003cp>For deployment, the CI pipeline builds the app, assumes an AWS role through OIDC, so no long-lived access keys are stored, syncs the files to S3, and invalidates just \u003ccode>index.html\u003c/code> in CloudFront. I'd define all of this with infrastructure as code, like CDK or Terraform, so dev, staging and production are identical.\u003c/p>\u003cp>If it's Next.js with server rendering, the options are Vercel, AWS Amplify, OpenNext on Lambda, or a Docker container on ECS or Fargate with CloudFront in front.\u003c/p>\u003c/div>\n\u003col>\u003cli>Build in CI (\u003ccode>npm ci &amp;&amp; npm run build\u003c/code>) → hashed assets in \u003ccode>dist/\u003c/code>.\u003c/li>\u003cli>A private S3 bucket + CloudFront with \u003cstrong>Origin Access Control\u003c/strong>; HTTPS via ACM; Route 53 alias record.\u003c/li>\u003cli>Cache policy: hashed assets get a 1 year \u003ccode>immutable\u003c/code> cache; \u003ccode>index.html\u003c/code> gets \u003ccode>no-cache\u003c/code>.\u003c/li>\u003cli>SPA fallback: serve \u003ccode>index.html\u003c/code> for unknown paths.\u003c/li>\u003cli>Security headers via a CloudFront \u003cstrong>response headers policy\u003c/strong> (CSP, HSTS, X-Content-Type-Options, frame-ancestors).\u003c/li>\u003cli>CI deploys with an IAM role assumed via \u003cstrong>OIDC\u003c/strong> (no stored AWS keys) → \u003ccode>aws s3 sync\u003c/code> → \u003ccode>aws cloudfront create-invalidation --paths /index.html\u003c/code>.\u003c/li>\u003cli>Infrastructure as code (CDK/Terraform), environments for dev/staging/prod, WAF in front, and alarms on 5xx/4xx rates.\u003c/li>\u003c/ol>\n\u003cp>For Next.js with SSR: Vercel, \u003cstrong>AWS Amplify\u003c/strong>, \u003cstrong>OpenNext/SST\u003c/strong> (Lambda + CloudFront), or a \u003cstrong>Docker container\u003c/strong> on ECS/Fargate / Cloud Run / Kubernetes with the CDN in front.\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>Why not just make the S3 bucket public with static website hosting?\u003c/summary>\u003cp>It's simpler, but you lose HTTPS on a custom domain without CloudFront, edge caching, security headers and WAF, and anyone can bypass the CDN. A private bucket with Origin Access Control is the recommended setup.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>How do you roll back a bad deployment?\u003c/summary>\u003cp>Keep previous builds in versioned folders or as versioned artifacts. Rollback means re-deploying the previous \u003ccode>index.html\u003c/code>, or pointing CloudFront's origin path to the previous version, and invalidating the HTML.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>How do you handle multiple environments?\u003c/summary>\u003cp>Separate buckets and distributions per environment, defined by the same infrastructure code with different parameters, ideally in separate AWS accounts for production isolation.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">How do CDNs work, and what are the key caching headers?\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>A CDN has servers, called edge locations, all over the world. When a user requests a file, it goes to the nearest edge. If that edge has a cached copy, it returns it immediately. If not, it fetches it from the origin server, stores it, and serves it to later users. That reduces latency, protects the origin, and absorbs traffic spikes, like a device launch on Bell's site.\u003c/p>\u003cp>Caching is controlled mainly by the \u003ccode>Cache-Control\u003c/code> header. Hashed static assets get a long \u003ccode>max-age\u003c/code> with \u003ccode>immutable\u003c/code>. For HTML or API responses that can be shared, \u003ccode>s-maxage\u003c/code> sets the CDN cache time separately from the browser's, and \u003ccode>stale-while-revalidate\u003c/code> lets the CDN serve a slightly old version while it fetches a new one in the background. Anything user-specific, like a cart or account page, gets \u003ccode>private\u003c/code> or \u003ccode>no-store\u003c/code>, so it's never cached at the CDN. ETags allow efficient revalidation with a 304 Not Modified response. The \u003ccode>Vary\u003c/code> header creates separate cached versions, for example by language, but too many variations lowers the cache hit rate.\u003c/p>\u003cp>The classic incident is accidentally caching a personalised response and showing one customer's data to another, usually because cookies weren't considered in the cache key. So I'm careful to keep personalised and shared content clearly separated.\u003c/p>\u003c/div>\n\u003cp>A CDN caches responses at \u003cstrong>edge locations\u003c/strong> near users. On a cache miss it goes to the origin, stores the response per the cache key (URL + chosen headers/cookies/query params), and serves later users from the edge, which lowers latency, absorbs traffic spikes and protects the origin.\u003c/p>\n\u003cp>Headers:\u003c/p>\n\u003cul>\u003cli>\u003ccode>Cache-Control: public, max-age=31536000, immutable\u003c/code> for hashed assets.\u003c/li>\u003cli>\u003ccode>Cache-Control: public, s-maxage=300, stale-while-revalidate=600\u003c/code> lets the CDN cache HTML/API for 5 min and serve stale while refreshing.\u003c/li>\u003cli>\u003ccode>Cache-Control: private, no-store\u003c/code> for user-specific data (cart, account): \u003cstrong>never CDN-cache it\u003c/strong>.\u003c/li>\u003cli>\u003ccode>ETag\u003c/code> / \u003ccode>If-None-Match\u003c/code> → \u003ccode>304 Not Modified\u003c/code>.\u003c/li>\u003cli>\u003ccode>Vary: Accept-Language\u003c/code> / \u003ccode>Accept-Encoding\u003c/code> lets the cache store different variants (careful: high cardinality kills the hit ratio).\u003c/li>\u003c/ul>\n\u003cp>Invalidation: purge by path/tag (CloudFront invalidation, Fastly/Cloudflare surrogate keys), or avoid needing it via content hashing. Watch out for \u003cstrong>caching personalised responses\u003c/strong> by accident (cookies in the cache key). That's a classic incident.\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>What's a cache hit ratio and how do you improve it?\u003c/summary>\u003cp>The percentage of requests served from the edge. Improve it by normalising cache keys, excluding unnecessary cookies, headers and query parameters, using long TTLs for hashed assets, and an origin shield.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>How do you purge content from a CDN?\u003c/summary>\u003cp>CloudFront invalidations by path, or tag-based purging on CDNs like Fastly or Cloudflare. But the best strategy is designing so you rarely need purges, with hashed file names and short TTLs on HTML.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Describe a CI/CD pipeline you'd set up for a front-end team.\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>On every pull request, the pipeline installs dependencies with \u003ccode>npm ci\u003c/code> from a cache, then runs linting, type-checking and the unit and integration tests in parallel. It builds the production bundle and checks it against the size budget. Then it deploys a preview environment for that branch and runs a small Playwright or Cypress smoke suite against it, and optionally Lighthouse and accessibility checks. All of these are required to pass, along with a code review.\u003c/p>\u003cp>When the code merges to main, the pipeline builds the artifact once, deploys it to staging and runs the full end-to-end suite. Then it promotes that exact same artifact to production. I avoid rebuilding per environment, so what we tested is exactly what we ship. Production releases use a canary or feature flags, with smoke tests after the deployment, and monitoring that can trigger an automatic rollback if the error rate spikes.\u003c/p>\u003cp>The principles behind it are fast feedback, ideally under 10 minutes for a pull request, which means caching and running only affected projects in a monorepo; build once, deploy many; trunk-based development with short-lived branches; and feature flags rather than long-lived release branches.\u003c/p>\u003c/div>\n\u003cdiv class=\"code\">\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003cpre>\u003ccode data-lang=\"yaml\">\u003cspan class=\"t-c\"># .github/workflows/ci.yml (simplified)\u003c/span>\nname: ci\non: [pull_request]\njobs:\n  verify:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-node@v4\n        with: { node-version: \u003cspan class=\"t-n\">22\u003c/span>, cache: npm }\n      - run: npm ci\n      - run: npm run lint &amp;&amp; npm run typecheck\n      - run: npm test -- --coverage\n      - run: npm run build\n      - run: npx size-limit            \u003cspan class=\"t-c\"># bundle budget\u003c/span>\n      \u003cspan class=\"t-c\"># deploy a preview environment, then:\u003c/span>\n      - run: npx playwright test --project=smoke\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>Stages: \u003cstrong>PR\u003c/strong> → lint, type-check, unit/integration, build, bundle budget, preview deploy, E2E smoke, Lighthouse CI, required reviews. \u003cstrong>Main\u003c/strong> → build once (immutable artifact) → deploy to staging → E2E → \u003cstrong>promote the same artifact\u003c/strong> to production (canary or blue/green) → post-deploy smoke + monitoring → automatic rollback on error spikes.\u003c/p>\n\u003cp>Principles: build once, deploy many; fast feedback (&lt; 10 min PR pipeline, caching, parallel jobs, Nx/Turbo affected-only); trunk-based development with short-lived branches; feature flags instead of long-lived branches.\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>How do you store secrets for the pipeline?\u003c/summary>\u003cp>In the CI platform's secret store or a cloud secret manager, and for cloud access, use OIDC federation, so the pipeline gets short-lived credentials instead of storing access keys.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>What's trunk-based development?\u003c/summary>\u003cp>Everyone merges small changes into the main branch frequently, at least daily, with short-lived feature branches and feature flags for unfinished work. It avoids painful merges and keeps main always releasable.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>How do preview deployments help?\u003c/summary>\u003cp>Every pull request gets its own URL, so designers, product owners and QA can review the real change before merging, and E2E tests can run against it.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Blue/green vs canary vs rolling deployments\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>With blue/green, you have two identical environments. Blue is live, you deploy the new version to green, test it, then switch all traffic to green at once. Rollback is instant, you just switch back, but you need double the infrastructure during the release.\u003c/p>\u003cp>With a canary release, you send a small percentage of traffic, say one percent, to the new version, watch the metrics, like errors, performance and even conversion, and gradually increase to 100 percent. If metrics get worse, you roll back automatically, and only a small group of users was affected. Rolling deployments replace servers or containers gradually, which is the Kubernetes default. Feature flags work at a finer level: the code is deployed, but the feature is released per user or segment.\u003c/p>\u003cp>There's a front-end-specific issue I'd raise: version skew. A user might have the old JavaScript loaded in their browser while the server is already on the new version. To handle that, keep old asset files available after deployment, make API changes backward compatible, and catch chunk load errors so the app reloads once instead of breaking.\u003c/p>\u003c/div>\n\u003cul>\u003cli>\u003cstrong>Blue/green\u003c/strong>: two identical environments; switch traffic all at once; instant rollback by switching back. Costs double the infrastructure during release.\u003c/li>\u003cli>\u003cstrong>Canary\u003c/strong>: send 1% → 10% → 50% → 100% of traffic to the new version while watching metrics (errors, Web Vitals, conversion). Auto-rollback on regression.\u003c/li>\u003cli>\u003cstrong>Rolling\u003c/strong>: replace instances gradually (the Kubernetes default).\u003c/li>\u003cli>\u003cstrong>Feature flags\u003c/strong>: release the \u003cem>feature\u003c/em> separately from the \u003cem>deploy\u003c/em>, at user-level granularity.\u003c/li>\u003c/ul>\n\u003cp>Front-end-specific gotcha: \u003cstrong>version skew\u003c/strong>. A user has old JS loaded while the API or chunks changed. Keep old chunks available after deploy, make APIs backward compatible, and handle \u003ccode>ChunkLoadError\u003c/code> by reloading the page once.\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>What metrics would trigger an automatic canary rollback?\u003c/summary>\u003cp>Increased JavaScript error rate or 5xx rate compared with the baseline, worse latency or Core Web Vitals, and for critical flows, a drop in conversion steps like add-to-cart success.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>How do database migrations fit with blue/green?\u003c/summary>\u003cp>Migrations must be backward-compatible, using the expand and contract pattern: add new columns first, deploy code that handles both, then remove old structures later, so both versions can run at once.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Docker for a front-end app: write a Dockerfile\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>I'd use a multi-stage Dockerfile. For a single-page app, the first stage uses a Node image: it copies \u003ccode>package.json\u003c/code> and the lockfile first and runs \u003ccode>npm ci\u003c/code>, so the dependency layer is cached and only rebuilds when dependencies change. Then it copies the source and runs the build. The second stage is a small nginx image that copies only the built files, with an nginx config that serves \u003ccode>index.html\u003c/code> for unknown routes and sets the cache headers. The final image has no Node or source code, just static files, so it's small and has a minimal attack surface.\u003c/p>\u003cp>For Next.js, I'd enable the standalone output, which creates a minimal server with only the needed dependencies. The final stage copies the standalone folder and static assets into a slim Node image and runs \u003ccode>node server.js\u003c/code> as a non-root user.\u003c/p>\u003cp>Other good practices: a \u003ccode>.dockerignore\u003c/code> to exclude \u003ccode>node_modules\u003c/code> and \u003ccode>.git\u003c/code>, small base images, running as non-root, health checks, and thinking about which configuration is baked in at build time versus provided at runtime.\u003c/p>\u003c/div>\n\u003cp>Multi-stage build: dependencies and build in a Node image; serve static files from a tiny nginx image (SPA), or run the Next.js standalone server.\u003c/p>\n\u003cdiv class=\"code\">\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003cpre>\u003ccode data-lang=\"dockerfile\">\u003cspan class=\"t-c\"># SPA: build with Node, serve with nginx\u003c/span>\n\u003cspan class=\"t-k\">FROM\u003c/span> node:\u003cspan class=\"t-n\">22\u003c/span>-alpine AS build\n\u003cspan class=\"t-k\">WORKDIR\u003c/span> /app\n\u003cspan class=\"t-k\">COPY\u003c/span> package*.json ./\n\u003cspan class=\"t-k\">RUN\u003c/span> npm ci\n\u003cspan class=\"t-k\">COPY\u003c/span> . .\n\u003cspan class=\"t-k\">RUN\u003c/span> npm run build\n\n\u003cspan class=\"t-k\">FROM\u003c/span> nginx:\u003cspan class=\"t-n\">1.27\u003c/span>-alpine\n\u003cspan class=\"t-k\">COPY\u003c/span> --\u003cspan class=\"t-k\">from\u003c/span>=build /app/dist /usr/share/nginx/html\n\u003cspan class=\"t-k\">COPY\u003c/span> nginx.conf /etc/nginx/conf.d/\u003cspan class=\"t-k\">default\u003c/span>.conf   \u003cspan class=\"t-c\"># try_files $uri /index.html; cache headers\u003c/span>\n\u003cspan class=\"t-k\">EXPOSE\u003c/span> \u003cspan class=\"t-n\">80\u003c/span>\u003c/code>\u003c/pre>\u003c/div>\n\u003cdiv class=\"code\">\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003cpre>\u003ccode data-lang=\"dockerfile\">\u003cspan class=\"t-c\"># Next.js (output: 'standalone' in next.config)\u003c/span>\n\u003cspan class=\"t-k\">FROM\u003c/span> node:\u003cspan class=\"t-n\">22\u003c/span>-alpine AS build\n\u003cspan class=\"t-k\">WORKDIR\u003c/span> /app\n\u003cspan class=\"t-k\">COPY\u003c/span> package*.json ./\n\u003cspan class=\"t-k\">RUN\u003c/span> npm ci\n\u003cspan class=\"t-k\">COPY\u003c/span> . .\n\u003cspan class=\"t-k\">RUN\u003c/span> npm run build\n\n\u003cspan class=\"t-k\">FROM\u003c/span> node:\u003cspan class=\"t-n\">22\u003c/span>-alpine\n\u003cspan class=\"t-k\">WORKDIR\u003c/span> /app\n\u003cspan class=\"t-k\">ENV\u003c/span> NODE_ENV=production\n\u003cspan class=\"t-k\">COPY\u003c/span> --\u003cspan class=\"t-k\">from\u003c/span>=build /app/.next/standalone ./\n\u003cspan class=\"t-k\">COPY\u003c/span> --\u003cspan class=\"t-k\">from\u003c/span>=build /app/.next/\u003cspan class=\"t-k\">static\u003c/span> ./.next/\u003cspan class=\"t-k\">static\u003c/span>\n\u003cspan class=\"t-k\">COPY\u003c/span> --\u003cspan class=\"t-k\">from\u003c/span>=build /app/public ./public\n\u003cspan class=\"t-k\">USER\u003c/span> node\n\u003cspan class=\"t-k\">EXPOSE\u003c/span> \u003cspan class=\"t-n\">3000\u003c/span>\n\u003cspan class=\"t-k\">CMD\u003c/span> [\u003cspan class=\"t-s\">\"node\"\u003c/span>, \u003cspan class=\"t-s\">\"server.js\"\u003c/span>]\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>Talking points: layer caching (copy \u003ccode>package*.json\u003c/code> first), small images (alpine/distroless), run as non-root, \u003ccode>.dockerignore\u003c/code> (node_modules, .git), health checks, and env vars at \u003cstrong>runtime\u003c/strong> vs \u003cstrong>build time\u003c/strong>.\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>Why copy package.json before the rest of the source?\u003c/summary>\u003cp>Docker caches each layer. If only the source changes, the dependency install layer is reused, which makes rebuilds much faster.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>How do you keep the image small?\u003c/summary>\u003cp>Multi-stage builds, alpine or distroless base images, production dependencies only, Next.js standalone output, and a proper \u003ccode>.dockerignore\u003c/code>.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Build-time vs runtime configuration (environment variables) in front-end apps\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>This is a common trap with front-end environment variables. Variables like \u003ccode>VITE_API_URL\u003c/code> or \u003ccode>NEXT_PUBLIC_\u003c/code> values are inlined into the JavaScript at build time. That has two consequences. First, you need a separate build for each environment, which breaks the \"build once, deploy everywhere\" principle, since you're not shipping exactly what you tested. Second, those values are visible to anyone who opens the bundle, so they must never contain secrets.\u003c/p>\u003cp>To get runtime configuration, there are a few options. Serve a \u003ccode>config.json\u003c/code> file that the app fetches on startup, with different content per environment. Inject a small configuration object into \u003ccode>index.html\u003c/code> when the container starts. Have the server or BFF read environment variables at request time. Or use relative API paths like \u003ccode>/api\u003c/code>, and let the CDN or ingress route them to the right backend per environment, which is the simplest of all.\u003c/p>\u003cp>And real secrets, like third-party API keys, stay on the server, in something like AWS Secrets Manager or Azure Key Vault, and the browser goes through the BFF.\u003c/p>\u003c/div>\n\u003cp>Front-end env vars like \u003ccode>VITE_API_URL\u003c/code> and \u003ccode>NEXT_PUBLIC_*\u003c/code> are \u003cstrong>inlined at build time\u003c/strong>. That means a separate build per environment (which breaks \"build once, deploy many\"), and \u003cstrong>everything is public\u003c/strong>: never put secrets there.\u003c/p>\n\u003cp>Options for runtime config: serve a \u003ccode>/config.json\u003c/code> (or inject \u003ccode>window.__CONFIG__\u003c/code> into \u003ccode>index.html\u003c/code> at container start), have the server/BFF read env vars at request time, or use same-origin relative API paths (\u003ccode>/api\u003c/code>) routed by the CDN/ingress per environment. Secrets live only server-side (Secrets Manager / Key Vault).\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>How would you implement runtime config for a static SPA in a container?\u003c/summary>\u003cp>At container start, a small entrypoint script writes a \u003ccode>config.js\u003c/code> from environment variables, which \u003ccode>index.html\u003c/code> loads before the app, setting values like the API URL on the window object. The same image then runs in every environment.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Kubernetes basics a front-end senior should know\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>I'm not a Kubernetes administrator, but I understand the main concepts well enough to work with platform teams. A Pod is the smallest unit and runs one or more containers. A Deployment declares how many replicas of a pod should run and handles rolling updates. A Service gives those pods a stable network address, and an Ingress routes external HTTP traffic and handles TLS. ConfigMaps and Secrets provide configuration. And the Horizontal Pod Autoscaler scales the number of pods based on CPU or traffic.\u003c/p>\u003cp>For a front-end team running a Next.js server, a few details matter. Readiness probes make sure traffic only goes to pods that are fully started, and liveness probes restart stuck pods. Resource requests and limits need to match Node's memory settings, otherwise containers get killed for running out of memory.\u003c/p>\u003cp>In the IBM and telecom world, OpenShift, Red Hat's enterprise Kubernetes platform, is common. \u003cspan class=\"fill\">[At Bell, our deployments ran through ... and my involvement was ...]\u003c/span>\u003c/p>\u003c/div>\n\u003cul>\u003cli>\u003cstrong>Pod\u003c/strong> (one or more containers), \u003cstrong>Deployment\u003c/strong> (desired replicas, rolling updates), \u003cstrong>Service\u003c/strong> (stable network endpoint), \u003cstrong>Ingress\u003c/strong> (HTTP routing/TLS from outside), \u003cstrong>ConfigMap/Secret\u003c/strong> (config), \u003cstrong>HPA\u003c/strong> (autoscaling on CPU/requests).\u003c/li>\u003cli>Liveness vs readiness probes (readiness = \"ready for traffic\": don't send requests to a Next.js pod still warming up).\u003c/li>\u003cli>Resource requests/limits; Node.js memory (\u003ccode>--max-old-space-size\u003c/code>) vs the container limit.\u003c/li>\u003cli>\u003cstrong>OpenShift\u003c/strong> = Red Hat's enterprise Kubernetes (common in IBM/telecom environments).\u003c/li>\u003c/ul>\n\u003cp>You won't be asked to write YAML from memory, but knowing these terms shows you can work with platform teams.\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>What's the difference between liveness and readiness probes?\u003c/summary>\u003cp>Readiness decides whether the pod receives traffic; if it fails, traffic stops but the pod keeps running. Liveness decides whether the pod is healthy; if it fails, Kubernetes restarts it.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>Why would a Node container get OOMKilled?\u003c/summary>\u003cp>The container exceeded its memory limit. Node's heap size may not match the limit, so you configure \u003ccode>--max-old-space-size\u003c/code> below the container limit, and look for memory leaks.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Serverless vs containers vs edge for SSR\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>Serverless functions, like AWS Lambda, scale automatically, including to zero, and you only pay per request, with no servers to manage. The trade-offs are cold starts, execution time and size limits, and database connection issues at high concurrency, which need something like RDS Proxy. They're great for spiky or low-to-medium traffic.\u003c/p>\u003cp>Containers, on ECS, Cloud Run or Kubernetes, give predictable performance, support long-lived connections like WebSockets, and give full control over the runtime. But you pay for idle capacity and you manage scaling and operations. They're better for steady high traffic.\u003c/p>\u003cp>Edge functions run in lightweight runtimes close to the user, with almost no cold start. They're ideal for redirects, personalisation, authentication checks and A/B testing, but they have limited APIs and are far from your database.\u003c/p>\u003cp>My rule of thumb: make as much as possible static and cached at the CDN, use the edge for lightweight request-time logic, and choose serverless or containers for server rendering and APIs based on traffic patterns and the team's operational experience.\u003c/p>\u003c/div>\n\u003cul>\u003cli>\u003cstrong>Serverless (Lambda/Cloud Functions):\u003c/strong> scales to zero, pay per request, no servers to manage; cold starts, execution limits, connection pooling issues with databases (use RDS Proxy / HTTP-based DBs).\u003c/li>\u003cli>\u003cstrong>Containers (ECS/Cloud Run/K8s):\u003c/strong> predictable performance, long-lived connections, full control; you pay for idle and manage scaling.\u003c/li>\u003cli>\u003cstrong>Edge (CloudFront Functions, Cloudflare Workers, Vercel Edge):\u003c/strong> lowest latency, tiny cold starts; limited runtime APIs, and data is far away unless replicated.\u003c/li>\u003c/ul>\n\u003cp>Rule of thumb: \u003cstrong>static + CDN\u003c/strong> wherever possible; edge for personalisation/redirects; serverless or containers for SSR/APIs depending on traffic shape and team ops maturity.\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>How do you reduce cold starts?\u003c/summary>\u003cp>Smaller bundles and fewer dependencies, avoiding heavy work at initialisation, choosing a faster runtime, provisioned concurrency for critical functions, and keeping functions close to their data.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>When does serverless get expensive?\u003c/summary>\u003cp>With high, steady traffic, where you're always running anyway, and long-running requests. Then containers with reserved capacity are usually cheaper.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Observability: what do you monitor for a front end?\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>I'd monitor four areas. First, errors: a tool like Sentry or Datadog captures JavaScript errors, with source maps uploaded privately during CI so stack traces are readable, tagged with the release version, so I can see immediately if a deployment introduced new errors, and alert on spikes.\u003c/p>\u003cp>Second, real-user performance: Core Web Vitals broken down by page type, device and region, plus API latency as experienced by the browser. Third, business metrics, like the conversion funnel from product page to cart to checkout completion. Often a performance or JavaScript problem shows up as a drop in conversion before anyone reports it. Fourth, synthetic monitoring: scripted user journeys that run every few minutes from different regions, so we know checkout is broken before customers tell us.\u003c/p>\u003cp>For debugging across systems, I'd propagate a trace ID from the browser request through the BFF to the microservices with OpenTelemetry, so one failing request can be followed end to end. And I'd define dashboards and SLOs. Privacy matters too: scrub personal data and respect consent, given laws like Quebec's Law 25.\u003c/p>\u003c/div>\n\u003cul>\u003cli>\u003cstrong>Errors:\u003c/strong> Sentry / Datadog / New Relic browser agent with \u003cstrong>source maps uploaded in CI\u003c/strong> (not public), release tags, grouping, alert on spikes after deploy.\u003c/li>\u003cli>\u003cstrong>Performance (RUM):\u003c/strong> Core Web Vitals per route/device/country, long tasks, API latency from the client side.\u003c/li>\u003cli>\u003cstrong>Business funnels:\u003c/strong> add-to-cart rate, checkout completion, drop-off per step. A perf regression often shows up here first.\u003c/li>\u003cli>\u003cstrong>Logs and traces:\u003c/strong> propagate a \u003cstrong>trace ID\u003c/strong> (W3C \u003ccode>traceparent\u003c/code>) from the front-end request through the BFF to microservices for end-to-end debugging (OpenTelemetry).\u003c/li>\u003cli>\u003cstrong>Synthetic monitoring:\u003c/strong> scripted journeys every few minutes from several regions (Checkly, Datadog Synthetics, CloudWatch Synthetics).\u003c/li>\u003cli>\u003cstrong>Dashboards + SLOs:\u003c/strong> e.g. \"99.9% of checkout page loads without JS error\", \"p75 LCP &lt; 2.5 s\".\u003c/li>\u003cli>Privacy: scrub PII, respect consent (Quebec \u003cstrong>Law 25\u003c/strong>, PIPEDA).\u003c/li>\u003c/ul>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>Why upload source maps privately?\u003c/summary>\u003cp>Public source maps expose your original source code. Uploading them only to the monitoring tool gives readable stack traces without publishing your code.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>How do you avoid alert fatigue?\u003c/summary>\u003cp>Alert on symptoms users feel, like error rates and SLO breaches, not every single error, use thresholds relative to baseline, and route alerts to the owning team.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Infrastructure as Code: what tools and why?\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>Infrastructure as code means defining cloud resources, like buckets, CDN distributions, DNS records and permissions, in version-controlled code instead of clicking around in the console. Changes go through code review, environments are reproducible and identical, there's a history of every change, and you avoid the drift where production was manually tweaked and nobody remembers how.\u003c/p>\u003cp>The main tools: Terraform, or its open-source fork OpenTofu, which works across clouds with its own configuration language. AWS CDK, which lets you write infrastructure in TypeScript, so it's very approachable for front-end developers. Pulumi, which supports general-purpose languages across clouds. SST, built for serverless and Next.js on AWS. And the native options, CloudFormation on AWS and Bicep on Azure.\u003c/p>\u003cp>As a front-end engineer, I'd use CDK for something like defining the S3 bucket, CloudFront distribution, security headers policy and DNS for our app, so a new environment for a feature branch or region can be created with one command.\u003c/p>\u003c/div>\n\u003cp>IaC means infrastructure defined in version-controlled code: reviewable, repeatable environments, no click-ops drift. \u003cstrong>Terraform/OpenTofu\u003c/strong> (multi-
