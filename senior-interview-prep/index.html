th product, I try to get involved early, clarify acceptance criteria before development starts, and when something is expensive, offer options instead of a flat no, so we can find the version that delivers most of the value soonest.\u003c/p>\u003cp>With design, I review designs early for things that are easy to change at that stage: accessibility, responsive behaviour, how layouts handle longer French text, and the loading, empty and error states that designs often leave out.\u003c/p>\u003cp>With backend teams, I prefer to agree on the API contract first, ideally an OpenAPI spec, and then build against mocks with MSW. That way neither team blocks the other, and integration is mostly about switching the mocks off.\u003c/p>\u003cp>With QA, at Bell we decided together which scenarios should be automated and which stay manual. I added stable selectors so their tests weren't brittle, and we automated the critical checkout journeys with Cypress, which helped reduce production bugs by about 30 percent. In general, I treat all of them as partners in the same goal rather than handoffs.\u003c/p>\u003c/div>\n\u003cul>\u003cli>\u003cstrong>Product:\u003c/strong> clarify acceptance criteria early, push back with trade-offs, break work into shippable slices.\u003c/li>\u003cli>\u003cstrong>Design:\u003c/strong> review designs early for a11y, responsive behaviour, French text length, loading/empty/error states (designs usually forget these).\u003c/li>\u003cli>\u003cstrong>Backend:\u003c/strong> contract-first APIs, mocks, shared types.\u003c/li>\u003cli>\u003cstrong>QA:\u003c/strong> decide together what's automated vs manual; give them \u003ccode>data-testid\u003c/code>s/stable roles; fix flaky tests fast.\u003c/li>\u003c/ul>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>Give an example where early involvement with design saved time.\u003c/summary>\u003cp>\u003cspan class=\"fill\">[Real example.]\u003c/span> For instance: \"In a design review I noticed the plan cards had no error or empty state, and the French text would overflow the fixed-width buttons. Fixing that in Figma took an hour; finding it after development would have meant rework and another QA cycle.\"\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>What do you do when a backend team is late?\u003c/summary>\u003cp>Keep building against the agreed contract with mocks, communicate the dependency clearly to both product owners, and adjust the plan early, for example by shipping the UI behind a flag. Escalating early with facts is much better than being surprised at the end.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Why are you leaving / why now?\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>I've really valued my time at Bell. Over four and a half years I've grown from a front-end developer to a senior full-stack role, and I've worked on things I'm proud of, like the performance improvements and the state management migration.\u003c/p>\u003cp>At this point, I'm looking for a role where I can take on more ownership of front-end architecture and work directly on a product, rather than through a consulting engagement. I want to be part of the product decisions from the start and help shape technical direction for the long term.\u003c/p>\u003cp>\u003cspan class=\"fill\">[This role stands out to me because ... for example, the scale of your product, your focus on performance, or the chance to work on your design system.]\u003c/span> It feels like a natural next step that builds on what I've been doing at Bell.\u003c/p>\u003c/div>\n\u003cp>Keep it positive: \"I've had a great 4.5 years on Bell and grew into a senior role. I'm looking for \u003cspan class=\"fill\">[a product company / deeper ownership of front-end architecture / a team where front-end performance and DX are first-class]\u003c/span>. I want to work directly on a product rather than through a consulting engagement.\" \u003cstrong>Never criticise Bell, LGS or IBM.\u003c/strong>\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>Is it about money?\u003c/summary>\u003cp>Compensation matters, as it does for everyone, but it's not the main reason. I'm looking for more ownership of architecture and to work directly on a product. If the role is the right fit, I'm confident we can agree on the compensation.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>What would make you stay at Bell?\u003c/summary>\u003cp>Honestly, I've been happy there. But what I'm looking for, direct product ownership and a long-term architectural role, is hard to get through a consulting engagement, and that's why I'm looking at roles like this one.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">What's your biggest strength / area of growth?\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>My biggest strength is taking a complex, high-traffic front end and making it faster and more reliable. At Bell, I led performance work that improved load times by about 20 percent, refactored our legacy state management to Redux Toolkit, and worked with QA on test automation that cut production bugs by around 30 percent. I enjoy finding the root cause of a problem, measuring it, fixing it, and putting guardrails in place so it stays fixed.\u003c/p>\u003cp>An area I'm actively growing in is large-scale architecture across many teams, things like micro-frontends, platform decisions and design systems that serve several products. At Bell I've been involved in team-level architecture decisions, and I've been building that broader skill by studying patterns like module federation, taking part in architecture discussions, and writing proposals for larger changes. It's one of the reasons I'm looking for a senior role with more architectural ownership.\u003c/p>\u003c/div>\n\u003cul>\u003cli>\u003cstrong>Strength:\u003c/strong> \"Taking a messy, high-traffic front end and making it faster and more reliable: performance, state management, testing.\" Back it up with the 20% and 30% numbers.\u003c/li>\u003cli>\u003cstrong>Growth:\u003c/strong> something real that you're actively working on, e.g. \"Large-scale system design across many teams. I've been studying micro-frontends and module federation, and I volunteer for architecture discussions.\" Or \"public speaking: I started running our team's tech talks\".\u003c/li>\u003c/ul>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>Give a concrete example of the area of growth in action.\u003c/summary>\u003cp>\u003cspan class=\"fill\">[Real example.]\u003c/span> For example: \"I recently wrote an architecture proposal for \u003cspan class=\"fill\">[X]\u003c/span> and presented it to the wider team. The feedback showed me I needed to consider other teams' release processes earlier, which I now do from the start.\"\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>What feedback have you received from your lead?\u003c/summary>\u003cp>\u003cspan class=\"fill\">[Real feedback.]\u003c/span> Positive feedback about reliability and performance work, plus one constructive point and what you did with it. Showing that you act on feedback is the key.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003ch2 id=\"your-numbers-memorise-these\">Your numbers (memorise these)\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>~4.5+ years\u003c/strong> on Bell e-commerce · \u003cstrong>~8 years\u003c/strong> total front-end\u003c/li>\u003cli>\u003cstrong>~20%\u003c/strong> load-time improvement (code splitting, lazy loading, Tailwind optimisation)\u003c/li>\u003cli>\u003cstrong>~30%\u003c/strong> fewer production bugs (Jest + Cypress with QA)\u003c/li>\u003cli>\u003cstrong>Promoted\u003c/strong> Front End Developer → \u003cstrong>Senior Full Stack Developer\u003c/strong> (April 2025)\u003c/li>\u003cli>\u003cspan class=\"fill\">[Add: team size, # of devs mentored, # of components in the library, traffic, Lighthouse scores]\u003c/span>\u003c/li>\u003c/ul>"},{"id":"02-javascript","title":"JavaScript Deep Dive","html":"\u003ch1 id=\"javascript-deep-dive\">JavaScript Deep Dive\u003c/h1>\n\u003cblockquote>\u003cp>Senior interviews don't ask \"what is a closure?\". They ask \u003cem>why your code has a stale value\u003c/em> or \u003cem>what this prints\u003c/em>. Know the \u003cstrong>mechanism\u003c/strong> behind each answer.\u003c/p>\u003c/blockquote>\n\u003ch2 id=\"scope-hoisting-closures\">Scope, Hoisting &amp; Closures\u003c/h2>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">What is a closure? Give a real use case.\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>A closure is a function that remembers the variables from the scope where it was created, even after that outer function has finished running. So if I write a \u003ccode>createCounter\u003c/code> function that declares \u003ccode>let count = 0\u003c/code> and returns an \u003ccode>increment\u003c/code> function, that inner function keeps access to \u003ccode>count\u003c/code>. Nobody outside can touch it, which gives you private state.\u003c/p>\u003cp>In day-to-day front-end work closures are everywhere. A debounce utility keeps its timer id in a closure. Memoization keeps its cache in one. And every React hook relies on them: an event handler closes over the props and state of the render that created it.\u003c/p>\u003cp>That's also the most common closure bug I see: stale closures. If you start a \u003ccode>setInterval\u003c/code> inside a \u003ccode>useEffect\u003c/code> with an empty dependency array, the callback sees the state from the first render forever. I fix that with a functional update like \u003ccode>setCount(c =&gt; c + 1)\u003c/code>, a ref, or the correct dependencies.\u003c/p>\u003c/div>\n\u003cp>A closure is a function bundled with references to the variables of the scope where it was \u003cstrong>created\u003c/strong>. It keeps access to those variables after the outer function has returned.\u003c/p>\n\u003cdiv class=\"code\">\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003cpre>\u003ccode data-lang=\"js\">\u003cspan class=\"t-k\">function\u003c/span> createCounter() {\n  \u003cspan class=\"t-k\">let\u003c/span> count = \u003cspan class=\"t-n\">0\u003c/span>;                 \u003cspan class=\"t-c\">// private state\u003c/span>\n  \u003cspan class=\"t-k\">return\u003c/span> {\n    inc: () =&gt; ++count,\n    get: () =&gt; count,\n  };\n}\n\u003cspan class=\"t-k\">const\u003c/span> c = createCounter();\nc.inc(); c.get(); \u003cspan class=\"t-c\">// 1. `count` is not accessible from outside\u003c/span>\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>\u003cstrong>Real uses:\u003c/strong> data privacy/encapsulation, factories, \u003ccode>debounce\u003c/code>/\u003ccode>throttle\u003c/code> (the timer id lives in a closure), memoization caches, partial application, and \u003cstrong>every React hook\u003c/strong>: event handlers close over the props/state of the render that created them.\u003c/p>\n\u003cp>\u003cstrong>Pitfall: stale closures in React.\u003c/strong> A \u003ccode>setInterval\u003c/code> created in \u003ccode>useEffect(..., [])\u003c/code> sees the \u003ccode>count\u003c/code> from the first render forever. Fix it with a functional update \u003ccode>setCount(c =&gt; c + 1)\u003c/code>, a ref, or correct dependencies.\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>Can closures cause memory leaks?\u003c/summary>\u003cp>Yes. A closure keeps the variables it references alive, so if a long-lived callback, like an event listener or a global cache, closes over a large object, that object can't be garbage collected. The fix is removing listeners when they're no longer needed and not capturing more than necessary.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>How would you create a private variable without classes?\u003c/summary>\u003cp>With a closure, like a factory function that declares a variable and returns functions that read or change it. The variable is only reachable through those functions. Today classes also have truly private \u003ccode>#fields\u003c/code>.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>Explain a stale closure with useEffect and setInterval, and three ways to fix it.\u003c/summary>\u003cp>With an empty dependency array, the interval callback closes over the state from the first render, so it always sees the initial value. Fixes: use the functional updater \u003ccode>setCount(c =&gt; c + 1)\u003c/code>; store the latest value in a ref; or include the value in the dependency array, which recreates the interval when it changes.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">var vs let vs const, hoisting and the Temporal Dead Zone\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>\u003ccode>var\u003c/code> is function-scoped, \u003ccode>let\u003c/code> and \u003ccode>const\u003c/code> are block-scoped. All three are hoisted, but differently. \u003ccode>var\u003c/code> is initialised to \u003ccode>undefined\u003c/code>, so reading it before the declaration gives you \u003ccode>undefined\u003c/code>. \u003ccode>let\u003c/code> and \u003ccode>const\u003c/code> are hoisted but left uninitialised, and that period before the declaration is the Temporal Dead Zone, so accessing them there throws a ReferenceError, which is actually safer.\u003c/p>\u003cp>\u003ccode>const\u003c/code> means the binding can't be reassigned. It doesn't make objects immutable: I can still push into a \u003ccode>const\u003c/code> array.\u003c/p>\u003cp>My default is \u003ccode>const\u003c/code> everywhere, \u003ccode>let\u003c/code> only when I genuinely reassign, like a loop counter, and I never use \u003ccode>var\u003c/code> in modern code. The block scoping also fixes the classic loop-with-setTimeout bug.\u003c/p>\u003c/div>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>\u003c/th>\u003cth>Scope\u003c/th>\u003cth>Hoisted?\u003c/th>\u003cth>Re-declare\u003c/th>\u003cth>Re-assign\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>var\u003c/code>\u003c/td>\u003ctd>function\u003c/td>\u003ctd>yes, initialised to \u003ccode>undefined\u003c/code>\u003c/td>\u003ctd>yes\u003c/td>\u003ctd>yes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>let\u003c/code>\u003c/td>\u003ctd>block\u003c/td>\u003ctd>yes, but \u003cstrong>uninitialised (TDZ)\u003c/strong>\u003c/td>\u003ctd>no\u003c/td>\u003ctd>yes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>const\u003c/code>\u003c/td>\u003ctd>block\u003c/td>\u003ctd>yes, but \u003cstrong>uninitialised (TDZ)\u003c/strong>\u003c/td>\u003ctd>no\u003c/td>\u003ctd>no (the \u003cem>binding\u003c/em> is constant; objects are still mutable)\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"code\">\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003cpre>\u003ccode data-lang=\"js\">console.log(a); \u003cspan class=\"t-c\">// undefined (var hoisted)\u003c/span>\nconsole.log(b); \u003cspan class=\"t-c\">// ReferenceError: Cannot access 'b' before initialization (TDZ)\u003c/span>\n\u003cspan class=\"t-k\">var\u003c/span> a = \u003cspan class=\"t-n\">1\u003c/span>; \u003cspan class=\"t-k\">let\u003c/span> b = \u003cspan class=\"t-n\">2\u003c/span>;\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>Function \u003cstrong>declarations\u003c/strong> are hoisted completely (you can call them before the line). Function \u003cstrong>expressions\u003c/strong> / arrow functions follow their variable's rules.\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>Is const object immutable? How do you make it immutable?\u003c/summary>\u003cp>No. Only the binding is constant, so you can still change properties. \u003ccode>Object.freeze\u003c/code> makes it shallowly immutable, and for deep immutability you freeze recursively, or use readonly types in TypeScript, or Immer for safe updates.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>Are function declarations and function expressions hoisted the same way?\u003c/summary>\u003cp>No. A function declaration is fully hoisted, so you can call it before its line. A function expression or arrow function follows the rules of its variable: with \u003ccode>const\u003c/code> it's in the TDZ, and with \u003ccode>var\u003c/code> it's undefined, so calling it early throws.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Classic: what does this print? for (var i = 0; i &lt; 3; i++) setTimeout(() =&gt; console.log(i))\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>It prints \u003ccode>3, 3, 3\u003c/code>. Because \u003ccode>var\u003c/code> is function-scoped, there's only one \u003ccode>i\u003c/code> shared by every iteration. The timeouts run after the loop has finished, and by then \u003ccode>i\u003c/code> is 3.\u003c/p>\u003cp>If you change it to \u003ccode>let\u003c/code>, it prints \u003ccode>0, 1, 2\u003c/code>, because \u003ccode>let\u003c/code> creates a new binding for each iteration of the loop, so each callback closes over its own copy. Before ES6, people solved it with an IIFE that captured \u003ccode>i\u003c/code> as a parameter, or by passing \u003ccode>i\u003c/code> as the third argument to \u003ccode>setTimeout\u003c/code>.\u003c/p>\u003cp>The underlying lesson is about closures and the event loop: callbacks capture variables, not values, and they run later.\u003c/p>\u003c/div>\n\u003cp>Prints \u003ccode>3 3 3\u003c/code>. \u003ccode>var\u003c/code> is function-scoped, so there's \u003cstrong>one\u003c/strong> \u003ccode>i\u003c/code> shared by all callbacks, and they run after the loop ends.\u003c/p>\n\u003cp>With \u003ccode>let\u003c/code>, each iteration gets a \u003cstrong>new binding\u003c/strong>, so it prints \u003ccode>0 1 2\u003c/code>. The pre-ES6 fix was an IIFE: \u003ccode>(j =&gt; setTimeout(() =&gt; console.log(j)))(i)\u003c/code>.\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>How would you fix it without using let?\u003c/summary>\u003cp>Wrap the body in an IIFE that receives \u003ccode>i\u003c/code> as a parameter, so each callback closes over its own copy, or pass \u003ccode>i\u003c/code> as the third argument to \u003ccode>setTimeout\u003c/code>, which forwards it to the callback.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>What if the delay is i * 1000?\u003c/summary>\u003cp>With \u003ccode>var\u003c/code> it still prints 3 three times, just one second apart, because the delay is evaluated at loop time but the logged value is read when the callback runs.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003ch2 id=\"this-call-apply-bind\">\u003ccode>this\u003c/code>, call/apply/bind\u003c/h2>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">How is \u003ccode>this\u003c/code> determined? (the 5 rules)\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>\u003ccode>this\u003c/code> isn't decided where a function is written. It's decided by how the function is called. There are a few rules in order of priority. If it's called with \u003ccode>new\u003c/code>, \u003ccode>this\u003c/code> is the newly created object. If it's called with \u003ccode>call\u003c/code>, \u003ccode>apply\u003c/code> or \u003ccode>bind\u003c/code>, \u003ccode>this\u003c/code> is whatever you passed explicitly. If it's called as a method, like \u003ccode>user.getName()\u003c/code>, \u003ccode>this\u003c/code> is the object to the left of the dot. Otherwise it's the default binding: \u003ccode>undefined\u003c/code> in strict mode and modules, or the global object in sloppy mode.\u003c/p>\u003cp>Arrow functions are the exception: they don't have their own \u003ccode>this\u003c/code> at all. They take it lexically from the surrounding scope, and \u003ccode>bind\u003c/code> can't change that.\u003c/p>\u003cp>The classic bug is passing a method as a callback, like \u003ccode>setTimeout(user.getName)\u003c/code>, which loses the implicit binding. You fix it with an arrow function or \u003ccode>bind\u003c/code>. In React with function components this mostly disappears, but it's still important in class components and plain JS.\u003c/p>\u003c/div>\n\u003cp>In order of precedence:\u003c/p>\n\u003col>\u003cli>\u003cstrong>\u003ccode>new\u003c/code>\u003c/strong>: \u003ccode>this\u003c/code> is the new object.\u003c/li>\u003cli>\u003cstrong>Explicit\u003c/strong>: \u003ccode>fn.call(obj)\u003c/code>, \u003ccode>fn.apply(obj)\u003c/code>, \u003ccode>fn.bind(obj)\u003c/code>.\u003c/li>\u003cli>\u003cstrong>Implicit\u003c/strong>: \u003ccode>obj.fn()\u003c/code> makes \u003ccode>this === obj\u003c/code> (whatever is left of the dot \u003cem>at call time\u003c/em>).\u003c/li>\u003cli>\u003cstrong>Default\u003c/strong>: plain \u003ccode>fn()\u003c/code> gives \u003ccode>undefined\u003c/code> in strict mode / modules, or \u003ccode>globalThis\u003c/code> in sloppy mode.\u003c/li>\u003cli>\u003cstrong>Arrow functions\u003c/strong> have no own \u003ccode>this\u003c/code>. They use \u003ccode>this\u003c/code> \u003cstrong>lexically\u003c/strong> from the enclosing scope, and \u003ccode>call\u003c/code>/\u003ccode>bind\u003c/code> can't change it.\u003c/li>\u003c/ol>\n\u003cdiv class=\"code\">\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003cpre>\u003ccode data-lang=\"js\">\u003cspan class=\"t-k\">const\u003c/span> user = {\n  name: \u003cspan class=\"t-s\">'Ana'\u003c/span>,\n  regular() { \u003cspan class=\"t-k\">return\u003c/span> \u003cspan class=\"t-k\">this\u003c/span>.name; },\n  arrow: () =&gt; \u003cspan class=\"t-k\">this\u003c/span>?.name,      \u003cspan class=\"t-c\">// lexical: module scope, so undefined\u003c/span>\n  later() { setTimeout(() =&gt; console.log(\u003cspan class=\"t-k\">this\u003c/span>.name)); }, \u003cspan class=\"t-c\">// arrow keeps `this`, so 'Ana'\u003c/span>\n};\n\u003cspan class=\"t-k\">const\u003c/span> f = user.regular;\nf();            \u003cspan class=\"t-c\">// undefined: lost implicit binding (classic bug passing methods as callbacks)\u003c/span>\u003c/code>\u003c/pre>\u003c/div>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>What is \u003ccode>this\u003c/code> inside a class method passed as an onClick in a React class component?\u003c/summary>\u003cp>It's undefined, because the method is called without its object. That's why class components bound methods in the constructor or used arrow function class fields, which capture \u003ccode>this\u003c/code> lexically.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>What does \u003ccode>this\u003c/code> refer to inside an arrow function defined as an object property?\u003c/summary>\u003cp>Not the object. The arrow takes \u003ccode>this\u003c/code> from the surrounding scope where the object literal is defined, usually the module, so it's undefined. Use a regular method syntax if you need the object.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>What happens with \u003ccode>this\u003c/code> in event listeners added with addEventListener?\u003c/summary>\u003cp>With a regular function, \u003ccode>this\u003c/code> is the element the listener is attached to, the same as \u003ccode>event.currentTarget\u003c/code>. With an arrow function, it's the outer \u003ccode>this\u003c/code>.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Difference between call, apply and bind?\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>All three let you set \u003ccode>this\u003c/code> explicitly. \u003ccode>call\u003c/code> and \u003ccode>apply\u003c/code> invoke the function immediately. The only difference is how you pass arguments: \u003ccode>call\u003c/code> takes them one by one, \u003ccode>apply\u003c/code> takes an array. A memory trick is \"A for array\".\u003c/p>\u003cp>\u003ccode>bind\u003c/code> doesn't call the function. It returns a new function with \u003ccode>this\u003c/code> permanently set, and optionally some arguments pre-filled, which is partial application. That's useful for callbacks and event handlers.\u003c/p>\u003cp>One subtle point: a bound function's \u003ccode>this\u003c/code> can't be overridden by another \u003ccode>bind\u003c/code> or \u003ccode>call\u003c/code>, but if you call it with \u003ccode>new\u003c/code>, the \u003ccode>new\u003c/code> binding wins. With spread syntax, \u003ccode>apply\u003c/code> is used much less these days.\u003c/p>\u003c/div>\n\u003cul>\u003cli>\u003ccode>fn.call(thisArg, a, b)\u003c/code>: invoke now, args listed.\u003c/li>\u003cli>\u003ccode>fn.apply(thisArg, [a, b])\u003c/code>: invoke now, args as an array.\u003c/li>\u003cli>\u003ccode>fn.bind(thisArg, a)\u003c/code>: returns a \u003cstrong>new function\u003c/strong> with \u003ccode>this\u003c/code> (and optional leading args) permanently bound. Calling \u003ccode>new\u003c/code> on a bound function ignores the bound \u003ccode>this\u003c/code>.\u003c/li>\u003c/ul>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>Can you rebind a bound function?\u003c/summary>\u003cp>No. Calling \u003ccode>bind\u003c/code> again on a bound function doesn't change \u003ccode>this\u003c/code>; the first binding wins. The only override is calling it with \u003ccode>new\u003c/code>.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>When would you use apply today?\u003c/summary>\u003cp>Rarely, since spread syntax covers most cases, like \u003ccode>Math.max(...numbers)\u003c/code>. It's mostly seen in older code or generic utility functions forwarding \u003ccode>arguments\u003c/code>.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003ch2 id=\"prototypes-classes\">Prototypes &amp; Classes\u003c/h2>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Explain prototypal inheritance. How do classes relate?\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>In JavaScript, objects inherit directly from other objects. Every object has a hidden link to its prototype. When you access a property, the engine looks on the object first, and if it's not there it walks up the prototype chain until it finds it or reaches \u003ccode>null\u003c/code>. That's how arrays get \u003ccode>map\u003c/code> and \u003ccode>filter\u003c/code>: they live on \u003ccode>Array.prototype\u003c/code>.\u003c/p>\u003cp>Classes are mostly syntax sugar over this. Methods defined in a class go onto \u003ccode>ClassName.prototype\u003c/code>, and \u003ccode>extends\u003c/code> wires up the chain. There are real differences: class bodies are always in strict mode, classes aren't usable before their declaration, they must be called with \u003ccode>new\u003c/code>, and they support private \u003ccode>#fields\u003c/code>.\u003c/p>\u003cp>When you use \u003ccode>new\u003c/code>, the engine creates an object linked to the constructor's prototype, runs the constructor with \u003ccode>this\u003c/code> set to that object, and returns it. In React work I rarely write classes, but understanding the chain helps with things like debugging \u003ccode>instanceof\u003c/code> failures or why methods are shared and not copied per instance.\u003c/p>\u003c/div>\n\u003cp>Every object has an internal \u003ccode>[[Prototype]]\u003c/code> link (\u003ccode>Object.getPrototypeOf(obj)\u003c/code>). A property lookup walks up the \u003cstrong>prototype chain\u003c/strong> until it finds the property or reaches \u003ccode>null\u003c/code>.\u003c/p>\n\u003cp>\u003ccode>class\u003c/code> is mostly \u003cstrong>syntax sugar\u003c/strong> over constructor functions + prototypes: methods go on \u003ccode>Class.prototype\u003c/code>, and \u003ccode>extends\u003c/code> sets up the chain. Real differences: classes are always strict mode, not hoisted (TDZ), must be called with \u003ccode>new\u003c/code>, and support \u003ccode>#private\u003c/code> fields and \u003ccode>static\u003c/code> blocks.\u003c/p>\n\u003cdiv class=\"code\">\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003cpre>\u003ccode data-lang=\"js\">\u003cspan class=\"t-k\">function\u003c/span> Animal(name) { \u003cspan class=\"t-k\">this\u003c/span>.name = name; }\nAnimal.prototype.speak = \u003cspan class=\"t-k\">function\u003c/span> () { \u003cspan class=\"t-k\">return\u003c/span> \u003cspan class=\"t-k\">this\u003c/span>.name + \u003cspan class=\"t-s\">' makes a sound'\u003c/span>; };\n\u003cspan class=\"t-k\">const\u003c/span> dog = \u003cspan class=\"t-k\">new\u003c/span> Animal(\u003cspan class=\"t-s\">'Rex'\u003c/span>);\ndog.speak();                        \u003cspan class=\"t-c\">// found on Animal.prototype\u003c/span>\nObject.getPrototypeOf(dog) === Animal.prototype; \u003cspan class=\"t-c\">// true\u003c/span>\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>What \u003ccode>new\u003c/code> does: 1) create an object linked to \u003ccode>Ctor.prototype\u003c/code>, 2) run the constructor with \u003ccode>this\u003c/code> = that object, 3) return it (unless the constructor returns an object).\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>What's the difference between __proto__ and prototype?\u003c/summary>\u003cp>\u003ccode>prototype\u003c/code> is a property on constructor functions; it's the object that instances will be linked to. \u003ccode>__proto__\u003c/code> is the legacy accessor on an instance pointing to its actual prototype. The modern way to read it is \u003ccode>Object.getPrototypeOf\u003c/code>.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>How do you create an object with no prototype, and why?\u003c/summary>\u003cp>\u003ccode>Object.create(null)\u003c/code>. It has no inherited keys like \u003ccode>toString\u003c/code> or \u003ccode>constructor\u003c/code>, so it's a safe dictionary. Though today I'd normally just use a Map.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>Composition or inheritance?\u003c/summary>\u003cp>I prefer composition. Deep inheritance hierarchies are rigid and hard to change. In React this is the official guidance too: compose components with children and props, and share logic with hooks.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003ch2 id=\"the-event-loop-async\">The Event Loop &amp; Async\u003c/h2>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Explain the event loop, including microtasks vs macrotasks.\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>JavaScript runs on a single thread with one call stack. Anything asynchronous, like timers, network requests or user events, is handled by the browser, which queues a callback when it's ready.\u003c/p>\u003cp>The event loop runs one task, for example the main script or a click handler, until the call stack is empty. Then it drains the entire microtask queue: promise callbacks, \u003ccode>await\u003c/code> continuations, \u003ccode>queueMicrotask\u003c/code>. Only after that does the browser get a chance to render, and then it picks the next macrotask, like a \u003ccode>setTimeout\u003c/code> callback.\u003c/p>\u003cp>So in an output-order question, synchronous logs come first, then promise callbacks, then timeouts, even a \u003ccode>setTimeout\u003c/code> of zero.\u003c/p>\u003cp>The practical reason this matters for a senior front-end developer is performance. A long synchronous task blocks rendering and input, which directly hurts INP. At Bell, when we had heavy work on interactions, the fixes were breaking the work into chunks, yielding to the main thread, using \u003ccode>useTransition\u003c/code> in React, or moving computation to a Web Worker.\u003c/p>\u003c/div>\n\u003cp>JS runs on a \u003cstrong>single thread\u003c/strong> with one \u003cstrong>call stack\u003c/strong>. Async work (timers, network, I/O) is handled by the host (browser/Node), which queues callbacks.\u003c/p>\n\u003cp>Loop (browser):\u003c/p>\n\u003col>\u003cli>Run the current script / task until the call stack is empty.\u003c/li>\u003cli>\u003cstrong>Drain the entire microtask queue\u003c/strong>: Promise reactions (\u003ccode>.then\u003c/code>, \u003ccode>await\u003c/code> continuations), \u003ccode>queueMicrotask\u003c/code>, \u003ccode>MutationObserver\u003c/code>. Microtasks added during draining also run now.\u003c/li>\u003cli>If it's time, \u003cstrong>render\u003c/strong>: \u003ccode>requestAnimationFrame\u003c/code> callbacks, style, layout, paint.\u003c/li>\u003cli>Take the \u003cstrong>next macrotask\u003c/strong> (setTimeout/setInterval, I/O, UI events, \u003ccode>MessageChannel\u003c/code>) and repeat.\u003c/li>\u003c/ol>\n\u003cdiv class=\"code\">\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003cpre>\u003ccode data-lang=\"js\">console.log(\u003cspan class=\"t-s\">'1'\u003c/span>);\nsetTimeout(() =&gt; console.log(\u003cspan class=\"t-s\">'2'\u003c/span>));\nPromise.resolve().then(() =&gt; console.log(\u003cspan class=\"t-s\">'3'\u003c/span>));\nqueueMicrotask(() =&gt; console.log(\u003cspan class=\"t-s\">'4'\u003c/span>));\n(\u003cspan class=\"t-k\">async\u003c/span> () =&gt; { console.log(\u003cspan class=\"t-s\">'5'\u003c/span>); \u003cspan class=\"t-k\">await\u003c/span> \u003cspan class=\"t-k\">null\u003c/span>; console.log(\u003cspan class=\"t-s\">'6'\u003c/span>); })();\nconsole.log(\u003cspan class=\"t-s\">'7'\u003c/span>);\n\u003cspan class=\"t-c\">// 1 5 7 3 4 6 2\u003c/span>\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>\u003cstrong>Why it matters:\u003c/strong> a long synchronous task (&gt; 50 ms) blocks rendering and input, which hurts \u003cstrong>INP\u003c/strong>. Break work up (\u003ccode>scheduler.yield()\u003c/code>, \u003ccode>setTimeout\u003c/code>, chunking), move it to a \u003cstrong>Web Worker\u003c/strong>, or use \u003ccode>useTransition\u003c/code> in React. An infinite microtask loop freezes the page even though nothing is \"synchronous\".\u003c/p>\n\u003cp>Node extras: \u003ccode>process.nextTick\u003c/code> runs before other microtasks; phases are timers → poll → check (\u003ccode>setImmediate\u003c/code>).\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>What's the difference between setTimeout(fn, 0) and queueMicrotask(fn)?\u003c/summary>\u003cp>\u003ccode>queueMicrotask\u003c/code> runs right after the current task, before rendering and before any timers. \u003ccode>setTimeout\u003c/code> with zero schedules a new macrotask, which runs after microtasks and possibly after a render, and browsers clamp nested timeouts to at least 4 ms.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>Where does requestAnimationFrame fit?\u003c/summary>\u003cp>It runs right before the browser paints the next frame, after microtasks. It's the right place for visual updates and animations, because it syncs with the display refresh rate.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>Can a promise chain freeze the page?\u003c/summary>\u003cp>Yes. Microtasks run until the queue is empty, so an infinite chain of microtasks never lets the browser render or handle input, even though each step is \"async\".\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Promises: states, chaining, error handling, and the combinators\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>A promise represents a future value. It starts pending and settles exactly once, either fulfilled or rejected. \u003ccode>.then\u003c/code> always returns a new promise, which is what makes chaining work: returning a value fulfils the next promise, throwing rejects it, and returning another promise makes the chain wait for it.\u003c/p>\u003cp>For error handling I put a \u003ccode>.catch\u003c/code> at the end of the chain, or use try/catch with async/await. The common mistake is forgetting to return inside a \u003ccode>.then\u003c/code>, which breaks the chain silently.\u003c/p>\u003cp>For combining promises: \u003ccode>Promise.all\u003c/code> waits for everything but fails fast on the first rejection, which is good when all results are required. \u003ccode>allSettled\u003c/code> gives you every outcome, which is better for a dashboard where some widgets can fail independently. \u003ccode>race\u003c/code> settles with whichever finishes first, which is useful for timeouts. \u003ccode>any\u003c/code> gives the first success. I pick based on whether a partial failure should fail the whole operation.\u003c/p>\u003c/div>\n\u003cp>States: \u003cstrong>pending → fulfilled | rejected\u003c/strong> (settled once, immutable). \u003ccode>.then\u003c/code> always returns a \u003cstrong>new promise\u003c/strong>, which enables chaining. Returning a value fulfils it, throwing rejects it, and returning a promise adopts its state.\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Combinator\u003c/th>\u003cth>Resolves when\u003c/th>\u003cth>Rejects when\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>Promise.all\u003c/code>\u003c/td>\u003ctd>all fulfil (array of values, in order)\u003c/td>\u003ctd>\u003cstrong>first\u003c/strong> rejection (fail-fast)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>Promise.allSettled\u003c/code>\u003c/td>\u003ctd>all settle (\u003ccode>{status, value/reason}\u003c/code>)\u003c/td>\u003ctd>never\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>Promise.race\u003c/code>\u003c/td>\u003ctd>first to settle (either way)\u003c/td>\u003ctd>first to settle with rejection\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>Promise.any\u003c/code>\u003c/td>\u003ctd>first to fulfil\u003c/td>\u003ctd>all reject → \u003ccode>AggregateError\u003c/code>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Also: \u003ccode>Promise.withResolvers()\u003c/code> (ES2024) returns \u003ccode>{ promise, resolve, reject }\u003c/code>.\u003c/p>\n\u003cp>Pitfalls: forgetting to \u003ccode>return\u003c/code> inside \u003ccode>.then\u003c/code> breaks the chain; an unhandled rejection triggers an \u003ccode>unhandledrejection\u003c/code> event; \u003ccode>async\u003c/code> functions in \u003ccode>forEach\u003c/code> are \u003cstrong>not awaited\u003c/strong> (use \u003ccode>for...of\u003c/code> or \u003ccode>Promise.all(arr.map(...))\u003c/code>).\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>What happens if you throw inside a .then?\u003c/summary>\u003cp>The promise returned by that \u003ccode>.then\u003c/code> is rejected with the error, and it skips forward to the next \u003ccode>.catch\u003c/code> or rejection handler in the chain.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>What's the difference between .catch at the end and the second argument of .then?\u003c/summary>\u003cp>The second argument of \u003ccode>.then\u003c/code> only handles rejections from earlier in the chain, not errors thrown in the success handler of that same \u003ccode>.then\u003c/code>. A \u003ccode>.catch\u003c/code> at the end catches both.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>How do you add a timeout to a promise?\u003c/summary>\u003cp>Race it against a promise that rejects after a delay with \u003ccode>Promise.race\u003c/code>. For fetch specifically, the better option is \u003ccode>AbortSignal.timeout(ms)\u003c/code>, because it actually cancels the request instead of just ignoring it.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">async/await: sequential vs parallel, and error handling\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>\u003ccode>async/await\u003c/code> is syntax over promises that makes async code read top to bottom. The trap I look for in code review is accidental sequential awaits. If you \u003ccode>await getUser()\u003c/code> and then \u003ccode>await getOrders()\u003c/code> and they're independent, you pay for both latencies one after another. Starting them together with \u003ccode>Promise.all\u003c/code> means you only wait for the slowest one.\u003c/p>\u003cp>For errors I use try/catch. Two details matter. First, \u003ccode>fetch\u003c/code> doesn't reject on a 404 or 500, only on network failure, so I always check \u003ccode>response.ok\u003c/code> and throw. Second, if I'm cancelling requests with an AbortController, I check for \u003ccode>AbortError\u003c/code> and ignore it, because that's intentional.\u003c/p>\u003cp>One more gotcha: \u003ccode>forEach\u003c/code> doesn't wait for async callbacks. If I need to process items sequentially I use \u003ccode>for...of\u003c/code> with \u003ccode>await\u003c/code>, and in parallel I use \u003ccode>Promise.all\u003c/code> with \u003ccode>map\u003c/code>.\u003c/p>\u003c/div>\n\u003cdiv class=\"code\">\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003cpre>\u003ccode data-lang=\"js\">\u003cspan class=\"t-c\">// ❌ Sequential: total = a + b\u003c/span>\n\u003cspan class=\"t-k\">const\u003c/span> user = \u003cspan class=\"t-k\">await\u003c/span> getUser();\n\u003cspan class=\"t-k\">const\u003c/span> orders = \u003cspan class=\"t-k\">await\u003c/span> getOrders();\n\n\u003cspan class=\"t-c\">// ✅ Parallel when independent: total = max(a, b)\u003c/span>\n\u003cspan class=\"t-k\">const\u003c/span> [user2, orders2] = \u003cspan class=\"t-k\">await\u003c/span> Promise.all([getUser(), getOrders()]);\n\n\u003cspan class=\"t-c\">// Error handling\u003c/span>\n\u003cspan class=\"t-k\">try\u003c/span> {\n  \u003cspan class=\"t-k\">const\u003c/span> res = \u003cspan class=\"t-k\">await\u003c/span> fetch(url, { signal });\n  \u003cspan class=\"t-k\">if\u003c/span> (!res.ok) \u003cspan class=\"t-k\">throw\u003c/span> \u003cspan class=\"t-k\">new\u003c/span> Error(\u003cspan class=\"t-s\">'HTTP '\u003c/span> + res.status); \u003cspan class=\"t-c\">// fetch does NOT reject on 404/500!\u003c/span>\n  \u003cspan class=\"t-k\">return\u003c/span> \u003cspan class=\"t-k\">await\u003c/span> res.json();\n} \u003cspan class=\"t-k\">catch\u003c/span> (err) {\n  \u003cspan class=\"t-k\">if\u003c/span> (err.name === \u003cspan class=\"t-s\">'AbortError'\u003c/span>) \u003cspan class=\"t-k\">return\u003c/span>;    \u003cspan class=\"t-c\">// cancelled on purpose\u003c/span>\n  \u003cspan class=\"t-k\">throw\u003c/span> err;\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>\u003ccode>await\u003c/code> pauses only the current async function; the rest of the thread keeps running. \u003ccode>return await\u003c/code> matters inside \u003ccode>try/catch\u003c/code>, because without the \u003ccode>await\u003c/code> the catch won't see the rejection.\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>What does an async function return if you return a plain value?\u003c/summary>\u003cp>It always returns a promise, resolved with that value. And if the function throws, the promise is rejected.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>How would you run requests in parallel but tolerate failures?\u003c/summary>\u003cp>\u003ccode>Promise.allSettled\u003c/code>, then handle the fulfilled and rejected results separately, for example showing the widgets that loaded and an error state for the ones that didn't.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>Is top-level await allowed?\u003c/summary>\u003cp>Yes, in ES modules. But it blocks the evaluation of every module that imports that module, so I use it carefully, mainly for config loading or scripts.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">How do you cancel a fetch? Why does that matter in React?\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>I use an \u003ccode>AbortController\u003c/code>. You create a controller, pass \u003ccode>controller.signal\u003c/code> into \u003ccode>fetch\u003c/code>, and calling \u003ccode>controller.abort()\u003c/code> cancels the request and rejects it with an \u003ccode>AbortError\u003c/code>.\u003c/p>\u003cp>In React this matters a lot, because of race conditions. Take a search box: the user types \"ip\", then \"iphone\". If the response for \"ip\" comes back after the response for \"iphone\", it overwrites the correct results. So in my \u003ccode>useEffect\u003c/code> I create a controller and return a cleanup that aborts it. Whenever the query changes or the component unmounts, the previous request is cancelled. I also ignore \u003ccode>AbortError\u003c/code> in the catch so it doesn't show an error message.\u003c/p>\u003cp>At Bell we had exactly this with product filtering: fast filter clicks could show stale results. Aborting stale requests fixed it. In production code I usually let TanStack Query or RTK Query handle this, since they pass an abort signal and key results by query.\u003c/p>\u003c/div>\n\u003cp>Use \u003ccode>AbortController\u003c/code>:\u003c/p>\n\u003cdiv class=\"code\">\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003cpre>\u003ccode data-lang=\"js\">useEffect(() =&gt; {\n  \u003cspan class=\"t-k\">const\u003c/span> controller = \u003cspan class=\"t-k\">new\u003c/span> AbortController();\n  fetch(\u003cspan class=\"t-s\">'/api/search?q='\u003c/span> + q, { signal: controller.signal })\n    .then(r =&gt; r.json())\n    .then(setResults)\n    .\u003cspan class=\"t-k\">catch\u003c/span>(e =&gt; { \u003cspan class=\"t-k\">if\u003c/span> (e.name !== \u003cspan class=\"t-s\">'AbortError'\u003c/span>) setError(e); });\n  \u003cspan class=\"t-k\">return\u003c/span> () =&gt; controller.abort();   \u003cspan class=\"t-c\">// cleanup on q change / unmount\u003c/span>\n}, [q]);\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>It prevents \u003cstrong>race conditions\u003c/strong>: response for \"ab\" arriving after \"abc\" and overwriting it. It also avoids wasted bandwidth and setting state after unmount. \u003ccode>AbortSignal.timeout(5000)\u003c/code> gives timeouts and \u003ccode>AbortSignal.any([...])\u003c/code> combines signals.\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>Does aborting stop the server from processing the request?\u003c/summary>\u003cp>Not necessarily. Aborting closes the connection on the client, but the server may already be processing it. That's why non-idempotent operations like orders need server-side protection, such as idempotency keys.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>How do you cancel with axios?\u003c/summary>\u003cp>Modern axios also accepts an AbortController \u003ccode>signal\u003c/code>. The old CancelToken API is deprecated.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>How do you combine a timeout with user cancellation?\u003c/summary>\u003cp>\u003ccode>AbortSignal.any([controller.signal, AbortSignal.timeout(5000)])\u003c/code> creates a signal that aborts on whichever happens first.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003ch2 id=\"types-equality-coercion\">Types, Equality &amp; Coercion\u003c/h2>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">== vs ===, and the falsy values\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>Triple equals compares value and type with no conversion. Double equals applies type coercion first, so \u003ccode>'1' == 1\u003c/code> is true, and there are confusing cases like \u003ccode>null == 0\u003c/code> being false while \u003ccode>null == undefined\u003c/code> is true.\u003c/p>\u003cp>I use triple equals everywhere, enforced by ESLint. The one idiom I accept is \u003ccode>x == null\u003c/code>, because it neatly checks for both \u003ccode>null\u003c/code> and \u003ccode>undefined\u003c/code>.\u003c/p>\u003cp>For falsy values, there are only a few: \u003ccode>false\u003c/code>, \u003ccode>0\u003c/code>, \u003ccode>-0\u003c/code>, \u003ccode>0n\u003c/code>, empty string, \u003ccode>null\u003c/code>, \u003ccode>undefined\u003c/code> and \u003ccode>NaN\u003c/code>. Everything else is truthy, including empty arrays, empty objects and the string \"0\". That's why I prefer the nullish coalescing operator \u003ccode>??\u003c/code> for defaults. With \u003ccode>||\u003c/code>, a legitimate value like a quantity of \u003ccode>0\u003c/code> would be replaced by the default.\u003c/p>\u003c/div>\n\u003cp>\u003ccode>===\u003c/code> compares without type conversion. \u003ccode>==\u003c/code> applies the abstract equality algorithm (coercion): \u003ccode>'1' == 1\u003c/code>, \u003ccode>null == undefined\u003c/code> (true), \u003ccode>null == 0\u003c/code> (false), \u003ccode>NaN == NaN\u003c/code> (false).\u003c/p>\n\u003cp>Falsy: \u003ccode>false, 0, -0, 0n, '', null, undefined, NaN\u003c/code> (and \u003ccode>document.all\u003c/code>). Everything else is truthy, \u003cstrong>including \u003ccode>[]\u003c/code>, \u003ccode>{}\u003c/code> and \u003ccode>'0'\u003c/code>\u003c/strong>.\u003c/p>\n\u003cp>Use \u003ccode>===\u003c/code> everywhere. The one common idiom is \u003ccode>x == null\u003c/code> to check null \u003cem>or\u003c/em> undefined. Use \u003ccode>Object.is\u003c/code> for \u003ccode>NaN\u003c/code>/\u003ccode>-0\u003c/code> edge cases. Use \u003ccode>??\u003c/code> (nullish) instead of \u003ccode>||\u003c/code> when \u003ccode>0\u003c/code> or \u003ccode>''\u003c/code> are valid values: \u003ccode>count ?? 10\u003c/code>.\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>What is Object.is and how does it differ from ===?\u003c/summary>\u003cp>It's almost the same, but it treats \u003ccode>NaN\u003c/code> as equal to \u003ccode>NaN\u003c/code>, and \u003ccode>+0\u003c/code> and \u003ccode>-0\u003c/code> as different. React uses \u003ccode>Object.is\u003c/code> to compare state and dependencies.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>What does [] == false return, and why?\u003c/summary>\u003cp>True. Both sides are converted to numbers: the empty array becomes an empty string, then 0, and false becomes 0. It's a good example of why I avoid \u003ccode>==\u003c/code>.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Primitive vs reference types; shallow vs deep copy\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>Primitives, like strings, numbers and booleans, are immutable and copied by value. Objects, arrays and functions are reference types: when you assign or pass them, you share a reference to the same object, so mutating it through one variable affects every other variable holding it.\u003c/p>\u003cp>A shallow copy, like spread or \u003ccode>Object.assign\u003c/code>, only copies the top level. Nested objects are still shared. For a deep copy I use \u003ccode>structuredClone\u003c/code>, which handles dates, maps, sets and circular references. The old \u003ccode>JSON.parse(JSON.stringify())\u003c/code> trick loses dates, \u003ccode>undefined\u003c/code> and functions.\u003c/p>\u003cp>This matters a lot in React and Redux because they detect changes by reference. If you mutate state in place, the reference doesn't change, so React may not re-render and memoized selectors break. That's one reason Redux Toolkit uses Immer: you write mutating code, and it produces a new immutable object for you.\u003c/p>\u003c/div>\n\u003cp>Primitives (\u003ccode>string, number, bigint, boolean, undefined, null, symbol\u003c/code>) are immutable and copied by value. Objects (including arrays and functions) are passed by \u003cem>sharing a reference\u003c/em>.\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Shallow copy:\u003c/strong> \u003ccode>{...obj}\u003c/code>, \u003ccode>[...arr]\u003c/code>, \u003ccode>Object.assign\u003c/code>. Nested objects are still shared.\u003c/li>\u003cli>\u003cstrong>Deep copy:\u003c/strong> \u003ccode>structuredClone(obj)\u003c/code> handles Dates, Maps, Sets and cycles, but \u003cstrong>not functions, DOM nodes or class prototypes\u003c/strong>. \u003ccode>JSON.parse(JSON.stringify())\u003c/code> loses \u003ccode>undefined\u003c/code>, functions, Dates (become strings), \u003ccode>Infinity\u003c/code>, and fails on cycles.\u003c/li>\u003c/ul>\n\u003cp>React relies on \u003cstrong>immutability\u003c/strong>: new references signal change (\u003ccode>setState\u003c/code>, \u003ccode>React.memo\u003c/code> and selectors compare by reference).\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>Is JavaScript pass-by-reference?\u003c/summary>\u003cp>Technically it's always pass-by-value, but for objects the value is a reference. So you can mutate the object inside a function, but reassigning the parameter doesn't affect the caller's variable.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>How do you update a nested object immutably?\u003c/summary>\u003cp>Spread each level that changes, like copying the user, then copying the address with a new city. For deeper or frequent updates I use Immer, which Redux Toolkit already includes.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>What can't structuredClone copy?\u003c/summary>\u003cp>Functions, DOM nodes, symbols as values, and class prototypes: class instances come back as plain objects, and getters are lost.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">What does typeof return for null, arrays, functions? How do you check types reliably?\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>\u003ccode>typeof null\u003c/code> returns \"object\", which is a historical bug. Arrays also return \"object\", functions return \"function\", and \u003ccode>NaN\u003c/code> returns \"number\".\u003c/p>\u003cp>So for reliable checks I use specific tools: \u003ccode>Array.isArray\u003c/code> for arrays, a strict \u003ccode>=== null\u003c/code> check for null, \u003ccode>Number.isNaN\u003c/code> for NaN, and \u003ccode>instanceof\u003c/code> for class instances like \u003ccode>Date\u003c/code>, with the caveat that \u003ccode>instanceof\u003c/code> can fail across iframes. The most generic option is \u003ccode>Object.prototype.toString.call(value)\u003c/code>, which returns things like \"\u003cspan class=\"fill\">[object Date]\u003c/span>\".\u003c/p>\u003cp>In practice, with TypeScript most of these checks become type guards and narrowing, but at runtime boundaries, like API data, I'd validate with a schema library like Zod rather than hand-written typeof checks.\u003c/p>\u003c/div>\n\u003cp>\u003ccode>typeof null === 'object'\u003c/code> (a historic bug), \u003ccode>typeof [] === 'object'\u003c/code>, \u003ccode>typeof function(){} === 'function'\u003c/code>, \u003ccode>typeof NaN === 'number'\u003c/code>.\u003c/p>\n\u003cp>Reliable checks: \u003ccode>Array.isArray(x)\u003c/code>, \u003ccode>x === null\u003c/code>, \u003ccode>Number.isNaN(x)\u003c/code>, \u003ccode>x instanceof Date\u003c/code> (fails across iframes/realms), and \u003ccode>Object.prototype.toString.call(x)\u003c/code> returns \u003ccode>'[object Date]'\u003c/code>.\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>How do you check if a value is a plain object?\u003c/summary>\u003cp>Check it's not null, \u003ccode>typeof\u003c/code> is \"object\", and \u003ccode>Object.getPrototypeOf(value)\u003c/code> is either \u003ccode>Object.prototype\u003c/code> or null. That excludes arrays, dates and class instances.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>Why can instanceof fail?\u003c/summary>\u003cp>Each realm, like an iframe, has its own global constructors, so an array from an iframe isn't an instance of the parent page's Array. That's why \u003ccode>Array.isArray\u003c/code> exists.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003ch2 id=\"modern-language-features\">Modern Language Features\u003c/h2>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Map/Set vs Object/Array; WeakMap/WeakRef\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>I use a \u003ccode>Map\u003c/code> when keys are dynamic, are not strings, or are added and removed frequently. It accepts any key type including objects, keeps insertion order, has a \u003ccode>size\u003c/code> property, and has no risk of colliding with prototype keys like \"constructor\". A plain object is still great for fixed, known shapes like a config or a DTO.\u003c/p>\u003cp>A \u003ccode>Set\u003c/code> is for unique values. Deduplicating an array is just spreading a new Set, and lookups are O(1), unlike \u003ccode>array.includes\u003c/code>.\u003c/p>\u003cp>\u003ccode>WeakMap\u003c/code> and \u003ccode>WeakSet\u003c/code> hold their keys weakly, so they don't prevent garbage collection. That makes them perfect for attaching metadata or caches to objects or DOM nodes without leaking memory. The trade-off is that they're not iterable. \u003ccode>WeakRef\u003c/code> exists too, but I'd rarely reach for it in application code.\u003c/p>\u003c/div>\n\u003cul>\u003cli>\u003cstrong>Map:\u003c/strong> any key type (objects too), insertion order, \u003ccode>.size\u003c/code>, no prototype key collisions, better for frequent add/delete.\u003c/li>\u003cli>\u003cstrong>Set:\u003c/strong> unique values; ES2025 adds set methods \u003ccode>union\u003c/code>, \u003ccode>intersection\u003c/code>, \u003ccode>difference\u003c/code>, \u003ccode>isSubsetOf\u003c/code>...\u003c/li>\u003cli>\u003cstrong>WeakMap/WeakSet:\u003c/strong> keys must be objects and are held \u003cstrong>weakly\u003c/strong>, so they don't prevent garbage collection. Not iterable. Use them for caching metadata about DOM nodes/objects without leaks.\u003c/li>\u003cli>\u003cstrong>WeakRef / FinalizationRegistry:\u003c/strong> advanced, rarely needed.\u003c/li>\u003c/ul>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>How do you deduplicate an array of objects by id?\u003c/summary>\u003cp>Use a Map keyed by id: \u003ccode>[...new Map(items.map(i =&gt; [i.id, i])).values()]\u003c/code>. That keeps the last item for each id in O(n).\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>Why can't you iterate a WeakMap?\u003c/summary>\u003cp>Because its entries can disappear at any time when keys are garbage collected, so iteration results would be non-deterministic. That's by design.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>Can you JSON.stringify a Map?\u003c/summary>\u003cp>Not directly; it becomes an empty object. You convert it first, for example with \u003ccode>Object.fromEntries(map)\u003c/code> or \u003ccode>[...map]\u003c/code>.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">ES Modules vs CommonJS\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>ES Modules use \u003ccode>import\u003c/code> and \u003ccode>export\u003c/code>. Their structure is static, so bundlers can analyse them at build time, and that's what enables tree-shaking. They load asynchronously, support top-level await, and work natively in browsers.\u003c/p>\u003cp>CommonJS uses \u003ccode>require\u003c/code> and \u003ccode>module.exports\u003c/code>. It's synchronous and dynamic, which makes it hard to tree-shake, and it's the legacy Node format.\u003c/p>\u003cp>For front-end work, ESM is the standard. One very practical feature is dynamic \u003ccode>import()\u003c/code>, which returns a promise and is the basis of code splitting. \u003ccode>React.lazy\u003c/code> uses it to load a route only when it's needed. That's one of the techniques I used to improve load times on the Bell site. I also watch for libraries that only ship CommonJS, because they can bloat the bundle.\u003c/p>\u003c/div>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>ESM (\u003ccode>import/export\u003c/code>)\u003c/th>\u003cth>CJS (\u003ccode>require/module.exports\u003c/code>)\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Static structure, so tree-shakable\u003c/td>\u003ctd>Dynamic, hard to tree-shake\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Async loading, top-level \u003ccode>await\u003c/code>\u003c/td>\u003ctd>Synchronous\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Live bindings\u003c/td>\u003ctd>Copies of exported values\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Native in browsers (\u003ccode>type=\"module\"\u003c/code>)\u003c/td>\u003ctd>Node legacy\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Dynamic \u003ccode>import()\u003c/code> returns a promise. It's the basis of \u003cstrong>code splitting\u003c/strong> (\u003ccode>React.lazy(() =&gt; import('./Page'))\u003c/code>). Mention \u003ccode>\"type\": \"module\"\u003c/code>, the \u003ccode>exports\u003c/code> field in package.json, and dual packages.\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>What's a barrel file and why can it hurt?\u003c/summary>\u003cp>An \u003ccode>index.js\u003c/code> that re-exports everything from a folder. It's convenient, but it can make bundlers pull in or evaluate far more code than needed, and slows down dev servers and tests. I use them carefully, especially in large apps.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>What does \"sideEffects\": false in package.json do?\u003c/summary>\u003cp>It tells the bundler that importing a module doesn't run any code with side effects, so unused exports and modules can be safely removed. If files like CSS imports do have side effects, you list them explicitly.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>What are live bindings?\u003c/summary>\u003cp>With ESM, an imported variable reflects the current value of the exported variable. With CommonJS, you get a copy at the time of require.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Generators and iterators: where are they actually used?\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>A generator function, written with \u003ccode>function*\u003c/code>, returns an iterator. Each \u003ccode>yield\u003c/code> pauses execution and produces a value, and the function resumes when you call \u003ccode>next()\u003c/code>. That makes generators good for lazy or infinite sequences, where you only compute values as they're needed.\u003c/p>\u003cp>Where I've actually seen them: custom iterables using \u003ccode>Symbol.iterator\u003c/code>; async generators with \u003ccode>for await...of\u003c/code>, which are a really clean way to consume paginated APIs page by page; and redux-saga, which is built entirely on generators for managing side effects. There are also new iterator helpers in the language that allow lazy \u003ccode>map\u003c/code> and \u003ccode>filter\u003c/code> over iterators.\u003c/p>\u003cp>That said, in typical React application code I rarely write generators directly. I'd mention them mainly for pagination streams and legacy saga code.\u003c/p>\u003c/div>\n\u003cp>\u003ccode>function*\u003c/code> returns an iterator; \u003ccode>yield\u003c/code> pauses execution. Uses: lazy/infinite sequences, custom iterables (\u003ccode>[Symbol.iterator]\u003c/code>), paginated API readers with \u003ccode>async function*\u003c/code> + \u003ccode>for await...of\u003c/code>, and redux-saga. ES2025 adds \u003cstrong>Iterator helpers\u003c/strong> (\u003ccode>iter.map().filter().take()\u003c/code>), which are lazy.\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>How would you consume a paginated API with an async generator?\u003c/summary>\u003cp>Write an async generator that fetches a page, yields each item, follows the next cursor, and stops when there isn't one. The caller just uses \u003ccode>for await\u003c/code> over it, without knowing about pagination.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>What's the difference between an iterable and an iterator?\u003c/summary>\u003cp>An iterable has a \u003ccode>Symbol.iterator\u003c/code> method that returns an iterator. An iterator has a \u003ccode>next()\u003c/code> method that returns objects with a \u003ccode>value\u003c/code> and a \u003ccode>done\u003c/code> flag.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Optional chaining, nullish coalescing, logical assignment, other modern syntax you should use\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>The modern syntax I use daily: optional chaining, like \u003ccode>user?.address?.city\u003c/code>, which short-circuits to undefined instead of throwing. Nullish coalescing \u003ccode>??\u003c/code>, which only falls back on null or undefined, unlike \u003ccode>||\u003c/code>, which also replaces \u003ccode>0\u003c/code> and empty strings. And logical assignment, like \u003ccode>options.retries ??= 3\u003c/code>.\u003c/p>\u003cp>For arrays, I like the non-mutating methods: \u003ccode>toSorted\u003c/code>, \u003ccode>toReversed\u003c/code> and \u003ccode>with\u003c/code>, because they return new arrays, which fits React state perfectly. I don't have to copy before sorting anymore. \u003ccode>at(-1)\u003c/code> gets the last element, and \u003ccode>Object.groupBy\u003c/code> replaces a lot of reduce boilerplate.\u003c/p>\u003cp>Also \u003ccode>structuredClone\u003c/code> for deep copies, \u003ccode>Promise.withResolvers\u003c/code>, and private class fields with \u003ccode>#\u003c/code>. Using these well makes code shorter and removes whole categories of bugs.\u003c/p>\u003c/div>\n\u003cp>\u003ccode>a?.b?.[key]?.()\u003c/code>, \u003ccode>x ?? fallback\u003c/code>, \u003ccode>a ||= b\u003c/code>, \u003ccode>a ??= b\u003c/code>, \u003ccode>arr.at(-1)\u003c/code>, \u003ccode>Object.groupBy(items, i =&gt; i.type)\u003c/code>, \u003ccode>arr.toSorted() / toReversed() / with(i, v)\u003c/code> (non-mutating, great for React state), \u003ccode>structuredClone\u003c/code>, \u003ccode>Array.prototype.findLast\u003c/code>, \u003ccode>Promise.withResolvers\u003c/code>, top-level \u003ccode>await\u003c/code>, \u003ccode>#private\u003c/code> class fields.\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>When is optional chaining a code smell?\u003c/summary>\u003cp>When it's sprinkled everywhere to hide unclear data contracts. If a value should always exist, I'd rather validate at the boundary and fail clearly than silently render undefined deep in the UI.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>Difference between a ||= b and a ??= b?\u003c/summary>\u003cp>\u003ccode>||=\u003c/code> assigns when \u003ccode>a\u003c/code> is falsy, including 0 and an empty string. \u003ccode>??=\u003c/code> assigns only when \u003ccode>a\u003c/code> is null or undefined.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003ch2 id=\"memory-performance\">Memory &amp; Performance\u003c/h2>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">How does garbage collection work, and what causes memory leaks in front-end apps?\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>JavaScript engines like V8 use a mark-and-sweep garbage collector. Starting from roots, such as global variables and the current call stack, it marks everything reachable, and anything not reachable is freed. It's generational: new objects are collected frequently and cheaply, and long-lived ones are moved to an old generation that's collected less often.\u003c/p>\u003cp>So a memory leak in a front-end app means something is still reachable that shouldn't be. The most common causes I've seen are event listeners, intervals or subscriptions that aren't cleaned up when a component unmounts, which in React means a missing \u003ccode>useEffect\u003c/code> cleanup. Others are detached DOM nodes still referenced from JavaScript, closures holding large objects, and caches that grow forever.\u003c/p>\u003cp>To debug, I use the Memory panel in Chrome DevTools: take a heap snapshot, perform the action several times, take another, and compare what grew. The \"detached elements\" view is very useful. For caches, I use an LRU limit or a WeakMap.\u003c/p>\u003c/div>\n\u003cp>V8 uses \u003cstrong>mark-and-sweep\u003c/strong>: anything reachable from the roots (globals, the stack) is kept. It's generational: a young generation (scavenger, frequent) and an old generation (mark-compact).\u003c/p>\n\u003cp>Common leaks:\u003c/p>\n\u003cul>\u003cli>Event listeners / \u003ccode>setInterval\u003c/code> / subscriptions \u003cstrong>not removed on unmount\u003c/strong> (missing \u003ccode>useEffect\u003c/code> cleanup).\u003c/li>\u003cli>Detached DOM nodes still referenced by JS.\u003c/li>\u003cli>Closures holding big objects; ever-growing caches/maps (use LRU or WeakMap).\u003c/li>\u003cli>Global variables, observers (\u003ccode>ResizeObserver\u003c/code>, \u003ccode>IntersectionObserver\u003c/code>) not disconnected.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Debugging:\u003c/strong> DevTools Memory → heap snapshots (compare before/after), \"Detached elements\", allocation timeline.\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>Walk me through finding a leak in a React app.\u003c/summary>\u003cp>I'd reproduce the action several times, like opening and closing a modal, taking a heap snapshot before and after, and comparing. If retained objects grow, the retainers view shows what's holding them, often a listener or subscription without cleanup, or detached DOM nodes.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>Does React automatically remove event listeners?\u003c/summary>\u003cp>For listeners declared in JSX, like \u003ccode>onClick\u003c/code>, yes. For anything added manually in an effect, such as \u003ccode>window.addEventListener\u003c/code>, an observer or a subscription, you must remove it in the cleanup.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Debounce vs throttle: when do you use each?\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>Both limit how often a function runs, but in different ways. Debounce waits until activity stops: the function runs only after there have been, say, 300 milliseconds of no new calls. Throttle guarantees the function runs at most once per interval during continuous activity.\u003c/p>\u003cp>I use debounce for search inputs, autocomplete and autosave, where I care about the final value. At Bell, the address lookup for checking which internet services are available was a perfect case: we only call the API once the user pauses typing.\u003c/p>\u003cp>I use throttle for continuous events like scroll position, resize or mouse move, where I want regular updates but not hundreds per second.\u003c/p>\u003cp>That said, for many scroll use cases there are better tools: \u003ccode>IntersectionObserver\u003c/code> for detecting visibility, like lazy loading or infinite scroll, and \u003ccode>requestAnimationFrame\u003c/code> for visual updates. In React, I make sure the debounced function is stable across renders, otherwise each render creates a new timer.\u003c/p>\u003c/div>\n\u003cul>\u003cli>\u003cstrong>Debounce:\u003c/strong> run \u003cstrong>after\u003c/strong> activity stops for N ms. Use it for search input, autosave and window-resize-end. Example: \"fire the serviceability lookup 300 ms after the user stops typing\".\u003c/li>\u003cli>\u003cstrong>Throttle:\u003c/strong> run \u003cstrong>at most once per\u003c/strong> N ms during continuous activity. Use it for scroll position, mousemove, drag and analytics on scroll.\u003c/li>\u003c/ul>\n\u003cp>For animation-tied work prefer \u003ccode>requestAnimationFrame\u003c/code>. For visibility prefer \u003ccode>IntersectionObserver\u003c/code> over scroll handlers. Implementations are in Coding Challenges.\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>What delay would you choose for a search box?\u003c/summary>\u003cp>Around 250 to 300 milliseconds. Shorter makes too many requests, longer feels sluggish. I'd confirm with real usage, and combine it with cancellation and caching.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>How do you debounce correctly in a React component?\u003c/summary>\u003cp>Either debounce the value with a \u003ccode>useDebounce\u003c/code> hook, or create the debounced function once with \u003ccode>useMemo\u003c/code> or a ref, and cancel it on unmount. Creating it inline means a new debounced function every render, which breaks it.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>What's leading versus trailing debounce?\u003c/summary>\u003cp>Trailing runs after the activity stops, which is the default. Leading runs immediately on the first call and then ignores calls until things are quiet, which is good for preventing double clicks on a button.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">What are Web Workers? When would you use one?\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>Web Workers let you run JavaScript on a background thread, separate from the main thread. They don't have access to the DOM, and they communicate with the page by posting messages. Data is copied, or transferred without copying for things like ArrayBuffers.\u003c/p>\u003cp>I'd use one for CPU-heavy work that would otherwise block the main thread and make the UI unresponsive: parsing a big JSON or CSV file, image processing, building a search index on the client, or complex calculations. Moving that work off the main thread directly helps INP. Librar
