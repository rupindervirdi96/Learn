<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Senior Front-End Interview Prep</title>
<style>
:root {
  --bg: #0f0f17; --panel: #151827; --card: #1d2138; --line: #2a2f4d;
  --text: #e2e8f0; --muted: #8b93a7; --accent: #e94560; --accent-soft: rgba(233,69,96,.12);
  --green: #4ade80; --green-soft: rgba(74,222,128,.12); --yellow: #fbbf24; --blue: #60a5fa; --purple: #a78bfa;
  --code-bg: #0b0d16; --shadow: 0 8px 30px rgba(0,0,0,.35);
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #f6f7fb; --panel: #ffffff; --card: #eef0f7; --line: #dde1ee;
  --text: #1a1f36; --muted: #5b6478; --accent: #d6334f; --accent-soft: rgba(214,51,79,.08);
  --green: #15803d; --green-soft: rgba(21,128,61,.08); --yellow: #b45309; --blue: #1d4ed8; --purple: #6d28d9;
  --code-bg: #f1f3f9; --shadow: 0 8px 30px rgba(20,30,60,.08);
  color-scheme: light;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.65 'Segoe UI', system-ui, -apple-system, sans-serif; }
a { color: var(--blue); }
code, pre, .mono { font-family: 'Cascadia Code', 'Consolas', ui-monospace, monospace; }

/* Layout */
.layout { display: grid; grid-template-columns: 290px minmax(0, 1fr); min-height: 100vh; }
.sidebar { position: sticky; top: 0; height: 100vh; overflow-y: auto; background: var(--panel); border-right: 1px solid var(--line); padding: 1.2rem 0.9rem 2rem; }
.brand { padding: 0 .5rem 1rem; }
.brand h1 { font-size: 1.15rem; margin: 0; line-height: 1.3; }
.brand h1 span { color: var(--accent); }
.brand p { margin: .25rem 0 0; color: var(--muted); font-size: .8rem; }
.overall { margin: 0 .5rem 1rem; }
.bar { height: 6px; background: var(--card); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--purple)); border-radius: 99px; transition: width .3s; }
.overall small { color: var(--muted); font-size: .75rem; }
.modes { display: grid; grid-template-columns: repeat(3, 1fr); gap: .3rem; margin: 0 .3rem 1rem; }
.modes button { border: 1px solid var(--line); background: var(--card); color: var(--muted); padding: .45rem .2rem; border-radius: 8px; cursor: pointer; font-size: .78rem; font-weight: 600; }
.modes button.active { color: #fff; background: var(--accent); border-color: var(--accent); }
.nav { list-style: none; margin: 0; padding: 0; }
.nav a { display: grid; grid-template-columns: 1fr auto; gap: .2rem .5rem; padding: .5rem .6rem; border-radius: 8px; color: var(--text); text-decoration: none; font-size: .86rem; }
.nav a:hover { background: var(--card); }
.nav a.active { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
.nav .count { color: var(--muted); font-size: .72rem; font-variant-numeric: tabular-nums; }
.nav .mini { grid-column: 1 / -1; height: 3px; background: var(--card); border-radius: 9px; overflow: hidden; }
.nav .mini i { display: block; height: 100%; background: var(--green); }
.theme-btn { margin: 1rem .5rem 0; width: calc(100% - 1rem); border: 1px solid var(--line); background: transparent; color: var(--muted); padding: .45rem; border-radius: 8px; cursor: pointer; }

.main { min-width: 0; }
.topbar { position: sticky; top: 0; z-index: 10; display: flex; gap: .6rem; align-items: center; padding: .7rem 2rem; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.menu-btn { display: none; border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 8px; padding: .4rem .7rem; cursor: pointer; }
.search { position: relative; flex: 1; max-width: 560px; }
.search input { width: 100%; padding: .55rem .9rem .55rem 2.1rem; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--text); font-size: .9rem; }
.search::before { content: '⌕'; position: absolute; left: .75rem; top: .42rem; color: var(--muted); font-size: 1.05rem; }
.results { position: absolute; top: calc(100% + 6px); left: 0; right: 0; max-height: 60vh; overflow-y: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: .3rem; }
.results button { display: block; width: 100%; text-align: left; border: 0; background: transparent; color: var(--text); padding: .5rem .7rem; border-radius: 7px; cursor: pointer; font-size: .86rem; }
.results button:hover, .results button:focus { background: var(--card); outline: none; }
.results small { display: block; color: var(--muted); font-size: .72rem; }
.kbd-hint { color: var(--muted); font-size: .75rem; white-space: nowrap; }

.content { max-width: 920px; padding: 2rem 2rem 5rem; margin: 0 auto; }
.content h1 { overflow-wrap: anywhere; font-size: 2rem; line-height: 1.2; margin: .2rem 0 1rem; }
.content h2 { font-size: 1.35rem; margin: 2.4rem 0 .8rem; padding-bottom: .35rem; border-bottom: 1px solid var(--line); }
.content h3 { font-size: 1.1rem; margin: 1.8rem 0 .6rem; color: var(--purple); }
.content h4 { margin: 1.2rem 0 .4rem; }
.content p { margin: .6rem 0; }
.content ul, .content ol { padding-left: 1.4rem; margin: .5rem 0; }
.content li { margin: .25rem 0; }
.content li.task { list-style: none; margin-left: -1.3rem; }
.content strong { color: color-mix(in srgb, var(--text) 100%, var(--yellow) 0%); }
:not(pre) > code { background: var(--card); padding: .1rem .38rem; border-radius: 5px; font-size: .86em; color: var(--yellow); }
.fill { color: var(--yellow); background: rgba(251,191,36,.1); border-radius: 4px; padding: 0 .15rem; }
blockquote { margin: 1rem 0; padding: .7rem 1.1rem; border-left: 4px solid var(--accent); background: var(--accent-soft); border-radius: 0 10px 10px 0; }
blockquote p { margin: .3rem 0; }
.table-wrap { overflow-x: auto; margin: 1rem 0; border: 1px solid var(--line); border-radius: 10px; }
table { border-collapse: collapse; width: 100%; font-size: .87rem; }
th, td { text-align: left; padding: .55rem .75rem; border-bottom: 1px solid var(--line); vertical-align: top; }
th { background: var(--card); font-weight: 700; }
tr:last-child td { border-bottom: 0; }
.code { position: relative; margin: .9rem 0; }
pre { margin: 0; background: var(--code-bg); border: 1px solid var(--line); border-radius: 10px; padding: 1rem 1.1rem; overflow-x: auto; font-size: .82rem; line-height: 1.55; }
.copy { position: absolute; top: .45rem; right: .45rem; opacity: 0; transition: opacity .15s; border: 1px solid var(--line); background: var(--card); color: var(--muted); border-radius: 6px; padding: .15rem .55rem; font-size: .72rem; cursor: pointer; }
.code:hover .copy, .copy:focus { opacity: 1; }
.t-c { color: var(--muted); font-style: italic; } .t-s { color: var(--green); } .t-k { color: var(--purple); } .t-n { color: var(--yellow); }

/* Q&A */
.chapter-tools { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; margin: 0 0 1.5rem; padding: .7rem .9rem; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
.chapter-tools .grow { flex: 1; min-width: 160px; }
.chapter-tools small { color: var(--muted); }
.btn { border: 1px solid var(--line); background: var(--card); color: var(--text); padding: .38rem .8rem; border-radius: 8px; cursor: pointer; font-size: .8rem; font-weight: 600; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.good { background: var(--green-soft); border-color: var(--green); color: var(--green); }
details.qa { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; margin: .7rem 0; transition: border-color .15s; }
details.qa[open] { border-color: color-mix(in srgb, var(--accent) 50%, var(--line)); }
details.qa.mastered { border-left: 4px solid var(--green); }
details.qa > summary { display: flex; align-items: center; gap: .7rem; cursor: pointer; padding: .8rem 1rem; list-style: none; font-weight: 600; }
details.qa > summary::-webkit-details-marker { display: none; }
details.qa > summary::before { content: '▸'; color: var(--accent); transition: transform .15s; flex: none; }
details.qa[open] > summary::before { transform: rotate(90deg); }
details.qa > summary .q { flex: 1; }
.followups { margin: 1.4rem 0 .4rem; padding: .9rem 1.1rem; border-radius: 12px; background: color-mix(in srgb, var(--purple) 8%, transparent); border: 1px solid color-mix(in srgb, var(--purple) 32%, var(--line)); }
.fu-label { font-size: .75rem; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: var(--purple); margin-bottom: .4rem; }
.fu-label span { font-weight: 600; text-transform: none; letter-spacing: 0; color: var(--muted); margin-left: .4rem; }
details.fu { border-top: 1px dashed var(--line); }
details.fu:first-of-type { border-top: 0; }
details.fu > summary { cursor: pointer; padding: .55rem 0 .55rem 1.3rem; font-weight: 600; list-style: none; position: relative; }
details.fu > summary::-webkit-details-marker { display: none; }
details.fu > summary::before { content: 'Q'; position: absolute; left: 0; top: .55rem; font-size: .7rem; font-weight: 800; color: var(--purple); }
details.fu[open] > summary { color: var(--purple); }
details.fu > p { margin: 0 0 .7rem 1.3rem; line-height: 1.7; }
.master-btn { flex: none; border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 99px; padding: .15rem .65rem; font-size: .72rem; cursor: pointer; white-space: nowrap; }
.mastered .master-btn { color: var(--green); border-color: var(--green); background: var(--green-soft); }
.ans { padding: 0 1.2rem 1rem 2.2rem; border-top: 1px dashed var(--line); }
.hide-mastered details.qa.mastered { display: none; }
.mock { margin: 1rem 0 1.2rem; padding: .9rem 1.1rem; border-radius: 12px; background: color-mix(in srgb, var(--blue) 9%, transparent); border: 1px solid color-mix(in srgb, var(--blue) 35%, var(--line)); }
.mock p { margin: .5rem 0; line-height: 1.75; }
.mock-label { font-size: .75rem; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: var(--blue); margin-bottom: .2rem; }
.mock-label span { font-weight: 600; text-transform: none; letter-spacing: 0; color: var(--muted); margin-left: .4rem; }
.notes-label { font-size: .75rem; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin-top: 1.2rem; }
.hide-notes .ans > :not(.mock):not(.followups) { display: none; }
.speak-btn { margin-left: .5rem; border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 6px; padding: .1rem .5rem; font-size: .72rem; cursor: pointer; text-transform: none; letter-spacing: 0; }
.pager { display: flex; justify-content: space-between; gap: 1rem; margin-top: 3rem; }
.pager a { flex: 1; padding: .9rem 1rem; border: 1px solid var(--line); border-radius: 12px; text-decoration: none; color: var(--text); background: var(--panel); }
.pager a:hover { border-color: var(--accent); }
.pager small { display: block; color: var(--muted); font-size: .72rem; }
.pager .next { text-align: right; }

/* Flashcards */
.fc-setup { display: flex; flex-wrap: wrap; gap: .7rem; align-items: center; margin-bottom: 1.2rem; }
.fc-setup select, .fc-setup label { font-size: .85rem; }
select { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: .4rem .6rem; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 1.6rem 1.8rem; box-shadow: var(--shadow); }
.card .tag { display: inline-block; font-size: .72rem; font-weight: 700; color: var(--accent); background: var(--accent-soft); padding: .15rem .6rem; border-radius: 99px; margin-bottom: .7rem; }
.card .question { font-size: 1.3rem; font-weight: 700; line-height: 1.4; }
.card .answer { margin-top: 1.2rem; padding-top: 1rem; border-top: 1px dashed var(--line); }
.card-actions { display: flex; flex-wrap: wrap; gap: .6rem; margin-top: 1.4rem; }
.fc-meta { color: var(--muted); font-size: .8rem; margin-top: .8rem; }
.tip { color: var(--muted); font-size: .85rem; margin-bottom: 1rem; }
.timer { font-variant-numeric: tabular-nums; color: var(--yellow); font-weight: 700; }

/* Progress */
.prog-grid { display: grid; gap: .6rem; }
.prog-row { display: grid; grid-template-columns: 1fr 90px 160px; gap: 1rem; align-items: center; background: var(--panel); border: 1px solid var(--line); padding: .7rem 1rem; border-radius: 10px; text-decoration: none; color: var(--text); }
.prog-row:hover { border-color: var(--accent); }
.prog-row span { color: var(--muted); font-size: .82rem; text-align: right; font-variant-numeric: tabular-nums; }
.stat-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: .8rem; margin: 1rem 0 1.6rem; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 1rem; }
.stat b { display: block; font-size: 1.8rem; line-height: 1.1; }
.stat small { color: var(--muted); }

@media (max-width: 860px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .sidebar { position: fixed; z-index: 30; left: 0; top: 0; width: 290px; transform: translateX(-100%); transition: transform .2s; box-shadow: var(--shadow); }
  .sidebar.open { transform: none; }
  .menu-btn { display: inline-block; }
  .topbar { padding: .6rem 1rem; }
  .content { padding: 1.4rem 1rem 4rem; }
  .content h1 { font-size: 1.55rem; }
  .kbd-hint { display: none; }
  .prog-row { grid-template-columns: 1fr 70px; }
  .prog-row .bar { grid-column: 1 / -1; }
  .ans { padding: 0 .9rem 1rem 1rem; }
}
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <h1>Senior <span>Front-End</span> Interview Prep</h1>
      <p>React · JavaScript · Cloud · System Design</p>
    </div>
    <div class="overall">
      <div class="bar"><i id="overallBar" style="width:0"></i></div>
      <small id="overallText"></small>
    </div>
    <div class="modes" role="tablist" aria-label="Mode">
      <button data-mode="study" class="active">📖 Study</button>
      <button data-mode="cards">🃏 Cards</button>
      <button data-mode="progress">📊 Progress</button>
    </div>
    <ul class="nav" id="nav"></ul>
    <button class="theme-btn" id="themeBtn" type="button">◐ Toggle theme</button>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="menu-btn" id="menuBtn" type="button" aria-label="Open chapters">☰</button>
      <div class="search">
        <input id="search" type="search" placeholder="Search questions… (press / )" autocomplete="off" aria-label="Search questions">
        <div class="results" id="results" hidden></div>
      </div>
      <span class="kbd-hint">Cards: <b>Space</b> reveal · <b>G</b> got it · <b>→</b> next</span>
    </header>
    <main class="content" id="content"></main>
  </div>
</div>

<script>
const CHAPTERS = [{"id":"00-game-plan","title":"Game Plan — How to Use This Guide","html":"\u003ch1 id=\"game-plan-how-to-use-this-guide\">Game Plan — How to Use This Guide\u003c/h1>\n\u003cblockquote>\u003cp>\u003cstrong>Goal:\u003c/strong> walk into a Senior Front-End (React / JavaScript) interview ready to (1) tell a credible senior story about your Bell work, (2) answer deep technical questions, (3) code live, (4) design a front-end system on a whiteboard, and (5) talk confidently about cloud, CI/CD and production.\u003c/p>\u003c/blockquote>\n\u003ch2 id=\"what-a-senior-interview-loop-usually-looks-like\">What a senior interview loop usually looks like\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Round\u003c/th>\u003cth>Length\u003c/th>\u003cth>What they're really testing\u003c/th>\u003cth>Where to study\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Recruiter screen\u003c/td>\u003ctd>20–30 min\u003c/td>\u003ctd>Communication, salary range, notice period, \"why you\"\u003c/td>\u003ctd>Your Story\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Tech screen\u003c/td>\u003ctd>45–60 min\u003c/td>\u003ctd>JS/React fundamentals, one small coding task\u003c/td>\u003ctd>JavaScript, React\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Live coding\u003c/td>\u003ctd>60 min\u003c/td>\u003ctd>Build a component or utility, talk while coding, test it\u003c/td>\u003ctd>Coding Challenges\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Front-end system design\u003c/td>\u003ctd>60 min\u003c/td>\u003ctd>Architecture, trade-offs, performance, scaling to many teams\u003c/td>\u003ctd>System Design, Performance, Cloud\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Behavioral / leadership\u003c/td>\u003ctd>45–60 min\u003c/td>\u003ctd>Ownership, conflict, mentoring, influence, failure\u003c/td>\u003ctd>Your Story, Leadership\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hiring manager\u003c/td>\u003ctd>30–45 min\u003c/td>\u003ctd>Do they want you on the team? Your motivation and ambition\u003c/td>\u003ctd>Your Story, Cheat Sheet\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"what-separates-senior-from-intermediate-answers\">What separates \"senior\" from \"intermediate\" answers\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Trade-offs, not facts.\u003c/strong> Don't stop at \"useMemo caches a value\". Add \"...but it has a cost. I only use it when profiling shows a slow computation or when I need a stable reference for a memoized child.\"\u003c/li>\u003cli>\u003cstrong>Scope beyond the ticket.\u003c/strong> Talk about the team, the codebase, the users and the business: \"this reduced checkout drop-off\", \"this unblocked 3 other teams\".\u003c/li>\u003cli>\u003cstrong>Production thinking.\u003c/strong> Monitoring, rollbacks, feature flags, accessibility, i18n, security and performance budgets.\u003c/li>\u003cli>\u003cstrong>Influence.\u003c/strong> \"I wrote an RFC\", \"I set up the lint rule so the whole team got it for free\", \"I mentored two juniors through...\"\u003c/li>\u003cli>\u003cstrong>Say \"it depends\", then say what it depends on.\u003c/strong> Follow it with a recommendation every time.\u003c/li>\u003c/ul>\n\u003ch2 id=\"a-14-day-study-plan\">A 14-day study plan\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Day\u003c/th>\u003cth>Focus\u003c/th>\u003cth>Output\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>Your Story: write and rehearse the 60s and 2-min pitch out loud, then fill in the real numbers in the STAR stories\u003c/td>\u003ctd>Record yourself once\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>JavaScript core (closures, \u003ccode>this\u003c/code>, prototypes, event loop, promises)\u003c/td>\u003ctd>Flashcards: JavaScript\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>Coding: debounce, throttle, Promise.all, deep clone, memoize, EventEmitter\u003c/td>\u003ctd>Write each from scratch in &lt; 10 min\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>React internals: rendering, reconciliation, hooks, effects, memoization\u003c/td>\u003ctd>Flashcards: React\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>React 19 + concurrent features + Server Components + Next.js\u003c/td>\u003ctd>Explain RSC to a rubber duck\u003c/td>\u003c/tr>\u003ctr>\u003ctd>6\u003c/td>\u003ctd>React coding: autocomplete, infinite scroll, modal, data table, form\u003c/td>\u003ctd>Build 2 of them timed (45 min)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>7\u003c/td>\u003ctd>TypeScript + state management (RTK, RTK Query, TanStack Query, Zustand)\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>8\u003c/td>\u003ctd>Performance + Core Web Vitals, plus your Bell perf story\u003c/td>\u003ctd>Be able to name 10 techniques\u003c/td>\u003c/tr>\u003ctr>\u003ctd>9\u003c/td>\u003ctd>Accessibility, CSS, HTML, i18n\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>10\u003c/td>\u003ctd>Testing + security\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>11\u003c/td>\u003ctd>System design: practise 2 designs out loud with the RADIO framework\u003c/td>\u003ctd>Draw on paper\u003c/td>\u003c/tr>\u003ctr>\u003ctd>12\u003c/td>\u003ctd>Cloud &amp; DevOps: AWS front-end hosting, CI/CD, Docker, monitoring\u003c/td>\u003ctd>Draw the S3+CloudFront diagram from memory\u003c/td>\u003c/tr>\u003ctr>\u003ctd>13\u003c/td>\u003ctd>Leadership / behavioral: rehearse 8 STAR stories, then a mock interview\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>14\u003c/td>\u003ctd>Cheat Sheet only. Rest. Prepare questions to ask.\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"how-to-answer-any-technical-question-the-4-step-pattern\">How to answer any technical question (the 4-step pattern)\u003c/h2>\n\u003col>\u003cli>\u003cstrong>Define it\u003c/strong> in one sentence.\u003c/li>\u003cli>\u003cstrong>Explain how it works\u003c/strong> (the mechanism, not just the definition).\u003c/li>\u003cli>\u003cstrong>Give an example\u003c/strong>, ideally from Bell: \"On the Bell checkout we...\"\u003c/li>\u003cli>\u003cstrong>Trade-offs / when NOT to use it.\u003c/strong> This step is what makes the answer senior.\u003c/li>\u003c/ol>\n\u003ch2 id=\"how-to-approach-live-coding\">How to approach live coding\u003c/h2>\n\u003col>\u003cli>Restate the problem and ask clarifying questions about inputs, edge cases and the expected API.\u003c/li>\u003cli>Say your approach out loud \u003cstrong>before\u003c/strong> typing.\u003c/li>\u003cli>Start with a working simple version, then improve it.\u003c/li>\u003cli>Narrate as you go: \"I'm using a ref here so the timer survives re-renders.\"\u003c/li>\u003cli>Test with edge cases: empty input, rapid clicks, unmount mid-request, keyboard users.\u003c/li>\u003cli>Finish with \"If I had more time I'd add... (a11y, tests, error states, cancellation)\".\u003c/li>\u003c/ol>\n\u003ch2 id=\"day-of-checklist\">Day-of checklist\u003c/h2>\n\u003cul>\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" class=\"chk\" data-chk=\"0\"> Camera, mic and IDE ready; a CodeSandbox/StackBlitz React template open\u003c/label>\u003c/li>\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" class=\"chk\" data-chk=\"1\"> Water, notepad for system-design sketches\u003c/label>\u003c/li>\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" class=\"chk\" data-chk=\"2\"> Your 60-second pitch rehearsed out loud\u003c/label>\u003c/li>\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" class=\"chk\" data-chk=\"3\"> 3 numbers you will mention: \u003cstrong>~20% faster page loads\u003c/strong>, \u003cstrong>~30% fewer production bugs\u003c/strong>, \u003cstrong>promoted to Senior Full Stack (Apr 2025)\u003c/strong>\u003c/label>\u003c/li>\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" class=\"chk\" data-chk=\"4\"> 3–5 questions for them (see Cheat Sheet)\u003c/label>\u003c/li>\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" class=\"chk\" data-chk=\"5\"> The job description re-read: map each requirement to one of your stories\u003c/label>\u003c/li>\u003c/ul>"},{"id":"01-your-story","title":"Your Story — Background, Pitch & STAR Stories","html":"\u003ch1 id=\"your-story-background-pitch-star-stories\">Your Story — Background, Pitch &amp; STAR Stories\u003c/h1>\n\u003cblockquote>\u003cp>⚠️ \u003cstrong>Read this first.\u003c/strong> This chapter is built from your actual résumé: LGS (an IBM company) consultant at \u003cstrong>Bell\u003c/strong>, \u003cem>Front End Developer Jan 2022 – Mar 2025\u003c/em>, \u003cem>Senior Full Stack Developer Apr 2025 – present\u003c/em>, working on Bell's e-commerce site. Wherever you see \u003cstrong>\u003cspan class=\"fill\">[brackets]\u003c/span>\u003c/strong>, replace them with your real details. Senior interviewers drill 3–4 levels deep on every claim (\"how did you measure that 20%?\"). \u003cstrong>Only say what you actually did.\u003c/strong> If a detail below doesn't match your real project, change it or drop it.\u003c/p>\u003c/blockquote>\n\u003ch2 id=\"your-profile-in-one-view\">Your profile in one view\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Current role\u003c/strong>\u003c/td>\u003ctd>Senior Full Stack Developer, LGS (an IBM company), consultant on Bell's digital/e-commerce team (Apr 2025 – present)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Previous role\u003c/strong>\u003c/td>\u003ctd>Front End Developer, same engagement (Jan 2022 – Mar 2025)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Bell tenure\u003c/strong>\u003c/td>\u003ctd>~4.5+ years on the same product, a strong signal of depth and trust\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Earlier\u003c/strong>\u003c/td>\u003ctd>Front End Developer, Enrage Tech, India (2015 – 2018), multiple client projects\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Total front-end experience\u003c/strong>\u003c/td>\u003ctd>~7–8 years\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Education\u003c/strong>\u003c/td>\u003ctd>AEC IT Programmer Analyst, Collège LaSalle (Montréal); Bachelor's in Computer Science, Guru Nanak Dev University\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Core stack\u003c/strong>\u003c/td>\u003ctd>React, Next.js, TypeScript, JavaScript, Redux Toolkit, Tailwind CSS, Node.js, NestJS, Express, PostgreSQL, MongoDB\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Quality\u003c/strong>\u003c/td>\u003ctd>Jest, React Testing Library, Cypress\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Wins (résumé)\u003c/strong>\u003c/td>\u003ctd>~20% faster load times; ~30% fewer production bugs; Redux Toolkit refactor; REST integration for filtering, cart and checkout; Core Web Vitals improvements\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Bonus\u003c/strong>\u003c/td>\u003ctd>AI integration: OpenAI API, embeddings, vector DB (Supabase/pgvector), RAG\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"the-bell-context-what-you-can-talk-about\">The Bell context (what you can talk about)\u003c/h2>\n\u003cp>The Bell e-commerce platform is a strong senior story because telecom e-commerce is \u003cstrong>harder than a normal store\u003c/strong>:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Complex products:\u003c/strong> phones plus rate plans plus add-ons; internet/TV bundles; promotions that depend on region, customer type and existing services.\u003c/li>\u003cli>\u003cstrong>Serviceability checks:\u003c/strong> \"Is Fibe internet available at this address?\" means async address lookup, debouncing and error states.\u003c/li>\u003cli>\u003cstrong>Checkout with real-world constraints:\u003c/strong> identity and credit checks, existing-customer login, porting a number, delivery or store pickup, appointment booking for installation.\u003c/li>\u003cli>\u003cstrong>Bilingual (EN/FR):\u003c/strong> Canadian requirements and Quebec French-language law, so i18n is core, not an afterthought. French strings are often ~20–30% longer, which affects layouts.\u003c/li>\u003cli>\u003cstrong>Accessibility:\u003c/strong> telecom is federally regulated, so the \u003cem>Accessible Canada Act\u003c/em> applies, plus \u003cem>AODA\u003c/em> in Ontario. Target \u003cstrong>WCAG 2.1 AA\u003c/strong> or better.\u003c/li>\u003cli>\u003cstrong>Scale and traffic spikes:\u003c/strong> device launch days and Black Friday / Boxing Day. Performance and caching matter.\u003c/li>\u003cli>\u003cstrong>Many teams, one site:\u003c/strong> shared design system, shared header/footer, multiple squads, release trains and QA cycles. This is perfect material for system-design and leadership questions.\u003c/li>\u003cli>\u003cstrong>SEO:\u003c/strong> product and plan pages must rank, so SSR/SSG and Core Web Vitals matter for revenue.\u003c/li>\u003c/ul>\n\u003cblockquote>\u003cp>🔧 \u003cstrong>\u003cspan class=\"fill\">[Fill in]\u003c/span>\u003c/strong> Which parts did \u003cem>you\u003c/em> own? e.g. \u003cspan class=\"fill\">[product listing + filters]\u003c/span>, \u003cspan class=\"fill\">[cart]\u003c/span>, \u003cspan class=\"fill\">[checkout steps]\u003c/span>, \u003cspan class=\"fill\">[plan selector]\u003c/span>, \u003cspan class=\"fill\">[serviceability check]\u003c/span>, \u003cspan class=\"fill\">[shared component library]\u003c/span>. How many devs were on your squad? \u003cspan class=\"fill\">[ ]\u003c/span> What was the release cadence? \u003cspan class=\"fill\">[ ]\u003c/span> Which backend did you call: REST microservices, a BFF, or a commerce platform? \u003cspan class=\"fill\">[ ]\u003c/span>\u003c/p>\u003c/blockquote>\n\u003ch3 id=\"a-simple-architecture-you-can-draw-adapt-it-to-reality\">A simple architecture you can draw (adapt it to reality)\u003c/h3>\n\u003cdiv class=\"code\">\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003cpre>\u003ccode data-lang=\"\"> Browser (React SPA / Next.js pages, EN/FR)\n    │  HTTPS\n    ▼\n CDN (\u003cspan class=\"t-k\">static\u003c/span> assets, cached HTML \u003cspan class=\"t-k\">for\u003c/span> marketing pages)\n    │\n    ▼\n Web/BFF layer (Node)  ── auth/session ──► Identity (login, SSO)\n    │  REST/JSON\n    ├──► Catalog service (devices, plans, prices, promos)\n    ├──► Serviceability service (address → available products)\n    ├──► Cart service\n    ├──► Checkout / Order service ──► Credit check, payment, fulfilment\n    └──► Content (CMS) \u003cspan class=\"t-k\">for\u003c/span> marketing copy, banners, legal text\n\n Front end: React + Redux Toolkit (cart/checkout state), Tailwind, shared components\n Quality: Jest + RTL (unit/integration), Cypress (E2E critical paths), CI pipeline\n Observability: [Analytics tag manager / Adobe / GA], [error monitoring], Lighthouse/CWV\u003c/code>\u003c/pre>\u003c/div>\n\u003cblockquote>\u003cp>🔧 Replace any box that doesn't exist in your project. Interviewers love it when you can \u003cstrong>draw your current system from memory\u003c/strong> and point to the part you changed.\u003c/p>\u003c/blockquote>\n\u003ch2 id=\"handling-lgs-ibm-bell-how-to-explain-it\">Handling \"LGS / IBM / Bell\": how to explain it\u003c/h2>\n\u003cblockquote>\u003cp>\"I'm employed by LGS, which is an IBM company, and I've been embedded full-time on Bell's digital e-commerce team for about four and a half years. Day-to-day I work like any Bell team member: same squad, same standups, same codebase and release process. In April 2025 I was promoted to Senior Full Stack Developer on the same engagement.\"\u003c/p>\u003c/blockquote>\n\u003cp>Why it's good: it removes the \"just a contractor\" doubt and shows that \u003cstrong>long tenure plus a promotion means the client trusted you\u003c/strong>.\u003c/p>\n\u003ch2 id=\"handling-the-2018-2022-gap\">Handling the 2018–2022 gap\u003c/h2>\n\u003cblockquote>\u003cp>\"In 2018 I moved to Canada. I completed the IT Programmer Analyst program at Collège LaSalle in Montréal to get Canadian credentials and modernise my stack (React, Node, MongoDB), and then joined LGS/IBM on the Bell account in January 2022.\"\u003c/p>\u003c/blockquote>\n\u003cblockquote>\u003cp>🔧 Adjust it to what actually happened. Keep it short, positive and forward-looking.\u003c/p>\u003c/blockquote>\n\u003ch2 id=\"tell-me-about-yourself-60-second-version\">\"Tell me about yourself\": 60-second version\u003c/h2>\n\u003cblockquote>\u003cp>\"I'm a front-end-focused full-stack developer with about eight years of experience, the last four and a half on Bell's e-commerce platform through LGS, an IBM company.\u003c/p>\u003cp>At Bell I build the customer-facing shopping experience in React: product listing and filtering, cart and checkout. I've done a lot of work on performance and code quality. I led a refactor of our legacy state management to Redux Toolkit, and I improved Core Web Vitals with code splitting, lazy loading and CSS optimisation, which cut load times by roughly 20%. I also worked closely with QA to build out Jest and Cypress automation, which reduced production bugs by around 30%.\u003c/p>\u003cp>In 2025 I was promoted to Senior Full Stack Developer, so now I also work on the Node/Nest side and mentor other developers. Recently I've been integrating AI features using the OpenAI API and RAG.\u003c/p>\u003cp>I'm looking for a senior front-end role where I can own architecture and performance for a product at scale, which is why this role caught my attention.\"\u003c/p>\u003c/blockquote>\n\u003ch2 id=\"tell-me-about-yourself-2-minute-version-add-these-beats\">\"Tell me about yourself\": 2-minute version (add these beats)\u003c/h2>\n\u003col>\u003cli>\u003cstrong>Origin\u003c/strong> (10 s): started in 2015 at Enrage Tech building responsive sites and React components for multiple clients. \u003cem>Learned to ship for real clients fast.\u003c/em>\u003c/li>\u003cli>\u003cstrong>Bell, Front-End years\u003c/strong> (40 s): owned \u003cspan class=\"fill\">[features]\u003c/span>. Biggest technical wins: RTK refactor, API integration for filter/cart/checkout, performance.\u003c/li>\u003cli>\u003cstrong>Bell, Senior years\u003c/strong> (30 s): full-stack ownership, \u003cspan class=\"fill\">[Nest/Node BFF endpoints]\u003c/span>, code reviews, mentoring \u003cspan class=\"fill\">[N]\u003c/span> developers, \u003cspan class=\"fill\">[setting standards: lint rules, testing patterns, PR template]\u003c/span>.\u003c/li>\u003cli>\u003cstrong>Current interest\u003c/strong> (20 s): AI features, plus \u003cspan class=\"fill\">[performance/design systems/DX]\u003c/span>.\u003c/li>\u003cli>\u003cstrong>Why them\u003c/strong> (20 s): one specific thing about their product or tech.\u003c/li>\u003c/ol>\n\u003ch2 id=\"star-stories-prepare-at-least-8\">STAR stories (prepare at least 8)\u003c/h2>\n\u003cp>Structure: \u003cstrong>S\u003c/strong>ituation (1–2 sentences) → \u003cstrong>T\u003c/strong>ask (your responsibility) → \u003cstrong>A\u003c/strong>ction (60% of the time; say \u003cem>I\u003c/em>, not \u003cem>we\u003c/em>) → \u003cstrong>R\u003c/strong>esult (number + learning).\u003c/p>\n\u003ch3 id=\"story-1-performance-20-faster-load-times-your-flagship\">Story 1: Performance, ~20% faster load times ⭐ (your flagship)\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>S:\u003c/strong> Bell's \u003cspan class=\"fill\">[product listing / device pages]\u003c/span> were slow on mobile. The Lighthouse performance score was \u003cspan class=\"fill\">[~X]\u003c/span> and LCP was \u003cspan class=\"fill\">[~X s]\u003c/span>. That hurts conversion and SEO, and most traffic is mobile.\u003c/li>\u003cli>\u003cstrong>T:\u003c/strong> I was asked to \u003cspan class=\"fill\">[improve page performance / own the perf initiative]\u003c/span> for \u003cspan class=\"fill\">[the shop pages]\u003c/span>.\u003c/li>\u003cli>\u003cstrong>A:\u003c/strong>\u003cul>\u003cli>\u003cstrong>Measured first:\u003c/strong> Lighthouse plus Chrome DevTools Performance panel, \u003cspan class=\"fill\">[real-user data from analytics/CrUX]\u003c/span>, and a bundle analyzer (webpack-bundle-analyzer / \u003ccode>source-map-explorer\u003c/code>).\u003c/li>\u003cli>Found \u003cspan class=\"fill\">[one huge JS bundle; heavy libraries (e.g. full lodash / moment); unoptimised hero images; large CSS]\u003c/span>.\u003c/li>\u003cli>\u003cstrong>Route-level code splitting\u003c/strong> with \u003ccode>React.lazy\u003c/code> + \u003ccode>Suspense\u003c/code>; lazy-loaded below-the-fold components (reviews, recommendations) and modals.\u003c/li>\u003cli>\u003cstrong>Images:\u003c/strong> lazy-loaded off-screen images, responsive \u003ccode>srcset\u003c/code>, modern formats (WebP/AVIF), explicit width/height to stop CLS. Hero image \u003cem>not\u003c/em> lazy, with \u003ccode>fetchpriority=\"high\"\u003c/code>.\u003c/li>\u003cli>\u003cstrong>Tailwind:\u003c/strong> made sure purge/content config was correct so unused classes were stripped; removed duplicated legacy CSS.\u003c/li>\u003cli>Replaced/trimmed heavy dependencies; tree-shaking-friendly imports.\u003c/li>\u003cli>Added \u003cspan class=\"fill\">[a performance budget / Lighthouse CI check]\u003c/span> so it wouldn't regress.\u003c/li>\u003c/ul>\u003c/li>\u003cli>\u003cstrong>R:\u003c/strong> load times down ~\u003cstrong>20%\u003c/strong>, \u003cspan class=\"fill\">[LCP from X to Y]\u003c/span>, \u003cspan class=\"fill\">[CLS under 0.1]\u003c/span>, better Core Web Vitals and SEO. \u003cstrong>Learning:\u003c/strong> measure before and after, and protect the gains with automated budgets.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Expect follow-ups:\u003c/strong> \"How did you measure 20%?\", \"What's LCP/INP/CLS?\", \"What did NOT work?\", \"How did you prevent regressions?\" → see the Performance chapter.\u003c/p>\n\u003ch3 id=\"story-2-legacy-state-redux-toolkit-refactor\">Story 2: Legacy state → Redux Toolkit refactor\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>S:\u003c/strong> Cart/checkout state was spread across \u003cspan class=\"fill\">[classic Redux with lots of boilerplate / prop drilling / duplicated local state]\u003c/span>. Bugs came from out-of-sync data (e.g. cart count wrong after promo applied).\u003c/li>\u003cli>\u003cstrong>T:\u003c/strong> Simplify state management without stopping feature delivery.\u003c/li>\u003cli>\u003cstrong>A:\u003c/strong>\u003cul>\u003cli>Proposed it to the team with a short write-up: problems, options (keep, RTK, Context, Zustand, React Query), and why RTK fit (team already knew Redux, DevTools, Immer, standard patterns).\u003c/li>\u003cli>\u003cstrong>Incremental migration:\u003c/strong> one slice at a time (\u003ccode>createSlice\u003c/code>), with new and old code coexisting. Started with the \u003cspan class=\"fill\">[cart]\u003c/span> slice.\u003c/li>\u003cli>\u003ccode>createAsyncThunk\u003c/code> \u003cspan class=\"fill\">[or RTK Query]\u003c/span> for API calls with standard loading/error states; normalised entities with \u003ccode>createEntityAdapter\u003c/code>.\u003c/li>\u003cli>Memoised selectors (\u003ccode>createSelector\u003c/code>) to cut re-renders.\u003c/li>\u003cli>Wrote tests per slice; paired with teammates on the first migrations; documented the pattern.\u003c/li>\u003c/ul>\u003c/li>\u003cli>\u003cstrong>R:\u003c/strong> \u003cspan class=\"fill\">[~X% less state code]\u003c/span>, fewer sync bugs, faster onboarding. \u003cstrong>Learning:\u003c/strong> big refactors succeed when they're incremental, documented and shipped alongside features.\u003c/li>\u003c/ul>\n\u003ch3 id=\"story-3-rest-api-integration-for-filtering-cart-and-checkout\">Story 3: REST API integration for filtering, cart and checkout\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>S:\u003c/strong> New \u003cspan class=\"fill\">[filtering / cart / checkout]\u003c/span> features depended on backend services built in parallel by other teams.\u003c/li>\u003cli>\u003cstrong>T:\u003c/strong> Integrate the front end without being blocked, and make it resilient.\u003c/li>\u003cli>\u003cstrong>A:\u003c/strong>\u003cul>\u003cli>Agreed on the \u003cstrong>API contract\u003c/strong> early (OpenAPI/Swagger or a shared JSON example) and built against \u003cstrong>mocks\u003c/strong> (MSW / mock server) until the backend was ready.\u003c/li>\u003cli>Built a typed API layer (one place for base URL, headers, auth, error mapping).\u003c/li>\u003cli>Filters synced to the \u003cstrong>URL query string\u003c/strong> so results are shareable, survive refresh and work with the back button.\u003c/li>\u003cli>Debounced rapid filter changes; \u003cstrong>cancelled stale requests\u003c/strong> with \u003ccode>AbortController\u003c/code> so old responses couldn't overwrite new ones (race condition).\u003c/li>\u003cli>Checkout: disabled double submit, idempotency \u003cspan class=\"fill\">[key/flag]\u003c/span>, clear error and retry states, preserved user input on failure.\u003c/li>\u003c/ul>\u003c/li>\u003cli>\u003cstrong>R:\u003c/strong> \u003cspan class=\"fill\">[shipped on time]\u003c/span>, \u003cspan class=\"fill\">[fewer checkout errors]\u003c/span>, \u003cspan class=\"fill\">[better conversion]\u003c/span>. \u003cstrong>Learning:\u003c/strong> contract-first and mocks remove cross-team blocking.\u003c/li>\u003c/ul>\n\u003ch3 id=\"story-4-testing-culture-30-fewer-production-bugs\">Story 4: Testing culture, ~30% fewer production bugs\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>S:\u003c/strong> Releases kept leaking regressions in critical flows (cart/checkout); QA was mostly manual.\u003c/li>\u003cli>\u003cstrong>T:\u003c/strong> Work with QA to automate the critical paths.\u003c/li>\u003cli>\u003cstrong>A:\u003c/strong> Jest + React Testing Library for components and slices (testing behaviour, not implementation); Cypress E2E for the happy paths of \u003cspan class=\"fill\">[browse → add to cart → checkout]\u003c/span>; ran them in the CI pipeline on every PR; worked with QA to choose the scenarios; used stable \u003ccode>data-testid\u003c/code>/role selectors to reduce flakiness; added a \"test required\" item to the PR template.\u003c/li>\u003cli>\u003cstrong>R:\u003c/strong> ~\u003cstrong>30% fewer production bugs\u003c/strong>, faster release cycles, more confidence to refactor. \u003cstrong>Learning:\u003c/strong> test what users do; E2E only for the critical paths, because the pyramid keeps it fast.\u003c/li>\u003c/ul>\n\u003ch3 id=\"story-5-production-incident-use-your-real-one\">Story 5: Production incident (use your real one)\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>S:\u003c/strong> \u003cspan class=\"fill\">[After a release, users in [French / Safari / a region]\u003c/span> couldn't \u003cspan class=\"fill\">[complete checkout / see prices]\u003c/span>].\u003c/li>\u003cli>\u003cstrong>T:\u003c/strong> \u003cspan class=\"fill\">[I was on call / I owned the feature.]\u003c/span>\u003c/li>\u003cli>\u003cstrong>A:\u003c/strong> Confirmed impact (monitoring, logs, analytics); \u003cstrong>mitigated first\u003c/strong> (rollback / feature flag off); then root cause \u003cspan class=\"fill\">[e.g. missing translation key crashed a component, or a date/number format, or an API field change]\u003c/span>; fixed it, added a test, added an \u003cstrong>error boundary\u003c/strong> so one widget can't crash the page; wrote a blameless post-mortem.\u003c/li>\u003cli>\u003cstrong>R:\u003c/strong> \u003cspan class=\"fill\">[Restored in X min]\u003c/span>; the class of bug was prevented. \u003cstrong>Learning:\u003c/strong> mitigate before you debug; make failures small.\u003c/li>\u003c/ul>\n\u003ch3 id=\"story-6-disagreement-with-design-product-backend\">Story 6: Disagreement with design / product / backend\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>S:\u003c/strong> \u003cspan class=\"fill\">[Design wanted a custom dropdown / animation / infinite scroll]\u003c/span> that \u003cspan class=\"fill\">[wasn't accessible / hurt performance]\u003c/span>.\u003c/li>\u003cli>\u003cstrong>T:\u003c/strong> Ship something good for users \u003cem>and\u003c/em> keep the relationship.\u003c/li>\u003cli>\u003cstrong>A:\u003c/strong> Asked about the goal behind the request; built a quick prototype of both options; showed data (a11y audit, Lighthouse, screen-reader demo); proposed a compromise \u003cspan class=\"fill\">[accessible headless component styled to the design]\u003c/span>.\u003c/li>\u003cli>\u003cstrong>R:\u003c/strong> Agreed solution; the pattern was \u003cspan class=\"fill\">[added to the design system]\u003c/span>. \u003cstrong>Learning:\u003c/strong> disagree with data and prototypes, not opinions.\u003c/li>\u003c/ul>\n\u003ch3 id=\"story-7-mentoring-raising-the-bar-senior-role\">Story 7: Mentoring / raising the bar (senior role)\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>S:\u003c/strong> After promotion, \u003cspan class=\"fill\">[N]\u003c/span> newer devs joined; PRs were inconsistent and review cycles were slow.\u003c/li>\u003cli>\u003cstrong>A:\u003c/strong> Pairing sessions; a PR template and checklist (tests, a11y, i18n keys, screenshots); ESLint/Prettier + TypeScript strictness in CI so machines catch style; \"how we do X\" docs; constructive reviews that explain \u003cem>why\u003c/em>.\u003c/li>\u003cli>\u003cstrong>R:\u003c/strong> \u003cspan class=\"fill\">[Review turnaround from X to Y days]\u003c/span>, \u003cspan class=\"fill\">[junior now owns feature Z]\u003c/span>. \u003cstrong>Learning:\u003c/strong> scale yourself through tooling and teaching.\u003c/li>\u003c/ul>\n\u003ch3 id=\"story-8-ambiguity-owning-something-end-to-end-full-stack\">Story 8: Ambiguity / owning something end-to-end (full-stack)\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>S:\u003c/strong> \u003cspan class=\"fill\">[A feature with unclear requirements, e.g. a new plan comparison tool, an internal dashboard, an AI assistant / RAG search]\u003c/span>.\u003c/li>\u003cli>\u003cstrong>A:\u003c/strong> Clarified the problem with stakeholders; wrote a one-page plan; built the \u003cspan class=\"fill\">[NestJS endpoint + React UI]\u003c/span>; shipped an MVP behind a feature flag; iterated on feedback.\u003c/li>\u003cli>\u003cstrong>R:\u003c/strong> \u003cspan class=\"fill\">[adoption / time saved]\u003c/span>. \u003cstrong>Learning:\u003c/strong> ship small, learn fast.\u003c/li>\u003c/ul>\n\u003ch3 id=\"story-9-a-mistake-failure\">Story 9: A mistake / failure\u003c/h3>\n\u003cp>Pick something real and small-to-medium: \u003cspan class=\"fill\">[underestimated a task]\u003c/span>, \u003cspan class=\"fill\">[shipped a bug]\u003c/span>, \u003cspan class=\"fill\">[over-engineered an abstraction]\u003c/span>. Show \u003cstrong>ownership → fix → what you changed in your process\u003c/strong>. Never blame others.\u003c/p>\n\u003ch3 id=\"story-10-tight-deadline-trade-off\">Story 10: Tight deadline / trade-off\u003c/h3>\n\u003cp>\u003cspan class=\"fill\">[Device launch date or promo deadline]\u003c/span>. You cut scope with the PM (must-have vs nice-to-have), shipped behind a flag, and logged tech debt with a ticket and a plan to pay it back.\u003c/p>\n\u003ch2 id=\"behavioral-questions-spoken-versions-of-your-stories\">Behavioral questions: spoken versions of your stories\u003c/h2>\n\u003cblockquote>\u003cp>Each answer below is a full STAR story written the way you'd \u003cstrong>say\u003c/strong> it (about 2 minutes). Rehearse them out loud until they feel natural, not memorised. The leadership chapter covers the disagreement, mentoring and mistake stories.\u003c/p>\u003c/blockquote>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Tell me about yourself.\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>Sure. I'm a front-end-focused full-stack developer with about eight years of experience, and for the last four and a half years I've been working on Bell's e-commerce platform through LGS, which is an IBM company.\u003c/p>\u003cp>At Bell I build the customer-facing shopping experience in React: product listing and filtering, the cart, and checkout. A lot of my work has been about performance and code quality. I led a refactor of our legacy state management to Redux Toolkit, and I improved our Core Web Vitals with code splitting, lazy loading and CSS optimisation, which cut load times by roughly 20 percent. I also worked closely with our QA team to build out automated testing with Jest and Cypress, which reduced production bugs by about 30 percent.\u003c/p>\u003cp>In April 2025 I was promoted to Senior Full Stack Developer, so now I also work on the Node and NestJS side and mentor newer developers on the team. Recently I've also been building AI features with the OpenAI API and retrieval-augmented generation.\u003c/p>\u003cp>I'm now looking for a senior front-end role where I can own architecture and performance for a product at scale, and \u003cspan class=\"fill\">[one specific thing about this company]\u003c/span> is what drew me to this role.\u003c/p>\u003c/div>\n\u003cp>Keep it to 60–90 seconds. End by connecting to \u003cem>them\u003c/em>, which invites the next question.\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>Why did you stay on the same project for four and a half years?\u003c/summary>\u003cp>Because it kept giving me bigger problems to solve. I started on features, then took on performance, then the state management migration, and then the senior full-stack role with mentoring. The Bell platform is large and business-critical, so there was always something meaningful to improve, and staying long enough to see the long-term results of my decisions taught me a lot about maintainability.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>What does \"through LGS, an IBM company\" mean day to day?\u003c/summary>\u003cp>LGS is my employer, and I'm embedded full-time in Bell's digital team. Day to day I work exactly like a Bell team member: same squad, standups, codebase, release process and on-call expectations. The promotion to senior happened on that same engagement, which reflects the trust the client had in my work.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>You mentioned AI. Was that at Bell or on your own?\u003c/summary>\u003cp>\u003cspan class=\"fill\">[Be precise here.]\u003c/span> For example: \"Mostly on my own projects and \u003cspan class=\"fill\">[an internal prototype]\u003c/span>. I built features using the OpenAI API, embeddings stored in Supabase with pgvector, and a RAG pipeline. I'm happy to walk through how it works.\" Never inflate this: interviewers will ask about production details.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Tell me about a time you significantly improved performance.\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>On Bell's e-commerce site, our \u003cspan class=\"fill\">[device and product listing pages]\u003c/span> were slow on mobile. \u003cspan class=\"fill\">[Lighthouse performance was around X, and LCP was around Y seconds.]\u003c/span> Since most of our traffic is mobile, and load time affects both conversion and SEO, I took ownership of improving it.\u003c/p>\u003cp>I started by measuring. I used Lighthouse and the Chrome Performance panel, and ran a bundle analyzer. It showed \u003cspan class=\"fill\">[we were shipping one large bundle containing code for every page, some heavy dependencies, unoptimised images and a lot of unused CSS]\u003c/span>.\u003c/p>\u003cp>Then I worked through the fixes by impact. I added route-level code splitting with React.lazy and Suspense, and lazy-loaded components that weren't needed for the first view, like reviews, recommendations and modals. I optimised images with lazy loading below the fold, correct sizes and explicit dimensions to stop layout shifts, while making sure the hero image loaded with high priority. And I fixed our Tailwind configuration so unused classes were properly purged, and removed duplicated legacy CSS. I shipped it as small pull requests alongside feature work, with QA regression testing each one.\u003c/p>\u003cp>Load times improved by roughly 20 percent, and our Core Web Vitals improved, \u003cspan class=\"fill\">[LCP went from X to Y]\u003c/span>. \u003cspan class=\"fill\">[To keep it from regressing, we added a performance check to the pipeline.]\u003c/span> The main lesson for me was to measure first, because some of what we assumed was slow wasn't, and to protect the gains with automation.\u003c/p>\u003c/div>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>How exactly did you measure the 20 percent?\u003c/summary>\u003cp>I compared the same pages before and after using \u003cspan class=\"fill\">[Lighthouse runs under the same throttling settings, averaged over several runs, plus our real-user data from (analytics / CrUX)]\u003c/span>. The main metric was \u003cspan class=\"fill\">[load time / LCP]\u003c/span> on mobile. I used medians of several runs, because single Lighthouse runs vary quite a bit.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>What did you try that didn't work?\u003c/summary>\u003cp>\u003cspan class=\"fill\">[Use a real example.]\u003c/span> For example: \"I initially lazy-loaded too aggressively, including an image above the fold, which actually made LCP worse. Measuring after each change caught it, and I reverted that part. It taught me to lazy-load only what isn't needed for the first view.\"\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>How did you make sure performance didn't regress afterwards?\u003c/summary>\u003cp>\u003cspan class=\"fill\">[We added a Lighthouse CI check / bundle size budget to the pipeline]\u003c/span>, so a pull request that grew the bundle or dropped the score beyond a threshold was flagged. Without automation, performance gains tend to erode within a few months.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Tell me about a significant refactor you led.\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>When I joined the Bell project, the cart and checkout state was managed with \u003cspan class=\"fill\">[classic Redux with a lot of boilerplate, plus some duplicated local state]\u003c/span>. That caused real bugs. For example, \u003cspan class=\"fill\">[the cart count and totals could get out of sync after a promotion was applied]\u003c/span>, and new developers found the code hard to follow.\u003c/p>\u003cp>I wanted to fix it without stopping feature delivery, because the business couldn't pause for a rewrite. So I wrote a short proposal comparing the options: keeping things as they were, Redux Toolkit, Context, or a lighter library like Zustand. I recommended Redux Toolkit because the team already knew Redux, and it would cut boilerplate, prevent accidental mutations with Immer, and keep the DevTools we relied on.\u003c/p>\u003cp>The migration was incremental. First I swapped in configureStore, which was a very low-risk change. Then I converted one slice at a time, starting with the cart, with old and new code running side by side. I replaced hand-written loading actions with createAsyncThunk, normalised entities, and added memoised selectors for things like totals, which also reduced unnecessary re-renders. I wrote tests for each slice, paired with teammates on the first conversions, and documented the pattern so everyone could continue it.\u003c/p>\u003cp>We ended up with \u003cspan class=\"fill\">[significantly less state code]\u003c/span>, far fewer sync bugs, and new developers got productive faster because there was one clear pattern. The lesson was that big refactors succeed when they're incremental and shipped alongside features.\u003c/p>\u003c/div>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>How did you convince the team and your lead to invest in it?\u003c/summary>\u003cp>I framed it in terms of cost: how many bugs came from out-of-sync state and how much time it added to cart features. I wrote a short proposal with options and trade-offs, and I showed that the migration could be incremental, so it wouldn't stop feature work. Reducing the risk was what got the approval.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>Why Redux Toolkit and not React Query or Zustand?\u003c/summary>\u003cp>The team already knew Redux, we relied on the DevTools, and much of the cart state was genuinely client-side logic, like promotions and selections. RTK gave the biggest improvement with the least retraining. If I were doing it again, I'd move pure server data to RTK Query as a second step.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>How did you avoid breaking things during the migration?\u003c/summary>\u003cp>One slice at a time, with tests written for each slice before switching components over, old and new running side by side, and QA regression testing on the cart and checkout for every step. Each change was small enough to roll back easily.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Tell me about a time you depended on another team. How did you avoid being blocked?\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>We were building \u003cspan class=\"fill\">[the new product filtering and cart features]\u003c/span> on Bell's site, and the backend services they depended on were being built at the same time by another team. If we had waited for their APIs, we would have lost weeks.\u003c/p>\u003cp>So early on I set up a session with the backend team to agree on the API contract: the endpoints, request parameters, response shapes and error formats, documented \u003cspan class=\"fill\">[in Swagger]\u003c/span>. With that contract in place, I built the front end against mocks using \u003cspan class=\"fill\">[Mock Service Worker]\u003c/span>, so we could develop and test the complete UI, including error and loading states, before the real services existed.\u003c/p>\u003cp>I also built a small typed API layer, so the base URL, headers and error handling lived in one place. While building the filters, I synced them to the URL so results were shareable and the back button worked, and I added request cancellation, because rapid filter clicks could cause an older response to overwrite a newer one.\u003c/p>\u003cp>When the real APIs were ready, integration took \u003cspan class=\"fill\">[days rather than weeks]\u003c/span>, mostly just switching off the mocks and fixing a couple of small contract differences we caught early. The lesson I took is that agreeing on contracts first and building against mocks is the best way to keep teams from blocking each other.\u003c/p>\u003c/div>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>What happened when the real API didn't match the contract?\u003c/summary>\u003cp>\u003cspan class=\"fill\">[Real example.]\u003c/span> A couple of fields differed in naming or nullability. Because we found it early, it was a quick conversation: we agreed which side would change, updated the contract document, and I added validation so a mismatch would fail clearly instead of silently showing wrong data.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>How do you keep mocks from drifting from the real API?\u003c/summary>\u003cp>Ideally the mocks are generated from, or validated against, the OpenAPI spec, and contract tests run in the backend pipeline. At minimum, we update the mocks in the same pull request as any contract change, and run integration tests against a real staging environment before release.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Tell me about a time you improved quality or reduced bugs.\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>At Bell, our releases kept letting regressions through in critical flows like the cart and checkout. Our QA team was mostly testing manually, so every release meant long regression cycles, and bugs still reached production.\u003c/p>\u003cp>I worked with the QA team to automate the most important paths. We sat down together and agreed on which scenarios mattered most for customers and revenue: browsing, adding to cart, applying a promotion, and completing checkout. I wrote Jest and React Testing Library tests for components and Redux slices, focused on behaviour rather than implementation details, and we built Cypress end-to-end tests for those critical journeys. We ran them in the CI pipeline on every pull request. I added stable selectors so the tests weren't brittle, and added a testing item to our pull request template so new features came with tests.\u003c/p>\u003cp>Over the following \u003cspan class=\"fill\">[months]\u003c/span>, production bugs dropped by about 30 percent, release cycles got faster because less manual regression testing was needed, and the team became much more confident making changes, which actually made the later refactoring work possible. The lesson for me was to focus automation on what users actually do and on the flows that matter most, instead of chasing coverage numbers.\u003c/p>\u003c/div>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>How did you measure the 30 percent reduction?\u003c/summary>\u003cp>We compared the number of production defects logged \u003cspan class=\"fill\">[in Jira]\u003c/span> for the \u003cspan class=\"fill\">[cart and checkout area]\u003c/span> over \u003cspan class=\"fill\">[comparable release periods]\u003c/span> before and after the automation was in place. It's not a perfect experiment, but the trend was clear, and release regression cycles also got shorter.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>How did you deal with flaky Cypress tests?\u003c/summary>\u003cp>We replaced fixed waits with assertions on actual conditions, intercepted and stubbed unstable network calls, used stable selectors, and gave every test its own setup data. Any flaky test was quarantined with a ticket and fixed quickly, because flaky tests make people ignore failures.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>How did you decide what to automate versus leave manual?\u003c/summary>\u003cp>Together with QA, we ranked scenarios by business impact and how often they ran. Repetitive, critical paths like checkout were automated end to end. Exploratory testing and rarely-used edge cases stayed manual.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Tell me about a production incident you handled.\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>\u003cspan class=\"fill\">[Adapt to your real incident.]\u003c/span> After one release, we started seeing reports that \u003cspan class=\"fill\">[some customers using the French version of the site couldn't complete checkout]\u003c/span>.\u003c/p>\u003cp>I was \u003cspan class=\"fill\">[on the team that owned that feature]\u003c/span>, so I jumped in. The first thing I did was confirm the scope using \u003cspan class=\"fill\">[our error monitoring and analytics]\u003c/span>, and then focus on reducing customer impact first rather than immediately debugging. \u003cspan class=\"fill\">[We turned the new feature off with a feature flag / rolled back the release]\u003c/span>, which restored checkout within \u003cspan class=\"fill\">[X minutes]\u003c/span>.\u003c/p>\u003cp>Then I found the root cause: \u003cspan class=\"fill\">[a missing French translation key caused a component to throw during render, and since there was no error boundary around it, it took down the whole checkout step]\u003c/span>. I fixed the key, added a test for that case, and added an error boundary so a failure in one part of the page can't break the entire flow. We also added a CI check for missing translation keys.\u003c/p>\u003cp>Afterwards I wrote a blameless post-mortem covering the timeline, the root cause and the actions taken, so the whole team learned from it. The main lessons were to mitigate first and debug second, and to design so that failures stay small.\u003c/p>\u003c/div>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>How did you find out about the problem?\u003c/summary>\u003cp>\u003cspan class=\"fill\">[Real answer: monitoring alerts, a spike in errors, a drop in conversion on a dashboard, or customer reports.]\u003c/span> And if it came from customers, a good addition is what monitoring you added afterwards so you'd detect it first next time.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>Why didn't your tests catch it?\u003c/summary>\u003cp>\u003cspan class=\"fill\">[Be honest.]\u003c/span> For example: \"Our tests ran mostly in English, and the bug only appeared with the French locale. We added French locale coverage to the critical end-to-end tests and a CI check for missing translation keys.\"\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>What was in the post-mortem?\u003c/summary>\u003cp>The timeline, customer impact, root cause, what went well, what didn't, and action items with owners. It was blameless: the focus was on what in our process allowed the bug through, not who wrote it.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Tell me about a time you dealt with ambiguity or unclear requirements.\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>\u003cspan class=\"fill\">[Adapt this to your real project, for example an internal tool, a plan comparison feature, or an AI assistant.]\u003c/span> After I moved into the senior full-stack role, I was asked to build \u003cspan class=\"fill\">[a feature]\u003c/span>, but the requirements were very loose, basically \u003cspan class=\"fill\">[one sentence from a stakeholder]\u003c/span>.\u003c/p>\u003cp>Instead of guessing, I first spoke with the stakeholders to understand the actual problem: who would use it, what they were doing today, and what success would look like. I wrote a one-page plan with the scope, what was explicitly out of scope, and a simple design, and got agreement on it. That alone surfaced a few different expectations between \u003cspan class=\"fill\">[the product owner and the business team]\u003c/span> that we resolved before writing any code.\u003c/p>\u003cp>I then built a minimal version end to end, \u003cspan class=\"fill\">[a NestJS endpoint and a React interface]\u003c/span>, and released it behind a feature flag to a small group of users. Their feedback changed \u003cspan class=\"fill\">[one important part of the design]\u003c/span>, which we would have built wrong otherwise.\u003c/p>\u003cp>The result was \u003cspan class=\"fill\">[adoption or time saved]\u003c/span>. What I learned is that with ambiguous work, the most valuable step is making the problem clear and written down, and then shipping something small quickly so real feedback replaces assumptions.\u003c/p>\u003c/div>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>What would you have done if stakeholders disagreed on the requirements?\u003c/summary>\u003cp>I'd make the disagreement explicit by writing down both versions and the trade-offs, then ask the person who owns the decision, usually the product owner, to decide. My job is to make the options and consequences clear, not to choose between stakeholders silently.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>How do you decide what goes into an MVP?\u003c/summary>\u003cp>I ask what the smallest version is that lets us learn whether the idea works for real users. Everything not needed to answer that question goes on a later list. And the MVP still has to be good quality: small scope, not low quality.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Tell me about a time you had to make a trade-off under a tight deadline.\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>We had a fixed date for \u003cspan class=\"fill\">[a device launch or a holiday promotion]\u003c/span> at Bell. Marketing campaigns were already scheduled, so the date couldn't move, but partway through, it was clear the full scope wasn't going to fit.\u003c/p>\u003cp>I didn't want to quietly cut corners on quality, so I went to the product owner with a clear picture. I split the work into what was essential for launch day and what could follow a week or two later, and explained the risk of each option. We agreed to ship the core flow, \u003cspan class=\"fill\">[for example the new offer in the product page and cart]\u003c/span>, on time, and move \u003cspan class=\"fill\">[the comparison view and some edge cases]\u003c/span> to a follow-up release.\u003c/p>\u003cp>To reduce risk, we shipped behind a feature flag, so we could switch it on at launch time and turn it off instantly if something went wrong. I logged the shortcuts we took as tech-debt tickets with a plan, and we addressed them in the following sprint.\u003c/p>\u003cp>The launch went smoothly and \u003cspan class=\"fill\">[met the business goals]\u003c/span>, and the follow-up shipped as planned. The lesson for me is that under deadline pressure the scope should flex, not the quality, and that trade-offs should be made openly with the product owner, not silently by developers.\u003c/p>\u003c/div>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>What if the product owner had insisted on the full scope?\u003c/summary>\u003cp>I'd make the risk explicit in writing: what could slip, and the quality risk of rushing. If they still wanted it, I'd propose options like adding people early or reducing testing scope with clear acceptance of the risk. Ultimately it's their call, but it should be an informed one.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>Did the tech debt actually get paid back?\u003c/summary>\u003cp>\u003cspan class=\"fill\">[Real answer.]\u003c/span> Ideally yes: \"We created tickets during the release, with the reason and a proposed fix, and I raised them in the next sprint planning. They were done within \u003cspan class=\"fill\">[two sprints]\u003c/span>.\" If not, be honest about what you learned about making debt visible.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003ch2 id=\"questions-they-ll-ask-about-your-bell-experience-prepare-answers\">Questions they'll ask about your Bell experience (prepare answers)\u003c/h2>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">What was the most technically challenging thing you built at Bell?\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>The most challenging work was on the cart and checkout flow for Bell's e-commerce site. It's harder than a typical online store, because a single purchase can combine a device, a rate plan and add-ons, with prices that depend on the province, promotions and whether you're an existing customer. The flow spans several steps, calls several backend services, has to be fully bilingual and accessible, and any bug there directly costs revenue.\u003c/p>\u003cp>My part was \u003cspan class=\"fill\">[building the cart and checkout steps in React and integrating the APIs for the cart, promotions and order submission]\u003c/span>. The interesting technical problems were state and asynchrony. Cart data could get out of sync between components after a promotion was applied, which was one of the reasons I led the move to Redux Toolkit with a single source of truth and memoised selectors for totals. We had race conditions where a slow response could overwrite a newer one, which I fixed with request cancellation. And on order submission, I made sure the button couldn't double-submit and that errors kept the user's data, with clear retry options.\u003c/p>\u003cp>The result was \u003cspan class=\"fill\">[a more reliable checkout with fewer production issues]\u003c/span>, and combined with the testing work we did with QA, production bugs dropped by about 30 percent. Happy to go deeper into any part of it.\u003c/p>\u003c/div>\n\u003cp>Pick \u003cstrong>one\u003c/strong>: checkout or performance. Structure: why it was hard (state across many steps, async validations, many services, bilingual, a11y), what you designed, one surprising problem (race condition, hydration, caching), the result. Keep it under 3 minutes and let them dig in.\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>How did you handle state across the checkout steps?\u003c/summary>\u003cp>The cart and checkout data lived in Redux Toolkit as a single source of truth, so each step read from and wrote to the same store, and going back didn't lose data. Derived values, like totals, were memoised selectors rather than stored state, which removed a whole class of sync bugs.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>How did you prevent duplicate orders?\u003c/summary>\u003cp>The submit button was disabled while the request was pending, and \u003cspan class=\"fill\">[the order request carried an idempotency key / the backend de-duplicated on a request ID]\u003c/span>, so even a retry or double click couldn't create two orders.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>What would you do differently if you rebuilt it today?\u003c/summary>\u003cp>I'd move server data to a caching layer like RTK Query, render the static parts on the server, use React 19 actions for the form submission states, and share validation schemas with the backend using Zod.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">How was the front end architected? What would you change?\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>The front end is a React application, \u003cspan class=\"fill\">[describe: built with ... and served through ...]\u003c/span>, using Redux Toolkit for cart and checkout state, Tailwind for styling, and \u003cspan class=\"fill\">[a shared component library]\u003c/span>. It talks to backend services for the catalogue, pricing, cart and orders through REST APIs, \u003cspan class=\"fill\">[through a BFF layer]\u003c/span>. Quality is covered by Jest and React Testing Library for components and Cypress for critical user journeys, running in the CI pipeline.\u003c/p>\u003cp>If I could change things, I'd focus on three areas. First, I'd move server data out of Redux into a dedicated caching layer, like RTK Query, keeping Redux only for true client state. That removes a lot of manual loading and invalidation code. Second, for SEO-critical product pages, I'd move toward server rendering with streaming or Server Components, to improve LCP and ship less JavaScript. Third, I'd generate TypeScript types from the backend's OpenAPI specs, so API changes are caught at compile time.\u003c/p>\u003cp>Each of these has a real migration cost, so I'd do them incrementally and start where the measured benefit is highest, probably the product pages for performance and SEO.\u003c/p>\u003c/div>\n\u003cp>Describe it honestly (the diagram above). Then give \u003cstrong>2 improvements\u003c/strong> with reasoning, for example:\u003c/p>\n\u003cul>\u003cli>Move server data out of Redux into \u003cstrong>RTK Query / TanStack Query\u003c/strong> (cache, dedupe, background refetch) and keep Redux for truly client state.\u003c/li>\u003cli>Adopt \u003cstrong>SSR/streaming via Next.js App Router\u003c/strong> for SEO-critical product pages.\u003c/li>\u003cli>Stricter \u003cstrong>TypeScript\u003c/strong> and generated API types from OpenAPI.\u003c/li>\u003cli>\u003cstrong>Performance budgets\u003c/strong> in CI.\u003c/li>\u003cli>A shared \u003cstrong>design system\u003c/strong> package with visual regression tests.\u003c/li>\u003c/ul>\n\u003cp>A senior always has opinions on what to improve, \u003cstrong>with trade-offs\u003c/strong> (migration cost, risk, team skills).\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>Why not migrate everything to Next.js?\u003c/summary>\u003cp>A full migration of a large, revenue-critical app is risky and expensive. I'd start with the pages where server rendering has measurable value, like SEO-critical product pages, prove the benefit with data, and migrate incrementally, possibly route by route behind the same domain.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>How did releases work?\u003c/summary>\u003cp>\u003cspan class=\"fill\">[Describe: release cadence, environments, QA sign-off, feature flags, who deploys.]\u003c/span> Then add one improvement you'd make, for example more frequent smaller releases with feature flags.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">How do you work with QA, designers, product and backend?\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>Wi
