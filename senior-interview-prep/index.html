3c/p>\u003cp>Specificity is calculated as a score: inline styles are highest, then IDs, then classes, attributes and pseudo-classes, then element selectors. Cascade layers, with \u003ccode>@layer\u003c/code>, are a newer tool that lets you define the priority of whole groups of styles, like reset, base, components and utilities, so specificity battles between them stop mattering. Styles outside any layer beat layered ones.\u003c/p>\u003cp>Useful details: \u003ccode>:where()\u003c/code> has zero specificity, which is great for library styles that users should be able to override easily, while \u003ccode>:is()\u003c/code> and \u003ccode>:not()\u003c/code> take the specificity of their most specific argument.\u003c/p>\u003cp>In practice, I keep specificity low and flat: classes rather than IDs, and avoiding \u003ccode>!important\u003c/code>. Tailwind helps with that, since everything is a single utility class.\u003c/p>\u003c/div>\n\u003cp>The cascade resolves conflicts by: origin &amp; importance (\u003ccode>!important\u003c/code>) → \u003cstrong>cascade layers\u003c/strong> (\u003ccode>@layer\u003c/code>, later layers win, unlayered styles beat layered) → \u003cstrong>specificity\u003c/strong> (inline &gt; IDs &gt; classes/attributes/pseudo-classes &gt; elements) → source order.\u003c/p>\n\u003cp>\u003ccode>:where()\u003c/code> has zero specificity (great for resettable library styles); \u003ccode>:is()\u003c/code> / \u003ccode>:not()\u003c/code> take their most specific argument. Avoid \u003ccode>!important\u003c/code> and ID selectors in component CSS.\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>How would you override a third-party component's styles cleanly?\u003c/summary>\u003cp>Put the library's styles in a lower cascade layer, so your component styles win without needing high specificity or \u003ccode>!important\u003c/code>.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>What's the specificity of :where(.a .b)?\u003c/summary>\u003cp>Zero. \u003ccode>:where\u003c/code> always contributes zero specificity, which makes it ideal for defaults that should be easy to override.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Flexbox vs Grid\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>Flexbox is one-dimensional: it lays items out along a single row or column, and sizing is driven by the content. I use it for navigation bars, toolbars, button groups, aligning an icon with text, and centring things.\u003c/p>\u003cp>Grid is two-dimensional: it controls rows and columns at the same time, and the layout defines where content goes. I use it for page layouts, card grids, and complex forms. A pattern I use a lot is \u003ccode>repeat(auto-fill, minmax(240px, 1fr))\u003c/code>, which creates a responsive card grid without any media queries.\u003c/p>\u003cp>Subgrid is worth mentioning, because it lets nested elements align to the parent grid. For example, in a row of plan cards with different description lengths, subgrid keeps the prices and buttons aligned across all the cards. That's a very common e-commerce design request that used to need JavaScript or fixed heights.\u003c/p>\u003cp>They work well together: Grid for the overall layout, Flexbox inside the components.\u003c/p>\u003c/div>\n\u003cul>\u003cli>\u003cstrong>Flexbox\u003c/strong>: one-dimensional (row \u003cem>or\u003c/em> column), content-driven sizing. Navbars, toolbars, centring, button groups.\u003c/li>\u003cli>\u003cstrong>Grid\u003c/strong>: two-dimensional (rows \u003cem>and\u003c/em> columns), layout-driven. Page layouts, card grids (\u003ccode>repeat(auto-fill, minmax(240px, 1fr))\u003c/code>), complex forms. \u003cstrong>Subgrid\u003c/strong> aligns nested items with the parent grid (e.g. equal-height plan cards with aligned prices).\u003c/li>\u003c/ul>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>How do you center an element both ways?\u003c/summary>\u003cp>On the parent, \u003ccode>display: grid\u003c/code> with \u003ccode>place-items: center\u003c/code>, or flexbox with \u003ccode>justify-content\u003c/code> and \u003ccode>align-items\u003c/code> set to center.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>What's the difference between auto-fill and auto-fit?\u003c/summary>\u003cp>Both create as many columns as fit. With \u003ccode>auto-fill\u003c/code>, empty tracks are kept, so items don't stretch. With \u003ccode>auto-fit\u003c/code>, empty tracks collapse, so the existing items stretch to fill the row.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Modern CSS features worth mentioning\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>A few have changed how I build components. Container queries let a component adapt to the size of its container rather than the viewport. That's ideal for a design system, where the same product card might appear in a narrow sidebar or a wide grid. The \u003ccode>:has()\u003c/code> selector is finally a parent selector, so I can style a form group that contains an invalid input, without JavaScript.\u003c/p>\u003cp>Native CSS nesting and cascade layers make plain CSS much more maintainable. \u003ccode>clamp()\u003c/code> gives fluid typography and spacing. Logical properties, like \u003ccode>margin-inline-start\u003c/code>, make layouts work in right-to-left languages. The new viewport units, like \u003ccode>dvh\u003c/code>, fix the mobile browser address bar problem.\u003c/p>\u003cp>On the interactive side: the View Transitions API for smooth page and state transitions, scroll-driven animations, and the Popover API with anchor positioning, which can replace JavaScript positioning libraries for tooltips and menus. And I always respect \u003ccode>prefers-reduced-motion\u003c/code> and \u003ccode>prefers-color-scheme\u003c/code>.\u003c/p>\u003c/div>\n\u003cul>\u003cli>\u003cstrong>Container queries\u003c/strong> (\u003ccode>@container\u003c/code>): components respond to their \u003cem>container\u003c/em> size, not the viewport. Perfect for design-system cards reused in sidebars and main content.\u003c/li>\u003cli>\u003cstrong>\u003ccode>:has()\u003c/code>\u003c/strong>: the parent selector (\u003ccode>form:has(:invalid)\u003c/code>, \u003ccode>.card:has(img)\u003c/code>).\u003c/li>\u003cli>\u003cstrong>Native nesting\u003c/strong>, \u003cstrong>cascade layers\u003c/strong>, \u003ccode>clamp()\u003c/code> for fluid type (\u003ccode>font-size: clamp(1rem, 2.5vw, 1.5rem)\u003c/code>).\u003c/li>\u003cli>Logical properties, \u003ccode>aspect-ratio\u003c/code>, \u003ccode>gap\u003c/code> for flexbox, \u003ccode>dvh\u003c/code>/\u003ccode>svh\u003c/code> viewport units (mobile browser bars).\u003c/li>\u003cli>\u003cstrong>View Transitions API\u003c/strong> (page/state transitions), \u003cstrong>scroll-driven animations\u003c/strong>, \u003cstrong>anchor positioning\u003c/strong> + \u003cstrong>Popover API\u003c/strong> (tooltips/menus without JS positioning libraries), \u003ccode>@starting-style\u003c/code>.\u003c/li>\u003cli>\u003ccode>prefers-reduced-motion\u003c/code>, \u003ccode>prefers-color-scheme\u003c/code>, \u003ccode>color-mix()\u003c/code>, \u003ccode>oklch()\u003c/code> colours.\u003c/li>\u003c/ul>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>How do container queries work?\u003c/summary>\u003cp>You mark a parent as a container with \u003ccode>container-type: inline-size\u003c/code>, and then use \u003ccode>@container\u003c/code> rules in its children based on that container's width instead of the viewport.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>What can :has() replace?\u003c/summary>\u003cp>JavaScript that toggled parent classes based on children, like styling a field group when it contains an invalid input, or a card differently when it contains an image.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Tailwind vs CSS Modules vs CSS-in-JS: trade-offs\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>I've used Tailwind extensively at Bell. Its strengths are speed and consistency: you style directly in the markup using the design tokens from the config, you never have to name things, and the production CSS only includes the classes you actually use. The downsides are long class strings, and you need good component abstractions so you're not repeating the same class lists everywhere.\u003c/p>\u003cp>CSS Modules are plain CSS with locally scoped class names, no runtime cost, and a familiar syntax. They work really well with CSS variables for design tokens.\u003c/p>\u003cp>Runtime CSS-in-JS, like styled-components or Emotion, made dynamic styling and theming easy, but it has a runtime cost and doesn't fit well with Server Components and streaming, and styled-components is now in maintenance mode. Zero-runtime options like vanilla-extract or Panda extract the CSS at build time.\u003c/p>\u003cp>So for a new project today, I'd choose Tailwind or CSS Modules with CSS variables. One practical Tailwind lesson from our performance work: make sure the content paths are correct so purging works, and don't build class names dynamically, like concatenating a colour into a class name, because Tailwind can't detect them.\u003c/p>\u003c/div>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>\u003c/th>\u003cth>Pros\u003c/th>\u003cth>Cons\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tailwind\u003c/strong> (you used it at Bell)\u003c/td>\u003ctd>fast, consistent design tokens, tiny CSS (only used classes), no naming, colocated\u003c/td>\u003ctd>long class strings, learning curve, needs component abstractions to avoid repetition\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>CSS Modules\u003c/strong>\u003c/td>\u003ctd>scoped, plain CSS, zero runtime\u003c/td>\u003ctd>naming, tokens via CSS variables\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Runtime CSS-in-JS\u003c/strong> (styled-components, Emotion)\u003c/td>\u003ctd>dynamic styles, colocated, theming\u003c/td>\u003ctd>\u003cstrong>runtime cost\u003c/strong>, problematic with RSC/streaming; styled-components in maintenance mode\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Zero-runtime CSS-in-JS\u003c/strong> (vanilla-extract, Panda, StyleX)\u003c/td>\u003ctd>type-safe, extracted at build\u003c/td>\u003ctd>build setup\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Trend: \u003cstrong>Tailwind (v4, CSS-first config) or CSS Modules + CSS variables for design tokens\u003c/strong>, moving away from runtime CSS-in-JS because of Server Components and performance.\u003c/p>\n\u003cp>Tailwind performance at Bell: make sure the \u003ccode>content\u003c/code> paths are correct so unused classes are purged; avoid dynamic class strings that can't be detected (\u003ccode>bg-${color}-500\u003c/code>), using full class names in a map instead.\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>Why don't dynamic Tailwind classes work?\u003c/summary>\u003cp>Tailwind scans the source code for complete class names at build time. A class built at runtime, like concatenating a colour variable, never appears in full in the source, so it isn't generated. Map values to full class names instead.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>How do you avoid repeating long Tailwind class lists?\u003c/summary>\u003cp>Extract components, use a variants helper like class-variance-authority, and use \u003ccode>@apply\u003c/code> sparingly for the rare shared CSS case.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Responsive design approach\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>I work mobile-first: the base styles are for small screens, and I add complexity with \u003ccode>min-width\u003c/code> media queries as space allows. For a site like Bell's, where most traffic is mobile, that's also where the business value is.\u003c/p>\u003cp>I prefer fluid layouts over many fixed breakpoints: Grid and Flexbox with flexible units, \u003ccode>clamp()\u003c/code> for typography and spacing, and container queries so components adapt to the space they're given. Images are responsive with \u003ccode>srcset\u003c/code>, touch targets are large enough, at least 24 pixels and ideally 44, and I make sure nothing depends on hover alone.\u003c/p>\u003cp>Testing matters too: I use DevTools device mode while building, but I also test on real devices, especially a mid-range Android phone, because performance and touch behaviour on real hardware can be very different from a desktop simulation.\u003c/p>\u003c/div>\n\u003cp>Mobile-first (\u003ccode>min-width\u003c/code> media queries), fluid layouts (grid/flex, \u003ccode>%\u003c/code>, \u003ccode>clamp()\u003c/code>), container queries for components, responsive images, touch targets ≥ 24–44 px, test on real devices, and consider \u003cstrong>performance on low-end Android\u003c/strong> (most of your users' real devices).\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>Mobile-first versus desktop-first: why mobile-first?\u003c/summary>\u003cp>Base styles stay simple, small screens don't download and override desktop styles, and it forces you to prioritise content. It also matches where most e-commerce traffic is.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>How do you handle images for different screen sizes?\u003c/summary>\u003cp>\u003ccode>srcset\u003c/code> and \u003ccode>sizes\u003c/code> for different resolutions, and the \u003ccode>picture\u003c/code> element when the crop itself should change between mobile and desktop.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Box model, positioning, stacking contexts (quick hits)\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>Every element is a box made of content, padding, border and margin. I always set \u003ccode>box-sizing: border-box\u003c/code> globally, so the width includes padding and border, which makes sizing predictable.\u003c/p>\u003cp>For positioning: relative offsets an element and becomes the reference for absolutely positioned children. Absolute takes the element out of the flow. Fixed is relative to the viewport. Sticky behaves like relative until a scroll threshold, then sticks.\u003c/p>\u003cp>Stacking contexts explain most z-index bugs. A new stacking context is created by things like a positioned element with a z-index, opacity less than one, a transform, a filter, or \u003ccode>isolation: isolate\u003c/code>. A child can never appear above something outside its parent's stacking context, no matter how high its z-index. That's why a modal with z-index 9999 can still appear behind a header. The fixes are rendering into a portal at the top of the document, or using the top layer with \u003ccode>dialog\u003c/code> or the Popover API.\u003c/p>\u003cp>And a quick one: vertical margins between block elements collapse, but not inside flex or grid containers.\u003c/p>\u003c/div>\n\u003cul>\u003cli>\u003ccode>box-sizing: border-box\u003c/code> means width includes padding and border.\u003c/li>\u003cli>\u003ccode>position\u003c/code>: \u003ccode>static\u003c/code>, \u003ccode>relative\u003c/code> (offset, creates a containing block for absolute children), \u003ccode>absolute\u003c/code>, \u003ccode>fixed\u003c/code>, \u003ccode>sticky\u003c/code>.\u003c/li>\u003cli>\u003cstrong>Stacking context\u003c/strong> is created by \u003ccode>position\u003c/code> + \u003ccode>z-index\u003c/code>, \u003ccode>opacity &lt; 1\u003c/code>, \u003ccode>transform\u003c/code>, \u003ccode>filter\u003c/code>, \u003ccode>isolation: isolate\u003c/code>... A child can never escape its parent's stacking context. That's why \u003ccode>z-index: 9999\u003c/code> \"doesn't work\", and it's a reason to use portals or the top layer (\u003ccode>&lt;dialog&gt;\u003c/code>, popover).\u003c/li>\u003cli>Margin collapsing happens for vertical margins of block elements (not in flex/grid).\u003c/li>\u003cli>BFC (block formatting context): \u003ccode>display: flow-root\u003c/code> contains floats.\u003c/li>\u003c/ul>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>Why doesn't z-index work on my element?\u003c/summary>\u003cp>Either the element isn't positioned, or it's inside a parent that creates a stacking context with a lower order. Its z-index only competes within that parent's context.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>What is position: sticky relative to?\u003c/summary>\u003cp>The nearest scrolling ancestor. It also breaks if any ancestor has \u003ccode>overflow: hidden\u003c/code>, which is a common gotcha.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Design systems: how would you build or maintain one?\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>I'd start with design tokens: colours, spacing, typography, radii and shadows defined once as the single source of truth, ideally synced from Figma, and exported as CSS variables or a Tailwind theme. That makes theming possible. Bell, for example, has several brands, and tokens are what let one component library serve all of them.\u003c/p>\u003cp>Components are built on headless, accessible primitives, with our styling, and composable APIs. Each one is documented in Storybook with usage guidelines, do's and don'ts, and accessibility notes. Quality comes from unit and interaction tests, automated accessibility checks, and visual regression tests on every pull request, because a CSS change in a shared button affects every team.\u003c/p>\u003cp>It's published as a versioned package with semantic versioning, changesets and a changelog, and breaking changes come with codemods and a deprecation period.\u003c/p>\u003cp>But I'd say the hardest part isn't technical, it's adoption and governance: a clear contribution process, design and engineering reviewing together, office hours, tracking which teams use which components, and making the design system the easiest path, so teams want to use it.\u003c/p>\u003c/div>\n\u003cul>\u003cli>\u003cstrong>Tokens\u003c/strong> (colour, spacing, typography, radii) as the source of truth → CSS variables / Tailwind theme (Style Dictionary / Figma variables).\u003c/li>\u003cli>\u003cstrong>Components\u003c/strong>: accessible, headless-based, composable, documented in \u003cstrong>Storybook\u003c/strong> with usage guidelines and a11y notes.\u003c/li>\u003cli>Versioned package (semver, changesets), a changelog, codemods for breaking changes.\u003c/li>\u003cli>Tests: unit + interaction tests in Storybook + \u003cstrong>visual regression\u003c/strong> (Chromatic / Playwright screenshots).\u003c/li>\u003cli>Governance: contribution model, design + dev review, adoption metrics, deprecation policy.\u003c/li>\u003cli>Theming: brand variants (Bell has several sub-brands, so tokens enable multi-brand theming).\u003c/li>\u003c/ul>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>How do you handle breaking changes?\u003c/summary>\u003cp>Deprecate first with warnings and documentation, provide codemods where possible, release the change in a major version, and support the previous major for a period while teams migrate.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>How do you decide whether a component belongs in the design system?\u003c/summary>\u003cp>If it's used, or clearly will be used, across several products, and its behaviour is stable. One-off feature components stay in the product until a real need for reuse appears.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>How do you measure design system success?\u003c/summary>\u003cp>Adoption across products, how many custom alternatives remain, the time to build new features, accessibility issues found, and feedback from consuming teams.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>"},{"id":"10-testing","title":"Testing Strategy","html":"\u003ch1 id=\"testing-strategy\">Testing Strategy\u003c/h1>\n\u003cblockquote>\u003cp>Your story: \u003cstrong>Jest + Cypress with QA reduced production bugs by ~30%\u003c/strong>. Seniors are asked about \u003cem>strategy\u003c/em> (what to test, where, and why) more than syntax.\u003c/p>\u003c/blockquote>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Testing pyramid vs testing trophy: what's your strategy?\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>The classic testing pyramid says to write many unit tests, fewer integration tests and very few end-to-end tests. For front end, I find the testing trophy more useful. Its base is static analysis, then a small layer of unit tests, the biggest layer is integration tests, and there are a few end-to-end tests at the top. The idea is that tests give more confidence the more they resemble how users actually use the software.\u003c/p>\u003cp>My strategy is: TypeScript in strict mode and ESLint catch entire classes of bugs for free. Unit tests cover pure logic, like price calculations, reducers and validators. Most of the effort goes into integration tests with React Testing Library: render a feature, like the cart, with its real children and store, mock the network with MSW, then interact like a user and check what's on screen. And end-to-end tests with Cypress or Playwright cover only the critical journeys: browse, add to cart, checkout and login.\u003c/p>\u003cp>At Bell, working with QA on exactly this mix, especially automating the checkout path, reduced production bugs by about 30 percent.\u003c/p>\u003c/div>\n\u003cul>\u003cli>\u003cstrong>Pyramid\u003c/strong>: many unit tests, fewer integration tests, few E2E.\u003c/li>\u003cli>\u003cstrong>Testing Trophy\u003c/strong> (Kent C. Dodds), common in front end: \u003cstrong>static\u003c/strong> (TypeScript, ESLint) → \u003cstrong>unit\u003c/strong> (pure logic) → \u003cstrong>integration\u003c/strong> (the biggest layer: components with their children, hooks and mocked network) → \u003cstrong>E2E\u003c/strong> (a few critical user journeys).\u003c/li>\u003c/ul>\n\u003cp>\"The more your tests resemble the way your software is used, the more confidence they give you.\"\u003c/p>\n\u003cp>My strategy:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Static:\u003c/strong> TS strict + ESLint (incl. hooks and a11y plugins) catch whole bug classes for free.\u003c/li>\u003cli>\u003cstrong>Unit:\u003c/strong> pure functions such as price calculations, reducers/slices, validators, formatters.\u003c/li>\u003cli>\u003cstrong>Integration:\u003c/strong> React Testing Library for features (render \u003ccode>&lt;Cart/&gt;\u003c/code> with a store + \u003cstrong>MSW\u003c/strong> mocking the API, then click \"remove\" and expect the total to update).\u003c/li>\u003cli>\u003cstrong>E2E:\u003c/strong> Cypress/Playwright for revenue-critical flows (browse → add to cart → checkout, login, EN/FR switch), run on PR (smoke) and nightly (full).\u003c/li>\u003cli>Plus \u003cstrong>visual regression\u003c/strong> for the design system, \u003cstrong>a11y checks\u003c/strong> (axe) and \u003cstrong>contract tests\u003c/strong> with the backend.\u003c/li>\u003c/ul>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>Why mostly integration tests?\u003c/summary>\u003cp>They test components together the way users experience them, so they catch real bugs in how pieces interact, while still running fast without a browser or real backend. Unit tests of tiny components often pass while the feature is broken.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>What's your view on code coverage targets?\u003c/summary>\u003cp>Useful as a signal to find untested areas, harmful as a strict target, because people write meaningless tests to hit numbers. I'd rather require tests for critical logic and new features.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">React Testing Library principles. Show a good test.\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>The core principle of React Testing Library is to test behaviour, not implementation. I interact with the component the way a user would, and check what the user would see, instead of inspecting state or calling internal methods. That makes tests resilient: I can refactor from useState to Redux and the tests still pass, as long as the behaviour is the same.\u003c/p>\u003cp>In practice, I query by role and accessible name first, like a button named \"Apply\", then by label for form fields, and only use test IDs as a last resort. I use \u003ccode>user-event\u003c/code> rather than \u003ccode>fireEvent\u003c/code>, because it simulates real interactions like typing character by character. And for anything asynchronous, I use the \u003ccode>findBy\u003c/code> queries, which wait for the element to appear.\u003c/p>\u003cp>A typical test from cart work: set up an MSW handler for the promo endpoint, render the cart with a preloaded store, type a promo code into the field found by its label, click the Apply button, and assert that the new total and a success message appear. A nice side effect of querying by role is that it also checks accessibility: if the test can't find the button by its name, a screen reader user can't either.\u003c/p>\u003c/div>\n\u003cp>Test \u003cstrong>behaviour, not implementation\u003c/strong>: query like a user (by role, label, text), interact with \u003ccode>user-event\u003c/code>, and assert on what the user sees. Don't test state variables, internal methods, or snapshot whole trees.\u003c/p>\n\u003cp>Query priority: \u003ccode>getByRole\u003c/code> &gt; \u003ccode>getByLabelText\u003c/code> &gt; \u003ccode>getByPlaceholderText\u003c/code> &gt; \u003ccode>getByText\u003c/code> &gt; \u003ccode>getByDisplayValue\u003c/code> &gt; \u003ccode>getByAltText\u003c/code> &gt; \u003ccode>getByTitle\u003c/code> &gt; \u003ccode>getByTestId\u003c/code>.\u003c/p>\n\u003cdiv class=\"code\">\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003cpre>\u003ccode data-lang=\"tsx\">\u003cspan class=\"t-k\">import\u003c/span> { render, screen } \u003cspan class=\"t-k\">from\u003c/span> \u003cspan class=\"t-s\">'@testing-library/react'\u003c/span>;\n\u003cspan class=\"t-k\">import\u003c/span> userEvent \u003cspan class=\"t-k\">from\u003c/span> \u003cspan class=\"t-s\">'@testing-library/user-event'\u003c/span>;\n\u003cspan class=\"t-k\">import\u003c/span> { http, HttpResponse } \u003cspan class=\"t-k\">from\u003c/span> \u003cspan class=\"t-s\">'msw'\u003c/span>;\n\u003cspan class=\"t-k\">import\u003c/span> { server } \u003cspan class=\"t-k\">from\u003c/span> \u003cspan class=\"t-s\">'../mocks/server'\u003c/span>;\n\ntest(\u003cspan class=\"t-s\">'applies a promo code and updates the total'\u003c/span>, \u003cspan class=\"t-k\">async\u003c/span> () =&gt; {\n  server.use(\n    http.post(\u003cspan class=\"t-s\">'/api/cart/promo'\u003c/span>, () =&gt; HttpResponse.json({ total: \u003cspan class=\"t-n\">90\u003c/span>, discount: \u003cspan class=\"t-n\">10\u003c/span> }))\n  );\n  \u003cspan class=\"t-k\">const\u003c/span> user = userEvent.setup();\n  renderWithProviders(&lt;Cart /&gt;, { preloadedState: { cart: cartWith100Dollars } });\n\n  \u003cspan class=\"t-k\">await\u003c/span> user.\u003cspan class=\"t-k\">type\u003c/span>(screen.getByLabelText(/promo code/i), \u003cspan class=\"t-s\">'SAVE10'\u003c/span>);\n  \u003cspan class=\"t-k\">await\u003c/span> user.click(screen.getByRole(\u003cspan class=\"t-s\">'button'\u003c/span>, { name: /apply/i }));\n\n  expect(\u003cspan class=\"t-k\">await\u003c/span> screen.findByText(/total: \\$\u003cspan class=\"t-n\">90\u003c/span>\\.\u003cspan class=\"t-n\">00\u003c/span>/i)).toBeInTheDocument();\n  expect(screen.getByRole(\u003cspan class=\"t-s\">'status'\u003c/span>)).toHaveTextContent(/promo applied/i);\n});\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>\u003ccode>getBy\u003c/code> throws if missing, \u003ccode>queryBy\u003c/code> returns null (use it for asserting absence), and \u003ccode>findBy\u003c/code> is async (waits). Avoid \u003ccode>act()\u003c/code> warnings by awaiting \u003ccode>findBy\u003c/code>/\u003ccode>waitFor\u003c/code>.\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>When is getByTestId acceptable?\u003c/summary>\u003cp>When there's no accessible way to query the element, like a container with no role or text, or dynamic content where text is unstable. It should be the exception.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>What's the difference between fireEvent and userEvent?\u003c/summary>\u003cp>\u003ccode>fireEvent\u003c/code> dispatches a single DOM event. \u003ccode>userEvent\u003c/code> simulates the full interaction, like focus, key down, key press, input and key up, so it catches more realistic bugs.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>How do you fix \"not wrapped in act\" warnings?\u003c/summary>\u003cp>They usually mean a state update happened after the test stopped waiting. Use \u003ccode>findBy\u003c/code> or \u003ccode>waitFor\u003c/code> to wait for the final UI state, rather than wrapping things in act manually.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Why MSW (Mock Service Worker) instead of mocking fetch/axios?\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>MSW intercepts requests at the network level instead of replacing your HTTP client with a mock. That means the code under test runs for real: my fetch calls, my API layer, error handling, and the data-fetching library's caching and retries. If I mocked axios directly, I'd be skipping exactly the code most likely to have bugs, and the tests would break whenever I changed the HTTP library.\u003c/p>\u003cp>The other big advantage is reuse. The same request handlers work in unit and integration tests in Node, in the browser during development, and in Storybook. That was really useful on the API integration work at Bell: we agreed the contract with the backend team, wrote MSW handlers that matched it, and could build and test the front end before the backend was ready. When the real API arrived, we just turned the mocks off.\u003c/p>\u003cp>It also makes it easy to test edge cases, like a 500 error, a slow response or an empty list, by overriding a handler in a single test.\u003c/p>\u003c/div>\n\u003cp>MSW intercepts at the \u003cstrong>network level\u003c/strong>, so your real fetch code, API layer, query library and error handling all run. The \u003cstrong>same handlers\u003c/strong> work in tests (Node), the browser during development (build UI before the backend exists, as in your API-integration story), and Storybook. It's less brittle than \u003ccode>jest.mock('axios')\u003c/code> and doesn't care which HTTP client you use.\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>How do you test an error state with MSW?\u003c/summary>\u003cp>Override the handler in that specific test with \u003ccode>server.use\u003c/code>, returning a 500 or a network error, then assert that the error message appears. Handlers reset after each test.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>How do you make sure no test hits a real API?\u003c/summary>\u003cp>Configure MSW to error on unhandled requests, so any unexpected call fails the test.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Jest vs Vitest\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>They're very similar from a developer's point of view. Vitest deliberately kept a Jest-compatible API, so \u003ccode>describe\u003c/code>, \u003ccode>it\u003c/code>, \u003ccode>expect\u003c/code> and mocking work almost the same way.\u003c/p>\u003cp>The differences are under the hood. Vitest is built on Vite, so it reuses the same configuration and transforms as the app, has native ES module and TypeScript support without extra setup, and is generally faster, especially in watch mode. Jest is very mature, with a huge ecosystem, and it's still what most existing enterprise codebases use, including Bell's.\u003c/p>\u003cp>For a new Vite-based project, I'd choose Vitest. For an existing Jest codebase, I'd only migrate if speed or ESM configuration problems were a real pain point, and the migration is usually straightforward. I'd also mention Vitest's browser mode, which runs component tests in a real browser instead of a simulated DOM.\u003c/p>\u003c/div>\n\u003cp>Vitest has a Jest-compatible API, is Vite-native (shares config/transforms), is fast with ESM support, and is the default for Vite projects. Jest is mature and still everywhere (Bell). Migration is usually easy. Use Vitest \u003cstrong>browser mode\u003c/strong> for real-browser component tests.\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>What's the hardest part of migrating Jest to Vitest?\u003c/summary>\u003cp>Module mocking differences and Jest-specific config like transforms or module name mappers. Most test code works unchanged, especially with globals enabled.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>Why might you run component tests in a real browser?\u003c/summary>\u003cp>jsdom doesn't implement layout, CSS or many browser APIs, so things like visibility, scrolling, IntersectionObserver or focus behaviour are better tested in a real browser.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Cypress vs Playwright\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>I've used Cypress at Bell for our end-to-end tests. Its strength is the developer experience: the interactive runner shows the app as tests run, with time-travel snapshots of each step, which makes writing and debugging tests pleasant. Its limitations are that it runs inside the browser, so multiple tabs and cross-origin flows have historically been harder, and parallel runs are mainly a paid cloud feature.\u003c/p>\u003cp>Playwright controls the browser from outside. It supports Chromium, Firefox and WebKit, which is the closest you get to testing Safari, and it handles multiple tabs, origins and browser contexts easily. It has free built-in parallelisation and sharding, and its trace viewer is excellent for debugging CI failures.\u003c/p>\u003cp>Many teams are moving to Playwright for speed, cross-browser coverage and cost. The good news is that the concepts transfer directly: stable selectors, waiting on conditions instead of timeouts, and focusing on critical user journeys. So I'd be comfortable with either, and I'd pick based on the team's existing investment.\u003c/p>\u003c/div>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Cypress (you used it)\u003c/th>\u003cth>Playwright\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Runs inside the browser, great interactive runner / time-travel debugging\u003c/td>\u003ctd>Controls browsers externally via CDP-like protocols\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Chromium, Firefox, WebKit (experimental)\u003c/td>\u003ctd>Chromium, Firefox, \u003cstrong>WebKit\u003c/strong> (Safari engine) first-class\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Single tab, same-origin limits (improved with \u003ccode>cy.origin\u003c/code>)\u003c/td>\u003ctd>Multi-tab, multi-origin, multiple contexts\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Parallelisation via paid Cloud\u003c/td>\u003ctd>Free built-in parallelism + sharding, trace viewer\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Component testing\u003c/td>\u003ctd>Component testing (experimental), API testing\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Trend: many teams are moving to \u003cstrong>Playwright\u003c/strong> for speed, cross-browser coverage and free parallelism. Your Cypress experience transfers directly, so say so.\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>How would you migrate a Cypress suite to Playwright?\u003c/summary>\u003cp>Incrementally: write new tests in Playwright, port the most valuable or flakiest Cypress tests first, run both in CI during the transition, and retire Cypress when coverage matches.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>How do you handle login in E2E tests efficiently?\u003c/summary>\u003cp>Log in once through the API rather than the UI, save the session state, and reuse it across tests, like Playwright's storage state or Cypress's \u003ccode>cy.session\u003c/code>. Keep one dedicated test for the real login UI.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">How do you deal with flaky tests?\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>First, I treat a flaky test as a real bug, not something to retry until it passes, because flaky tests destroy trust in the whole suite and people start ignoring failures.\u003c/p>\u003cp>To fix them, I look at the usual causes. Timing is the most common: tests with fixed waits, like waiting one second, instead of waiting for a condition, so I replace them with assertions that retry or \u003ccode>findBy\u003c/code> queries. Then shared state between tests: each test should set up its own data and not depend on another test's order. Real network calls to third-party services should be mocked or stubbed. Non-deterministic data like dates, random values and sort order needs to be controlled, for example with fake timers. Animations can be disabled in the test environment. And fragile selectors based on CSS classes or text that changes should be replaced with roles or test IDs.\u003c/p>\u003cp>As a process, I'd quarantine a flaky test with a ticket and an owner, so it doesn't block everyone, fix it quickly, and track the flake rate in CI so we can see if it's getting worse.\u003c/p>\u003c/div>\n\u003cp>Causes: timing (fixed \u003ccode>wait(1000)\u003c/code>), test interdependence/shared state, real network/3rd-party calls, animations, non-deterministic data (dates, random, ordering), and selector fragility.\u003c/p>\n\u003cp>Fixes: wait on \u003cstrong>conditions\u003c/strong> (auto-retrying assertions, \u003ccode>findBy\u003c/code>), not time; isolate state (reset DB/store, seed data via API); \u003cstrong>mock the network\u003c/strong> for non-E2E tests; stable selectors (\u003ccode>role\u003c/code>, \u003ccode>data-testid\u003c/code>); freeze time (fake timers / \u003ccode>cy.clock\u003c/code>); disable animations in test env; quarantine-and-fix policy (a flaky test is a bug with an owner); track flake rate in CI.\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>Is automatic retry in CI a good solution?\u003c/summary>\u003cp>Only as a temporary safety net. It hides real race conditions, and some flaky tests point to actual production bugs. I'd track retried tests and fix them.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>How would you find out whether a test is flaky?\u003c/summary>\u003cp>Run it many times in a loop or in CI with repeat options, and track failure rates per test over time. Some CI tools and test runners report flakiness directly.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">What do you NOT test?\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>I avoid testing implementation details, such as a component's internal state variables, private functions, or which hooks it uses, because those tests break during refactoring even when nothing is actually broken. I don't test third-party libraries; I trust React and the router to work. I don't write tests for trivial code with no logic.\u003c/p>\u003cp>I'm also careful with large snapshot tests. They tend to get updated without anyone reading them, so they don't really catch bugs. For visual changes, proper visual regression testing works better.\u003c/p>\u003cp>And I don't chase 100 percent coverage. Coverage is a useful signal for finding untested areas, but not a goal. I focus effort on business-critical logic, like pricing, eligibility rules and checkout validation, and on the most important user flows. That's where a bug costs real money.\u003c/p>\u003c/div>\n\u003cp>Third-party library internals, implementation details (state shape, private functions), trivial getters, styling via snapshots (use visual regression instead), and 100%-coverage vanity. Focus coverage on \u003cstrong>business-critical logic\u003c/strong> (pricing, eligibility, checkout validation) and \u003cstrong>user flows\u003c/strong>. Coverage is a signal, not a goal.\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>Are snapshot tests useless?\u003c/summary>\u003cp>Not useless. Small, focused snapshots, like a serialised config or the output of a formatter, work well. Large component snapshots become noise that people update without reading.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>Do you test CSS?\u003c/summary>\u003cp>Not with unit tests. I use visual regression tests for important components and pages, and test behaviour that depends on CSS, like visibility, in real-browser tests.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Testing custom hooks, timers and async code\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>For custom hooks, I prefer testing them through a component that uses them, but for reusable hooks I use \u003ccode>renderHook\u003c/code> from React Testing Library. It renders the hook and gives me \u003ccode>result.current\u003c/code> to check its return value, plus \u003ccode>rerender\u003c/code> to pass new arguments.\u003c/p>\u003cp>For timers, I use fake timers. For example, to test a debounce hook: render it with an initial value, re-render with a new value, check that the result is still the old value, then advance the timers by the debounce delay inside \u003ccode>act\u003c/code>, and check that it updated. That makes the test instant and deterministic, with no real waiting. I always restore real timers afterwards.\u003c/p>\u003cp>For async code, I use the \u003ccode>findBy\u003c/code> queries or \u003ccode>waitFor\u003c/code> to wait for the expected outcome, and MSW to control the network responses, including errors and slow responses. If I see an \u003ccode>act\u003c/code> warning, it usually means a state update happened after the test finished, so I make the test wait for that final state rather than suppressing the warning.\u003c/p>\u003c/div>\n\u003cdiv class=\"code\">\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003cpre>\u003ccode data-lang=\"ts\">\u003cspan class=\"t-k\">import\u003c/span> { renderHook, act } \u003cspan class=\"t-k\">from\u003c/span> \u003cspan class=\"t-s\">'@testing-library/react'\u003c/span>;\n\ntest(\u003cspan class=\"t-s\">'useDebounce delays the value'\u003c/span>, () =&gt; {\n  vi.useFakeTimers();                                \u003cspan class=\"t-c\">// or jest.useFakeTimers()\u003c/span>\n  \u003cspan class=\"t-k\">const\u003c/span> { result, rerender } = renderHook(({ v }) =&gt; useDebounce(v, \u003cspan class=\"t-n\">300\u003c/span>), { initialProps: { v: \u003cspan class=\"t-s\">'a'\u003c/span> } });\n  rerender({ v: \u003cspan class=\"t-s\">'ab'\u003c/span> });\n  expect(result.current).toBe(\u003cspan class=\"t-s\">'a'\u003c/span>);\n  act(() =&gt; { vi.advanceTimersByTime(\u003cspan class=\"t-n\">300\u003c/span>); });\n  expect(result.current).toBe(\u003cspan class=\"t-s\">'ab'\u003c/span>);\n  vi.useRealTimers();\n});\u003c/code>\u003c/pre>\u003c/div>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>What's the pitfall with fake timers and promises?\u003c/summary>\u003cp>Promises resolve in microtasks, which fake timers don't control. After advancing timers you may need to flush promises, for example with the async versions like \u003ccode>advanceTimersByTimeAsync\u003c/code>.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>Should you test hooks directly or through components?\u003c/summary>\u003cp>Through components when the hook is specific to one component. Directly with \u003ccode>renderHook\u003c/code> when it's a reusable hook with its own API.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Contract testing and visual regression: what and why?\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>Contract testing verifies that the front end and the backend agree on the API shape without running the full system end to end. Tools like Pact record what the consumer expects and verify it against the provider, or you can validate responses against the OpenAPI schema. In a microservices setup like Bell's, it catches the classic problem where a backend team renames a field and the front end breaks in production, and it catches it in the backend's pipeline before deployment.\u003c/p>\u003cp>Visual regression testing takes screenshots of components or pages and compares them with approved baselines on each pull request, using tools like Chromatic, Percy, or Playwright's screenshot assertions. It catches unintended visual changes that functional tests miss, like a CSS change in a shared component breaking the layout on a page nobody checked. It's essential for a design system used by many teams.\u003c/p>\u003cp>Both fill gaps that unit and end-to-end tests don't cover well, at a much lower cost than full end-to-end environments.\u003c/p>\u003c/div>\n\u003cul>\u003cli>\u003cstrong>Contract testing\u003c/strong> (Pact, or schema validation against OpenAPI): verifies that the front end's expectations of an API match what the backend provides, \u003cem>without\u003c/em> full E2E environments. It catches \"backend renamed a field\" before production.\u003c/li>\u003cli>\u003cstrong>Visual regression\u003c/strong> (Chromatic, Percy, Playwright \u003ccode>toHaveScreenshot\u003c/code>): pixel/DOM snapshots of components/pages compared per PR. Essential for a shared \u003cstrong>design system\u003c/strong> used by many teams.\u003c/li>\u003c/ul>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>What causes false positives in visual testing?\u003c/summary>\u003cp>Fonts and anti-aliasing differences between machines, animations, dates and random data. You fix it by running in a consistent Docker environment, disabling animations, and fixing data.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>Who owns the contract tests?\u003c/summary>\u003cp>The consumer, meaning the front end, defines its expectations, and the provider's pipeline verifies them before deploying. Ownership is shared, which is why it encourages communication.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">How do tests fit into CI/CD?\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>On every pull request, the pipeline runs the fast checks in parallel: linting, type-checking, unit and integration tests, and a production build with a bundle size check. Then it deploys a preview environment and runs a small end-to-end smoke suite against it, plus accessibility and Lighthouse checks if possible. All of these are required checks before merging, along with code review.\u003c/p>\u003cp>After merging to main, we build the artifact once, deploy it to staging, run the full end-to-end suite, and then promote that same artifact to production, ideally with a canary release or behind feature flags, followed by smoke tests and monitoring. A nightly job can run the slower cross-browser tests.\u003c/p>\u003cp>The key is keeping the pull request pipeline fast, ideally under 10 minutes, with caching, parallel jobs and only testing affected projects in a monorepo. If the pipeline is slow, people find ways to bypass it, and then it stops protecting anything.\u003c/p>\u003c/div>\n\u003cp>On every PR: lint + type-check + unit/integration tests (fast, parallel) + build + bundle-size check + a small E2E smoke suite against a \u003cstrong>preview deployment\u003c/strong>. On merge: full E2E, deploy to staging, smoke tests, then production (canary/feature flags). Nightly: full cross-browser E2E + a11y + Lighthouse. Required checks block the merge. Keep the PR pipeline under ~10 minutes, or people will bypass it.\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>How do you keep the pipeline fast as the test suite grows?\u003c/summary>\u003cp>Parallelise and shard tests, cache dependencies and builds, run only affected tests in a monorepo, keep the PR suite focused, and move slow cross-browser runs to nightly jobs.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>What do you do when a test fails on main?\u003c/summary>\u003cp>Treat it as a priority: either fix it quickly or revert the change that broke it, because a red main branch blocks everyone and hides new failures.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>"},{"id":"11-security","title":"Front-End Security","html":"\u003ch1 id=\"front-end-security\">Front-End Security\u003c/h1>\n\u003cblockquote>\u003cp>E-commerce + payments + customer accounts (Bell) means security questions are fair game. Know the \u003cstrong>OWASP\u003c/strong> basics from a front-end angle.\u003c/p>\u003c/blockquote>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">What is XSS? How does React protect you, and where doesn't it?\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>Cross-site scripting is when an attacker manages to run their own JavaScript in other users' browsers on your site. That script can steal session data, act as the user, or skim payment details from a form. It can be stored, for example in a product review saved in the database; reflected, from a URL parameter; or DOM-based, where client-side code writes untrusted data into the page.\u003c/p>\u003cp>React protects you by default because it escapes any value rendered in JSX, so user input appears as text, not HTML. But there are gaps. \u003ccode>dangerouslySetInnerHTML\u003c/code> bypasses it, so any HTML from a CMS or a user must be sanitised with DOMPurify first. \u003ccode>href\u003c/code> attributes can contain \u003ccode>javascript:\u003c/code> URLs, so I validate that user-provided links use http or https. Direct DOM APIs like \u003ccode>innerHTML\u003c/code> or \u003ccode>eval\u003c/code> bypass React entirely. Serialising state into a script tag during SSR needs proper escaping. And third-party scripts run with full access to the page.\u003c/p>\u003cp>So I rely on defence in depth: sanitising, a Content Security Policy, HttpOnly cookies so session tokens can't be read by scripts, and server-side validation.\u003c/p>\u003c/div>\n\u003cp>\u003cstrong>Cross-Site Scripting\u003c/strong> is an attacker getting their JavaScript to run in your users' browsers (steal sessions, act as the user, skim payment forms).\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Stored\u003c/strong> (saved in the DB, e.g. a product review), \u003cstrong>Reflected\u003c/strong> (in the URL/response), \u003cstrong>DOM-based\u003c/strong> (client JS writes untrusted data into the DOM).\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>React escapes\u003c/strong> values rendered in JSX (\u003ccode>{userInput}\u003c/code> becomes text). It does \u003cstrong>not\u003c/strong> protect:\u003c/p>\n\u003cul>\u003cli>\u003ccode>dangerouslySetInnerHTML\u003c/code> → sanitise with \u003cstrong>DOMPurify\u003c/strong> first (CMS content, rich text).\u003c/li>\u003cli>\u003ccode>href={userUrl}\u003c/code> → \u003ccode>javascript:alert(1)\u003c/code> URLs. Validate the protocol (\u003ccode>http:\u003c/code>/\u003ccode>https:\u003c/code> only).\u003c/li>\u003cli>Direct DOM APIs: \u003ccode>innerHTML\u003c/code>, \u003ccode>insertAdjacentHTML\u003c/code>, \u003ccode>document.write\u003c/code>, \u003ccode>eval\u003c/code>, \u003ccode>new Function\u003c/code>, \u003ccode>setTimeout(string)\u003c/code>.\u003c/li>\u003cli>SSR: serialising state into \u003ccode>&lt;script&gt;\u003c/code> tags without escaping (\u003ccode>&lt;/script&gt;\u003c/code> injection). Use safe serialisers.\u003c/li>\u003cli>Third-party scripts (they run with full page privileges).\u003c/li>\u003c/ul>\n\u003cp>Defence in depth: \u003cstrong>Content Security Policy\u003c/strong>, \u003cstrong>HttpOnly cookies\u003c/strong> (JS can't read the session), \u003cstrong>Trusted Types\u003c/strong>, input validation on the server, and output encoding.\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>How would you safely render HTML from a CMS?\u003c/summary>\u003cp>Sanitise it with DOMPurify using a strict allow-list of tags and attributes, preferably on the server or at build time, and then render it. Ideally the CMS provides structured content instead of raw HTML.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>What are Trusted Types?\u003c/summary>\u003cp>A browser feature, enforced through CSP, that makes dangerous DOM sinks like innerHTML only accept special typed values created by approved policies, so a stray string can't be injected.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>Is user input in a URL query parameter safe in React?\u003c/summary>\u003cp>Rendering it as text is safe. Using it in an \u003ccode>href\u003c/code>, in \u003ccode>dangerouslySetInnerHTML\u003c/code> or passing it to eval-like functions is not.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">What is Content Security Policy (CSP)?\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>CSP is an HTTP response header that tells the browser which sources are allowed to load scripts, styles, images, fonts, frames and network connections. If an attacker injects a script tag pointing to their own domain, or an inline script, the browser refuses to run it. That makes it one of the strongest defences against XSS.\u003c/p>\u003cp>A good modern policy uses nonces or hashes for scripts instead of allowing all inline scripts, with \u003ccode>strict-dynamic\u003c/code> so trusted scripts can load their dependencies. It restricts \u003ccode>connect-src\u003c/code> to your own APIs, blocks plugins with \u003ccode>object-src 'none'\u003c/code>, and uses \u003ccode>frame-ancestors\u003c/code> to prevent clickjacking.\u003c/p>\u003cp>The way to roll it out safely is to start with the report-only header, collect violation reports for a while to see what would break, fix or allow-list those, and then enforce it.\u003c/p>\u003cp>The real-world challenge on large corporate sites is third-party marketing scripts and tag managers, which load scripts from many domains. So CSP is partly a governance conversation: which third parties do we actually need?\u003c/p>\u003c/div>\n\u003cp>An HTTP response header that whitelists where scripts, styles, images, frames and connections can load from, which blocks most injected scripts.\u003c/p>\n\u003cdiv class=\"code\">\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003cpre>\u003ccode data-lang=\"\">Content-Security-Policy: \u003cspan class=\"t-k\">default\u003c/span>-src \u003cspan class=\"t-s\">'self'\u003c/span>; script-src \u003cspan class=\"t-s\">'self'\u003c/span> \u003cspan class=\"t-s\">'nonce-r4nd0m'\u003c/span> \u003cspan class=\"t-s\">'strict-dynamic'\u003c/span>;\n  img-src \u003cspan class=\"t-s\">'self'\u003c/span> https:\u003cspan class=\"t-c\">//images.cdn.example; connect-src 'self' https://api.example;\u003c/span>\n  frame-ancestors \u003cspan class=\"t-s\">'none'\u003c/span>; object-src \u003cspan class=\"t-s\">'none'\u003c/span>; base-uri \u003cspan class=\"t-s\">'self'\u003c/span>\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>Use \u003cstrong>nonces/hashes\u003c/strong> instead of \u003ccode>'unsafe-inline'\u003c/code>, and roll out with \u003ccode>Content-Security-Policy-Report-Only\u003c/code> first to collect violations. Challenge on big corporate sites: \u003cstrong>tag managers and marketing scripts\u003c/strong>. A senior would push to govern third-party scripts.\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>Why are nonces better than 'unsafe-inline'?\u003c/summary>\u003cp>'unsafe-inline' allows any inline script, including injected ones, which defeats much of CSP. A nonce is a random value per response, and only scripts with that nonce run, which an attacker can't guess.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>How does CSP work with Next.js?\u003c/summary>\u003cp>Generate a nonce per request in middleware or the proxy, set it in the CSP header, and Next.js applies it to its own scripts. It requires dynamic rendering for those pages, which is a trade-off with static caching.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">What is CSRF, and how is it prevented?\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>Cross-site request forgery is an attack where a malicious website makes the user's browser send a request to your site, and because the browser automatically attaches cookies, the request is authenticated as the user. For example, a hidden form on another site that submits a \"change email address\" request to your account page.\u003c/p>\u003cp>The main defence today is the \u003ccode>SameSite\u003c/code> cookie attribute. With \u003ccode>Lax\u003c/code>, which is now the browser default, cookies aren't sent on cross-site POST requests, and \u003ccode>Strict\u003c/code> is even tighter for sensitive cookies. On top of that, I'd use CSRF tokens for state-changing requests, either a token from the server embedded in the form or the double-submit cookie pattern, and check the \u003ccode>Origin\u003c/code> header on the server. And state-changing operations should never be GET requests.\u003c/p>\u003cp>It's worth noting the trade-off with tokens: if the API uses a bearer token in a header instead of cookies, CSRF isn't a risk, but then you have to store the token somewhere JavaScript can read it, which makes XSS more dangerous.\u003c/p>\u003c/div>\n\u003cp>\u003cstrong>Cross-Site Request Forgery\u003c/strong>: a malicious site makes the user's browser send an authenticated request (cookies attached automatically) to your site, e.g. a hidden form that POSTs to \u003ccode>/account/change-email\u003c/code>.\u003c/p>\n\u003cp>Prevention:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>\u003ccode>SameSite\u003c/code> cookies\u003c/strong> (\u003ccode>Lax\u003c/code> by default in modern browsers; \u003ccode>Strict\u003c/code> for sensitive ones).\u003c/li>\u003cli>\u003cstrong>CSRF tokens\u003c/strong> (synchroniser token or double-submit cookie) for state-changing requests.\u003c/li>\u003cli>Check \u003ccode>Origin\u003c/code> / \u003ccode>Referer\u003c/code> headers.\u003c/li>\u003cli>Never change state with GET.\u003c/li>\u003c/ul>\n\u003cp>Bearer tokens in headers aren't vulnerable to CSRF, but then token storage is an XSS risk. That's the trade-off.\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>Does SameSite=Lax fully protect against CSRF?\u003c/summary>\u003cp>Mostly, but not completely: Lax still sends cookies on top-level GET navigations, so GET endpoints must never change state, and older browsers or subdomain attacks remain concerns. That's why tokens or origin checks add defence in depth.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>Do JSON APIs need CSRF protection?\u003c/summary>\u003cp>If they use cookies for auth, yes. Requiring a JSON content type and checking the Origin header helps, because cross-site forms can't send JSON without a preflight, but it shouldn't be the only defence.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Where should you store auth tokens? (classic senior question)\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>This is a trade-off between XSS and CSRF risk. If you store tokens in localStorage, any script running on the page can read them, so a single XSS vulnerability, including one in a third-party script, means the token gets stolen and used from anywhere. So I avoid localStorage for anything sensitive. Keeping a token in memory is better, but it's lost on refresh, and it's still accessible while the page is running.\u003c/p>\u003cp>My recommended approach is an HttpOnly, Secure, SameSite cookie. JavaScript can't read it at all, it's only sent over HTTPS, and SameSite blocks most CSRF, with a CSRF token added for extra protection. Even better is the Backend-for-Frontend pattern: the BFF handles the OAuth flow and keeps the actual access and refresh tokens on the server, and the browser only has a session cookie. Access tokens are short-lived, and refresh tokens are rotated.\u003c/p>\u003cp>I'd add one honest caveat: HttpOnly cookies stop token theft, but if there's an XSS vulnerability, the attacker can still make requests as the user while they're on the page. So preventing XSS is still essential.\u003c/p>\u003c/div>\n\u003cul>\u003cli>\u003cstrong>\u003ccode>localStorage\u003c/code>\u003c/strong>: readable by any JS on the page, so \u003cstrong>XSS = token theft\u003c/strong>. Avoid it for sensitive tokens.\u003c/li>\u003cli>\u003cstrong>In-memory\u003c/strong> (a JS variable): lost on refresh; still readable by XSS while the page is running, but not persisted.\u003c/li>\u003cli>\u003cstrong>\u003ccode>HttpOnly; Secure; SameSite\u003c/code> cookie\u003c/strong>: JS can't read it (mitigates token theft via XSS); needs CSRF protection (SameSite + token).\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Recommended:\u003c/strong> session or refresh token in an \u003cstrong>HttpOnly Secure SameSite cookie\u003c/strong>, ideally managed by a \u003cstrong>BFF\u003c/strong> (Backend-for-Frontend). The browser never sees OAuth tokens; the BFF holds them server-side. Short-lived access tokens, refresh token rotation.\u003c/p>\n\u003cp>Note: XSS can still \u003cem>make requests as the user\u003c/em> even with HttpOnly cookies, so preventing XSS remains essential.\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>How does the frontend know if the user is logged in with HttpOnly cookies?\u003c/summary>\u003cp>It calls a session endpoint, like \u003ccode>/api/me\u003c/code>, which returns the user, or the server renders the user state into the page. The frontend never reads the token itself.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>How does token refresh work?\u003c/summary>\u003cp>The access token is short-lived. When it expires, the BFF or the client calls a refresh endpoint using the refresh token in an HttpOnly cookie, gets a new access token, and rotates the refresh token so a stolen one can only be used once.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Explain OAuth 2.0 / OpenID Connect and PKCE for an SPA\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>OAuth 2.0 is about authorisation. It lets an app get an access token to call APIs on behalf of the user, without handling their password. OpenID Connect is a layer on top that adds authentication. It provides an ID token that says who the user is. So login is OIDC, and calling APIs is OAuth.\u003c/p>\u003cp>For single-page apps and mobile apps, the recommended flow is Authorization Code with PKCE. The app generates a random secret called the code verifier, and sends a hashed version, the code challenge, when redirecting the user to the login page. After login, the app gets an authorisation code, and exchanges it for tokens by sending the original verifier. If an attacker intercepts the code, it's useless without the verifier. The older implicit flow, which returned tokens directly in the URL, is now deprecated.\u003c/p>\u003cp>In practice, you'd use a provider like Auth0, Okta, AWS Cognito or Microsoft Entra ID with their SDK, or a BFF that does the flow on the server, which keeps tokens out of the browser.\u003c/p>\u003c/div>\n\u003cul>\u003cli>\u003cstrong>OAuth 2.0\u003c/strong>: delegated \u003cstrong>authorisation\u003c/strong> (access tokens to call APIs).\u003c/li>\u003cli>\u003cstrong>OIDC\u003c/strong>: an identity layer on top, adding the \u003cstrong>ID token\u003c/strong> (who the user is) for \u003cstrong>authentication / login\u003c/strong>.\u003c/li>\u003cli>For SPAs and mobile apps: \u003cstrong>Authorization Code flow + PKCE\u003c/strong>. The app creates a random \u003ccode>code_verifier\u003c/code>, sends its hash (\u003ccode>code_challenge\u003c/code>) with the auth request, receives a code, and exchanges code + verifier for tokens. An intercepted code is useless without the verifier.\u003c/li>\u003cli>The \u003cstrong>Implicit flow is deprecated\u003c/strong> (tokens in the URL).\u003c/li>\u003cli>Providers: Auth0/Okta, AWS Cognito, Azure Entra ID, Keycloak, and NextAuth/Auth.js in Next.js.\u003c/li>\u003c/ul>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>What's the difference between the ID token and the access token?\u003c/summary>\u003cp>The ID token is for the client, describing who the user is. The access token is for the API, granting permission. You should never send the ID token to APIs as an access token.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>Why was the implicit flow deprecated?\u003c/summary>\u003cp>Tokens were returned in the URL fragment, where they could leak through browser history, logs and referrers, and there was no proof that the client requesting the token was the one receiving it.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">CORS: what is it and what is it NOT?\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>The browser's same-origin policy prevents JavaScript on one origin from reading responses from another origin. CORS is the mechanism that lets a server opt in to allowing that. The server sends headers like \u003ccode>Access-Control-Allow-Origin\u003c/code> to say which origins may read the response, and whether credentials are allowed. For non-simple requests, like a PUT or a JSON content type, the browser first sends a preflight OPTIONS request to ask permission.\u003c/p>\u003cp>What CORS is not: it's not a server-side security control. It doesn't stop anyone calling your API with curl or from another server. It only controls what browsers allow JavaScript to read, to protect users. So it doesn't replace authentication.\u003c/p>\u003cp>When developers hit a CORS error, the fix is on the server, by configuring the allowed origins correctly, or by avoiding cross-origin calls entirely with a dev proxy or a BFF on the same domain. Two gotchas: the wildcard origin can't be used with credentials, and reflecting any origin back is effectively no protection at all.\u003c/p>\u003c/div>\n\u003cp>The \u003cstrong>Same-Origin Policy\u003c/strong> stops JS on \u003ccode>a.com\u003c/code> from reading responses from \u003ccode>b.com\u003c/code>. \u003cstrong>CORS\u003c/strong> is how \u003ccode>b.com\u003c/code> \u003cem>opts in\u003c/em>, via response headers: \u003ccode>Access-Control-Allow-Origin\u003c/code>, \u003ccode>-Methods\u003c/code>, \u003ccode>-Headers\u003c/code>, \u003ccode>-Credentials\u003c/code>.\u003c/p>\n\u003cp>\u003cstrong>Preflight\u003c/strong>: for \"non-simple\" requests (e.g. \u003ccode>PUT\u003c/code>, a JSON \u003ccode>Content-Type\u003c/code>, custom headers) the browser first sends \u003ccode>OPTIONS\u003c/code> to check permission.\u003c/p>\n\u003cp>What it's NOT: it's not a server-side security mechanism, and it doesn't stop curl or server-to-server calls. It protects \u003cstrong>users' browsers\u003c/strong>. \u003ccode>Access-Control-Allow-Origin: *\u003c/code> can't be combined with credentials. A \"CORS error\" is fixed \u003cstrong>on the server\u003c/strong> (or with a dev proxy / BFF on the same origin), never by disabling security in the browser.\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>Why do I see an OPTIONS request before my POST?\u003c/summary>\u003cp>It's a CORS preflight. Because the request uses a JSON content type or custom headers, the browser first asks the server whether the actual request is allowed.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>How do you avoid CORS entirely?\u003c/summary>\u003cp>Serve the API from the same origin as the frontend, through a reverse proxy, CDN path routing or a BFF, so no cross-origin requests happen at all.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Other headers and attacks to know\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>Clickjacking is when your site is loaded in an invisible iframe on another site to trick users into clicking things. You prevent it with the CSP \u003ccode>frame-ancestors\u003c/code> directive or the \u003ccode>X-Frame-Options\u003c/code> header. HSTS, Strict-Transport-Security, forces browsers to use HTTPS. \u003ccode>X-Content-Type-Options: nosniff\u003c/code> stops the browser guessing content types. \u003ccode>Referrer-Policy\u003c/code> controls what URL information leaks to other sites. And \u003ccode>Permissions-Policy\u003c/code> restricts features like the camera or geolocation.\u003c/p>\u003cp>Subresource Integrity adds a hash to script tags loading from a CDN, so if the file is tampered with, the browser refuses to run it. Open redirects are a common issue in login flows: a \u003ccode>returnUrl\u003c/code> parameter pointing to a malicious site, which I prevent by allow-listing redirect targets.\u003c/p>\u003cp>On the front end specifically: never put secrets in front-end environment variables, because anything prefixed \u003ccode>NEXT_PUBLIC\u003c/code> or \u003ccode>VITE\u003c/code> ends up in the bundle that anyone can read. Don't log personal data to analytics or error monitoring. And for payments, use the payment provider's hosted fields, so card data never touches your code, which also reduces PCI compliance scope.\u003c/p>\u003c/div>\n\u003cul>\u003cli>\u003cstrong>Clickjacking\u003c/strong>: your site is embedded in an invisible iframe. Fix: \u003ccode>frame-ancestors 'none'\u003c/code> (CSP) / \u003ccode>X-Frame-Options: DENY\u003c/code>.\u003c/li>\u003cli>\u003cstrong>HSTS\u003c/strong>: \u003ccode>Strict-Transport-Security\u003c/code> forces HTTPS.\u003c/li>\u003cli>\u003ccode>X-Content-Type-Options: nosniff\u003c/code>, \u003ccode>Referrer-Policy: strict-origin-when-cross-origin\u003c/code>, \u003ccode>Permissions-Policy\u003c/code>.\u003c/li>\u003cli>\u003cstrong>Subresource Integrity (SRI)\u003c/strong>: \u003ccode>&lt;script src integrity=\"sha384-...\"&gt;\u003c/code> makes the browser refuse a CDN file that was tampered with.\u003c/li>\u003cli>\u003cstrong>Open redirects\u003c/strong>: \u003ccode>?returnUrl=https://evil.com\u003c/code> after login. Allow-list redirect targets.\u003c/li>\u003cli>\u003cstrong>Sensitive data\u003c/strong>: never put secrets in front-end env vars (\u003ccode>NEXT_PUBLIC_*\u003c/code> / \u003ccode>VITE_*\u003c/code> are \u003cstrong>public\u003c/strong>!). Don't log PII to analytics/Sentry (scrub it).\u003c/li>\u003cli>\u003cstrong>Payment forms\u003c/strong>: use the provider's hosted fields/iframes (Stripe/Moneris), which keeps PCI scope off your front end.\u003c/li>\u003c/ul>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>Why are front-end environment variables not secret?\u003c/summary>\u003cp>They're inlined into the JavaScript bundle at build time, and anyone can view the bundle in their browser. Only public values belong there.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>How does HSTS preload work?\u003c/summary>\u003cp>The domain is included in a list built into browsers, so they use HTTPS even on the very first visit, before seeing the header.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Supply-chain security for npm dependencies\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>A typical front-end project has hundreds or thousands of transitive dependencies, and any of them can be compromised. There have been real incidents in the last couple of years where popular npm packages were hijacked, including through phishing maintainers, and published malicious versions that stole credentials.\u003c/p>\u003cp>The practices I follow: commit the lockfile and use \u003ccode>npm ci\u003c/co
