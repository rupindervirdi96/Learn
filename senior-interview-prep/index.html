re>\u003ccode data-lang=\"jsx\">\u003cspan class=\"t-k\">function\u003c/span> Autocomplete({ fetchSuggestions, onSelect }) {\n  \u003cspan class=\"t-k\">const\u003c/span> [input, setInput] = useState(\u003cspan class=\"t-s\">''\u003c/span>);\n  \u003cspan class=\"t-k\">const\u003c/span> [items, setItems] = useState([]);\n  \u003cspan class=\"t-k\">const\u003c/span> [active, setActive] = useState(-\u003cspan class=\"t-n\">1\u003c/span>);\n  \u003cspan class=\"t-k\">const\u003c/span> [open, setOpen] = useState(\u003cspan class=\"t-k\">false\u003c/span>);\n  \u003cspan class=\"t-k\">const\u003c/span> cache = useRef(\u003cspan class=\"t-k\">new\u003c/span> Map());\n  \u003cspan class=\"t-k\">const\u003c/span> q = useDebounce(input.trim(), \u003cspan class=\"t-n\">250\u003c/span>);\n  \u003cspan class=\"t-k\">const\u003c/span> listId = useId();\n\n  useEffect(() =&gt; {\n    \u003cspan class=\"t-k\">if\u003c/span> (q.length &lt; \u003cspan class=\"t-n\">2\u003c/span>) { setItems([]); \u003cspan class=\"t-k\">return\u003c/span>; }\n    \u003cspan class=\"t-k\">if\u003c/span> (cache.current.has(q)) { setItems(cache.current.get(q)); \u003cspan class=\"t-k\">return\u003c/span>; }\n    \u003cspan class=\"t-k\">const\u003c/span> ctrl = \u003cspan class=\"t-k\">new\u003c/span> AbortController();\n    fetchSuggestions(q, ctrl.signal)\n      .then(res =&gt; { cache.current.set(q, res); setItems(res); setOpen(\u003cspan class=\"t-k\">true\u003c/span>); setActive(-\u003cspan class=\"t-n\">1\u003c/span>); })\n      .\u003cspan class=\"t-k\">catch\u003c/span>(() =&gt; {});\n    \u003cspan class=\"t-k\">return\u003c/span> () =&gt; ctrl.abort();\n  }, [q, fetchSuggestions]);\n\n  \u003cspan class=\"t-k\">const\u003c/span> choose = item =&gt; { setInput(item.label); setOpen(\u003cspan class=\"t-k\">false\u003c/span>); onSelect(item); };\n\n  \u003cspan class=\"t-k\">const\u003c/span> onKeyDown = e =&gt; {\n    \u003cspan class=\"t-k\">if\u003c/span> (!open || !items.length) \u003cspan class=\"t-k\">return\u003c/span>;\n    \u003cspan class=\"t-k\">if\u003c/span> (e.key === \u003cspan class=\"t-s\">'ArrowDown'\u003c/span>) { e.preventDefault(); setActive(i =&gt; (i + \u003cspan class=\"t-n\">1\u003c/span>) % items.length); }\n    \u003cspan class=\"t-k\">if\u003c/span> (e.key === \u003cspan class=\"t-s\">'ArrowUp'\u003c/span>)   { e.preventDefault(); setActive(i =&gt; (i - \u003cspan class=\"t-n\">1\u003c/span> + items.length) % items.length); }\n    \u003cspan class=\"t-k\">if\u003c/span> (e.key === \u003cspan class=\"t-s\">'Enter'\u003c/span> &amp;&amp; active &gt;= \u003cspan class=\"t-n\">0\u003c/span>) { e.preventDefault(); choose(items[active]); }\n    \u003cspan class=\"t-k\">if\u003c/span> (e.key === \u003cspan class=\"t-s\">'Escape'\u003c/span>) setOpen(\u003cspan class=\"t-k\">false\u003c/span>);\n  };\n\n  \u003cspan class=\"t-k\">return\u003c/span> (\n    &lt;div className=\u003cspan class=\"t-s\">\"autocomplete\"\u003c/span>&gt;\n      &lt;input\n        role=\u003cspan class=\"t-s\">\"combobox\"\u003c/span> aria-expanded={open} aria-controls={listId} aria-autocomplete=\u003cspan class=\"t-s\">\"list\"\u003c/span>\n        aria-activedescendant={active &gt;= \u003cspan class=\"t-n\">0\u003c/span> ? listId + \u003cspan class=\"t-s\">'-'\u003c/span> + active : \u003cspan class=\"t-k\">undefined\u003c/span>}\n        value={input} onChange={e =&gt; setInput(e.target.value)} onKeyDown={onKeyDown}\n        onBlur={() =&gt; setTimeout(() =&gt; setOpen(\u003cspan class=\"t-k\">false\u003c/span>), \u003cspan class=\"t-n\">100\u003c/span>)}\n      /&gt;\n      {open &amp;&amp; items.length &gt; \u003cspan class=\"t-n\">0\u003c/span> &amp;&amp; (\n        &lt;ul role=\u003cspan class=\"t-s\">\"listbox\"\u003c/span> id={listId}&gt;\n          {items.map((item, i) =&gt; (\n            &lt;li key={item.id} id={listId + \u003cspan class=\"t-s\">'-'\u003c/span> + i} role=\u003cspan class=\"t-s\">\"option\"\u003c/span> aria-selected={i === active}\n                onMouseDown={e =&gt; e.preventDefault()} onClick={() =&gt; choose(item)}&gt;\n              {item.label}\n            &lt;/li&gt;\n          ))}\n        &lt;/ul&gt;\n      )}\n    &lt;/div&gt;\n  );\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>Talking points: debounce, \u003cstrong>abort stale requests\u003c/strong>, \u003cstrong>cache\u003c/strong>, ARIA combobox pattern, keyboard support, \u003ccode>onMouseDown\u003c/code> preventDefault so blur doesn't close it before the click, \u003ccode>fetchSuggestions\u003c/code> should be stable (\u003ccode>useCallback\u003c/code>), and virtualise if there are many results. Bell tie-in: \u003cstrong>address autocomplete for the serviceability check\u003c/strong>.\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>How would you highlight the matching text?\u003c/summary>\u003cp>Split the label around the matched substring, case-insensitively, and wrap the match in a \u003ccode>mark\u003c/code> element. Never use \u003ccode>dangerouslySetInnerHTML\u003c/code> for this, because the suggestions may contain user content.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>How would you handle 10,000 suggestions?\u003c/summary>\u003cp>Don't render them all: limit to the top N from the server, or virtualise the listbox. And keep \u003ccode>aria-setsize\u003c/code> and \u003ccode>aria-posinset\u003c/code> correct so screen readers know the real count.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>How does a screen reader user know results appeared?\u003c/summary>\u003cp>Through a polite live region announcing \"8 results available\", plus \u003ccode>aria-expanded\u003c/code> changing on the combobox, and \u003ccode>aria-activedescendant\u003c/code> announcing the highlighted option as they arrow through.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Infinite scroll with IntersectionObserver\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>I'd keep items, page, a hasMore flag and loading in state. One effect fetches the current page and appends the results, with an ignore flag in the cleanup so a late response after unmount doesn't set state.\u003c/p>\u003cp>Instead of listening to scroll events, I put an empty sentinel element after the list and observe it with an IntersectionObserver. When it becomes visible and we're not already loading, I increment the page. I use a \u003ccode>rootMargin\u003c/code> of a couple of hundred pixels so the next page starts loading before the user actually hits the bottom. The observer is disconnected in the cleanup.\u003c/p>\u003cp>The senior points: for thousands of items, I'd add virtualisation so the DOM stays small. I'd use cursor-based pagination on the API so new items don't cause duplicates. I'd preserve scroll position when the user navigates back. And for accessibility, I'd consider a \"Load more\" button, because pure infinite scroll makes the footer unreachable and is hard for keyboard users.\u003c/p>\u003c/div>\n\u003cdiv class=\"code\">\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003cpre>\u003ccode data-lang=\"jsx\">\u003cspan class=\"t-k\">function\u003c/span> InfiniteList({ fetchPage }) {\n  \u003cspan class=\"t-k\">const\u003c/span> [items, setItems] = useState([]);\n  \u003cspan class=\"t-k\">const\u003c/span> [page, setPage] = useState(\u003cspan class=\"t-n\">1\u003c/span>);\n  \u003cspan class=\"t-k\">const\u003c/span> [hasMore, setHasMore] = useState(\u003cspan class=\"t-k\">true\u003c/span>);\n  \u003cspan class=\"t-k\">const\u003c/span> [loading, setLoading] = useState(\u003cspan class=\"t-k\">false\u003c/span>);\n  \u003cspan class=\"t-k\">const\u003c/span> sentinel = useRef(\u003cspan class=\"t-k\">null\u003c/span>);\n\n  useEffect(() =&gt; {\n    \u003cspan class=\"t-k\">let\u003c/span> ignore = \u003cspan class=\"t-k\">false\u003c/span>;\n    setLoading(\u003cspan class=\"t-k\">true\u003c/span>);\n    fetchPage(page).then(({ data, hasMore }) =&gt; {\n      \u003cspan class=\"t-k\">if\u003c/span> (ignore) \u003cspan class=\"t-k\">return\u003c/span>;\n      setItems(prev =&gt; [...prev, ...data]);\n      setHasMore(hasMore);\n      setLoading(\u003cspan class=\"t-k\">false\u003c/span>);\n    });\n    \u003cspan class=\"t-k\">return\u003c/span> () =&gt; { ignore = \u003cspan class=\"t-k\">true\u003c/span>; };\n  }, [page, fetchPage]);\n\n  useEffect(() =&gt; {\n    \u003cspan class=\"t-k\">const\u003c/span> el = sentinel.current;\n    \u003cspan class=\"t-k\">if\u003c/span> (!el || !hasMore) \u003cspan class=\"t-k\">return\u003c/span>;\n    \u003cspan class=\"t-k\">const\u003c/span> io = \u003cspan class=\"t-k\">new\u003c/span> IntersectionObserver(([entry]) =&gt; {\n      \u003cspan class=\"t-k\">if\u003c/span> (entry.isIntersecting &amp;&amp; !loading) setPage(p =&gt; p + \u003cspan class=\"t-n\">1\u003c/span>);\n    }, { rootMargin: \u003cspan class=\"t-s\">'200px'\u003c/span> });               \u003cspan class=\"t-c\">// prefetch before reaching the bottom\u003c/span>\n    io.observe(el);\n    \u003cspan class=\"t-k\">return\u003c/span> () =&gt; io.disconnect();\n  }, [hasMore, loading]);\n\n  \u003cspan class=\"t-k\">return\u003c/span> (\n    &lt;&gt;\n      &lt;ul&gt;{items.map(i =&gt; &lt;li key={i.id}&gt;{i.title}&lt;/li&gt;)}&lt;/ul&gt;\n      {loading &amp;&amp; &lt;p role=\u003cspan class=\"t-s\">\"status\"\u003c/span>&gt;Loading…&lt;/p&gt;}\n      {hasMore ? &lt;div ref={sentinel} /&gt; : &lt;p&gt;No more results&lt;/p&gt;}\n    &lt;/&gt;\n  );\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>Senior extras: \u003cstrong>virtualisation\u003c/strong> (TanStack Virtual / react-window) for thousands of rows, cursor-based pagination, preserving scroll position on back navigation, a \"Load more\" button fallback for a11y and footer reachability, and \u003ccode>useInfiniteQuery\u003c/code>.\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>How would you restore scroll position when the user comes back?\u003c/summary>\u003cp>Cache the loaded pages, for example with a query cache like \u003ccode>useInfiniteQuery\u003c/code>, and save the scroll offset in session storage or the router's history state, then restore it after the list renders.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>Why cursor-based pagination?\u003c/summary>\u003cp>With offsets, if new items are inserted while the user scrolls, page two shifts and items are duplicated or skipped. A cursor points to a specific item, so pages stay stable.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>Why might you avoid infinite scroll altogether?\u003c/summary>\u003cp>The footer becomes unreachable, users lose their place, it's hard for keyboard and screen reader users, and it's bad when people need to compare items. For e-commerce listings, a \"Load more\" button or pagination is often better.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Accessible Modal (portal, focus trap, Esc, restore focus)\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>My first choice today is the native \u003ccode>dialog\u003c/code> element with \u003ccode>showModal()\u003c/code>. It renders in the top layer, so there are no z-index problems, traps focus, closes on Escape, and makes the background inert, which covers most of the accessibility work for free.\u003c/p>\u003cp>In React I keep an \u003ccode>open\u003c/code> prop and use an effect to call \u003ccode>showModal\u003c/code> or \u003ccode>close\u003c/code> on a ref. I listen for the native close event to sync state back up through \u003ccode>onClose\u003c/code>, which handles the Escape key. I give it \u003ccode>aria-labelledby\u003c/code> pointing to the title, close it on a backdrop click by checking that the click target is the dialog itself, and render it into \u003ccode>document.body\u003c/code> with a portal.\u003c/p>\u003cp>Things I'd mention if I were building it without \u003ccode>dialog\u003c/code>: a manual focus trap, \u003ccode>role=\"dialog\"\u003c/code> with \u003ccode>aria-modal\u003c/code>, setting \u003ccode>inert\u003c/code> on the rest of the page, locking background scroll, and, importantly, returning focus to the button that opened the modal when it closes.\u003c/p>\u003c/div>\n\u003cdiv class=\"code\">\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003cpre>\u003ccode data-lang=\"jsx\">\u003cspan class=\"t-k\">function\u003c/span> Modal({ open, onClose, title, children }) {\n  \u003cspan class=\"t-k\">const\u003c/span> ref = useRef(\u003cspan class=\"t-k\">null\u003c/span>);\n  useEffect(() =&gt; {\n    \u003cspan class=\"t-k\">const\u003c/span> dialog = ref.current;\n    \u003cspan class=\"t-k\">if\u003c/span> (!dialog) \u003cspan class=\"t-k\">return\u003c/span>;\n    \u003cspan class=\"t-k\">if\u003c/span> (open &amp;&amp; !dialog.open) dialog.showModal();   \u003cspan class=\"t-c\">// native &lt;dialog&gt;: focus trap + Esc + inert background\u003c/span>\n    \u003cspan class=\"t-k\">if\u003c/span> (!open &amp;&amp; dialog.open) dialog.close();\n  }, [open]);\n\n  \u003cspan class=\"t-k\">return\u003c/span> createPortal(\n    &lt;dialog ref={ref} aria-labelledby=\u003cspan class=\"t-s\">\"modal-title\"\u003c/span> onClose={onClose}\n            onClick={e =&gt; { \u003cspan class=\"t-k\">if\u003c/span> (e.target === ref.current) onClose(); }}&gt;\n      &lt;h2 id=\u003cspan class=\"t-s\">\"modal-title\"\u003c/span>&gt;{title}&lt;/h2&gt;\n      {children}\n      &lt;button onClick={onClose}&gt;Close&lt;/button&gt;\n    &lt;/dialog&gt;,\n    document.body\n  );\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>Talking points: the native \u003ccode>&lt;dialog&gt;\u003c/code> + \u003ccode>showModal()\u003c/code> handles the top layer, \u003ccode>Esc\u003c/code>, background inertness and focus. Also cover returning focus to the trigger on close, preventing background scroll, and \u003ccode>aria-labelledby\u003c/code>. Without \u003ccode>&lt;dialog&gt;\u003c/code>: a manual focus trap, \u003ccode>inert\u003c/code> on siblings, and \u003ccode>role=\"dialog\" aria-modal=\"true\"\u003c/code>.\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>How do you prevent the page behind from scrolling?\u003c/summary>\u003cp>With \u003ccode>showModal()\u003c/code> most browsers handle inertness, but scroll may still chain, so I add \u003ccode>overflow: hidden\u003c/code> on the body while open, or \u003ccode>overscroll-behavior: contain\u003c/code> on the dialog, and restore it on close.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>How do you return focus to the trigger?\u003c/summary>\u003cp>Save \u003ccode>document.activeElement\u003c/code> when opening, and call \u003ccode>.focus()\u003c/code> on it after closing. The native dialog does this automatically in modern browsers, but I verify it.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>When would you not use a modal at all?\u003c/summary>\u003cp>For long forms or content that users want to reference while doing something else. A separate page or inline expansion is often better, especially on mobile.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Tabs component (compound component pattern)\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>I'd use the compound component pattern so the API reads naturally: \u003ccode>Tabs\u003c/code> contains a \u003ccode>TabList\u003c/code> with \u003ccode>Tab\u003c/code> children, plus \u003ccode>TabPanel\u003c/code> children. The parent \u003ccode>Tabs\u003c/code> holds the selected value in state and shares it through context, so each Tab and TabPanel can read whether it's active without prop drilling.\u003c/p>\u003cp>For accessibility, the list has \u003ccode>role=\"tablist\"\u003c/code>, each tab is a button with \u003ccode>role=\"tab\"\u003c/code>, \u003ccode>aria-selected\u003c/code> and \u003ccode>aria-controls\u003c/code>, and each panel has \u003ccode>role=\"tabpanel\"\u003c/code> with \u003ccode>aria-labelledby\u003c/code> pointing back to its tab. I use a roving tabindex: only the selected tab is in the tab order, and arrow keys move between tabs, which is the expected keyboard pattern.\u003c/p>\u003cp>Extensions I'd mention: supporting both controlled and uncontrolled modes with a \u003ccode>value\u003c/code> and \u003ccode>onChange\u003c/code>, lazy rendering of panels, and throwing a helpful error if a Tab is used outside Tabs. This is exactly the kind of component that belongs in a design system.\u003c/p>\u003c/div>\n\u003cdiv class=\"code\">\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003cpre>\u003ccode data-lang=\"jsx\">\u003cspan class=\"t-k\">const\u003c/span> TabsCtx = createContext(\u003cspan class=\"t-k\">null\u003c/span>);\n\n\u003cspan class=\"t-k\">function\u003c/span> Tabs({ defaultValue, children }) {\n  \u003cspan class=\"t-k\">const\u003c/span> [value, setValue] = useState(defaultValue);\n  \u003cspan class=\"t-k\">return\u003c/span> &lt;TabsCtx.Provider value={{ value, setValue }}&gt;{children}&lt;/TabsCtx.Provider&gt;;\n}\n\u003cspan class=\"t-k\">function\u003c/span> TabList({ children }) { \u003cspan class=\"t-k\">return\u003c/span> &lt;div role=\u003cspan class=\"t-s\">\"tablist\"\u003c/span>&gt;{children}&lt;/div&gt;; }\n\u003cspan class=\"t-k\">function\u003c/span> Tab({ value, children }) {\n  \u003cspan class=\"t-k\">const\u003c/span> ctx = useContext(TabsCtx);\n  \u003cspan class=\"t-k\">const\u003c/span> selected = ctx.value === value;\n  \u003cspan class=\"t-k\">return\u003c/span> (\n    &lt;button role=\u003cspan class=\"t-s\">\"tab\"\u003c/span> id={\u003cspan class=\"t-s\">'tab-'\u003c/span> + value} aria-selected={selected} aria-controls={\u003cspan class=\"t-s\">'panel-'\u003c/span> + value}\n            tabIndex={selected ? \u003cspan class=\"t-n\">0\u003c/span> : -\u003cspan class=\"t-n\">1\u003c/span>} onClick={() =&gt; ctx.setValue(value)}&gt;\n      {children}\n    &lt;/button&gt;\n  );\n}\n\u003cspan class=\"t-k\">function\u003c/span> TabPanel({ value, children }) {\n  \u003cspan class=\"t-k\">const\u003c/span> ctx = useContext(TabsCtx);\n  \u003cspan class=\"t-k\">if\u003c/span> (ctx.value !== value) \u003cspan class=\"t-k\">return\u003c/span> \u003cspan class=\"t-k\">null\u003c/span>;\n  \u003cspan class=\"t-k\">return\u003c/span> &lt;div role=\u003cspan class=\"t-s\">\"tabpanel\"\u003c/span> id={\u003cspan class=\"t-s\">'panel-'\u003c/span> + value} aria-labelledby={\u003cspan class=\"t-s\">'tab-'\u003c/span> + value}&gt;{children}&lt;/div&gt;;\n}\n\u003cspan class=\"t-c\">// &lt;Tabs defaultValue=\"plans\"&gt;&lt;TabList&gt;&lt;Tab value=\"plans\"&gt;Plans&lt;/Tab&gt;...&lt;/TabList&gt;&lt;TabPanel value=\"plans\"&gt;…&lt;/TabPanel&gt;&lt;/Tabs&gt;\u003c/span>\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>Extras: arrow-key navigation (roving tabindex), controlled + uncontrolled modes, and a lazy-mounted panel.\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>Implement arrow key navigation.\u003c/summary>\u003cp>On keydown in the tablist, find the current tab's index, and on ArrowRight or ArrowLeft move to the next or previous tab with wrap-around, focusing it and, for automatic activation, selecting it. Home and End jump to the first and last tab.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>How do you support both controlled and uncontrolled usage?\u003c/summary>\u003cp>Accept optional \u003ccode>value\u003c/code> and \u003ccode>onValueChange\u003c/code> props. If \u003ccode>value\u003c/code> is provided, use it as the source of truth, otherwise keep internal state initialised from \u003ccode>defaultValue\u003c/code>, and always call \u003ccode>onValueChange\u003c/code> on change.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Data table: sort, filter, paginate (with useMemo)\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>State is the sort key and direction, the filter text, and the current page. The visible rows are derived data, so I compute them during render with \u003ccode>useMemo\u003c/code> instead of storing them in state. I filter first, then sort with \u003ccode>toSorted\u003c/code>, so I don't mutate the props. Then I slice the current page.\u003c/p>\u003cp>Clicking a column header toggles the direction if it's the same column, otherwise sorts that column ascending. Changing the filter resets to page one, otherwise you can end up on an empty page.\u003c/p>\u003cp>For accessibility, the header buttons are real buttons, and the \u003ccode>th\u003c/code> has \u003ccode>aria-sort\u003c/code> reflecting the current state.\u003c/p>\u003cp>Then the scale discussion: for large data, sorting, filtering and pagination should move to the server. I'd put sort, filter and page into the URL so views are shareable and the back button works. And for complex tables I'd use TanStack Table for the headless logic, plus virtualisation for many rows.\u003c/p>\u003c/div>\n\u003cdiv class=\"code\">\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003cpre>\u003ccode data-lang=\"jsx\">\u003cspan class=\"t-k\">function\u003c/span> ProductTable({ rows }) {\n  \u003cspan class=\"t-k\">const\u003c/span> [sort, setSort] = useState({ key: \u003cspan class=\"t-s\">'name'\u003c/span>, dir: \u003cspan class=\"t-s\">'asc'\u003c/span> });\n  \u003cspan class=\"t-k\">const\u003c/span> [filter, setFilter] = useState(\u003cspan class=\"t-s\">''\u003c/span>);\n  \u003cspan class=\"t-k\">const\u003c/span> [page, setPage] = useState(\u003cspan class=\"t-n\">0\u003c/span>);\n  \u003cspan class=\"t-k\">const\u003c/span> PAGE = \u003cspan class=\"t-n\">10\u003c/span>;\n\n  \u003cspan class=\"t-k\">const\u003c/span> visible = useMemo(() =&gt; {\n    \u003cspan class=\"t-k\">const\u003c/span> f = filter.toLowerCase();\n    \u003cspan class=\"t-k\">const\u003c/span> filtered = rows.filter(r =&gt; r.name.toLowerCase().includes(f));\n    \u003cspan class=\"t-k\">return\u003c/span> filtered.toSorted((a, b) =&gt; {\n      \u003cspan class=\"t-k\">const\u003c/span> cmp = a[sort.key] &gt; b[sort.key] ? \u003cspan class=\"t-n\">1\u003c/span> : a[sort.key] &lt; b[sort.key] ? -\u003cspan class=\"t-n\">1\u003c/span> : \u003cspan class=\"t-n\">0\u003c/span>;\n      \u003cspan class=\"t-k\">return\u003c/span> sort.dir === \u003cspan class=\"t-s\">'asc'\u003c/span> ? cmp : -cmp;\n    });\n  }, [rows, filter, sort]);\n\n  \u003cspan class=\"t-k\">const\u003c/span> pageRows = visible.slice(page * PAGE, page * PAGE + PAGE);\n  \u003cspan class=\"t-k\">const\u003c/span> toggle = key =&gt; setSort(s =&gt; ({ key, dir: s.key === key &amp;&amp; s.dir === \u003cspan class=\"t-s\">'asc'\u003c/span> ? \u003cspan class=\"t-s\">'desc'\u003c/span> : \u003cspan class=\"t-s\">'asc'\u003c/span> }));\n\n  \u003cspan class=\"t-k\">return\u003c/span> (\n    &lt;&gt;\n      &lt;input aria-label=\u003cspan class=\"t-s\">\"Filter\"\u003c/span> value={filter} onChange={e =&gt; { setFilter(e.target.value); setPage(\u003cspan class=\"t-n\">0\u003c/span>); }} /&gt;\n      &lt;table&gt;\n        &lt;thead&gt;&lt;tr&gt;\n          {[\u003cspan class=\"t-s\">'name'\u003c/span>, \u003cspan class=\"t-s\">'price'\u003c/span>].map(k =&gt; (\n            &lt;th key={k} aria-sort={sort.key === k ? (sort.dir === \u003cspan class=\"t-s\">'asc'\u003c/span> ? \u003cspan class=\"t-s\">'ascending'\u003c/span> : \u003cspan class=\"t-s\">'descending'\u003c/span>) : \u003cspan class=\"t-s\">'none'\u003c/span>}&gt;\n              &lt;button onClick={() =&gt; toggle(k)}&gt;{k}&lt;/button&gt;\n            &lt;/th&gt;\n          ))}\n        &lt;/tr&gt;&lt;/thead&gt;\n        &lt;tbody&gt;{pageRows.map(r =&gt; &lt;tr key={r.id}&gt;&lt;td&gt;{r.name}&lt;/td&gt;&lt;td&gt;{r.price}&lt;/td&gt;&lt;/tr&gt;)}&lt;/tbody&gt;\n      &lt;/table&gt;\n      &lt;button disabled={page === \u003cspan class=\"t-n\">0\u003c/span>} onClick={() =&gt; setPage(p =&gt; p - \u003cspan class=\"t-n\">1\u003c/span>)}&gt;Prev&lt;/button&gt;\n      &lt;button disabled={(page + \u003cspan class=\"t-n\">1\u003c/span>) * PAGE &gt;= visible.length} onClick={() =&gt; setPage(p =&gt; p + \u003cspan class=\"t-n\">1\u003c/span>)}&gt;Next&lt;/button&gt;\n    &lt;/&gt;\n  );\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>Senior extras: put sort/filter/page in the \u003cstrong>URL\u003c/strong> (shareable, back button works), use server-side pagination for big data, and TanStack Table for headless logic.\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>How would you make the table work with 100,000 rows?\u003c/summary>\u003cp>Move sorting, filtering and pagination to the server, and if the UI must scroll through many rows, virtualise them. Also debounce the filter input.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>Why derive visible rows instead of storing them in state?\u003c/summary>\u003cp>Storing derived data creates two sources of truth that can get out of sync. Computing it from the source data and the filter and sort state during render is always correct, and \u003ccode>useMemo\u003c/code> keeps it cheap.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">useFetch / useAsync hook with status, abort and refetch\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>The hook takes a URL and returns status, data, error and a refetch function. I model status as a single field, idle, loading, success or error, to avoid impossible combinations.\u003c/p>\u003cp>The effect runs when the URL changes. It creates an AbortController, sets loading, fetches with the signal, checks \u003ccode>response.ok\u003c/code> because fetch doesn't reject on HTTP errors, and sets success or error. AbortErrors are ignored, and the cleanup aborts the request, which handles both race conditions and unmounting. For refetch, I keep a counter in state and include it in the dependencies, so incrementing it re-runs the effect.\u003c/p>\u003cp>I'd point out a common pitfall: passing an options object as a dependency causes an infinite loop because it's a new object every render. And I'd finish by saying this is a good exercise, but in production I'd use TanStack Query or RTK Query, because caching, deduplication, retries and background refresh are hard to get right.\u003c/p>\u003c/div>\n\u003cdiv class=\"code\">\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003cpre>\u003ccode data-lang=\"jsx\">\u003cspan class=\"t-k\">function\u003c/span> useFetch(url, options) {\n  \u003cspan class=\"t-k\">const\u003c/span> [state, setState] = useState({ status: \u003cspan class=\"t-s\">'idle'\u003c/span>, data: \u003cspan class=\"t-k\">null\u003c/span>, error: \u003cspan class=\"t-k\">null\u003c/span> });\n  \u003cspan class=\"t-k\">const\u003c/span> [nonce, setNonce] = useState(\u003cspan class=\"t-n\">0\u003c/span>);\n\n  useEffect(() =&gt; {\n    \u003cspan class=\"t-k\">if\u003c/span> (!url) \u003cspan class=\"t-k\">return\u003c/span>;\n    \u003cspan class=\"t-k\">const\u003c/span> ctrl = \u003cspan class=\"t-k\">new\u003c/span> AbortController();\n    setState(s =&gt; ({ ...s, status: \u003cspan class=\"t-s\">'loading'\u003c/span>, error: \u003cspan class=\"t-k\">null\u003c/span> }));\n    fetch(url, { ...options, signal: ctrl.signal })\n      .then(r =&gt; (r.ok ? r.json() : Promise.reject(\u003cspan class=\"t-k\">new\u003c/span> Error(\u003cspan class=\"t-s\">'HTTP '\u003c/span> + r.status))))\n      .then(data =&gt; setState({ status: \u003cspan class=\"t-s\">'success'\u003c/span>, data, error: \u003cspan class=\"t-k\">null\u003c/span> }))\n      .\u003cspan class=\"t-k\">catch\u003c/span>(error =&gt; { \u003cspan class=\"t-k\">if\u003c/span> (error.name !== \u003cspan class=\"t-s\">'AbortError'\u003c/span>) setState({ status: \u003cspan class=\"t-s\">'error'\u003c/span>, data: \u003cspan class=\"t-k\">null\u003c/span>, error }); });\n    \u003cspan class=\"t-k\">return\u003c/span> () =&gt; ctrl.abort();\n    \u003cspan class=\"t-c\">// eslint-disable-next-line react-hooks/exhaustive-deps\u003c/span>\n  }, [url, nonce]);   \u003cspan class=\"t-c\">// options intentionally excluded: callers would pass a new object each render\u003c/span>\n\n  \u003cspan class=\"t-k\">return\u003c/span> { ...state, refetch: () =&gt; setNonce(n =&gt; n + \u003cspan class=\"t-n\">1\u003c/span>) };\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>Say explicitly: \"This is fine for an interview, but in production I'd use TanStack Query or RTK Query for caching, dedupe, retries and stale-while-revalidate.\"\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>Why is options not in the dependency array?\u003c/summary>\u003cp>Callers usually pass a new object literal every render, which would re-run the effect in an infinite loop. Better designs accept primitive dependencies, a stable key, or memoised options.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>What does TanStack Query give you that this hook doesn't?\u003c/summary>\u003cp>A shared cache across components, request deduplication, stale-while-revalidate, retries, refetch on window focus, pagination helpers, mutations with invalidation, and devtools.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Multi-step form (checkout) with validation\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>I'd keep a single form data object for all steps, plus the current step and an errors object. Keeping one source of truth means going back doesn't lose data.\u003c/p>\u003cp>Each step has its own validation. Clicking Next validates the current step's fields, and only advances if there are no errors. Errors are shown next to fields, connected with \u003ccode>aria-describedby\u003c/code>, and the input gets \u003ccode>aria-invalid\u003c/code>. On the last step, submit sets a submitting flag, disables the button to prevent double orders, calls the API, and shows a form-level error if it fails, without clearing the user's data.\u003c/p>\u003cp>I'd also show progress with an ordered list and \u003ccode>aria-current=\"step\"\u003c/code>, and move focus to the first invalid field or the new step's heading.\u003c/p>\u003cp>In production, based on checkout work at Bell, I'd use React Hook Form with a Zod schema that can be shared with the backend, save a draft to sessionStorage so a refresh doesn't lose progress, and use an idempotency key on the order submission.\u003c/p>\u003c/div>\n\u003cp>Key design: a single source of truth for form data; per-step validation; Next disabled until valid; going back keeps data; on submit, prevent double-submit and handle server errors per field.\u003c/p>\n\u003cdiv class=\"code\">\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003cpre>\u003ccode data-lang=\"jsx\">\u003cspan class=\"t-k\">const\u003c/span> steps = [\u003cspan class=\"t-s\">'Plan'\u003c/span>, \u003cspan class=\"t-s\">'Details'\u003c/span>, \u003cspan class=\"t-s\">'Review'\u003c/span>];\n\n\u003cspan class=\"t-k\">function\u003c/span> Checkout() {\n  \u003cspan class=\"t-k\">const\u003c/span> [step, setStep] = useState(\u003cspan class=\"t-n\">0\u003c/span>);\n  \u003cspan class=\"t-k\">const\u003c/span> [data, setData] = useState({ plan: \u003cspan class=\"t-s\">''\u003c/span>, name: \u003cspan class=\"t-s\">''\u003c/span>, email: \u003cspan class=\"t-s\">''\u003c/span> });\n  \u003cspan class=\"t-k\">const\u003c/span> [errors, setErrors] = useState({});\n  \u003cspan class=\"t-k\">const\u003c/span> [submitting, setSubmitting] = useState(\u003cspan class=\"t-k\">false\u003c/span>);\n\n  \u003cspan class=\"t-k\">const\u003c/span> validate = () =&gt; {\n    \u003cspan class=\"t-k\">const\u003c/span> e = {};\n    \u003cspan class=\"t-k\">if\u003c/span> (step === \u003cspan class=\"t-n\">0\u003c/span> &amp;&amp; !data.plan) e.plan = \u003cspan class=\"t-s\">'Choose a plan'\u003c/span>;\n    \u003cspan class=\"t-k\">if\u003c/span> (step === \u003cspan class=\"t-n\">1\u003c/span>) {\n      \u003cspan class=\"t-k\">if\u003c/span> (!data.name) e.name = \u003cspan class=\"t-s\">'Name is required'\u003c/span>;\n      \u003cspan class=\"t-k\">if\u003c/span> (!/^\\S+@\\S+\\.\\S+$/.test(data.email)) e.email = \u003cspan class=\"t-s\">'Enter a valid email'\u003c/span>;\n    }\n    setErrors(e);\n    \u003cspan class=\"t-k\">return\u003c/span> Object.keys(e).length === \u003cspan class=\"t-n\">0\u003c/span>;\n  };\n\n  \u003cspan class=\"t-k\">const\u003c/span> next = () =&gt; validate() &amp;&amp; setStep(s =&gt; s + \u003cspan class=\"t-n\">1\u003c/span>);\n  \u003cspan class=\"t-k\">const\u003c/span> update = field =&gt; e =&gt; setData(d =&gt; ({ ...d, [field]: e.target.value }));\n\n  \u003cspan class=\"t-k\">const\u003c/span> submit = \u003cspan class=\"t-k\">async\u003c/span> e =&gt; {\n    e.preventDefault();\n    \u003cspan class=\"t-k\">if\u003c/span> (submitting) \u003cspan class=\"t-k\">return\u003c/span>;\n    setSubmitting(\u003cspan class=\"t-k\">true\u003c/span>);\n    \u003cspan class=\"t-k\">try\u003c/span> { \u003cspan class=\"t-k\">await\u003c/span> placeOrder(data); \u003cspan class=\"t-c\">/* navigate to confirmation */\u003c/span> }\n    \u003cspan class=\"t-k\">catch\u003c/span> (err) { setErrors({ form: \u003cspan class=\"t-s\">'Order failed, please try again.'\u003c/span> }); }\n    \u003cspan class=\"t-k\">finally\u003c/span> { setSubmitting(\u003cspan class=\"t-k\">false\u003c/span>); }\n  };\n\n  \u003cspan class=\"t-k\">return\u003c/span> (\n    &lt;form onSubmit={submit} noValidate&gt;\n      &lt;ol aria-label=\u003cspan class=\"t-s\">\"Progress\"\u003c/span>&gt;{steps.map((s, i) =&gt; &lt;li key={s} aria-current={i === step ? \u003cspan class=\"t-s\">'step'\u003c/span> : \u003cspan class=\"t-k\">undefined\u003c/span>}&gt;{s}&lt;/li&gt;)}&lt;/ol&gt;\n      {step === \u003cspan class=\"t-n\">1\u003c/span> &amp;&amp; (\n        &lt;&gt;\n          &lt;label htmlFor=\u003cspan class=\"t-s\">\"name\"\u003c/span>&gt;Name&lt;/label&gt;\n          &lt;input id=\u003cspan class=\"t-s\">\"name\"\u003c/span> value={data.name} onChange={update(\u003cspan class=\"t-s\">'name'\u003c/span>)}\n                 aria-invalid={!!errors.name} aria-describedby=\u003cspan class=\"t-s\">\"name-err\"\u003c/span> /&gt;\n          {errors.name &amp;&amp; &lt;p id=\u003cspan class=\"t-s\">\"name-err\"\u003c/span> role=\u003cspan class=\"t-s\">\"alert\"\u003c/span>&gt;{errors.name}&lt;/p&gt;}\n          {\u003cspan class=\"t-c\">/* email similar */\u003c/span>}\n        &lt;/&gt;\n      )}\n      {errors.form &amp;&amp; &lt;p role=\u003cspan class=\"t-s\">\"alert\"\u003c/span>&gt;{errors.form}&lt;/p&gt;}\n      {step &gt; \u003cspan class=\"t-n\">0\u003c/span> &amp;&amp; &lt;button \u003cspan class=\"t-k\">type\u003c/span>=\u003cspan class=\"t-s\">\"button\"\u003c/span> onClick={() =&gt; setStep(s =&gt; s - \u003cspan class=\"t-n\">1\u003c/span>)}&gt;Back&lt;/button&gt;}\n      {step &lt; steps.length - \u003cspan class=\"t-n\">1\u003c/span>\n        ? &lt;button \u003cspan class=\"t-k\">type\u003c/span>=\u003cspan class=\"t-s\">\"button\"\u003c/span> onClick={next}&gt;Next&lt;/button&gt;\n        : &lt;button \u003cspan class=\"t-k\">type\u003c/span>=\u003cspan class=\"t-s\">\"submit\"\u003c/span> disabled={submitting}&gt;{submitting ? \u003cspan class=\"t-s\">'Placing order…'\u003c/span> : \u003cspan class=\"t-s\">'Place order'\u003c/span>}&lt;/button&gt;}\n    &lt;/form&gt;\n  );\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>Production: React Hook Form + Zod (schema shared with the backend), focus the first invalid field, persist the draft in sessionStorage, and React 19 \u003ccode>useActionState\u003c/code> for server actions.\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>How would you handle a server validation error for a specific field?\u003c/summary>\u003cp>Map the server's error response to field errors, navigate to the step containing that field, show the message next to it, and move focus to it.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>How would you persist progress if the user refreshes?\u003c/summary>\u003cp>Save the form data, excluding sensitive fields like card numbers, to sessionStorage on change, debounced, restore it on load, and clear it after a successful submission.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>How would you structure the validation?\u003c/summary>\u003cp>One Zod schema per step, composed into a full schema for the final submit, and ideally shared with the backend so both sides validate the same rules.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Other components to practise (no solution: do them timed)\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>For any of these, I use the same approach in the interview. First I clarify requirements and edge cases out loud. Then I sketch the state model, deciding what's actual state and what's derived. For example, in tic-tac-toe the winner is derived from the board and shouldn't be stored separately.\u003c/p>\u003cp>Then I build the simplest working version, and narrate as I go: why I'm using a ref for a timer, why I'm cleaning up an interval, why a value is derived. After it works, I go back over accessibility (keyboard, roles, live regions for toasts), edge cases like rapid clicks and unmounting, and reduced motion for carousels.\u003c/p>\u003cp>I finish by saying what I'd add with more time: tests with React Testing Library, error states, and how the component would fit into a design system. The interviewer is grading the process and communication as much as the final code.\u003c/p>\u003c/div>\n\u003col>\u003cli>\u003cstrong>Star rating\u003c/strong> (hover preview, keyboard, radio-group semantics).\u003c/li>\u003cli>\u003cstrong>Accordion\u003c/strong> (one/many open, \u003ccode>aria-expanded\u003c/code>, \u003ccode>&lt;details&gt;\u003c/code>?).\u003c/li>\u003cli>\u003cstrong>Countdown timer / stopwatch\u003c/strong> (\u003ccode>useRef\u003c/code> for interval, cleanup, pause/resume, drift correction using \u003ccode>Date.now()\u003c/code>).\u003c/li>\u003cli>\u003cstrong>Toast notification system\u003c/strong> (context + portal + auto-dismiss + \u003ccode>aria-live=\"polite\"\u003c/code>).\u003c/li>\u003cli>\u003cstrong>Nested comments / file tree\u003c/strong> (recursive component, expand/collapse).\u003c/li>\u003cli>\u003cstrong>Traffic light\u003c/strong> (state machine with timers).\u003c/li>\u003cli>\u003cstrong>Progress bars with a concurrency limit\u003c/strong> (only 3 filling at a time).\u003c/li>\u003cli>\u003cstrong>Kanban drag and drop\u003c/strong> (HTML5 DnD or pointer events, keyboard alternative).\u003c/li>\u003cli>\u003cstrong>Image carousel\u003c/strong> (autoplay pause on hover/focus, \u003ccode>prefers-reduced-motion\u003c/code>).\u003c/li>\u003cli>\u003cstrong>Tic-tac-toe / memory game\u003c/strong> (state modelling, derived winner).\u003c/li>\u003cli>\u003cstrong>Plan comparison selector\u003c/strong> (Bell-flavoured: pick a phone + plan + add-ons, live price total, derived state).\u003c/li>\u003c/ol>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>What do interviewers usually look for in these exercises?\u003c/summary>\u003cp>A clear state model, working code early, handling edge cases like cleanup on unmount and rapid clicks, accessibility, and clear communication of trade-offs, more than a perfect final result.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>What do you do if you get stuck?\u003c/summary>\u003cp>Say what I'm thinking, simplify the problem, get a basic version working, and ask a clarifying question if needed. Interviewers reward visible reasoning and collaboration.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>"},{"id":"04-react","title":"React Deep Dive (React 18 → 19.x)","html":"\u003ch1 id=\"react-deep-dive-react-18-19-x\">React Deep Dive (React 18 → 19.x)\u003c/h1>\n\u003cblockquote>\u003cp>Versions to know (as of late 2026): \u003cstrong>React 19\u003c/strong> (stable since Dec 2024), \u003cstrong>19.1/19.2\u003c/strong> (\u003ccode>&lt;Activity&gt;\u003c/code>, \u003ccode>useEffectEvent\u003c/code>), and the \u003cstrong>React Compiler 1.0\u003c/strong> (auto-memoization). Create React App is deprecated, so new apps use \u003cstrong>Vite\u003c/strong> or a framework (Next.js, React Router v7/Remix). Check the latest minor before your interview.\u003c/p>\u003c/blockquote>\n\u003ch2 id=\"rendering-model\">Rendering Model\u003c/h2>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">What triggers a re-render? What does \"render\" actually mean?\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>A component re-renders for four main reasons: its own state changes, its parent re-renders, a context it consumes changes value, or an external store it subscribes to changes. One thing people often get wrong: by default, when a parent re-renders, all its children re-render too, even if their props didn't change, unless they're wrapped in \u003ccode>React.memo\u003c/code>.\u003c/p>\u003cp>It's also important to separate rendering from updating the DOM. Rendering just means React calls the component function to produce a new description of the UI. Then reconciliation compares it with the previous one, and in the commit phase React touches only the DOM nodes that actually changed. After that, effects run.\u003c/p>\u003cp>So a re-render isn't automatically a performance problem. It only becomes one when the render itself is expensive or happens very frequently across a big tree. That's why I profile with the React DevTools Profiler before optimising anything.\u003c/p>\u003c/div>\n\u003cp>A component re-renders when:\u003c/p>\n\u003col>\u003cli>Its \u003cstrong>state\u003c/strong> changes (\u003ccode>setState\u003c/code> with a new value; \u003ccode>Object.is\u003c/code> same value is bailed out).\u003c/li>\u003cli>Its \u003cstrong>parent re-renders\u003c/strong>. By default children re-render even if props didn't change.\u003c/li>\u003cli>A \u003cstrong>context\u003c/strong> it consumes changes value.\u003c/li>\u003cli>(A hook it uses triggers one, e.g. an external store via \u003ccode>useSyncExternalStore\u003c/code>.)\u003c/li>\u003c/ol>\n\u003cp>\u003cstrong>Render ≠ DOM update.\u003c/strong> \"Render\" means React calls your component function to get new elements. \u003cstrong>Reconciliation\u003c/strong> diffs them with the previous tree, and the \u003cstrong>commit\u003c/strong> phase applies only the actual DOM changes. Then effects run.\u003c/p>\n\u003cp>Phases: \u003cstrong>Render\u003c/strong> (pure, can be interrupted/restarted in concurrent mode) → \u003cstrong>Commit\u003c/strong> (DOM mutations, then \u003ccode>useLayoutEffect\u003c/code>, then paint, then \u003ccode>useEffect\u003c/code>).\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>If a parent re-renders but passes the same props, does the child re-render?\u003c/summary>\u003cp>Yes, by default. Only if the child is wrapped in \u003ccode>React.memo\u003c/code>, and the props are referentially equal, does React skip it. The React Compiler makes that automatic.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>Does calling setState with the same value cause a re-render?\u003c/summary>\u003cp>React compares with \u003ccode>Object.is\u003c/code> and bails out if it's the same. It might still call the component once before bailing out, but it won't re-render the children or commit.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>How do you find out why a component re-rendered?\u003c/summary>\u003cp>The React DevTools Profiler has a setting to record why each component rendered: props changed, state changed, hooks changed, or the parent rendered.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Explain reconciliation, the diffing heuristics and why keys matter\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>Reconciliation is how React figures out what changed between two renders. A general tree diff is O(n³), so React uses two heuristics to make it O(n).\u003c/p>\u003cp>First, if the element type changes, say a \u003ccode>div\u003c/code> becomes a \u003ccode>section\u003c/code>, or \u003ccode>ComponentA\u003c/code> becomes \u003ccode>ComponentB\u003c/code>, React throws away the whole subtree and rebuilds it, and the state is lost. If the type is the same, it keeps the DOM node or component instance and just updates the props.\u003c/p>\u003cp>Second, for lists, React matches children by their \u003ccode>key\u003c/code>. That's why keys matter. If you use the array index as the key and then insert an item at the top, every item's key shifts, so React reuses the wrong components. Input values and focus end up attached to the wrong rows. So I use stable IDs from the data.\u003c/p>\u003cp>Two practical tricks follow from this. You can deliberately change a key to reset a component, like \u003ccode>key={userId}\u003c/code> on a form. And you should never define a component inside another component, because it becomes a new type every render and remounts each time.\u003c/p>\u003c/div>\n\u003cp>Comparing two arbitrary trees is O(n³), so React uses O(n) heuristics:\u003c/p>\n\u003col>\u003cli>\u003cstrong>Different element type\u003c/strong> (\u003ccode>div\u003c/code> → \u003ccode>span\u003c/code>, \u003ccode>ComponentA\u003c/code> → \u003ccode>ComponentB\u003c/code>): tear down the whole subtree, state lost.\u003c/li>\u003cli>\u003cstrong>Same type\u003c/strong>: keep the DOM node/instance, update the changed props, recurse.\u003c/li>\u003cli>\u003cstrong>Lists\u003c/strong> are matched by \u003cstrong>\u003ccode>key\u003c/code>\u003c/strong>.\u003c/li>\u003c/ol>\n\u003cp>\u003cstrong>Keys\u003c/strong> identify items between renders. Using the \u003cstrong>index\u003c/strong> as key breaks things when items are inserted/removed/reordered: state (input values, focus) sticks to the \u003cem>position\u003c/em>, not the item, and work is wasted. Use stable IDs. Use the index only for static lists that never reorder.\u003c/p>\n\u003cp>\u003cstrong>Trick:\u003c/strong> change a \u003ccode>key\u003c/code> to \u003cstrong>reset\u003c/strong> a component's state on purpose: \u003ccode>&lt;ProfileForm key={userId} /&gt;\u003c/code>.\u003c/p>\n\u003cp>\u003cstrong>Pitfall:\u003c/strong> defining a component \u003cem>inside\u003c/em> another component creates a new type every render, so it remounts every time and loses state/focus.\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>Why is using Math.random() as a key bad?\u003c/summary>\u003cp>The key changes every render, so React treats every item as new, unmounting and remounting all of them, losing state and focus, and doing far more DOM work.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>When is the index acceptable as a key?\u003c/summary>\u003cp>When the list is static, never reordered or filtered, and items have no state. Otherwise use a stable ID from the data.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>How would you reset a component's state when a prop changes?\u003c/summary>\u003cp>Give it a key based on that prop, like \u003ccode>key={productId}\u003c/code>. When it changes, React mounts a fresh instance. That's cleaner than an effect that resets state.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">What is React Fiber?\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>Fiber is React's reconciliation engine, introduced in React 16. Before Fiber, rendering was one recursive, synchronous pass: once it started, it couldn't be interrupted, so a large update could freeze the page.\u003c/p>\u003cp>Fiber breaks the work into small units. Each component instance becomes a fiber node in a linked tree, and React can process a few units, check whether something more urgent has arrived, like a user typing, and pause, resume or even throw away work in progress. React keeps a current tree and a work-in-progress tree and swaps them when committing.\u003c/p>\u003cp>That's the foundation for everything concurrent in modern React: transitions, Suspense, streaming and selective hydration. As a developer I don't use Fiber directly, but understanding it explains why the render phase must be pure, since it can run more than once, and why things like \u003ccode>useTransition\u003c/code> are possible.\u003c/p>\u003c/div>\n\u003cp>Fiber (React 16+) is the reimplementation of the reconciler. Each component instance is a \u003cstrong>fiber node\u003c/strong> (a unit of work) in a linked tree. Because work is split into units, React can \u003cstrong>pause, prioritise, resume or abandon\u003c/strong> rendering. That's the foundation of \u003cstrong>concurrent rendering\u003c/strong> (transitions, Suspense, time-slicing). React keeps two trees, \u003cem>current\u003c/em> and \u003cem>work-in-progress\u003c/em>, and swaps them on commit (double buffering).\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>Why must the render phase be pure?\u003c/summary>\u003cp>Because in concurrent rendering React may run the render phase several times, pause it, or throw it away before committing. Side effects during render could run multiple times or for UI that never appears.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>What's the difference between the render phase and the commit phase?\u003c/summary>\u003cp>Render computes what the UI should look like and can be interrupted. Commit applies the changes to the DOM synchronously and runs layout effects, and it can't be interrupted.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Virtual DOM: is it \"fast\"?\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>The virtual DOM is a lightweight JavaScript description of what the UI should look like. When state changes, React builds a new one, compares it with the previous one and applies the minimal set of real DOM changes.\u003c/p>\u003cp>But I wouldn't say it's fast in absolute terms. Carefully hand-written DOM updates would always beat it, because diffing is extra work. Its real value is the programming model: I describe the UI for a given state declaratively, and React keeps the DOM in sync efficiently enough that I rarely have to think about it.\u003c/p>\u003cp>It's also fair to mention that other frameworks, like Svelte and Solid, skip the virtual DOM by compiling to direct updates or using fine-grained signals, and they can be faster. React's answer has been better scheduling with concurrent rendering, and now the React Compiler to reduce unnecessary re-renders automatically.\u003c/p>\u003c/div>\n\u003cp>The VDOM is a lightweight JS description of the UI. It's \u003cstrong>not inherently faster\u003c/strong> than hand-written DOM updates. Its value is a \u003cstrong>declarative model\u003c/strong>: you describe the UI for a given state, and React computes minimal DOM operations, while staying fast enough. Alternatives such as Svelte and Solid (compile-time, fine-grained signals) skip the VDOM. A good senior answer acknowledges the trade-off.\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>What are signals, and how do they differ?\u003c/summary>\u003cp>Signals are reactive values that track exactly which parts of the UI read them, so updates go directly to those DOM nodes without re-running components or diffing. Solid, Preact signals, Angular and Vue use variants of this.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>What does the React Compiler change?\u003c/summary>\u003cp>It automatically memoises components and values at build time, so React skips re-rendering parts that didn't change, which closes much of the performance gap without manual \u003ccode>useMemo\u003c/code> and \u003ccode>memo\u003c/code>.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">What does React 18's automatic batching do?\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>Batching means that when you call several state setters together, React performs one re-render instead of one per setter. Before React 18, that only happened inside React event handlers. If you updated state in a promise callback, a timeout or a native event listener, each \u003ccode>setState\u003c/code> caused its own render.\u003c/p>\u003cp>Since React 18, with the new root API, batching is automatic everywhere. So after an await, setting loading to false and setting the data results in a single render, which is better for performance and avoids intermediate inconsistent states being shown.\u003c/p>\u003cp>If you ever need to opt out, for example to read the DOM right after an update, there's \u003ccode>flushSync\u003c/code>, but that's rare and I'd treat it as a last resort.\u003c/p>\u003c/div>\n\u003cp>Multiple \u003ccode>setState\u003c/code> calls in the same tick are batched into \u003cstrong>one\u003c/strong> re-render, now \u003cstrong>everywhere\u003c/strong> (promises, timeouts, native handlers), not only inside React event handlers. Use \u003ccode>flushSync\u003c/code> to opt out (rare, e.g. to measure the DOM immediately after an update).\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>Are updates inside setTimeout batched in React 17?\u003c/summary>\u003cp>No. In React 17, only updates inside React event handlers were batched. Since React 18 with \u003ccode>createRoot\u003c/code>, all updates are batched automatically.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>When would you use flushSync?\u003c/summary>\u003cp>Very rarely, for example when you need the DOM updated immediately to measure it or to scroll to a newly added item. It forces a synchronous render, so it hurts performance if overused.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003ch2 id=\"hooks\">Hooks\u003c/h2>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Rules of hooks, and WHY they exist\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>There are two rules: only call hooks at the top level of a component or custom hook, so never inside conditions, loops or after an early return, and only call them from React function components or other custom hooks.\u003c/p>\u003cp>The reason is how React stores hook state. It doesn't know hooks by name. It keeps an ordered list of hook slots on each component's fiber and matches them purely by call order. On every render, the first \u003ccode>useState\u003c/code> call gets slot one, the second gets slot two, and so on. If a hook is called conditionally, the order shifts on some renders, and a hook ends up reading another hook's state. That leads to very confusing bugs.\u003c/p>\u003cp>The ESLint plugin for hooks enforces this, and I always keep it on as an error. The one exception now is the \u003ccode>use\u003c/code> API in React 19, which can be called conditionally because it's designed differently.\u003c/p>\u003c/div>\n\u003col>\u003cli>Call hooks only at the \u003cstrong>top level\u003c/strong> (not in loops/conditions/after early returns).\u003c/li>\u003cli>Call them only from \u003cstrong>React function components or custom hooks\u003c/strong>.\u003c/li>\u003c/ol>\n\u003cp>\u003cstrong>Why:\u003c/strong> React stores hook state in an ordered list on the fiber and matches each call \u003cstrong>by call order\u003c/strong>. A conditional hook shifts the order, so state gets assigned to the wrong hook. Enforced by \u003ccode>eslint-plugin-react-hooks\u003c/code>.\u003c/p>\n\u003cp>\u003cem>Exception:\u003c/em> the React 19 \u003ccode>use()\u003c/code> API \u003cstrong>can\u003c/strong> be called conditionally.\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>How would you conditionally run an effect?\u003c/summary>\u003cp>Put the condition inside the effect, not around it: always call \u003ccode>useEffect\u003c/code>, and inside it return early if the condition isn't met.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>Can you call hooks inside a regular helper function?\u003c/summary>\u003cp>Only if that function is itself a custom hook, named starting with \u003ccode>use\u003c/code> and called from a component or another hook. Otherwise it breaks the rules and the lint plugin will flag it.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">useState: functional updates, lazy initialisation, object state\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>State in React is a snapshot per render. If I call \u003ccode>setCount(count + 1)\u003c/code> twice in the same handler, both calls read the same \u003ccode>count\u003c/code>, so it only increases by one. The functional form, \u003ccode>setCount(c =&gt; c + 1)\u003c/code>, queues an updater that receives the latest pending value, so calling it twice adds two. I use the functional form whenever the new state depends on the previous one, and it also avoids stale closure problems in effects and intervals.\u003c/p>\u003cp>Lazy initialisation means passing a function to \u003ccode>useState\u003c/code>, like \u003ccode>useState(() =&gt; parseExpensiveData())\u003c/code>. It runs only on the first render, instead of recomputing an expensive initial value every render and throwing it away.\u003c/p>\u003cp>For object state, unlike the old class \u003ccode>setState\u003c/code>, the hook doesn't merge. It replaces. So I spread the previous object, or split unrelated values into separate state variables, or use \u003ccode>useReducer\u003c/code> when there are several related fields.\u003c/p>\u003c/div>\n\u003cdiv class=\"code\">\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003cpre>\u003ccode data-lang=\"jsx\">\u003cspan class=\"t-k\">const\u003c/span> [count, setCount] = useState(\u003cspan class=\"t-n\">0\u003c/span>);\nsetCount(count + \u003cspan class=\"t-n\">1\u003c/span>); setCount(count + \u003cspan class=\"t-n\">1\u003c/span>);   \u003cspan class=\"t-c\">// +1 (both read the same snapshot)\u003c/span>\nsetCount(c =&gt; c + \u003cspan class=\"t-n\">1\u003c/span>); setCount(c =&gt; c + \u003cspan class=\"t-n\">1\u003c/span>); \u003cspan class=\"t-c\">// +2 (queue of updater functions)\u003c/span>\n\n\u003cspan class=\"t-k\">const\u003c/span> [rows] = useState(() =&gt; expensiveParse(raw)); \u003cspan class=\"t-c\">// lazy init: runs only once\u003c/span>\n\nsetUser(u =&gt; ({ ...u, name: \u003cspan class=\"t-s\">'Ana'\u003c/span> }));       \u003cspan class=\"t-c\">// replace, don't merge (unlike class setState)\u003c/span>\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>State is a \u003cstrong>snapshot per render\u003c/strong>. Reading state right after \u003ccode>setState\u003c/code> gives the old value.\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>Why doesn't console.log show the new state right after setState?\u003c/summary>\u003cp>Because state is a snapshot for the current render. The setter schedules a re-render, and the new value is only available in the next render.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>When would you use one state object versus several useState calls?\u003c/summary>\u003cp>Separate state for values that change independently, and an object or \u003ccode>useReducer\u003c/code> for values that always change together, like the fields of one form step.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>What happens if you mutate state directly and call setState with the same object?\u003c/summary>\u003cp>React sees the same reference, bails out, and the UI doesn't update. You always create a new object or array.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">useEffect: what is it for, dependency array, cleanup, common mistakes\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>\u003ccode>useEffect\u003c/code> is for synchronising a component with something outside React: network requests, subscriptions, timers, browser APIs, or third-party widgets. It runs after the browser paints. The dependency array tells React when to re-run it, and the cleanup function runs before the next run and on unmount, which is where I unsubscribe, clear timers or abort requests.\u003c/p>\u003cp>The biggest senior-level point is knowing when not to use an effect. Derived data should be calculated during render, not copied into state with an effect, because that causes an extra render and sync bugs. Logic that responds to a user action belongs in the event handler. Resetting state when a prop changes is better done with a \u003ccode>key\u003c/code>. Chains of effects that set state and trigger other effects are a code smell.\u003c/p>\u003cp>Common mistakes I look for in code review: missing cleanup, objects or functions in the dependency array that change every render and cause loops, and fetching without handling race conditions. In development, StrictMode runs effects twice to expose missing cleanups, and the right fix is a proper cleanup, not disabling StrictMode.\u003c/p>\u003c/div>\n\u003cp>\u003ccode>useEffect\u003c/code> \u003cstrong>synchronises a component with an external system\u003c/strong> (network, subscriptions, DOM APIs, timers, analytics). It runs \u003cstrong>after paint\u003c/strong>.\u003c/p>\n\u003cul>\u003cli>No deps: runs after every render. \u003ccode>[]\u003c/code>: after mount (plus cleanup on unmount). \u003ccode>[a, b]\u003c/code>: when \u003ccode>a\u003c/code> or \u003ccode>b\u003c/code> change (\u003ccode>Object.is\u003c/code>).\u003c/li>\u003cli>\u003cstrong>Cleanup\u003c/strong> runs before the next effect and on unmount.\u003c/li>\u003cli>In \u003cstrong>StrictMode (dev)\u003c/strong>, React mounts → unmounts → mounts again to surface missing cleanups.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>\"You might not need an effect\"\u003c/strong> (very common senior topic):\u003c/p>\n\u003cul>\u003cli>❌ Deriving state: \u003ccode>useEffect(() =&gt; setFullName(first + ' ' + last))\u003c/code>. ✅ Compute during render: \u003ccode>const fullName = first + ' ' + last\u003c/code>.\u003c/li>\u003cli>❌ Reacting to an event in an effect. ✅ Put the logic in the \u003cstrong>event handler\u003c/strong>.\u003c/li>\u003cli>❌ Resetting state when a prop changes via an effect. ✅ Use \u003ccode>key\u003c/code>.\u003c/li>\u003cli>❌ Fetching in effects without race handling. ✅ Use a data library, or handle abort/ignore.\u003c/li>\u003cli>❌ Chains of effects setting state that triggers other effects.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Object/function deps\u003c/strong> change every render, which causes infinite loops. Move them inside the effect, memoize them, or depend on primitives.\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>How would you fetch data in an effect correctly?\u003c/summary>\u003cp>Create an AbortController or an ignore flag in the effect, fetch with the signal, only set state if not cancelled, and abort in the cleanup. Include all inputs in the dependency array. And in production, prefer a data library or framework loaders.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>Why does my effect run twice in development?\u003c/summary>\u003cp>StrictMode mounts, unmounts and remounts components in development to check that effects clean up correctly. It doesn't happen in production. If running twice causes a problem, the effect needs a proper cleanup.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>How do you avoid an infinite loop with an object dependency?\u003c/summary>\u003cp>Move the object creation inside the effect, memoise it with \u003ccode>useMemo\u003c/code>, or depend on its primitive fields instead of the object.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">useEffect vs useLayoutEffect vs useInsertionEffect\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>\u003ccode>useEffect\u003c/code> runs after the browser has painted, so it doesn't block the user from seeing the update. That's the right default for almost everything.\u003c/p>\u003cp>\u003ccode>useLayoutEffect\u003c/code> runs synchronously after React has updated the DOM but before the browser paints. I use it when I need to measure the layout and adjust before the user sees anything, for example positioning a tooltip based on the trigger's size, or scrolling to a position. With a normal effect, the user might see a flicker of the wrong position. The cost is that it blocks painting, so heavy work there hurts performance, and it doesn't run on the server.\u003c/p>\u003cp>\u003ccode>useInsertionEffect\u003c/code> runs even earlier, before layout effects, and it's really only for CSS-in-JS libraries that need to inject styles before anything reads layout. In application code I've never needed it.\u003c/p>\u003c/div>\n\u003cul>\u003cli>\u003ccode>useEffect\u003c/code>: after paint, non-blocking. The default.\u003c/li>\u003cli>\u003ccode>useLayoutEffect\u003c/code>: after DOM mutation, \u003cstrong>before paint\u003c/strong>, synchronous. Use it to \u003cstrong>measure layout\u003c/strong> (tooltip position) and avoid flicker. It blocks paint, so use it sparingly. Warns in SSR.\u003c/li>\u003cli>\u003ccode>useInsertionEffect\u003c/code>: before layout effects, for CSS-in-JS libraries injecting styles.\u003c/li>\u003c/ul>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>Give a concrete example where useEffect causes a visible flicker.\u003c/summary>\u003cp>A tooltip that measures its trigger and then positions itself. With \u003ccode>useEffect\u003c/code>, the browser paints it in the default position first, then moves it. With \u003ccode>useLayoutEffect\u003c/code>, it's positioned before the first paint.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>What happens to useLayoutEffect during server rendering?\u003c/summary>\u003cp>It doesn't run on the server. For SSR you either use \u003ccode>useEffect\u003c/code> or make sure the measurement only matters on the client.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">useRef: two use cases\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>\u003ccode>useRef\u003c/code> has two main uses. The first is accessing a DOM element: I attach the ref to an element and can call things like \u003ccode>focus()\u003c/code> or measure it. A common example is focusing the first invalid field after form validation.\u003c/p>\u003cp>The second is storing a mutable value that persists across renders but doesn't cause a re-render when it changes. That's perfect for timer IDs, an AbortController, the previous value of a prop, or the latest version of a callback, to avoid stale closures.\u003c/p>\u003cp>The guideline is that I don't read or write refs during render, only in effects and event handlers, because that would make rendering impure. And in React 19, \u003ccode>ref\u003c/code> can be passed as a normal prop to function components, so \u003ccode>forwardRef\u003c/code> is no longer needed, and ref callbacks can return a cleanup function.\u003c/p>\u003c/div>\n\u003col>\u003cli>\u003cstrong>DOM access\u003c/strong>: \u003ccode>inputRef.current.focus()\u003c/code>.\u003c/li>\u003cli>\u003cstrong>A mutable value that persists across renders without causing re-renders\u003c/strong>: timer IDs, previous values, the latest callback, instance variables, \"is mounted\", AbortController.\u003c/li>\u003c/ol>\n\u003cp>Don't read/write \u003ccode>ref.current\u003c/code> during render (except lazy init), because it makes rendering impure.\u003c/p>\n\u003cp>React 19: \u003ccode>ref\u003c/code> is a \u003cstrong>regular prop\u003c/strong> for function components, so \u003ccode>forwardRef\u003c/code> is no longer needed. Ref callbacks can return a \u003cstrong>cleanup function\u003c/strong>.\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>Why not store the value in a regular variable instead of a ref?\u003c/summary>\u003cp>A regular variable inside the component is recreated every render, so it's lost. A variable outside the component is shared by every instance. A ref is persistent per instance.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>How do you keep the latest callback in a ref?\u003c/summary>\u003cp>Assign \u003ccode>callbackRef.current = callback\u003c/code> in an effect or layout effect after each render, then call \u003ccode>callbackRef.current()\u003c/code> inside long-lived listeners. React 19.2's \u003ccode>useEffectEvent\u003c/code> is now the official solution for this.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>What is a callback ref?\u003c/summary>\u003cp>Passing a function as the \u003ccode>ref\u003c/code> prop. React calls it with the DOM node when it mounts and, in React 19, you can return a cleanup function, which is great for attaching observers to elements.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">useMemo, useCallback, React.memo: when do they actually help?\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>\u003ccode>React.memo\u003c/code> lets a component skip re-rendering when its props are shallowly equal. \u003ccode>useMemo\u003c/code> caches a computed value between renders, and \u003ccode>useCallback\u003c/code> caches a function reference.\u003c/p>\u003cp>They only help in two situations. One is a genuinely expensive calculation, which I confirm by profiling rather than guessing. The other is referential stability: when I pass an object or function to a child wrapped in \u003ccode>React.memo\u003c/code>, or use it as a dependency of another hook. Without stable references, memo is useless because the props change every render.\u003c/p>\u003cp>Outside those cases they add complexity and memory for no benefit, so I don't wrap everything by default. Often better fixes come first: moving state down closer to where it's used, passing components as \u003ccode>children\u003c/code> so they don't re-render, or splitting context.\u003c/p>\u003cp>It's also worth mentioning the React Compiler, which reached 1.0 in 2025. It memoizes automatically at build time, so in codebases that adopt it, most manual \u003ccode>useMemo\u003c/code> and \u003ccode>useCallback\u003c/code> calls become unnecessary, as long as the code follows the rules of React.\u003c/p>\u003c/div>\n\u003cul>\u003cli>\u003ccode>React.memo(Component)\u003c/code>: skip re-rendering if props are shallow-equal.\u003c/li>\u003cli>\u003ccode>useMemo(() =&gt; compute(a), [a])\u003c/code>: cache a \u003cstrong>value\u003c/strong> between renders.\u003c/li>\u003cli>\u003ccode>useCallback(fn, [deps])\u003c/code>: cache a \u003cstrong>function reference\u003c/strong> (= \u003ccode>useMemo(() =&gt; fn)\u003c/code>).\u003c/li>\u003c/ul>\n\u003cp>They help only when:\u003c/p>\n\u003col>\u003cli>A computation is \u003cstrong>measurably expensive\u003c/strong> (profile it: &gt; ~1 ms).\u003c/li>\u003cli>You pass a value/function to a \u003cstrong>\u003ccode>React.memo\u003c/code> child\u003c/strong>, or it's a \u003cstrong>dependency of another hook\u003c/strong>, so referential stability matters.\u003c/li>\u003c/ol>\n\u003cp>They're \u003cstrong>wasted\u003c/strong> when the child isn't memoized, deps change every render, or the computation is trivial. They also add memory and complexity.\u003c/p>\n\u003cp>\u003cstrong>Better first fixes:\u003c/strong> move state down (colocation), lift content up (\u003ccode>children\u003c/code> as props), split context.\u003c/p>\n\u003cp>\u003cstrong>React Compiler (1.0, 2025)\u003c/strong> auto-memoizes at build time, so manual \u003ccode>useMemo/useCallback/memo\u003c/code> becomes mostly unnecessary in compiled codebases. Know it exists, that it requires following the Rules of React, and that you can adopt it incrementally.\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>Does useMemo guarantee the value won't be recomputed?\u003c/summary>\u003cp>No. React treats it as a performance hint and may discard the cache. Code must still be correct if it recomputes.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>Why would React.memo not work even though you wrapped the child?\u003c/summary>\u003cp>Usually because a prop is a new object, array or function created inline every render, so shallow comparison fails. Children passed as JSX are also new elements each render.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>When would you not use the React Compiler?\u003c/summary>\u003cp>When the codebase breaks the rules of React, like mutating props or reading refs during render, since the compiler's assumptions would be wrong. I'd adopt it incrementally, starting with the lint rules.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">useReducer: when is it better than useState?\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>I reach for \u003ccode>useReducer\u003c/code> when state has several related values that change together, or when the next state depends on the previous one in non-trivial ways. A checkout flow is a good example: the current step, form data, validation errors and submission status all interact. Putting every transition in a reducer makes the logic explicit and easy to unit test, since the reducer is just a pure function.\u003c/p>\u003cp>Other benefits: event handlers become simple, they just dispatch an action describing what happened, and \u003ccode>dispatch\u003c/code> is a stable function, so I can pass it down without \u003ccode>useCallback\u003c/code>.\u003c/p>\u003cp>For a single boolean or input value, \u003ccode>useState\u003c/code> is simpler and clearer. A
