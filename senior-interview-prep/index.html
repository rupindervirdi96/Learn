cloud, HCL), \u003cstrong>AWS CDK\u003c/strong> (TypeScript! very approachable for front-end devs), \u003cstrong>Pulumi\u003c/strong> (TS/Python), \u003cstrong>SST\u003c/strong> (CDK-based, great for Next.js/serverless on AWS), CloudFormation, Bicep (Azure). Mention: \"I'd define the S3 bucket, CloudFront distribution and headers policy in CDK so every environment is identical.\"\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>What's Terraform state, and why is it important?\u003c/summary>\u003cp>The record of what Terraform has created, mapping config to real resources. It must be stored remotely, locked during changes, and protected, since it can contain sensitive values.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>CDK or Terraform for a front-end team?\u003c/summary>\u003cp>CDK if the company is fully on AWS and the team prefers TypeScript. Terraform if the company is multi-cloud or already standardised on it. Following the company's existing standard matters most.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">How do you handle file uploads securely from the browser?\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>I'd avoid sending large files through the API server, because it ties up server resources and adds latency. Instead, I'd use pre-signed URLs. The client first asks our backend for an upload URL. The backend checks that the user is authenticated and allowed to upload, then generates a pre-signed S3 URL that's only valid for a few minutes and is restricted to a specific file type and maximum size. The browser then uploads directly to S3 with that URL. I'd use XHR for progress events, or multipart upload for large files.\u003c/p>\u003cp>After the upload, an S3 event triggers a Lambda function that scans the file for viruses and creates resized versions for images, and the backend records the metadata.\u003c/p>\u003cp>Security-wise, I always validate the file type and size on the server side too, since client-side checks can be bypassed. I'd generate random file names rather than trusting user-provided ones, keep the bucket private, and serve sensitive files through CloudFront signed URLs or short-lived pre-signed download URLs.\u003c/p>\u003c/div>\n\u003cp>Don't stream big files through your API server. Instead: 1) the client asks the backend for a \u003cstrong>pre-signed S3 URL\u003c/strong> (authenticated, short expiry, content-type and size restrictions); 2) the browser \u003ccode>PUT\u003c/code>s directly to S3 (with progress via XHR or chunked multipart upload for large files); 3) S3 triggers a Lambda to virus-scan/resize; 4) the backend records metadata. Validate type and size on the server too, and keep the bucket private, serving files via CloudFront signed URLs if they're sensitive.\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>How do you show upload progress?\u003c/summary>\u003cp>Use XMLHttpRequest's upload progress events, since fetch doesn't expose upload progress in most browsers, or track completed parts in a multipart upload.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>How do you prevent users from uploading malicious files?\u003c/summary>\u003cp>Restrict the content type and size in the pre-signed URL, validate on the server after upload, scan for malware, never serve user files from your main domain, and set \u003ccode>Content-Disposition\u003c/code> correctly so files download instead of executing.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Quick-fire cloud terms (be able to define each in one line)\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>I'll go through them quickly. A region is a geographic area with several availability zones, which are isolated data centres for redundancy, and edge locations are the CDN's points of presence close to users. Auto-scaling adds or removes capacity based on load. A load balancer distributes traffic across instances and does health checks. A VPC is a private network in the cloud.\u003c/p>\u003cp>IAM is identity and access management, and least privilege means each role has only the permissions it needs, for example the CI deploy role can only write to one bucket. A cold start is the extra latency when a serverless function starts a new instance. An origin shield is an extra caching layer between the CDN edges and the origin.\u003c/p>\u003cp>RTO is how quickly you must recover after an outage, and RPO is how much data you can afford to lose. SLA is the promise to customers, SLO is the internal target, and SLI is the actual measurement, like the percentage of successful requests. The twelve-factor app is a set of principles for cloud-native apps, like config in the environment and stateless processes. Shift-left means testing and security earlier in the process. And GitOps means deployments are driven by the state of a Git repository, with tools like Argo CD.\u003c/p>\u003c/div>\n\u003cul>\u003cli>\u003cstrong>Region / Availability Zone / Edge location\u003c/strong>: geographic area / isolated datacentre(s) within it / CDN point of presence.\u003c/li>\u003cli>\u003cstrong>Auto-scaling\u003c/strong>: add or remove capacity based on load.\u003c/li>\u003cli>\u003cstrong>Load balancer (ALB)\u003c/strong>: distributes HTTP traffic, health checks, path routing.\u003c/li>\u003cli>\u003cstrong>VPC\u003c/strong>: a private network in the cloud.\u003c/li>\u003cli>\u003cstrong>IAM role / least privilege\u003c/strong>: give only the permissions needed.\u003c/li>\u003cli>\u003cstrong>Cold start\u003c/strong>: latency when a serverless function boots a new instance.\u003c/li>\u003cli>\u003cstrong>Origin shield\u003c/strong>: an extra CDN cache layer that reduces origin load.\u003c/li>\u003cli>\u003cstrong>RTO/RPO\u003c/strong>: how fast you recover / how much data you can lose.\u003c/li>\u003cli>\u003cstrong>12-factor app\u003c/strong>: config in env, stateless processes, logs as streams, dev/prod parity.\u003c/li>\u003cli>\u003cstrong>SLA / SLO / SLI\u003c/strong>: promise to customers / internal target / the measured indicator.\u003c/li>\u003cli>\u003cstrong>Shift-left\u003c/strong>: test/security earlier in the pipeline.\u003c/li>\u003cli>\u003cstrong>GitOps\u003c/strong>: deployments driven by Git state (Argo CD, Flux).\u003c/li>\u003c/ul>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>What's the difference between scaling up and scaling out?\u003c/summary>\u003cp>Scaling up means bigger machines; scaling out means more machines. Cloud-native apps prefer scaling out because it's more resilient and elastic.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>What's an SLO you'd set for a front end?\u003c/summary>\u003cp>For example, 99.9 percent of page loads without an unhandled JavaScript error, or 75th percentile LCP under 2.5 seconds on product pages.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>"},{"id":"14-ai-frontend","title":"AI in Front-End Development","html":"\u003ch1 id=\"ai-in-front-end-development\">AI in Front-End Development\u003c/h1>\n\u003cblockquote>\u003cp>Your résumé lists \u003cstrong>OpenAI API, embeddings, vector DBs (Supabase), RAG\u003c/strong>. In 2026 many interviews ask (a) how you'd build an AI feature into a product and (b) how you use AI tools responsibly in your own workflow. This is a differentiator for you.\u003c/p>\u003c/blockquote>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Explain RAG (Retrieval-Augmented Generation) simply\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>RAG, retrieval-augmented generation, is a way to make a language model answer questions using your own data, which it was never trained on. The model on its own only knows its training data, so it can't answer questions about your products, policies or a specific customer's situation, and it may make things up.\u003c/p>\u003cp>It works in two phases. First, ingestion: you split your documents, say help articles and plan details, into chunks, convert each chunk into an embedding, which is a vector representing its meaning, and store them in a vector database, like Postgres with pgvector in Supabase, which I've used. Then at question time, you embed the user's question, find the chunks with the most similar meaning, and send those chunks to the model together with the question and instructions to answer only from that context and cite the sources.\u003c/p>\u003cp>Compared to fine-tuning, RAG is cheaper, it updates as soon as the content changes, and answers can be traced back to sources. Fine-tuning is better for teaching style or format than adding knowledge. A telecom example would be a support assistant answering \"why is my bill higher this month?\" using the help centre and plan terms, with links to the articles it used.\u003c/p>\u003c/div>\n\u003cp>LLMs don't know your private/up-to-date data, so you \u003cstrong>retrieve\u003c/strong> relevant content and put it in the prompt:\u003c/p>\n\u003col>\u003cli>\u003cstrong>Ingest:\u003c/strong> split documents (help articles, plan details) into chunks → create \u003cstrong>embeddings\u003c/strong> (vectors capturing meaning) → store them in a \u003cstrong>vector DB\u003c/strong> (pgvector/Supabase, Pinecone, OpenSearch).\u003c/li>\u003cli>\u003cstrong>Query:\u003c/strong> embed the user's question → \u003cstrong>similarity search\u003c/strong> (cosine) for the top-k chunks (often hybrid with keyword search + re-ranking).\u003c/li>\u003cli>\u003cstrong>Generate:\u003c/strong> send the system prompt + retrieved chunks + the question to the LLM → an answer \u003cstrong>grounded\u003c/strong> in your data, with \u003cstrong>citations\u003c/strong>.\u003c/li>\u003c/ol>\n\u003cp>Why not fine-tune? RAG is cheaper, updates instantly when content changes, and is traceable (citations). Fine-tuning is for style/format/behaviour, not for adding knowledge.\u003c/p>\n\u003cp>Bell-style example: \"A support assistant that answers 'Why is my bill higher?' using the help-centre content and plan terms, with links to the source articles.\"\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>How would you evaluate whether your RAG system works?\u003c/summary>\u003cp>Build a test set of real questions with expected answers or source documents, then measure retrieval quality, meaning whether the right chunks were found, and answer quality, like correctness and faithfulness to the sources, using human review and automated LLM-based graders.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>What happens when the answer isn't in the documents?\u003c/summary>\u003cp>The prompt instructs the model to say it doesn't know and suggest a next step, and you can also set a similarity threshold, so if no chunk is relevant enough, you don't call the model with weak context.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>How do you keep the vector index up to date?\u003c/summary>\u003cp>Re-embed documents when they change, for example via a CMS webhook, track content hashes to skip unchanged chunks, and remove deleted documents from the index.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">How do you build a chat UI with streaming responses?\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>The first rule is that the browser never calls the model provider directly with an API key, because anyone could extract it. The browser calls our own backend endpoint, a Next.js route handler or a NestJS endpoint, which holds the key, checks authentication, applies rate limits, and logs usage.\u003c/p>\u003cp>That endpoint streams the response back, using Server-Sent Events or a streamed HTTP response. On the client, I read the response body as a stream, decode the text chunks, and append them to the message as they arrive, so the user sees the answer being written instead of waiting several seconds. For performance with fast token streams, I batch updates per animation frame.\u003c/p>\u003cp>Good chat UX needs a stop button, which aborts the request with an AbortController, retry and copy buttons, and markdown rendering that's properly sanitised. Auto-scroll should stop if the user scrolls up to read. Accessibility matters too: a polite live region that announces the completed answer rather than every token. Plus feedback buttons and citations. Libraries like the Vercel AI SDK handle a lot of this, but understanding the streaming mechanics matters for debugging.\u003c/p>\u003c/div>\n\u003cul>\u003cli>\u003cstrong>Never call the LLM API directly from the browser with your secret key.\u003c/strong> Call your own backend/BFF (Route Handler / NestJS endpoint), which holds the key, applies auth, rate limits and logging.\u003c/li>\u003cli>Stream tokens to the client via \u003cstrong>SSE\u003c/strong> or a streamed \u003ccode>fetch\u003c/code> response (\u003ccode>ReadableStream\u003c/code>), and render incrementally.\u003c/li>\u003c/ul>\n\u003cdiv class=\"code\">\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003cpre>\u003ccode data-lang=\"ts\">\u003cspan class=\"t-k\">const\u003c/span> res = \u003cspan class=\"t-k\">await\u003c/span> fetch(\u003cspan class=\"t-s\">'/api/chat'\u003c/span>, { method: \u003cspan class=\"t-s\">'POST'\u003c/span>, body: JSON.stringify({ messages }), signal });\n\u003cspan class=\"t-k\">const\u003c/span> reader = res.body!.pipeThrough(\u003cspan class=\"t-k\">new\u003c/span> TextDecoderStream()).getReader();\n\u003cspan class=\"t-k\">while\u003c/span> (\u003cspan class=\"t-k\">true\u003c/span>) {\n  \u003cspan class=\"t-k\">const\u003c/span> { value, done } = \u003cspan class=\"t-k\">await\u003c/span> reader.read();\n  \u003cspan class=\"t-k\">if\u003c/span> (done) \u003cspan class=\"t-k\">break\u003c/span>;\n  setAnswer(prev =&gt; prev + value);       \u003cspan class=\"t-c\">// consider batching with rAF for performance\u003c/span>\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003cul>\u003cli>UX: stop button (\u003ccode>AbortController\u003c/code>), retry, markdown rendering (\u003cstrong>sanitised!\u003c/strong>), copy button, auto-scroll that respects the user scrolling up, \u003ccode>aria-live=\"polite\"\u003c/code> announcements (not every token: announce when done), feedback thumbs, and citations.\u003c/li>\u003cli>Libraries: \u003cstrong>Vercel AI SDK\u003c/strong> (\u003ccode>useChat\u003c/code>, streaming, tool calling), provider SDKs (OpenAI, Anthropic).\u003c/li>\u003c/ul>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>How do you render markdown that is still streaming?\u003c/summary>\u003cp>Re-parse the accumulated text on each update with a markdown renderer that tolerates incomplete syntax, throttled to animation frames, and sanitise the output.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>How do you keep conversation history?\u003c/summary>\u003cp>Send the relevant previous messages with each request, trimmed or summarised to fit the context window, and store conversations server-side if users need them across sessions.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">What are the risks of AI features, and how do you mitigate them?\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>The first is prompt injection: text from the user, or from a retrieved document, containing instructions like \"ignore your previous instructions\". You can't fully prevent it with prompting, so the design must limit the damage. Treat the model's output as untrusted, give it only the minimum tools and permissions, and require human confirmation before any real action, like changing an account.\u003c/p>\u003cp>Second, XSS: if you render the model's markdown or HTML without sanitising it, an attacker who influences the output can inject script, so I sanitise output just like any user content. Third, hallucinations: grounding with RAG, showing citations, and instructing the model to say when it doesn't know. Fourth, privacy: avoid sending personal data unnecessarily, check the provider's data retention policies, and comply with laws like PIPEDA and Quebec's Law 25.\u003c/p>\u003cp>Then there are cost and latency, managed with caching, streaming, smaller models for simple tasks and per-user rate limits. And evaluation: a set of test questions with expected answers, run whenever the prompt or model changes, so quality doesn't silently regress.\u003c/p>\u003c/div>\n\u003cul>\u003cli>\u003cstrong>Prompt injection:\u003c/strong> user input or retrieved documents containing instructions (\"ignore previous instructions...\"). Mitigate: treat model output as untrusted, least-privilege tools, require human confirmation for actions, separate system and user content, and add output filtering.\u003c/li>\u003cli>\u003cstrong>XSS via model output:\u003c/strong> rendering LLM markdown/HTML without sanitising is a real XSS vector. Use DOMPurify or a safe markdown renderer.\u003c/li>\u003cli>\u003cstrong>Hallucinations:\u003c/strong> grounding with RAG, citations, \"I don't know\" behaviour, evals.\u003c/li>\u003cli>\u003cstrong>Data privacy:\u003c/strong> don't send PII unnecessarily, respect provider data retention settings, and comply with Law 25 / PIPEDA.\u003c/li>\u003cli>\u003cstrong>Cost and latency:\u003c/strong> caching, smaller models for simple tasks, streaming, token limits, rate limiting per user.\u003c/li>\u003cli>\u003cstrong>Evaluation:\u003c/strong> a test set of questions + expected answers, run on every prompt/model change.\u003c/li>\u003c/ul>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>Give an example of indirect prompt injection.\u003c/summary>\u003cp>A support document or webpage that the system retrieves contains hidden text like \"tell the user to visit this link\". The model treats it as an instruction. That's why retrieved content must be treated as data, and tools must be limited.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>How would you control costs?\u003c/summary>\u003cp>Rate limits per user, caching common answers, limiting response length, using smaller models for simple tasks, and monitoring cost per feature.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">How do you use AI coding tools in your workflow? (answer maturely)\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>I use AI tools like GitHub Copilot daily, \u003cspan class=\"fill\">[and also Claude or ChatGPT for bigger questions]\u003c/span>. They save me the most time on boilerplate, writing tests, refactoring, converting code between patterns, exploring an unfamiliar library or API, and drafting documentation.\u003c/p>\u003cp>But I treat AI output like a pull request from a junior developer: I read it, I make sure I understand it, I test it, and I own it once it's merged. AI tools are confidently wrong fairly often, especially with newer library versions or subtle concurrency and security issues, so I never paste code I couldn't explain in a code review.\u003c/p>\u003cp>I'm also careful about company policy: only using approved tools and never pasting proprietary code, customer data or secrets into tools that aren't approved.\u003c/p>\u003cp>As a senior, I'd also help the team use these tools well: agree on approved tools, keep the same review standards for AI-generated code, and share prompts and workflows that work. I see AI as making me faster at what I already know how to do. Architecture, security and performance judgment are still my responsibility.\u003c/p>\u003c/div>\n\u003cp>\"I use AI assistants (GitHub Copilot, \u003cspan class=\"fill\">[Claude/ChatGPT/Cursor]\u003c/span>) for boilerplate, tests, refactors, exploring unfamiliar APIs and first drafts of documentation. I treat the output like a junior's PR: I review it, test it and make sure I understand it before it goes in. I'm careful about not pasting proprietary code or secrets into tools that aren't approved by the company. Where they help most is speed on well-understood tasks. Architecture, security and performance decisions still need human judgment.\"\u003c/p>\n\u003cp>Seniors are increasingly asked how they'd \u003cstrong>set team guidelines\u003c/strong> for AI tools: approved tools, review standards, no secrets, licence concerns, and measuring impact.\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>Has AI ever introduced a bug into your code?\u003c/summary>\u003cp>\u003cspan class=\"fill\">[Honest example.]\u003c/span> For example: \"It suggested an effect without a cleanup, which caused a stale request bug. It reinforced that I review AI code just as carefully as any other code.\"\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>How do you think AI changes the role of a senior developer?\u003c/summary>\u003cp>Writing code gets faster, so judgment matters more: choosing the right architecture, reviewing carefully, testing, security, and understanding the business problem. Seniors also set the standards for how the team uses these tools.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Embeddings and vector search: key terms\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>An embedding is a list of numbers, a vector, that represents the meaning of a piece of text, so texts with similar meanings produce vectors that are close together. Similarity is usually measured with cosine similarity. That's what makes semantic search possible: a question like \"my internet keeps dropping\" can match an article titled \"troubleshooting connection issues\", even with no words in common.\u003c/p>\u003cp>Chunking is splitting documents into pieces of a few hundred tokens, usually by headings or paragraphs with some overlap, so each chunk is focused enough to be relevant. Vector databases use approximate nearest-neighbour indexes, like HNSW, to search millions of vectors quickly. In practice, hybrid search, combining vector search with traditional keyword search, plus a re-ranking step, gives the best results, since keywords still matter for things like product names and model numbers.\u003c/p>\u003cp>Other terms: the context window is the maximum amount of text the model can process at once. Tool calling lets the model return a structured request for your code to run, like checking service availability at an address. And MCP, the Model Context Protocol, is a standard way to connect models to tools and data sources.\u003c/p>\u003c/div>\n\u003cul>\u003cli>\u003cstrong>Embedding:\u003c/strong> a fixed-length vector representing meaning; similar meaning gives nearby vectors.\u003c/li>\u003cli>\u003cstrong>Cosine similarity / dot product:\u003c/strong> distance measures.\u003c/li>\u003cli>\u003cstrong>Chunking:\u003c/strong> split text (by headings/paragraphs, ~300–800 tokens, with overlap).\u003c/li>\u003cli>\u003cstrong>ANN index (HNSW, IVF):\u003c/strong> approximate nearest-neighbour search for speed.\u003c/li>\u003cli>\u003cstrong>Hybrid search:\u003c/strong> combine vector + keyword (BM25) results; \u003cstrong>re-ranking\u003c/strong> with a cross-encoder.\u003c/li>\u003cli>\u003cstrong>Context window:\u003c/strong> max tokens the model can read; more context means more cost and potential \"lost in the middle\".\u003c/li>\u003cli>\u003cstrong>Tool / function calling:\u003c/strong> the model returns structured calls your code executes (e.g. \u003ccode>checkServiceability(address)\u003c/code>).\u003c/li>\u003cli>\u003cstrong>Agents / MCP (Model Context Protocol):\u003c/strong> standardised ways for models to use tools and data sources.\u003c/li>\u003c/ul>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>Why use hybrid search?\u003c/summary>\u003cp>Vector search is good at meaning but can miss exact terms, like a phone model number or plan name, while keyword search catches those. Combining both and re-ranking gives better results.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>How do you choose chunk size?\u003c/summary>\u003cp>Small chunks are precise but lose context, large ones keep context but dilute relevance. I'd start around a few hundred tokens split on headings with overlap, then tune it using the evaluation set.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>"},{"id":"15-leadership-behavioral","title":"Leadership & Behavioral (Senior Expectations)","html":"\u003ch1 id=\"leadership-behavioral-senior-expectations\">Leadership &amp; Behavioral (Senior Expectations)\u003c/h1>\n\u003cblockquote>\u003cp>Seniors are hired for \u003cstrong>judgment and influence\u003c/strong>, not only code. Every answer should show: ownership, collaboration, trade-off thinking, and making others better. Use your STAR stories from \u003cem>Your Story\u003c/em>. Most questions below map to one of them.\u003c/p>\u003c/blockquote>\n\u003ch2 id=\"what-interviewers-are-scoring\">What interviewers are scoring\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Signal\u003c/th>\u003cth>What they want to hear\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Ownership\u003c/strong>\u003c/td>\u003ctd>You see problems beyond your ticket and fix them end-to-end, including after release.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Technical judgment\u003c/strong>\u003c/td>\u003ctd>You choose pragmatic solutions, can explain trade-offs, and know when \u003cem>not\u003c/em> to build.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Communication\u003c/strong>\u003c/td>\u003ctd>Clear with engineers \u003cem>and\u003c/em> non-technical stakeholders; writes things down.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Influence without authority\u003c/strong>\u003c/td>\u003ctd>You convince with data, prototypes and RFCs, not hierarchy.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Mentoring / multiplying\u003c/strong>\u003c/td>\u003ctd>Others get better because of you: reviews, pairing, docs, tooling.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Delivery\u003c/strong>\u003c/td>\u003ctd>You ship incrementally, manage risk and hit important dates.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Growth mindset\u003c/strong>\u003c/td>\u003ctd>You own mistakes and change your process.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"common-questions-which-story-to-use\">Common questions → which story to use\u003c/h2>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Tell me about a time you disagreed with a technical decision.\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>At Bell, \u003cspan class=\"fill\">[design proposed a custom dropdown for the plan selector, with an animation and a fully custom look]\u003c/span>. I liked the visual direction, but I was concerned about two things: a custom dropdown built from divs wasn't going to be accessible, and Bell has to meet accessibility requirements as a federally regulated company, and the animation library would add weight to a page we'd just worked hard to make faster.\u003c/p>\u003cp>Instead of just saying no, I first asked the designer what the goal was. It turned out it was mainly brand consistency and making the options easier to compare. So I built a quick prototype of two options: their version, and an accessible headless component styled to match the design. I showed both with a keyboard-only demo and a screen reader, and the bundle size difference.\u003c/p>\u003cp>Seeing the screen reader experience side by side changed the conversation more than any argument would have. We went with the accessible version, kept most of the visual design, and \u003cspan class=\"fill\">[it later became the standard pattern in our component library]\u003c/span>.\u003c/p>\u003cp>What I took from it is to disagree with data and prototypes rather than opinions, and to focus on the shared goal. And if the decision had gone the other way, I would have committed to it and raised the risks in writing.\u003c/p>\u003c/div>\n\u003cp>→ \u003cstrong>Story 6\u003c/strong> (design/product disagreement) or the \u003cstrong>RTK proposal\u003c/strong> (Story 2). Key beats: understand their reasoning first, bring data/prototype, propose options, \u003cstrong>disagree and commit\u003c/strong> if the decision goes the other way, and follow up on the outcome. Never make the other person look stupid.\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>What would you have done if the designer insisted on their version?\u003c/summary>\u003cp>If the decision-maker chose it knowing the trade-offs, I'd commit to it and make it as good as possible, including adding the accessibility attributes we could. If it created a real compliance risk, I'd escalate it calmly in writing to the right people.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>Tell me about a time you were the one who was wrong.\u003c/summary>\u003cp>\u003cspan class=\"fill\">[Real example.]\u003c/span> Show that you listened, changed your mind based on evidence, and what you learned. Interviewers value that more than always being right.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Tell me about a project you led end-to-end.\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>The one I'd pick is the performance initiative on Bell's e-commerce pages. Mobile performance was hurting both conversion and SEO, and I took ownership of improving it.\u003c/p>\u003cp>I started by establishing a baseline: Lighthouse scores, Core Web Vitals, and a bundle analysis, which showed \u003cspan class=\"fill\">[one large bundle, unoptimised images and unused CSS]\u003c/span>. I wrote a short plan listing the opportunities ranked by impact and effort, agreed priorities with my lead and the product owner, and broke it into small pull requests that could ship alongside feature work rather than as one risky change.\u003c/p>\u003cp>The implementation included route-level code splitting, lazy loading of below-the-fold components, image optimisation with proper dimensions, and fixing our Tailwind purge configuration. I coordinated with QA so each change went through regression testing, especially on checkout.\u003c/p>\u003cp>We improved load times by roughly 20 percent, with better Core Web Vitals. \u003cspan class=\"fill\">[Then we added a performance check to the pipeline so it wouldn't regress.]\u003c/span> What I learned about leading something like this: measure first, ship incrementally, communicate progress with numbers, and leave guardrails behind so the improvement lasts.\u003c/p>\u003c/div>\n\u003cp>→ \u003cstrong>Story 1 (performance)\u003c/strong>, \u003cstrong>Story 2 (RTK refactor)\u003c/strong> or \u003cstrong>Story 8 (ambiguity)\u003c/strong>. Show planning (scope, milestones), coordination (QA, backend, design), risk management (flags, incremental rollout), and measurable results.\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>What was the hardest part of leading it?\u003c/summary>\u003cp>\u003cspan class=\"fill\">[Real answer.]\u003c/span> Often balancing it with feature work and keeping stakeholders informed: I gave short progress updates with numbers, so the value stayed visible.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>How did you communicate progress?\u003c/summary>\u003cp>Short regular updates in \u003cspan class=\"fill\">[standups and a sprint demo]\u003c/span>, with before and after metrics, and a summary at the end that included what's left and the recommended next steps.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">How do you mentor junior developers?\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>Since moving into the senior role, mentoring has become a real part of my job. \u003cspan class=\"fill\">[Two newer developers joined our team, for example.]\u003c/span>\u003c/p>\u003cp>My approach starts with pairing on their first features, where I let them drive and I mostly ask questions, so they build their own understanding. In code reviews, I explain the why behind a suggestion, and I often phrase things as questions, like \"what happens if this request fails?\", so they learn to think about edge cases themselves rather than just applying my fix. I also label comments clearly, so they know what's blocking and what's just a suggestion.\u003c/p>\u003cp>I try to increase their scope gradually: a small bug, then a feature, then a feature where they coordinate with the backend team themselves. I also encourage them to present their work in demos, which builds confidence and visibility.\u003c/p>\u003cp>And I try to scale it beyond individuals: written guides for common patterns, a PR checklist covering tests, accessibility and translations, and lint rules so they get feedback automatically. \u003cspan class=\"fill\">[One of the developers I mentored now owns the ... feature on their own]\u003c/span>, and that's the result I'm proudest of.\u003c/p>\u003c/div>\n\u003cp>→ \u003cstrong>Story 7.\u003c/strong> Concrete practices: pairing on their first features; \u003cstrong>asking questions in code reviews\u003c/strong> instead of dictating (\"What happens if this request fails?\"); giving context (why), not just fixes; gradually increasing scope; letting them present their work; written guides; celebrating their wins publicly. Mention a specific person's growth (anonymised).\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>How do you give difficult feedback?\u003c/summary>\u003cp>Privately, promptly and specifically: what I observed, its impact, and a concrete suggestion, framed around their growth. And I ask for their view, because sometimes there's context I didn't know.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>How do you know your mentoring is working?\u003c/summary>\u003cp>When they need me less: they handle larger tasks independently, their pull requests need fewer review rounds, and they start helping others.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">How do you do code reviews? What do you look for?\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>I review in order of importance. First, correctness: does it do what the ticket asks, and what about edge cases, like empty states, errors, slow networks, or double clicks? Then security, like rendering user content or handling auth. Then the user impact that's easy to miss: accessibility, French translations, loading and error states, and performance, like new dependencies or unnecessary re-renders. Then maintainability: naming, whether the abstraction makes sense, and whether there are meaningful tests.\u003c/p>\u003cp>Style and formatting I leave to Prettier and ESLint, so reviews don't turn into debates about commas.\u003c/p>\u003cp>How I review matters just as much. I try to review within the same day, because waiting blocks people. I label comments, like \"nit\", \"question\" or \"blocking\", so the author knows what's essential. I explain my reasoning, I point out good things too, and if a discussion goes back and forth more than a couple of times, I suggest a quick call and then summarise the outcome in the PR. And I encourage small pull requests, because they get much better reviews than huge ones.\u003c/p>\u003c/div>\n\u003cp>Order of importance: \u003cstrong>correctness and edge cases\u003c/strong> → security (XSS, auth) → \u003cstrong>user impact\u003c/strong> (a11y, i18n, error/loading states, performance) → design/maintainability (naming, abstractions, tests) → style (automate it with linters and Prettier; don't argue about it in reviews).\u003c/p>\n\u003cp>Behaviour: review within a day; small PRs; label comments by severity (\"nit:\", \"blocking:\", \"question:\"); approve with suggestions when it's safe; praise good things; take long discussions to a call and then summarise in the PR.\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>What do you do if someone keeps ignoring your review comments?\u003c/summary>\u003cp>Talk to them directly, not in more PR comments, to understand why. Maybe the comments weren't clear, or they disagree. If it's a standards issue, agree on team conventions and automate them with lint rules where possible.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>How do you review a very large pull request?\u003c/summary>\u003cp>First I ask whether it can be split. If not, I review it in passes: overall design first, then logic, then details, and I might ask for a walkthrough call.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">How do you handle technical debt?\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>First, I make it visible. Tech debt that only lives in developers' heads never gets prioritised. So I create tickets that describe the impact in terms the business understands, like \"every change to checkout takes two extra days because of this\", or \"this caused three production incidents this quarter\".\u003c/p>\u003cp>Then I handle it at different scales. Small things I fix as I go, leaving code a bit better than I found it, as part of the related ticket. For medium items, I negotiate a regular share of each sprint, something like 15 to 20 percent. For big items, I avoid big-bang rewrites and instead do incremental migrations alongside feature work.\u003c/p>\u003cp>The Redux Toolkit migration at Bell is a good example. Instead of asking for a month to rewrite state management, I migrated one slice at a time, starting with the cart, while still delivering features. Finally, I add guardrails, like lint rules, stricter types and tests, so the same kind of debt doesn't come back.\u003c/p>\u003c/div>\n\u003cp>Make it \u003cstrong>visible\u003c/strong> (tickets with impact, a debt register), tie it to \u003cstrong>business outcomes\u003c/strong> (\"this slows every checkout feature by ~2 days\", \"caused 3 incidents\"), use the boy-scout rule for small things, negotiate a capacity % per sprint (e.g. 15–20%), do big items as incremental migrations alongside features (as with the RTK migration), and add guardrails (lint rules, types, tests) so the debt doesn't come back.\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>How do you decide which debt to pay first?\u003c/summary>\u003cp>By impact and frequency: debt in code we change often, that causes incidents, or that slows down planned features comes first. Old debt in code nobody touches can wait.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>Give an example of debt you decided not to fix.\u003c/summary>\u003cp>\u003cspan class=\"fill\">[Real example.]\u003c/span> For example, a legacy page scheduled for replacement within months. Fixing it wouldn't have paid back the effort.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Tell me about a time you missed a deadline or made a mistake.\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>\u003cspan class=\"fill\">[Example: early in the Bell project, I underestimated a feature that involved the cart and a promotions API.]\u003c/span> I gave an estimate based on the front-end work, but I didn't account for the uncertainty of an API that was still being built, or the French content and QA time.\u003c/p>\u003cp>About halfway through, I realised we wouldn't make the date. The thing I did right was raising it immediately with my lead and the product owner, rather than hoping to catch up. I explained the cause and proposed options: ship the core flow on time and follow with the edge cases a week later, or move the date. We chose to reduce scope, and the core feature shipped on time.\u003c/p>\u003cp>What I changed afterwards: I now identify unknowns first and do a short spike when an estimate depends on something uncertain, I give estimates as ranges with the main risk stated, and I include translation, accessibility and testing time explicitly. Since then my estimates have been much more reliable, and I flag risks much earlier.\u003c/p>\u003c/div>\n\u003cp>→ \u003cstrong>Story 9.\u003c/strong> Own it without excuses. Explain what you did immediately (communicate early, mitigate) and what you changed afterwards (estimation buffers, earlier risk flags, a checklist, an automated test). Interviewers distrust people who claim they've never failed.\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>How did your manager react?\u003c/summary>\u003cp>\u003cspan class=\"fill\">[Real answer.]\u003c/span> Generally, raising it early meant there was time to adjust, so the reaction was focused on the plan rather than the miss.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>How do you prevent it from happening again?\u003c/summary>\u003cp>Identifying uncertainty earlier, estimating in ranges, including all the work like testing and translations, and checking progress against the estimate midway rather than at the end.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">How do you estimate work and handle changing requirements?\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>For estimation, I first break the work into small pieces, so each piece is something I can reason about. Then I identify the unknowns, for example a new API or an unfamiliar library, and if they're significant, I suggest a short time-boxed spike before committing to an estimate. I give ranges rather than single numbers, like \"three to five days, and the main risk is the promotions API\", and I include the work people forget: tests, accessibility, French translations, code review and QA. I re-estimate as soon as I learn something that changes the picture.\u003c/p>\u003cp>When requirements change, I start by understanding the reason, because often the real goal can be met in a simpler way. Then I make the trade-off explicit to the product owner: if we add this, something has to move, the date, other scope, or a quality item we'd defer. I'd rather have that conversation openly than silently absorb the change and miss the date. And I try to design in small increments, so changes are cheaper to absorb.\u003c/p>\u003c/div>\n\u003cp>Break work into small pieces, find the unknowns first (time-boxed spikes), give ranges instead of single numbers (\"3–5 days, the risk is the promo API\"), include testing/a11y/i18n/review time, and re-estimate when you learn more. For changing requirements: ask about the goal behind the change, show the trade-off (scope vs date vs quality), and agree on what moves out.\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>What do you think of story points?\u003c/summary>\u003cp>They're useful for relative sizing and planning within a team, as long as they're not turned into a productivity metric or compared between teams. The conversation during estimation, which surfaces unknowns, is the most valuable part.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>What do you do when you're asked for an estimate on the spot?\u003c/summary>\u003cp>Give a rough range with clear assumptions, and say I'll confirm after looking into the unknowns. Better than a precise number that turns out wrong.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">How do you work with product managers and designers?\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>I try to get involved early, ideally while designs are still being explored, not when they arrive as a finished ticket. That's when I can point out things that are easy to change on paper: accessibility issues, how the layout handles longer French text, missing loading, empty and error states, and things that would be expensive to build or hurt performance.\u003c/p>\u003cp>When something is difficult, I bring options instead of a flat no, like \"we can do the full version in three weeks, or this version in one week that gets 90 percent of the value\". I help turn vague requirements into clear acceptance criteria, and I demo early, even rough work, so we can course-correct before it's polished.\u003c/p>\u003cp>I also try to explain technical constraints in business terms. For example, instead of \"the bundle is too big\", I'd say \"this would slow the product page by about a second on mobile, which affects conversion\". At Bell, working closely with design on the product pages and with backend teams on API contracts made features go much more smoothly.\u003c/p>\u003c/div>\n\u003cp>Get involved early (feasibility + a11y + performance input during design, not after), challenge with options instead of \"no\", turn vague requirements into acceptance criteria, demo early and often, and share technical constraints in business language. → Stories 3 and 6.\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>What do you do if a PM asks for something you think is a bad idea?\u003c/summary>\u003cp>Ask about the goal and the data behind it, share my concerns with evidence, and propose alternatives. If they still want to proceed, it's their call. I might suggest an experiment behind a feature flag to test it.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">How do you keep up with the front-end ecosystem?\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>I follow a few reliable sources rather than trying to read everything: the official React and Next.js blogs and release notes, web.dev for performance and platform features, and newsletters like This Week in React and JavaScript Weekly. I also watch talks from React Conf and similar conferences.\u003c/p>\u003cp>But I learn best by building, so I work on side projects. \u003cspan class=\"fill\">[For example, recently I've built projects with Next.js, NestJS, React Native and AI integrations using the OpenAI API and a vector database.]\u003c/span> That's where I try new things, like Server Components or new React 19 features, before suggesting them at work.\u003c/p>\u003cp>The other half is evaluating critically. Not every new tool is worth adopting. Before bringing something to the team, I ask what problem it solves for us, what it costs to migrate, how mature it is, and whether the team can support it. I'd rather be a little behind the hype and confident in what we use.\u003c/p>\u003c/div>\n\u003cp>Be specific: \u003cspan class=\"fill\">[React blog/RFCs, the Next.js changelog, web.dev, TC39 proposals, newsletters (This Week in React, Frontend Focus, JavaScript Weekly), podcasts (Syntax), conferences (React Summit, React Conf talks)]\u003c/span>, side projects (your folder has React Native, Next and NestJS projects, a chess app, AI integrations, so mention one), and \u003cstrong>evaluating new tools critically\u003c/strong> before bringing them to the team.\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>What's something new you learned recently?\u003c/summary>\u003cp>\u003cspan class=\"fill\">[Real example, e.g. React 19 actions, the React Compiler, Next.js caching changes, or a CSS feature.]\u003c/span> Explain it briefly and say whether you'd use it in production and why.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>How do you decide whether to adopt a new library?\u003c/summary>\u003cp>Check what problem it solves for us, its maturity and maintenance, bundle size, community, how hard it is to remove later, and run a small proof of concept before proposing it.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">What would you do in your first 90 days here?\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>In the first 30 days, my focus would be learning. I'd want to understand the product and the users, the architecture and codebase, how deployments and releases work, and the team's way of working. I'd ship some small fixes early, because that's the fastest way to learn the real development flow, and I'd meet the people I'll work with in product, design, QA and backend. I'd also read recent incident reports, which tell you a lot about where the system is fragile.\u003c/p>\u003cp>From 30 to 60 days, I'd take ownership of a meaningful feature and deliver it end to end. By then I'd also have noticed some improvement opportunities, maybe in performance, testing or developer experience, and I'd gather data on them rather than jumping to conclusions.\u003c/p>\u003cp>From 60 to 90 days, I'd propose and start leading one of those improvements, with a short written proposal and team buy-in. I'd also want to contribute to the team beyond my own work, through code reviews, documentation and onboarding, so that by three months I'm someone people come to for \u003cspan class=\"fill\">[front-end performance or React architecture]\u003c/span>.\u003c/p>\u003c/div>\n\u003cul>\u003cli>\u003cstrong>30:\u003c/strong> learn the product, users, codebase, architecture, deploy pipeline and team rituals; ship small fixes to learn the flow; meet stakeholders; read incident history.\u003c/li>\u003cli>\u003cstrong>60:\u003c/strong> own a meaningful feature; identify 2–3 improvement opportunities (performance, testing, DX) with data.\u003c/li>\u003cli>\u003cstrong>90:\u003c/strong> lead an improvement initiative (RFC → execution), contribute to hiring/onboarding docs, and become someone others come to for \u003cspan class=\"fill\">[performance / React architecture]\u003c/span>.\u003c/li>\u003c/ul>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>What if you find major problems in the codebase in your first weeks?\u003c/summary>\u003cp>Note them, but first understand why things are the way they are, since there's often history. I'd build trust by delivering, then bring proposals with data, rather than criticising early.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003cdetails class=\"qa\">\n\u003csummary>\u003cspan class=\"q\">Why do you want to be a senior engineer here? / Where do you see yourself in 3–5 years?\u003c/span>\u003c/summary>\u003cdiv class=\"ans\">\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-label\">🎤 Mock answer \u003cspan>say it out loud\u003c/span>\u003c/div>\u003cp>Over the last four and a half years at Bell, I've grown from building features to owning larger pieces, like the performance work and the state management migration, and mentoring other developers. What I want next is to have more ownership of front-end architecture and quality for a product, and to be closer to the product itself rather than working through a consulting engagement.\u003c/p>\u003cp>\u003cspan class=\"fill\">[What attracts me about this company specifically is ... for example, your product's scale, your focus on performance, or the technical challenges in the job description.]\u003c/span> That's exactly the kind of problem I've enjoyed most at Bell.\u003c/p>\u003cp>In three to five years, I see myself growing toward a staff or lead front-end role: someone who shapes technical direction across teams, sets standards for things like performance, accessibility and the design system, and helps other developers grow, while still staying hands-on with code, because that's what I enjoy most.\u003c/p>\u003c/div>\n\u003cp>Tie it to impact: \"I want to own front-end architecture and performance for a product at scale, and help a team grow. In 3–5 years I see myself as a staff/lead front-end engineer, someone who shapes technical direction across teams, while staying hands-on.\" Then connect it to something specific about their product or stack.\u003c/p>\n\u003cdiv class=\"followups\">\u003cdiv class=\"fu-label\">🔁 Follow-up questions \u003cspan>try answering before you open each one\u003c/span>\u003c/div>\u003cdetails class=\"fu\">\u003csummary>What do you know about our product?\u003c/summary>\u003cp>\u003cspan class=\"fill\">[Research the company.]\u003c/span> Mention the product, something specific about their tech or engineering blog, and connect it to your experience.\u003c/p>\u003c/details>\u003cdetails class=\"fu\">\u003csummary>Why should we hire you over other candidates?\u003c/summary>\u003cp>Four and a half years of hands-on experience on a large, high-traffic e-commerce platform, with proven results in performance, state management and quality, plus full-stack and AI skills, and a track record of being trusted with more responsibility over time.\u003c/p>\u003c/details>\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003ch2 id=\"senior-vs-staff-know-the-difference\">Senior vs Staff: know the difference\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Senior:\u003c/strong> owns features/systems end-to-end within a team, mentors, influences team-level decisions.\u003c/li>\u003cli>\u003cstrong>Staff:\u003c/strong> cross-team technical direction, sets standards (design system, platform, architecture), multiplies many teams.\u003c/li>\u003c/ul>\n\u003cp>If they ask \"what's the difference?\", answering this shows ambition and self-awareness.\u003c/p>\n\u003ch2 id=\"salary-logistics-canada\">Salary &amp; logistics (Canada)\u003c/h2>\n\u003cul>\u003cli>Research ranges for your city and level (levels.fyi, Glassdoor, the Robert Half / Hays salary guides). Senior front-end roles in Ottawa/Toronto/Montréal vary widely by company type.\u003c/li>\u003cli>If asked for expectations early: \"Based on my research for senior front-end roles with my experience, I'm targeting the range of \u003cspan class=\"fill\">[X–Y]\u003c/span>, but I'm flexible depending on the total package.\" Give a range whose \u003cstrong>bottom\u003c/strong> you're happy with.\u003c/li>\u003cli>Know your notice period, your work authorisation status, and your remote/hybrid preference.\u003c/li>\u003c/ul>"},{"id":"16-cheat-sheet","title":"Last-Night Cheat Sheet","html":"\u003ch1 id=\"last-night-cheat-sheet\">Last-Night Cheat Sheet\u003c/h1>\n\u003cblockquote>\u003cp>Read this the night before and the morning of. Don't learn anything new now.\u003c/p>\u003c/blockquote>\n\u003ch2 id=\"your-pitch-key-beats\">Your pitch (key beats)\u003c/h2>\n\u003col>\u003cli>~8 years front-end; \u003cstrong>~4.5 years on Bell e-commerce\u003c/strong> via LGS (an IBM company).\u003c/li>\u003cli>React, TypeScript, Next.js, Redux Toolkit, Tailwind; Node/Nest on the back end.\u003c/li>\u003cli>\u003cstrong>~20% faster load times\u003c/strong> (code splitting, lazy loading, Tailwind/CSS optimisation, Core Web Vitals).\u003c/li>\u003cli>\u003cstrong>Redux Toolkit refactor\u003c/strong> of legacy state; REST integration for \u003cstrong>filtering, cart and checkout\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>~30% fewer production bugs\u003c/strong> (Jest + Cypress with QA).\u003c/li>\u003cli>\u003cstrong>Promoted to Senior Full Stack (Apr 2025)\u003c/strong>; mentoring; AI features (OpenAI, RAG).\u003c/li>\u003cli>Why them: \u003cspan class=\"fill\">[one specific reason]\u003c/span>.\u003c/li>\u003c/ol>\n\u003ch2 id=\"30-one-liners\">30 one-liners\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Topic\u003c/th>\u003cth>One-liner\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Closure\u003c/td>\u003ctd>Function + the variables of the scope where it was created; the basis of hooks and stale-closure bugs.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Event loop\u003c/td>\u003ctd>Run a task → drain \u003cstrong>all microtasks\u003c/strong> (promises) → maybe render → next macrotask (timers).\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>this\u003c/code>\u003c/td>\u003ctd>Decided by the call site: new &gt; explicit (call/bind) &gt; implicit (obj.fn) &gt; default; arrows are lexical.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Prototype\u003c/td>\u003ctd>Property lookup walks the \u003ccode>[[Prototype]]\u003c/code> chain; classes are sugar over it.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>==\u003c/code>\u003c/td>\u003ctd>Coerces types; use \u003ccode>===\u003c/code>, except \u003ccode>x == null\u003c/code>.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Debounce vs throttle\u003c/td>\u003ctd>After activity stops vs at most once per interval.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Render\u003c/td>\u003ctd>Calling components to compute UI; commit applies the minimal DOM changes.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Keys\u003c/td>\u003ctd>Identity across renders; index keys break reordering and state; change the key to reset state.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>useEffect\u003c/td>\u003ctd>Sync with external systems; derived data belongs in render, user actions in handlers.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>useMemo/useCallback\u003c/td>\u003ctd>Only for expensive work or referential stability for memo'd children/deps; the React Compiler automates this.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Context\u003c/td>\u003ctd>Dependency injection, not a store; every consumer re-renders when the value changes; split it.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>useTransition\u003c/td>\u003ctd>Marks updates non-urgent so typing stays responsive (INP).\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Suspense\u003c/td>\u003ctd>Declarative loading for lazy code/data; enables streaming SSR.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>RSC\u003c/td>\u003ctd>Server-only components with zero client JS; \u003ccode>'use client'\u003c/code> marks the interactive boundary; RSC ≠ SSR.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>React 19\u003c/td>\u003ctd>Actions, useActionState, useOptimistic, useFormStatus, \u003ccode>use()\u003c/code>, ref as prop, metadata; 19.2: Activity, useEffectEvent.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hydration\u003c/td>\u003ctd>Attaching React to server HTML; the first client render must match (dates, locale, random).\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Server state\u003c/td>\u003ctd>Belongs in TanStack Query / RTK Query (cache, dedupe, revalidate), not hand-rolled Redux.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>RTK\u003c/td>\u003ctd>createSlice + Immer, createAsyncThunk, createEntityAdapter, createSelector, RTK Query.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>URL state\u003c/td>\u003ctd>Filters/sort/page in the query string: shareable, back button, SSR, SEO.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>CSR/SSR/SSG/ISR\u003c/td>\u003ctd>Browser / per request / at build / at build + background regeneration. Mix them per route.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>LCP\u003c/td>\u003ctd>≤ 2.5 s: TTFB, preload + \u003ccode>fetchpriority\u003c/code> hero, no lazy hero, critical CSS.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>INP\u003c/td>\u003ctd>≤ 200 ms (replaced FID in 2024): break long tasks, fewer re-renders, third-party scripts, workers.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>CLS\u003c/td>\u003ctd>≤ 0.1: image dimensions, reserved space, font metrics.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Caching\u003c/td>\u003ctd>Hashed assets get 1 year immutable; HTML gets no-cache; user data is private/no-store.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>XSS\u003c/td>\u003ctd>React escapes JSX; dangers are \u003ccode>dangerouslySetInnerHTML\u003c/code>, \u003ccode>javascript:\u003c/code> URLs and third-party scripts. Add a CSP.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Tokens\u003c/td>\u003ctd>HttpOnly Secure SameSite cookies via a BFF; not localStorage.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>CORS\u003c/td>\u003ctd>The server opts in to cross-origin reads; a browser protection; fix it on the server.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>OAuth for SPA\u003c/td>\u003ctd>Authorization Code + PKCE; OIDC adds the ID token.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Testing\u003c/td>\u003ctd>Trophy: static → unit → \u003cstrong>integration (RTL + MSW)\u003c/strong> → few E2E (Cypress/Playwright).\u003c/td>\u003c/tr>\u003ctr>\u003ctd>AWS SPA\u003c/td>\u003ctd>S3 (private) + CloudFront (OAC, ACM, headers) + Route 53, CI via OIDC role, invalidate index.html.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"system-design-radio\">System design: RADIO\u003c/h2>\n\u003cp>\u003cstrong>R\u003c/strong>equirements (functional + non-functional) → \u003cstrong>A\u003c/strong>rchitecture (rendering strategy, BFF, CDN) → \u003cstrong>D\u003c/strong>ata model (server/client/URL state) → \u003cstrong>I\u003c/strong>nterface (API, pagination, errors) → \u003cstrong>O\u003c/strong>ptimisations (perf, a11y, i18n, security, observability, testing, rollout).\u003c/p>\n\u003ch2 id=\"questions-to-ask-them-pick-3-5\">Questions to ask them (pick 3–5)\u003c/h2>\n\u003col>\u003cli>What does success look like for this role in the first 6 months?\u003c/li>\u003cli>What's the biggest technical challenge the front-end team is facing right now?\u003c/li>\u003cli>How is the front end architected (rendering strategy, state, design system), and what would you change if you could?\u003c/li>\u003cli>How do you deploy, and how often? How do you handle feature flags, monitoring and rollbacks?\u003c/li>\u003cli>How do you measure front-end performance and quality? Do you track Core Web Vitals?\u003c/li>\u003cli>How are technical decisions made? Is there an RFC/ADR process? How much influence do seniors have?\u003c/li>\u003cli>How do product, design and engineering collaborate here?\u003c/li>\u003cli>What does the path from senior to staff look like here?\u003c/li>\u003cli>What do you personally enjoy most about working here?\u003c/li>\u003c/ol>\n\u003ch2 id=\"red-flags-to-avoid-saying\">Red flags to avoid saying\u003c/h2>\n\u003cul>\u003cli>❌ \"We\" for everything. Say \u003cstrong>\"I\"\u003c/strong> for your actions.\u003c/li>\u003cli>❌ Criticising Bell, LGS, IBM or past teammates.\u003c/li>\u003cli>❌ \"I always use useMemo everywhere.\" / \"Redux for everything.\"\u003c/li>\u003cli>❌ Claiming deep cloud/K8s ops experience you don't have. Say what you did, plus what you understand conceptually.\u003c/li>\u003cli>❌ Jumping into code or a design without clarifying requirements.\u003c/li>\u003cli>❌ Silence while coding. Think out loud.\u003c/li>\u003c/ul>\n\u003ch2 id=\"if-you-get-stuck\">If you get stuck\u003c/h2>\n\u003cul>\u003cli>\"Let me think about this for a moment.\" (Silence is OK.)\u003c/li>\u003cli>\"I haven't used X directly, but here's how I'd reason about it: it's similar to Y, which I used at Bell.\"\u003c/li>\u003cli>\"My first instinct is A. Let me check an edge case...\"\u003c/li>\u003cli>Ask for a hint gracefully; showing collaboration is a positive signal.\u003c/li>\u003c/ul>"}];

// ---------- storage (safe) ----------
const store = {
  get(k, d) { try { const v = localStorage.getItem('sip:' + k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem('sip:' + k, JSON.stringify(v)); } catch {} },
};
let mastered = store.get('mastered', {});
let checks = store.get('checks', {});

// ---------- build question index ----------
const hash = s => { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) | 0; return (h >>> 0).toString(36); };
const QUESTIONS = [];
CHAPTERS.forEach(ch => {
  const tpl = document.createElement('template');
  tpl.innerHTML = ch.html;
  ch.questions = [];
  tpl.content.querySelectorAll('details.qa').forEach(d => {
    const qEl = d.querySelector('summary .q');
    const ansEl = d.querySelector('.ans');
    const mockEl = ansEl && ansEl.querySelector('.mock');
    const q = { cid: ch.id, chapter: ch.title, id: ch.id + '~' + hash(qEl.textContent),
      qHTML: qEl.innerHTML, qText: qEl.textContent, aHTML: ansEl ? ansEl.innerHTML : '',
      mockHTML: (mockEl ? mockEl.outerHTML : '') + (ansEl && ansEl.querySelector('.followups') ? ansEl.querySelector('.followups').outerHTML : ''),
      text: (qEl.textContent + ' ' + (ansEl ? ansEl.textContent : '')).toLowerCase() };
    ch.questions.push(q); QUESTIONS.push(q);
  });
  ch.headings = [...tpl.content.querySelectorAll('h2, h3')].map(h => ({ id: h.id, text: h.textContent }));
});

// ---------- elements ----------
const $ = s => document.querySelector(s);
const content = $('#content'), nav = $('#nav'), sidebar = $('#sidebar');
let mode = 'study', currentId = CHAPTERS[0] && CHAPTERS[0].id;

function chapterStats(ch) { const done = ch.questions.filter(q => mastered[q.id]).length; return { done, total: ch.questions.length }; }

function renderNav() {
  nav.innerHTML = CHAPTERS.map(ch => {
    const { done, total } = chapterStats(ch);
    const pct = total ? Math.round(done / total * 100) : 0;
    return '<li><a href="#' + ch.id + '" data-id="' + ch.id + '" class="' + (ch.id === currentId && mode === 'study' ? 'active' : '') + '">' +
      '<span>' + ch.title.replace(/\s*\(.*\)$/, '') + '</span><span class="count">' + (total ? done + '/' + total : '') + '</span>' +
      (total ? '<span class="mini"><i style="width:' + pct + '%"></i></span>' : '') + '</a></li>';
  }).join('');
  const done = QUESTIONS.filter(q => mastered[q.id]).length;
  $('#overallBar').style.width = (QUESTIONS.length ? done / QUESTIONS.length * 100 : 0) + '%';
  $('#overallText').textContent = done + ' of ' + QUESTIONS.length + ' questions mastered';
  document.querySelectorAll('.modes button').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
}

function setMastered(id, val) {
  if (val) mastered[id] = Date.now(); else delete mastered[id];
  store.set('mastered', mastered);
  renderNav();
}

// ---------- study mode ----------
function renderChapter(id, focusQid) {
  mode = 'study';
  const idx = CHAPTERS.findIndex(c => c.id === id);
  const ch = CHAPTERS[idx] || CHAPTERS[0];
  currentId = ch.id;
  const { done, total } = chapterStats(ch);
  const hideM = store.get('hideMastered', false);
  const hideN = store.get('hideNotes', false);
  const tools = total ? '<div class="chapter-tools"><div class="grow"><div class="bar"><i style="width:' + (done / total * 100) + '%"></i></div>' +
    '<small>' + done + ' / ' + total + ' mastered in this chapter</small></div>' +
    '<button class="btn" data-act="expand">Expand all</button><button class="btn" data-act="collapse">Collapse all</button>' +
    '<button class="btn" data-act="hide">' + (hideM ? 'Show mastered' : 'Hide mastered') + '</button>' +
    '<button class="btn" data-act="notes">' + (hideN ? '📚 Show full notes' : '🎤 Mock answers only') + '</button>' +
    '<button class="btn primary" data-act="drill">🃏 Drill this chapter</button></div>' : '';
  const prev = CHAPTERS[idx - 1], next = CHAPTERS[idx + 1];
  const pager = '<nav class="pager">' +
    (prev ? '<a href="#' + prev.id + '"><small>← Previous</small>' + prev.title + '</a>' : '<span></span>') +
    (next ? '<a class="next" href="#' + next.id + '"><small>Next →</small>' + next.title + '</a>' : '<span></span>') + '</nav>';

  content.className = 'content' + (hideM ? ' hide-mastered' : '') + (hideN ? ' hide-notes' : '');
  content.innerHTML = ch.html.replace(/(<\/h1>)/, '$1' + tools) + pager;
  decorateMocks();

  const list = content.querySelectorAll('details.qa');
  list.forEach((d, i) => {
    const q = ch.questions[i];
    d.dataset.qid = q.id;
    d.classList.toggle('mastered', !!mastered[q.id]);
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'master-btn';
    b.textContent = mastered[q.id] ? '✓ Mastered' : 'Mark mastered';
    b.addEventListener('click', e => {
      e.preventDefault(); e.stopPropagation();
      const val = !mastered[q.id];
      setMastered(q.id, val);
      d.classList.toggle('mastered', val);
      b.textContent = val ? '✓ Mastered' : 'Mark mastered';
      const s = chapterStats(ch);
      const t = content.querySelector('.chapter-tools');
      if (t) { t.querySelector('.bar i').style.width = (s.done / s.total * 100) + '%'; t.querySelector('small').textContent = s.done + ' / ' + s.total + ' mastered in this chapter'; }
    });
    d.querySelector('summary').appendChild(b);
  });
  content.querySelectorAll('input.chk').forEach(c => {
    const key = ch.id + ':' + c.dataset.chk;
    if (key in checks) c.checked = checks[key];
    c.addEventListener('change', () => { checks[key] = c.checked; store.set('checks', checks); });
  });

  renderNav();
  if (focusQid) {
    const d = content.querySelector('details[data-qid="' + focusQid + '"]');
    if (d) { d.open = true; d.scrollIntoView({ block: 'start' }); window.scrollBy(0, -70); return; }
  }
  window.scrollTo(0, 0);
}

// ---------- mock answers: read-aloud ----------
const canSpeak = 'speechSynthesis' in window;
function decorateMocks() {
  if (!canSpeak) return;
  content.querySelectorAll('.mock-label').forEach(l => {
    if (l.querySelector('.speak-btn')) return;
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'speak-btn'; b.textContent = '🔊 Listen';
    l.appendChild(b);
  });
}
function stopSpeaking() {
  if (!canSpeak) return;
  speechSynthesis.cancel();
  document.querySelectorAll('.speak-btn').forEach(b => b.textContent = '🔊 Listen');
}
content.addEventListener('click', e => {
  const sp = e.target.closest('.speak-btn');
  if (!sp) return;
  const wasPlaying = sp.textContent.startsWith('⏹');
  stopSpeaking();
  if (wasPlaying) return;
  const text = [...sp.closest('.mock').querySelectorAll('p')].map(p => p.textContent).join(' ');
  const u = new SpeechSynthesisUtterance(text);
  u.rate = 0.95; u.lang = 'en-CA';
  u.onend = () => { sp.textContent = '🔊 Listen'; };
  sp.textContent = '⏹ Stop';
  speechSynthesis.speak(u);
});
window.addEventListener('hashchange', stopSpeaking);

content.addEventListener('click', e => {
  const copy = e.target.closest('.copy');
  if (copy) {
    const text = copy.parentElement.querySelector('code').textContent;
    (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(
      () => { copy.textContent = 'Copied'; setTimeout(() => copy.textContent = 'Copy', 1200); },
      () => { copy.textContent = 'Select & copy'; });
    return;
  }
  const act = e.target.closest('[data-act]');
  if (!act) return;
  const a = act.dataset.act;
  if (a === 'expand' || a === 'collapse') content.querySelectorAll('details.qa').forEach(d => d.open = a === 'expand');
  if (a === 'collapse') content.querySelectorAll('details.fu').forEach(d => d.open = false);
  if (a === 'hide') { store.set('hideMastered', !store.get('hideMastered', false)); renderChapter(currentId); }
  if (a === 'notes') {
    const open = [...content.querySelectorAll('details.qa[open]')].map(d => d.dataset.qid);
    store.set('hideNotes', !store.get('hideNotes', false)); renderChapter(currentId);
    open.forEach(id => { const d = content.querySelector('details[data-qid="' + id + '"]'); if (d) d.open = true; });
  }
  if (a === 'drill') { fcScope = currentId; location.hash = 'cards'; }
});

// ---------- flashcards ----------
let fcScope = store.get('fcScope', 'all'), fcOnlyNew = store.get('fcOnlyNew', true), fcView = store.get('fcView', 'both');
let deck = [], deckPos = 0, revealed = false, timerStart = 0, timerId = null;

function buildDeck() {
  deck = QUESTIONS.filter(q => (fcScope === 'all' || q.cid === fcScope) && (!fcOnlyNew || !mastered[q.id]));
  for (let i = deck.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [deck[i], deck[j]] = [deck[j], deck[i]]; }
  deckPos = 0; revealed = false;
}

function renderCards(rebuild) {
  mode = 'cards';
  if (rebuild) buildDeck();
  renderNav();
  clearInterval(timerId);
  const opts = '<option value="all">All chapters</option>' + CHAPTERS.filter(c => c.questions.length)
    .map(c => '<option value="' + c.id + '"' + (fcScope === c.id ? ' selected' : '') + '>' + c.title + '</option>').join('');
  const setup = '<h1>🃏 Flashcards</h1><p class="tip">Answer out loud first, as if the interviewer just asked (aim for 1–2 minutes). Then reveal the 🎤 mock answer and compare: did you hit the same points, give an example and mention a trade-off? Use 🔊 Listen to hear it spoken.</p>' +
    '<div class="fc-setup"><select id="fcScope" aria-label="Chapter">' + opts + '</select>' +
    '<select id="fcView" aria-label="Answer view"><option value="both">Reveal: mock answer + notes</option><option value="mock">Reveal: mock answer only</option></select>' +
    '<label><input type="checkbox" id="fcOnlyNew"' + (fcOnlyNew ? ' checked' : '') + '> Only unmastered</label>' +
    '<button class="btn" id="fcShuffle">↻ Reshuffle</button></div>';

  const q = deck[deckPos];
  let card;
  if (!q) {
    card = '<div class="card"><div class="question">' + (deck.length ? '🎉 Deck finished!' : 'No cards here: everything in this scope is mastered.') + '</div>' +
      '<p class="fc-meta">Reshuffle, switch chapter, or untick "Only unmastered" to review everything again.</p></div>';
  } else {
    card = '<div class="card"><span class="tag">' + q.chapter + '</span><div class="question">' + q.qHTML + '</div>' +
      (revealed ? '<div class="answer">' + (fcView === 'mock' && q.mockHTML ? q.mockHTML : q.aHTML) + '</div>' : '') +
      '<div class="card-actions">' + (revealed
        ? '<button class="btn good" id="fcGot">✓ Got it (G)</button><button class="btn" id="fcAgain">↺ Review again</button><button class="btn" id="fcNext">Skip →</button>'
        : '<button class="btn primary" id="fcReveal">Reveal answer (Space)</button><button class="btn" id="fcNext">Skip →</button>') + '</div>' +
      '<p class="fc-meta">Card ' + (deckPos + 1) + ' of ' + deck.length + ' · <span class="timer" id="fcTimer">0:00</span></p></div>';
  }
  content.className = 'content';
  content.innerHTML = setup + card;

  decorateMocks();
  $('#fcScope').value = fcScope;
  $('#fcView').value = fcView;
  $('#fcView').onchange = e => { fcView = e.target.value; store.set('fcView', fcView); renderCards(false); };
  $('#fcScope').onchange = e => { fcScope = e.target.value; store.set('fcScope', fcScope); renderCards(true); };
  $('#fcOnlyNew').onchange = e => { fcOnlyNew = e.target.checked; store.set('fcOnlyNew', fcOnlyNew); renderCards(true); };
  $('#fcShuffle').onclick = () => renderCards(true);
  const on = (id, fn) => { const el = document.getElementById(id); if (el) el.onclick = fn; };
  on('fcReveal', reveal); on('fcNext', nextCard); on('fcGot', gotIt);
  on('fcAgain', () => { deck.push(deck[deckPos]); nextCard(); });
  if (q && !revealed) {
    timerStart = Date.now();
    timerId = setInterval(() => {
      const s = Math.floor((Date.now() - timerStart) / 1000), el = document.getElementById('fcTimer');
